\n- [ ] Slice 9 \u2014 The level's progress                                score: \u2014\n- [ ] Slice 10 \u2014 Every level renders its own sections                score: \u2014\n- [ ] Slice 11 \u2014 The diagram tiles open their drawing                score: \u2014\n- [ ] Slice 12 \u2014 A record opens in the Sheet                         score: \u2014\n- [ ] Slice 13 \u2014 A goal.json-only design renders                     score: \u2014\n- [ ] Slice 14 \u2014 The FlightDeck prototype, reviewed                  score: \u2014\n- [ ] Slice 15 \u2014 A single pull request at parity                     score: \u2014\n- [ ] Slice 16 \u2014 The joins rail                                      score: \u2014\n\n**Slice 6 ran on 2026-09-22 and scored 1.0**, weighted 0.08. It built the Work board at\n`src/shell/Board.tsx` and `src/shell/readiness.ts`, and the shell that reaches it at\n`src/shell/App.tsx`. Four of its nine criteria were carried from an earlier run: C3, C4,\nC6, and C8 were measured before the board's height was repaired, and the repair changed\nno claim they make. C1, C2, C5, C7, and C9 were re-measured after it.\n\n**One defect was found and fixed inside slice 6.** C7 scored 0.0 on the first run: the\nboard's scroll pane had no definite height, so it grew to its content and the document\nscrolled instead. The cause was wider than the board. `src/index.css` holds no `height`\nrule, `#root` holds none, and the shadcn wrapper's `min-h-svh` does not survive `cn`, so\nthe shell root's `h-full` resolved to `auto` on every route. The prototype never showed\nthis, because `Variations.tsx` gave the variation `h-dvh` and the old committed viewer\nset `html, body { height: 100% }` with `#app { height: 100vh }`. The fix adds a\n`max-h-dvh` cap to the shell root and a `min-w-0 shrink-0` wrapper around the board's\npane slot. Both are in `src/shell/App.tsx`, and the file's header states the rule.\n\n**Slice 7 ran on 2026-09-22 and scored 1.0**, weighted 0.05. It made a board row a real\nlink, so a press opens that item's Work surface. Both CRITICAL criteria scored 1.0, and no\nconsole message appeared at any level on any route.\n\nBoth of this epic's slices now stand at 1.0. Fourteen slices of the sixteen have not run: 1 to 5,\nand 8 to 13, and 14 to 16.\n\n## Escalated\n\nNone. Slices 6 and 7 ran and each scored 1.0, so no score fell below its threshold.\n\nNo slice scored below its threshold on a second attempt, so nothing escalated.\n\n## Notes for a fresh session\n\n**All nineteen epics share one branch.** Every epic in `goal.json` names\n`design/cobuilder-viewer/work-prototype`, and no epic names a pull request. So the\nepic state join reads `no-pull-request` for all of them, deferred ones included, and\nthe Build level cannot group its epics by state. The Build level pages them in\ndelivery order instead, six epics to a section. ADR-0028 states the reason.\n\n**E4's artifact is the React prototype, not a static HTML file.** E4's outcome\nasks for a prototype of the Work board. `goal.json`'s round-2 note then names a\n\"detailed static HTML prototype\" for each surface. The Work board's prototype\nshipped as a React application instead. It lives under\n`plugins/artifact/viewer/src/variations/sections-e/`, with its own `src/index.css`\ntoken set and its own Vite entry. `variations/app-shell/` is the same shell\nwithout the section model, kept as the comparison. Both are scaffolding for the\ndesign decision, in the same sense `Variations.tsx` is. Do not read either one as\nthe shipped viewer: the shipped file is `plugins/artifact/viewer/index.html`,\nwhich ADR-0023's build owns.\n\n**No `ui-spec.jsonc` exists anywhere in this repository, and none ever has.**\nThis plan carries the first one written. So `verify_gate.py` checks only that the\nfile exists, and nothing reads its contents. A later session that wants the file\nchecked must write the check.\n\n**Gate 1 and Gate 2 are approved without their documents.** The engineer\napproved both gates on 2026-09-22. Neither `01-product.md` nor\n`02-architecture.md` exists in this plan directory, so the approval rests on the\nengineer's word and not on a document a later session can read. The product\nintent lives in `goal.json` and `intent.json`. The architecture lives in\n`docs/architecture/designs/cobuilder-viewer/diagrams/` and in the five ADRs the\ndesign names. A session that needs the two missing documents should write them.\nDo not read the two gate lines as evidence that the documents exist.\n\n**The level-and-section model replaced the lens model.** Six design lenses were\nthe vocabulary of `react-viewer` and of earlier versions of this design. Those six\nwere intent, problem/solution, architecture, risks and verdict, build, and pull\nrequests. Nothing renders a lens now. A level pages its sections, one section at a\ntime on a horizontal track. ADR-0028 records the decision, and\n`docs/architecture/designs/cobuilder-viewer/diagrams/level-1.mmd` carries the\ncorrected text.\n\n**This design keeps its diagram sources in the repository.** They live in\n`docs/architecture/designs/cobuilder-viewer/diagrams/level-{1,2,3}.mmd` and reach\nthe bundle through `shared/build_index.py`. Level 1 is the container drawing and\nbelongs to the Intent level. Levels 2 and 3 are mechanism and belong to\nArchitecture. A PR's own diagrams under `<bundle-dir>/data/diagrams/` are a\ndifferent set, and `plugins/pr/scripts/build_diagrams.py` compiles those.\n\n**The scope was cut on 2026-09-22.** The engineer narrowed this program to two\nsurfaces. One is the Work surface. The other is the current pull request viewer,\nrenamed to FlightDeck at parity. The cut defers eleven epics rather than deleting\nthem: E8 to E18. Each one carries `state: \"deferred\"` in `goal.json`, with the\nreason on the epic.\nDo not renumber them, and do not read the gap as an unfinished list. The ladder in\n`04-slices.md` names them with no slices under them, so the cut is visible from the\nplan as well as from the design.\n\n**E19 is the landing surface the shell never had.** Before it, a reader arrived on\na route that named a work item. Nothing listed the bundle's designs, and a route\nthat named no work item fell through to the route error. E19 adds a board of every\ndesign in the bundle. Each row states the item's stage and the records it holds,\nand a row opens that item's Work surface. It is new in round 3, it reads `planned`,\nand it carries two slices.\n\n**Seven designs carry a `goal.json` and nothing else.** `build-workflow-polish`,\n`gate-state-resolution`, `inflight-record-store`, `interaction-design-gate`,\n`lean-bundle-diffs`, `maintainable-viewer`, and `ubiquitous-language`. E5's\nsurviving criterion is that the Work surface renders each of them. They are the\nfixtures for a sparse-record test, and they need no intent, narrative, or\nassessment record to do it.\n\n**The shipped shell owns the bare route, and the prototype does not.** `src/shell/App.tsx`\nsets `ROUTE_PREFIX` to `#/`, so `#/` is the board, `#/<design-id>` is that design's Work\nsurface, and `#/variations` reaches the comparison harness. The prototype keeps its own\n`#/sections-e` prefix at `src/variations/sections-e/model.ts`. Any older document that\nnames `#/sections-e` as a route is stale.\n\n**The built viewer asks for its data at an absolute path.** It requests\n`/bundle/data/index.json`, because the vite dev server mounts the bundle at `/bundle/`.\nA built file served beside a real bundle would 404 on its own data. E2 owns the fix, and\nit must land before the build is allowed to write the committed `index.html`.\n\n**A diagram tile once showed a raw Mermaid comment as its title.** On the design\n`review-flight-deck`, the level 1 tile rendered the literal text `%% review-flight-deck\nlevel 1 \u2014 where each part runs`, and its accessible name carried the same string. The\ntitle was read from a `.mmd` line that is a comment. The fix makes the title skip `%%`\ncomment lines. Slice 11 owns the diagram tiles, so a later session should re-check the\ntile in a browser.\n", "03-program-design.md": "# Program Design: cobuilder-viewer\n\nGate 3. The decisions an agent would otherwise make silently while implementing\nGate 2. Every one of them is cheap to change here and expensive to change once a\nslice has landed.\n\nThis design builds one program with three surfaces. Work reads a design. FlightDeck\nreads a pull request, or the whole open set. Reference reads the decisions and the\nmap coverage. A Vite build compiles all three into the committed viewer file.\n\n**The scope narrowed on 2026-09-22.** The engineer cut this program to two surfaces:\nthe Work surface, and the current pull request viewer renamed to FlightDeck at parity.\nEleven epics deferred on that date, E8 to E18, and their material stays in this\ndocument rather than leaving it. That material is the Reference surface, the describe\npath, the whole multi-pull-request mode and its simulator, the path runner, the\nledger's three state subtypes, publish parity, and the feedback path. None of it is\npart of the build. The live ladder is `04-slices.md`: sixteen slices across E1, E2,\nE3, E4, E5, E6, E7, and E19. Read every section below that serves a deferred epic as\ndesign on the shelf, ready for the epic that returns.\n\nFive ADRs govern it. ADR-0023 holds the build. ADR-0027 holds one FlightDeck surface\nwith two modes. ADR-0028 holds a level as sections on a track. ADR-0018 holds the\nrecord index, and ADR-0019 holds the ledger. Where this document and an ADR\ndisagree, the ADR wins and this document is wrong.\n\n## Files\n\n### The build, and the file it produces\n\n```\nplugins/artifact/viewer/\n  package.json                     scripts: dev, build, typecheck. React 19, Vite 7,\n                                   @vitejs/plugin-react, vite-plugin-singlefile\n  vite.config.ts                   root src/, the single-file plugin, outDir today\n                                   ../dist, alias @ -> src/, port 5273\n  tsconfig.json                    strict, noUnusedLocals, noUnusedParameters\n  src/index.html                   the dev entry\n  src/main.tsx                     mounts the shell\n  src/index.css                    the token set: ground, surface, ink, band, tint\n  index.html                       THE COMMITTED OUTPUT. The build writes here once\n                                   E2 lands, and a test rebuilds and compares\n  dist/                            today's scratch output. Deleted once index.html\n                                   is the build's target\n```\n\n**Why `vite.config.ts` changes.** It builds to `../dist` today, and its own comment\nsays ADR-0023's output rule is under revision while the shipped file keeps working.\nE2 settles that: the build writes `plugins/artifact/viewer/index.html`, and the\ncommitted file becomes a build artifact rather than a hand-maintained one.\n\n**Why the markers exist.** `export_artifact.py` rewrites the viewer by verbatim\nstring replacement and hard-errors when a literal moves. E1 gives the build's output a small set\nof named markers. The exporter then matches those names, rather than whatever\nliteral happens to sit between them. That is the seam, and it is the first slice.\n\n### The typed data layer\n\n```\nsrc/data/\n  global.d.ts                 the six window globals the bundle's script tags define:\n                              STORY, ODYSSEY, DIFFS, ADRS, DESIGNS, DIAGRAMS\n  types.ts                    every record type, the index shape, and the join results.\n                              Declares PullRequest here, and OpenPullRequest as its\n                              branded extension. ADR-0027 requires exactly one\n                              declaration of each\n  bundle.ts                   loads data/index.json, reads the globals, and resolves\n                              every join in one place. Exposes entitiesOf, joinsOf,\n                              and loadIndex\n  designs.ts / adrs.ts        record bodies, keyed by design and by decision id\n```\n\n**Why one module resolves the joins.** ADR-0018 built the joins into\n`data/index.json`. The shell reads them and derives none of them. A second\nderivation in the viewer would be a second source for the same fact.\n\n### The shell, and the section model\n\n```\nsrc/shell/\n  App.tsx                     the boot: index load, route, theme, the rail and the top\n                              bar, and the pane\n  model.ts                    buildWorkItems, gatesOf, levelsOf, readRoute, routeHref,\n                              the section lists per level\n  hooks.ts                    useIndexLoad, useHashRoute, useDocumentNoScroll,\n                              useVisibleWidthCap, useCollapsedRail, useFocusOnChange,\n                              useScrollResetOnRoute, useSectionAvailability\n  Pager.tsx                   SectionStrip, SectionStage, SectionPager, LevelProgress,\n                              useSectionPaging, withinOf. ADR-0028 owns this shape\n  panels/                     the sections each level pages, one file per level\n    Intent.tsx                Why, Done when, Abort if, Out of scope\n    ProblemSolution.tsx       Problem and solution, Risks, Assessment, Unknowns\n    Architecture.tsx          Diagrams, Architecture Decisions, Boundaries, Districts\n                              and alternatives considered\n    Build.tsx                 the epic runs, the slices, the rubrics\n    PullRequests.tsx          the envisioned pull request first, then the real ones,\n                              then FlightDeck\n    Shipped.tsx               the stage, the publications, and the deploy gap\n  atoms.tsx                   Panel, Box, Chip, TextList, and the band and tint classes\n  DiagramTiles.tsx            the diagram tiles, the dialog, the zoom, and the offline\n                              source fallback\n  Sheet.tsx                   the record sheet, and its jumplink row\n  Rail.tsx / TopBar.tsx       the traverse and the work item\n  Board.tsx                   the board E19 adds: one row per design, its stage,\n                              and its six record marks\n```\n\n**Why the section model lives in `Pager.tsx` and not in each level.** One index\ndrives the strip, the pager bar, and the two arrow keys, and one function computes\nthe level's progress. A level states its sections and nothing else.\n\n**Why the prototypes are separate directories.** `src/variations/sections-e/` and\n`src/variations/app-shell/` hold the built prototype and its comparison. They are\nscaffolding for the design decision, they are not the shipped surface, and the\nslices below port what they proved into `src/shell/`.\n\n### FlightDeck\n\n```\nsrc/flightdeck/\n  OpenSet.tsx                 the multi-pull-request mode: every open pull request,\n                              its head branch, its changed files, its design, and the\n                              ones the auto-merge rules already handled\n  SinglePr.tsx                the single-pull-request mode, at parity with today's\n                              viewer, plus the joins rail\n  ModeSwitch.tsx              one surface, two modes\n  MergePlan.tsx               renders data/merge-plan.json. It computes nothing\n```\n\n### Reference\n\n```\nsrc/reference/\n  Decisions.tsx               every decision, with its rule and its anchors\n  Coverage.tsx                the contexts, the districts, and the uncovered ones\n```\n\n**Why the five record-type tabs go.** E9 removes them. Reference is the surface those tabs\npointed at. A tab per record type also grows with the corpus, which section 2.1 of\nthe interaction design forbids.\n\n### Outside the browser\n\n```\nplugins/pr/scripts/\n  simulate_merge_order.py     reads the selected open set, simulates at least three\n                              paths against the common ancestor, replays the best one\n                              or two on a scratch worktree, and writes\n                              <bundle-dir>/data/merge-plan.json\n  execute_path.py             the runner: one integration branch per bundle, chained\n                              from the common ancestor, never the default branch\nshared/ledger.py              gains the merge-order proposal, the acceptance, and the\n                              post-merge actual as subtypes of the existing state line\nplugins/artifact/scripts/\n  export_artifact.py          matches the build's named markers, and drops or\n                              transcodes audio when a level exceeds the 16 MiB budget\n```\n\n### Tests\n\n```\ntests/test_viewer_build.py          new. Runs the viewer build and compares the result\n                                    against the committed index.html, byte for byte\ntests/test_sections.py              new. The section model's own claims, against the\n                                    served viewer\ntests/test_simulate_merge_order.py  new. The simulator, against a fixture repository\ntests/test_execute_path.py          new. The runner, against a fixture repository\ntests/test_ledger.py                extended. The three new state subtypes\ntests/test_export_artifact_budget.py new. The budget, and the degradation order\n```\n\n## Types & signatures\n\n```ts\n/* src/data/types.ts \u2014 the record types the index carries. */\n\nexport type DesignStage =\n  | \"backlog\" | \"design\" | \"review\" | \"approved\" | \"implemented\" | \"superseded\";\n\nexport interface DesignEntity {\n  id: string;\n  name: string;\n  outcome: string;\n  stage: DesignStage;\n}\n\nexport interface EpicEntity {\n  id: string;            // \"<design>/<epic-id>\"\n  design: string;\n  epic_id: string;       // \"E5\"\n  branch: string | null;\n  pr: number | null;\n  state: string;         // the ENTITY's own state, not the refined one\n  note: string | null;\n}\n\nexport interface SliceEntity {\n  id: string; n: number; title: string; ends_with: string | null;\n  score: number | null; state: string; attempts: number; feature: string;\n}\n\nexport interface PullRequest {\n  id: number;\n  title: string;\n  state: \"open\" | \"merged\" | \"closed\";\n  /** The head branch. Present on an open pull request, absent on a merged one. */\n  head: string | null;\n}\n\n/**\n * ADR-0027 fixes this shape, and E3 declares it once.\n * A field renamed on PullRequest and not here fails the build.\n */\nexport type OpenPullRequest = PullRequest & { status: \"open\" };\n\n/* The index, as data/index.json holds it. */\nexport interface RecordIndex {\n  entities: {\n    design: DesignEntity[]; epic: EpicEntity[]; slice: SliceEntity[];\n    adr: AdrEntity[]; boundary_rule: BoundaryRule[]; district: DistrictEntity[];\n    context: ContextEntity[]; pull_request: PullRequest[]; publication: Publication[];\n    epic_design: EpicDesignEntity[]; interaction_design: InteractionDesignEntity[];\n  };\n  joins: {\n    epic_status: Record<string, string>;\n    epic_to_pull_request: Record<string, number[]>;\n    slice_to_epic: Record<string, string>;\n    slice_to_epic_unresolved: string[];\n    adr_to_pull_request: Record<string, number[]>;\n    adr_to_context: Record<string, string[]>;\n    adr_to_district: Record<string, string[]>;\n    context_verifies_district: Record<string, string[]>;\n    district_uncovered: string[];\n    feature_gates: Record<string, GateStep[]>;\n  };\n}\n\nexport function loadIndex(): Promise<RecordIndex>;\nexport function entitiesOf(index: RecordIndex): RecordIndex[\"entities\"];\nexport function joinsOf(index: RecordIndex): RecordIndex[\"joins\"];\n\n/* src/shell/model.ts \u2014 the shell's own derivations. It computes no join. */\nexport function buildWorkItems(index: RecordIndex, designs: DesignRecords): Map<string, WorkItem>;\nexport function gatesOf(work: WorkItem): Gates;\nexport function levelsOf(work: WorkItem): Record<LevelKey, LevelState>;\nexport function readRoute(): Route;\nexport function routeHref(workId: string, section: SectionKey, tail?: string): string;\nexport function epicGroups(work: WorkItem): EpicEntity[][];\n\n/* src/shell/Pager.tsx \u2014 ADR-0028's shape. */\nexport interface Paging {\n  index: number; count: number;\n  select(index: number): void; previous(): void; next(): void;\n}\n\n/** The active section, clamped, and reset to `start` on a route change. */\nexport function useSectionPaging(count: number, routeKey: string, start?: number): Paging;\n\n/** How far through one box the reader is, from 0 to 1. A box with no range is 1. */\nexport function withinOf(box: HTMLElement | null): number;\n\n/** (index + within) / count, as a motion value the progress strip reads. */\nexport function useLevelProgress(index: number, count: number, boxRef: RefObject<HTMLElement | null>): MotionValue<number>;\n\nexport function SectionStrip(props: { targets: JumpTarget[]; activeIndex: number; onSelect(index: number): void }): JSX.Element;\nexport function SectionStage(props: { index: number; activeBoxRef?: RefObject<HTMLDivElement | null>; children: ReactNode }): JSX.Element;\nexport function SectionPager(props: { index: number; count: number; onPrevious(): void; onNext(): void }): JSX.Element;\n\n/* src/shell/DiagramTiles.tsx */\nexport function DiagramTiles(props: { levels: string[]; sources: Record<string, string>; theme: Theme }): JSX.Element;\nexport function loadMermaid(theme: Theme): Promise<MermaidApi>;\nexport function uncap(svg: string): string;\n\n/* src/shell/Sheet.tsx */\nexport function useSheetHeadings(scroll: HTMLElement | null, keys: readonly unknown[]): SheetHeading[];\n\n/* Off the browser. Python, in plugins/pr/scripts/. */\ndef simulate(selected: list[OpenPullRequest], ancestor: str, scratch: Path) -> MergePlan: ...\ndef replay(candidates: list[CandidatePath], scratch: Path) -> list[ReplayResult]: ...\ndef execute(path: MergePlan, pace: Literal[\"one-at-a-time\", \"all-at-once\"]) -> ExecutionRecord: ...\n```\n\n**The section model's own types are three, and nothing else needs one.** A section\nis a rendered element plus the text its own heading carries. The shell reads the\ntext from the DOM rather than storing it, so a label cannot disagree with the\nheading it names.\n\n## Call stack\n\n### Booting the shell and loading the index\n\n```\nmain.tsx\n  \u2192 createRoot(#root).render(<App />)\n  \u2192 App()\n       useIndexLoad()            \u2192 loadIndex() + loadDesigns() + loadAdrs()\n                                     fetch data/index.json\n                                     read the six window globals\n                                     resolve the joins once\n       useHashRoute()            \u2192 readRoute() from window.location.hash\n       readRoute()               \u2192 ROUTE_PREFIX, the four fields\n       useDocumentNoScroll()     \u2192 html and body carry no overflow\n       useVisibleWidthCap()      \u2192 cap the shell to the screen, never the window\n       useSectionAvailability()  \u2192 the nearest section this work can fill\n       buildWorkItems(index, designs) \u2192 one WorkItem per design\n       <Frame>                   \u2192 SidebarProvider, the shell's own token block\n            <TopBar />           \u2192 the work item, the stage, the theme\n            <Rail />             \u2192 the levels and the gated groups\n            <pane>               \u2192 the only scrolling region, on a stacking section\n```\n\nEvery count, state, and join on that path comes from the index. The shell renders.\n\n### A level rendering its sections\n\n```\npane\n  \u2192 SECTION_TITLE / SECTION_LEAD   the level's own words\n  \u2192 paged ? drop the band, keep <h1 id=\"work-section-heading\" class=\"sr-only\">\n  \u2192 pagedSections({ section, work, levelState, \u2026 })   the ordered array\n       intent              \u2192 Why, Done when, Abort if, Out of scope\n       problem-and-solution\u2192 Problem and solution, Risks, Assessment, Unknowns\n       architecture        \u2192 Diagrams, Architecture Decisions, Boundaries,\n                             Districts and alternatives considered\n       build               \u2192 epicGroups(work) \u2192 one run per six epics\n  \u2192 <PagedLevel sections targets routeKey start>\n       useSectionPaging(count, routeKey, start)\n       <SectionStrip targets activeIndex onSelect>      the headings\n       <SectionStage index activeBoxRef>                the track\n            one <SectionBox> per section, inert off screen\n       <LevelProgress index count boxRef>               the 4 px strip\n       <SectionPager index count onPrevious onNext>\n```\n\n`useJumpTargets(paneId, keys)` reads the panels the boxes rendered. So the strip's\nlabels come from the headings on the page, and its count comes from the same array\nthe boxes come from.\n\n### A section change, and the progress strip\n\n```\nreader presses Next, a heading, or ArrowRight\n  \u2192 useSectionPaging() step or select\n       setState(clamp(next, count))\n       a route change resets to `start`, which is the run holding an epic deep link\n  \u2192 re-render\n       SectionStage      animate x: -index * 100%     (150 ms reduced-motion aware)\n       SectionStrip      aria-current=\"step\" moves\n       SectionPager      \"Section N of M\" moves; Previous and Next disable at the ends\n       LevelProgress     useScroll({ container: boxRef })  \u2192 scrollYProgress\n                         useTransform(within => (index + within) / count)\n                         ScrollProgress value={progress}\n       one box becomes active; the others carry inert\n```\n\nThe index is view state. Nothing on that path writes the route. The progress strip\nmeasures the box, so a box that cannot scroll reads as fully read, and the value\nnever resets on a section change.\n\n### A diagram tile opening its dialog\n\n```\n<DiagramsSection levels sources theme>\n  \u2192 useEffect on mount          loadMermaid(theme)        one runtime, shared\n       api.render(id, source) per level, sequentially      uncap(result.svg)\n  \u2192 <DiagramTile>               scale = tileWidth / drawing.offsetWidth\n  \u2192 reader presses the tile     setOpen(level)\n  \u2192 <DiagramDialog>             createPortal(document.body)\n       zoom steps 50\u2026400 % of fit\n       the drawing's box is sized in pixels, so the body's own scroll grows\n       Escape, the backdrop, and Close all close it\n       a failed render shows the authored source as text\n```\n\n### A record opening its Sheet\n\n```\nreader presses a control inside a panel\n  \u2192 openSheet(subject)          the subject: a decision, a boundary rule, or an\n                                epic's technical solution design\n  \u2192 <RecordSheet subject open>  the registry's Sheet, portal, Escape, 44 px close\n       <SheetJumpLinks headings scroll>\n            useSheetHeadings(scroll, keys)   reads [data-sheet-heading] in the record\n            the callback ref puts the scroll container in state when it mounts\n       reader presses a part link\n            scroll.scrollTo(top + delta, behavior: reduce ? instant : smooth)\n            heading.setAttribute(\"tabindex\", \"-1\"); heading.focus({ preventScroll: true })\n```\n\n## Test plan\n\nThe repository's own suite is Python: `tests/`, run with\n`uv run --with pytest pytest tests/ -v`. The viewer is TypeScript and React, so the\nplan splits into three kinds of case, and each kind names its runner.\n\n### The byte-equal rebuild test (E2, pytest)\n\n`tests/test_viewer_build.py`:\n\n1. `test_build_reproduces_the_committed_viewer` \u2014 run `npm run build` in\n   `plugins/artifact/viewer/` and compare its output against\n   `plugins/artifact/viewer/index.html`, byte for byte. Skips when `npm` or\n   `node_modules` is absent, so the suite still runs on a checkout with no Node.\n2. `test_editing_the_output_fails_the_test` \u2014 write one byte into a temporary copy\n   of the committed file and assert the comparison fails. A rebuild test that cannot\n   fail proves nothing.\n3. `test_every_named_marker_survives_a_build` \u2014 assert `export_artifact.py`'s marker\n   names all appear in the built output. That is E1's seam, and it is the assertion\n   that keeps the exporter working.\n\n### The section model's claims (pytest against the served viewer)\n\n`tests/test_sections.py`. Each case asserts one claim ADR-0028 makes, and the Gate 4c\nrubrics score the same claims on the built surface. The harness serves the bundle\nrooted at `.cobuilder-architect/self/` and measures the DOM, which is how the\nprototype's numbers in this document were taken.\n\n1. `test_paged_level_pane_does_not_scroll` \u2014 on each of the four paged levels, the\n   pane's `scrollHeight - clientHeight` is zero.\n2. `test_one_box_is_in_view` \u2014 one box's rect sits inside the pane's, and no other's.\n3. `test_strip_count_matches_box_count` \u2014 the strip's headings equal the boxes, and\n   the pager reads `Section 1 of N` for that N.\n4. `test_next_moves_exactly_one_box` \u2014 the track's transform moves by exactly one\n   box width, forward and back.\n5. `test_progress_is_level_progress` \u2014 the reading is 0 at the first section's top,\n   one count's share higher mid-box, and the full walk never decreases.\n6. `test_a_box_with_no_range_reads_as_read` \u2014 a section that fits one screen\n   contributes its whole share.\n7. `test_arrow_keys_step_and_are_guarded` \u2014 `ArrowLeft` and `ArrowRight` step, and a\n   press inside an `input`, a `textarea`, or a `select`, or with a modifier, does not.\n8. `test_paged_level_drops_the_band_and_keeps_the_id` \u2014 no band element, and\n   `#work-section-heading` exists as an `sr-only` `h1` carrying the level's title.\n9. `test_a_section_that_stacks_keeps_the_pane_scroll` \u2014 Rubrics scrolls its pane and\n   has no strip.\n10. `test_sparse_design_renders` \u2014 one of the seven `goal.json`-only designs renders\n    every level it can fill, and the rail gates what it cannot.\n\n### The rest of the program (pytest)\n\n11. `test_export_artifact_marker_seam` \u2014 a publish survives a marker rename.\n12. `test_open_pull_request_drift_fails_the_build` \u2014 renaming a field on\n    `PullRequest` and not on `OpenPullRequest` fails `npm run typecheck`.\n13. `test_simulate_writes_a_plan_against_the_ancestor` \u2014 a fixture repository gives a\n    plan whose recorded ancestor is the common ancestor, never the default head.\n14. `test_replay_counts_real_conflicts` \u2014 a fixture with a known conflict reports it.\n15. `test_execute_never_touches_the_default_branch` \u2014 the runner's merges land on\n    `flightdeck/<path>/<n>-<slug>` and the default branch keeps its head.\n16. `test_ledger_three_subtypes_fold` \u2014 a proposal, an acceptance, and an actual\n    append as `state` subtypes, and `fold_threads` keeps all three.\n17. `test_audit_reports_a_hash_mismatch` \u2014 a mismatched tree hash is a stated state.\n18. `test_publish_holds_the_budget` \u2014 the exporter drops or transcodes over-budget\naudio in the documented order, and the published file is under 16 MiB.\n19. `test_describe_leaves_a_described_pull_request_alone` \u2014 the body stays identical.\n20. `test_anchor_survives_a_rerender` \u2014 an anchor taken before a re-render still\n    resolves to its sentence after it.\n\n### Cases the rubrics score, not pytest\n\nTwo claims need a human or a scripted browser, and the repository's suite holds\nneither today. This document states each one as a case for Gate 4c to score:\n\n- **The tile dialog's zoom reads whole percentages and the drawing stays reachable**\n  at 50 %, 100 %, and 400 %, measured in the browser.\n- **The published Artifact renders every surface** under the platform's CSP, which\n  only the platform can answer.\n\n## Least confident decisions\n\n1. **E4, E6, and E8 ask for a \"detailed static HTML prototype\". The Work prototype\n   shipped as a React application instead.** `variations/sections-e/` is\n   the artifact the engineer reviewed. Either the three prototype epics accept the\n   React prototype as their deliverable, or the static-HTML wording stands and each\n   prototype is a second artifact built beside the real one. This document assumes\n   the React prototype satisfies E4 and that E6 and E8 follow it, and it could be\n   wrong about all three.\n2. **The two prototype epics E6 and E8 may collapse into their build epics.** A\n   prototype whose only job is approval is cheap work, if the build epic already\n   exists to hang it on. This document keeps them separate because E7 and E9 measure\n   their own parity against an approved prototype, and that approval is the gate.\n3. **The diagram runtime loads when the Diagrams section mounts.** It used to load\n   on the reader's press, because the runtime is large. A tile cannot wait for a\n   press, so the rule changed. The cost is that a reader who opens Architecture to\n   read decisions pays for a runtime they never use. A lazy per-tile load is the\n   obvious alternative, and this document does not take it.\n4. **`ui-spec.jsonc` has no validator.** `verify_gate.py` checks that the file\n   exists and reads nothing inside it. So the component specification is a document\n   two people can disagree about with no test to settle it. Writing a schema check\n   is real work, and nothing in this program owns it.\n5. **The build's output path moves from `dist/` to the committed `index.html`.**\n   `vite.config.ts` says ADR-0023's output rule is under revision. E2 needs the move,\n   and every `export_artifact.py` run after it rewrites a build artifact. A stale\n   committed file is a real risk here, and the byte-equal test is the only guard.\n6. **The byte-equal test depends on a pinned toolchain.** Two machines with the same\n   lockfile and the same Node version should produce the same bytes. Nobody has\n   proven that yet. If it fails, the guard test fails for a reason nobody can act on. The spike\n   in E2 is where that gets answered.\n7. **The design settles where the runner's merges come from. It does not settle who\n   deletes the integration branches.** E15 leaves N branches per path behind, and no\n   epic owns their removal. It is out of scope in `intent.json`, and it stays out of scope here.\n8. **The 16 MiB budget assumes audio is the thing that breaks first.** That is what\n   the earlier artifact experiment measured. A pull request carrying four levels of\n   scene art and inlined React could break it with no audio at all. No epic measures\n   the degradation order this document implies on a real bundle.\n", "04-slices.md": "# Slices: cobuilder-viewer\n\nGate 4a. One line per slice, in build order. Every slice ends in a working,\ntestable state, and every slice declares the epic it advances.\n\nTest command: `uv run --with pytest pytest tests/ -v`\n\nThe viewer slices 6 to 13 carry two runners. `npm test` in `plugins/artifact/viewer/`\nruns their component cases through vitest. The page-level claims in their rubrics need\na served bundle and the ChromeDevTools MCP tools, and no runner in this repository holds\nthem yet.\n\nRubrics: `.cobuilder/rubrics/cobuilder-viewer/slice-N.md`, written before any\nimplementation exists.\n\n## What makes a slice here\n\n**A slice is vertical when it ends in something observable.** That is the one test,\nand the count follows from the work rather than the other way round.\n\nAn observable end is a state a reader can see or a test can assert. \"A pull request\nthat already has a description is left alone\" is one. \"Add the validation\" is not,\nand neither is \"wire the types\": they name a layer, and a layer is not a state.\n\nSo a slice here crosses every layer it needs, however thinly. Slice 1 reaches from\nsource into a published Artifact, and it carries no new user-facing behaviour at all.\nThe plan allows that, because its end is observable: a publish still works.\n\n**The count is the number of observable ends the epic has.** One is a real answer.\nFour epics here carry exactly one slice, because their whole outcome is one end\nstate. Where an epic has two ends, it gets two slices, and the second is never \"the\nedge cases\". Edge cases belong to the slice whose end they threaten.\n\n**A slice is not a layer, and this is where that shows.** An earlier draft of this\nplan used a three-slice template: tracer bullet, then happy path, then edge cases.\nThat template cuts horizontally and it inflates Gate 4b, because every epic with\nmore than one slice owes a technical solution design. It is gone. What decides a\nslice here is one question: what can a reader see when this slice is done?\n\n## The scope cut of 2026-09-22\n\nThe engineer narrowed this program to two surfaces: the Work surface, and the\ncurrent pull request viewer renamed to FlightDeck at parity. Eleven epics left the\nbuild on that date, and they are deferred rather than deleted or renumbered: **E8,\nE9, E10, E11, E12, E13, E14, E15, E16, E17, and E18.** Each one carries\n`state: \"deferred\"` in `goal.json` with the reason on the epic. They hold the\nReference surface, the describe-on-arrival path, the whole multi-pull-request mode\nand its merge-order simulation, the ledger and its audit, the path runner, publish\nparity, the workflow-polish carryover, and the feedback path. They are named in the\ntable below with no slices under them, so this ladder still says what was cut.\n\nEight epics remain in scope and carry the sixteen slices below: E1, E2, E3, E4, E5,\nE6, E7, and E19. The ladder was re-derived rather than copied. A slice survives only\nwhere its end still belongs to the narrowed program, and one slice moved from E5 to\nE19 because the shell now lands somewhere.\n\n## The ladder\n\nEight epics carry sixteen slices. Four carry more than one, and those four owe a\nGate 4b design before their slices build: E2, E5, E7, and E19. Four carry exactly\none: E1, E3, E4, and E6, and three of those four are the prototype epics, whose\nsingle end is an approval.\n\nSlice numbers run in build order. **This is not the table order.** The table groups\nslices under the epic they advance, and E19 builds before E5, so the numbers step\nout of epic order once. Build order is slice 1, then 2 and 3, then 4, then 5, then 6\nand 7, then 8 through 13, then 14, then 15 and 16.\n\nThree dependencies set that order. E1 before E2, because the exporter's markers\nexist before the build changes how the file is produced. E3 before E19, because the\nboard reads the typed model. E19 before E5, because the board is the surface that\nopens a work item, and E5's sections render inside one.\n\n| # | Epic | Slice | Ends with | Score | State |\n|---|---|---|---|---|---|\n| | **`cobuilder-viewer/E1` \u2014 The exporter seam.** `export_artifact.py` matches named markers the build emits on purpose, so a publish survives the build changing its output. | | | | |\n| 1 | `cobuilder-viewer/E1` | **Tracer bullet: a publish survives a marker rename** | The exporter matches the built file's named markers, and a real publish of the current viewer still succeeds after the marker names move | \u2014 | pending |\n| | **`cobuilder-viewer/E2` \u2014 The build pipeline.** The toolchain reproduces the same bytes, then `npm run build` produces the committed `index.html` and a test rebuilds it and fails on any difference. | | | | |\n| 2 | `cobuilder-viewer/E2` | Two builds produce the same bytes | Two builds from the same lockfile on the same machine produce the same bytes, so the byte-equal guard is possible at all | \u2014 | pending |\n| 3 | `cobuilder-viewer/E2` | The build owns the committed file | The build reproduces `plugins/artifact/viewer/index.html` byte for byte, and one edited byte makes the rebuild test fail | \u2014 | pending |\n| | **`cobuilder-viewer/E3` \u2014 The typed data layer.** One module reads the six window globals and `index.json`, resolves every join, and declares `PullRequest` and its branded extension `OpenPullRequest`. | | | | |\n| 4 | `cobuilder-viewer/E3` | One typed model reads the bundle | A level renders from `index.json` with no join derived in a component, and a field renamed on `PullRequest` and not on `OpenPullRequest` fails the type check | \u2014 | pending |\n| | **`cobuilder-viewer/E4` \u2014 The Work prototype.** A detailed prototype of the Work board, against this repository's own design records, reviewed before E5 starts. | | | | |\n| 5 | `cobuilder-viewer/E4` | The Work prototype, reviewed | The prototype renders this repository's own designs across the Work board, and the engineer approves it or names what to change | \u2014 | pending |\n| | **`cobuilder-viewer/E5` \u2014 The Work surface.** Every level, and the sections each level pages, including a design whose records are `goal.json` only. ADR-0028 owns the shape. | | | | |\n| 8 | `cobuilder-viewer/E5` | The section model | One box is on screen, the strip, the pager bar, and the two arrow keys move one index, and the pane reports no scroll at all | \u2014 | pending |\n| 9 | `cobuilder-viewer/E5` | The level's progress | The strip reads 0 at the first section's top, 25 percent at its bottom, 50 on the second, 100 on the last, and never decreases on a forward walk | \u2014 | pending |\n| 10 | `cobuilder-viewer/E5` | Every level renders its own sections | A reader walks Intent, Problem & Solution, Architecture, Build, Pull requests, and Shipped of one work item, and the envisioned pull request leads the Pull requests level | \u2014 | pending |\n| 11 | `cobuilder-viewer/E5` | The diagram tiles open their drawing | A tile shows the drawing's miniature scaled to its box, a press opens it whole with zoom from 50 to 400 percent, Escape and the backdrop close it, and a failed render shows the authored source | \u2014 | pending |\n| 12 | `cobuilder-viewer/E5` | A record opens in the Sheet | Pressing a decision, a boundary rule, or an epic's design opens the whole record, and a part link scrolls the record and moves focus to that heading | \u2014 | pending |\n| 13 | `cobuilder-viewer/E5` | A goal.json-only design renders | One of the seven sparse designs shows every level it can fill, and the rail gates the levels it cannot | \u2014 | pending |\n| | **`cobuilder-viewer/E6` \u2014 The FlightDeck prototype.** One surface, two modes behind one switch, reviewed before E7 starts. | | | | |\n| 14 | `cobuilder-viewer/E6` | The FlightDeck prototype, reviewed | One surface shows single-pull-request narration at parity and the multi-pull-request path as its second mode behind one switch, and the engineer approves it or names what to change | \u2014 | pending |\n| | **`cobuilder-viewer/E7` \u2014 FlightDeck, one pull request.** A single pull request at parity with today's viewer, plus the joins rail. | | | | |\n| 15 | `cobuilder-viewer/E7` | A single pull request at parity | A reader opens one pull request and reads its four narration levels, its diagrams, its art, its audio, and its intent and assessment sheet, as the shipped viewer does today | \u2014 | pending |\n| 16 | `cobuilder-viewer/E7` | The joins rail | The same page lists the decisions, the design, and the epics that reach that pull request | \u2014 | pending |\n| | **`cobuilder-viewer/E8` \u2014 The Reference prototype.** Deferred on 2026-09-22, and carries no slice. | | | | |\n| | **`cobuilder-viewer/E9` \u2014 The Reference surface.** Deferred on 2026-09-22, and carries no slice. | | | | |\n| | **`cobuilder-viewer/E10` \u2014 Describe on arrival.** Deferred on 2026-09-22, and carries no slice. | | | | |\n| | **`cobuilder-viewer/E11` \u2014 Read the open set.** Deferred on 2026-09-22, and carries no slice. | | | | |\n| | **`cobuilder-viewer/E12` \u2014 Simulate and replay the routes.** Deferred on 2026-09-22, and carries no slice. | | | | |\n| | **`cobuilder-viewer/E13` \u2014 Narrate and render the route.** Deferred on 2026-09-22, and carries no slice. | | | | |\n| | **`cobuilder-viewer/E14` \u2014 The ledger and the audit.** Deferred on 2026-09-22, and carries no slice. | | | | |\n| | **`cobuilder-viewer/E15` \u2014 Execute the path.** Deferred on 2026-09-22, and carries no slice. | | | | |\n| | **`cobuilder-viewer/E16` \u2014 Publish parity.** Deferred on 2026-09-22, and carries no slice. | | | | |\n| | **`cobuilder-viewer/E17` \u2014 The workflow-polish carryover.** Deferred on 2026-09-22, and carries no slice. | | | | |\n| | **`cobuilder-viewer/E18` \u2014 The feedback path.** Deferred on 2026-09-22, and carries no slice. | | | | |\n| | **`cobuilder-viewer/E19` \u2014 The Work board.** New in round 3. The shell lands on a board of every design in the bundle, each row stating the item's stage and which records it holds, and a row opens that item's Work surface. | | | | |\n| 6 | `cobuilder-viewer/E19` | The shell lands on the bundle's designs | Opening the viewer with no work item named shows every design as a row, each row stating its stage and the records it holds, and no error state | 1.00 | completed |\n| 7 | `cobuilder-viewer/E19` | A row opens the item's Work surface | Pressing a row lands on that item's Work surface at its first level, with the route naming the item | 1.00 | completed |\n\n## Why this order\n\n**Slice 1 is the tracer bullet, and it carries no new behaviour.** It runs the whole\npath the program depends on: source, the build, the marker seam, the exporter, and a\nreal publish. Nothing about that path is new to a reader, and everything about it is\nnew to the build. That is the point of a tracer bullet.\n\n**E1 lands before E2.** The exporter rewrites the built file by matching named\nmarkers. A build that changes how that file is produced, published before the seam\nexists, breaks publishing silently.\n\n**E19 lands before E5.** The board is where the shell can first show a design, and it\nis the surface that opens a work item. E5's sections render inside the item the board\nopened, so a board that lands later would leave E5's slices with no screen to land\non.\n\n**E5's sections come before E7's parity, and E6's prototype before E7.** FlightDeck\nis a surface beside Work, and it reuses the shell the Work surface proved.\n\n**Two answers the E2 spike used to seek now belong to deferred work.** The spike\nstill settles whether the build can be byte-equal, which is what slice 3 guards. The\npublished-Artifact size question and the Mermaid-injected-after-load question belong\nto E16 and to E18, and both are deferred.\n\n**A slice ends observable, so a slice can be large.** Slice 10 walks six sections.\nFour epics here carry one slice each, and none of them hides a second end.\n\n## Out of scope for this ladder\n\n- Everything the eleven deferred epics hold, until the engineer brings one back.\n- Any change to what the generation scripts write into the bundle. The design reads\n  the bundle, and it does not reshape it.\n- A new record type, a new join, or a schema version bump beyond `OpenPullRequest`.\n- The diff view's own rendering, which the team ports as it stands.\n- `--format notion`, which stays a reserved flag value.\n\n## Escalation\n\n`max_attempts: 3` per slice, then escalate rather than loop. The session records an\nescalated slice in `00-status.md` with the reason and the follow-up, and it never\naccepts one below threshold in silence.\n", "epic-E19-design.md": "# Epic Technical Solution Design: E19 \u2014 The Work board\n\nFeature: cobuilder-viewer\nEpic ID: cobuilder-viewer/E19\n\n## Scope and Intent\n\nE19 is the surface that lists every work item before a reader picks one. The shell had no\nlanding surface. A route that named a work item rendered it. A route that named none\nfell through to the error the shell keeps for an unknown id. A reader arriving on the\nbundle had nowhere to start.\n\n**The board is the landing surface.** The bare route `#/` renders it, and the\nrail's top entry returns to it from any level. The route that names an unknown id keeps\nits own error, because an address that resolved to nothing is not the board. The shipped\nshell owns the bare route, because the prototype's `#/sections-e` address belonged to the\ncomparison harness it sat behind.\n\n**The board is a flat list, not four lanes.** The approved lane rule survives as the\norder. A lane board does not fit this bundle. A superseded design holds no lane, and\nthis bundle holds four of them, so a lane arrangement would need a tab for work every\nreader must still reach. A row also carries more than a card does: a stage, six record\nmarks, and an epic and a slice figure.\n\nThe boundary. The board is not a paged level: it draws no section strip, no pager, and no\nlevel progress bar. It draws no reading-progress strip and no section-link bar either,\nbecause the page is a list of short rows and a progress reading would sit at one value. It\nopens the Work surface and changes nothing inside it. It does not list records: it says\nwhich records an item holds and opens the item.\n\n`plugins/artifact/viewer/src/variations/sections-e/Board.tsx` and its `readiness.ts` are\nthe working reference. Both were built and measured.\n\n## Files Touched\n\n- `plugins/artifact/viewer/src/shell/Board.tsx` \u2014 new. The board, ported from\n  the prototype with no change of behaviour.\n- `plugins/artifact/viewer/src/shell/readiness.ts` \u2014 new. The six record kinds,\n  the three readiness words, and the one derivation. Moved with the board, because the\n  board is its only reader.\n- `plugins/artifact/viewer/src/shell/Board.test.tsx` \u2014 new. The board's own\n  cases.\n- `plugins/artifact/viewer/src/shell/readiness.test.ts` \u2014 new. The readiness\n  rule's cases, which need no DOM.\n- `plugins/artifact/viewer/src/shell/App.tsx` \u2014 modified. `board = route.workId === null`\n  selects the board, and the pane renders it instead of the unknown-id error. The\n  work-item branch keeps that error.\n- `plugins/artifact/viewer/src/shell/Rail.tsx` \u2014 modified. The top entry `Work` opens the\n  board, and it takes `board` and `workCount` props.\n- `plugins/artifact/viewer/src/shell/TopBar.tsx` \u2014 modified. The bar states the board\n  rather than a missing work item.\n- `plugins/artifact/viewer/src/shell/model.ts` \u2014 modified. `boardHref()` returns the bare\n  route prefix.\n- `plugins/artifact/viewer/src/shell/records.ts` \u2014 modified. `MinWork` and the `min_work`\n  field on `goal`, which the goal verdict reads.\n- `plugins/artifact/viewer/src/shell/atoms.tsx` \u2014 modified. `TONE_MARK`, `TONE_PILL`,\n  `StateBadge`, and `toneForStage`, which the row's marks and badge read.\n\n## Types & Signatures\n\n```ts\n/* readiness.ts \u2014 the six authored records, and how complete each one is. */\nexport type RecordKind =\n  | \"goal\" | \"intent\" | \"narrative\" | \"assessment\" | \"pr-draft\" | \"diagrams\";\n\nexport const RECORD_KINDS: RecordKind[];\nexport const RECORD_LABEL: Record<RecordKind, string>;\n\nexport type Readiness = \"present\" | \"partial\" | \"absent\";\n\nexport interface Verdict {\n  state: Readiness;\n  /** The parts the record is missing. Empty unless the state is `partial`. */\n  missing: string[];\n}\n\nexport type RecordVerdicts = Record<RecordKind, Verdict>;\n\n/** One verdict per kind. A design `designs.js` misses reads absent on all six. */\nexport function recordVerdicts(record: DesignRecord | undefined): RecordVerdicts;\n\n/** How many of the six records exist, whole or in part. */\nexport function presentCount(verdicts: RecordVerdicts): number;\n\n/* Board.tsx \u2014 the props, as the component takes them. */\nexport interface BoardProps {\n  /** The resolved rows the record index yields, one per design. */\n  rows: DesignRow[];\n  /** The per-design record map `data/designs.js` carries. */\n  records: DesignRecords;\n  /** False while the index is in flight, so the board states that and nothing else. */\n  ready: boolean;\n  /** The heading the shell moves focus to on a route change. */\n  headingId: string;\n}\n\nexport function Board(props: BoardProps): JSX.Element;\n\n/* The row type, and the records it reads. Both are the shipped data layer. */\nexport interface DesignRow {\n  design: DesignEntity;\n  epics: EpicEntity[];\n  slices: SliceEntity[];\n  /** Epics whose joined status is completed or merged. */\n  done: number;\n  /** Pull requests this design's epics point at, deduplicated and sorted. */\n  pullRequests: number[];\n}\n\nexport type DesignRecord = /* one design's authored records, as designs.js writes them */;\nexport type DesignRecords = Record<string, DesignRecord>;\n\n/* model.ts */\n/** The bare route: the one destination that states no section. */\nexport function boardHref(): string;\n\n/* records.ts */\nexport interface MinWork {\n  derived_from?: string;\n  alternatives_explored?: number;\n  boundary_rules_checked?: boolean;\n  challenge_stage_run?: boolean;\n  note?: string;\n}\n```\n\n**The board reads the shipped data layer, not the variation's scaffolding.** An earlier\ndraft of this design took `works: Map<string, WorkItem>`, and `WorkItem` belongs to\n`variations/sections-e/model.ts`. That is the mockup's own copy, held together for the\nreason `atoms.tsx` gives: every directory under `variations/` stays independently\nremovable. The plan deletes the variations once the shipped surface exists. A shipped\ncomponent that took their type would break on the day the scaffolding went. The board\ntherefore takes `rows: DesignRow[]` from `@/data/types`, and it takes the record map\nbeside them. `src/components/work/WorkBoard.tsx` and `src/components/work/DesignCard.tsx`\nare the pattern, and the board follows it.\nThe board takes no address prop, for the reason the rail takes none: `src/shell/Board.tsx`\nimports `routeHref` from `./model`, so the shell keeps routing and the board keeps\npresentation.\n\n**A row's address names a level the design can fill, not a fixed level.** The board holds a\n`rowSection(row, records)` rule with three cases. `intent` comes first, because Intent is\navailable exactly when `data/designs.js` carries a record for the design, and the record map\nsits beside the rows already. A design that file misses fills no level, so its row names\n`build`, which fills when the row carries an epic. `intent` is the shell's own last resort.\nA single fixed address would be wrong for the second case: the shell would land on a gated\nlevel, redirect away from it, and state the redirect.\n\n**Where the modules live.** The board is a surface of the shell, so its two modules\nlive in `src/shell/`, beside `Sheet.tsx` and `DiagramTiles.tsx`. The approved program\ndesign states the rule: the slices port what the prototype proved into `src/shell/`\n(`03-program-design.md`, Files). `src/components/` holds the reusable primitives and\nthe prototype areas: `ui/`, `smoothui/`, and the older lane board at `work/`.\n\n**The order rule, and its two edges.** `STAGE_ORDER` holds `backlog`, `decided`,\n`approved`, `review`, `implemented`, `superseded`. A superseded design sorts after every\nlive stage, because no work waits on it. A stage outside that vocabulary sorts after even\nsuperseded, so a newer bundle still renders rather than disappearing. Two designs of one\nstage sort by id, so the order is total and stable.\n\n**The six marks, one per kind, in one order.** A mark states the record's name, whether\nit exists, and whether it is whole. A whole record takes a solid mark; a gap takes a\ndashed mark with a shape marker beside it, which survives greyscale. A `partial` verdict\nnames the empty part in its tooltip. One derivation produces every verdict, and every row\nrenders it, so two rows cannot disagree about one record.\n\n**The row carries the item's figures.** The stage comes from `work.design.stage`. The\nrecord count comes from `presentCount`. The epic figure counts epics whose refined state\nis `completed` or `merged`, read from the join and never from the entity. The slice\nfigure counts slices whose state is `completed`, and it hides when the item carries none.\n\n## Slice Decomposition\n\nPer `docs/plans/cobuilder-viewer/04-slices.md`, in build order.\n\n- **Slice 6 \u2014 The shell lands on the bundle's designs.** Depends on: slice 4 (the typed\n  model). The bare route renders the board: one row per design, each row stating its\n  stage and its six record marks, and no error state. The board's key renders beside the\n  list, because the three readiness words are new to a reader here.\n- **Slice 7 \u2014 A row opens the item's Work surface.** Depends on: slice 6, and slice 8\n  (the section model the opened surface renders). Pressing a row lands on that item's\n  Work surface at its first level, with the route naming the item.\n\nSlice 7 is not slice 6's interaction detail. Two states: a bundle a reader can survey,\nand one item a reader can enter. Slice 6 renders the list with no navigation out of it,\nand slice 7 is the transition the board exists for.\n\n## Test Plan\n\nThe suite is **vitest**, beside the modules it tests: `npm test` runs `vitest run` in\n`plugins/artifact/viewer/`, over `src/shell/Board.test.tsx` and\n`src/shell/readiness.test.ts`. Vitest is already a dependency of this package.\nThe two files sit in the same directory as the code they cover.\n\n`readiness.test.ts` needs no DOM, because the rule is pure. `Board.test.tsx` renders the\ncomponent with `@testing-library/react` inside a `TooltipProvider`, and it reads the rows\nby role.\n\n- **`readiness.test.ts`** \u2014 slice 6. `recordVerdicts` and `presentCount` against fixtures\n  written the way `data/designs.js` writes a record: a whole record reads `present`, a\n  record with an empty named part reads `partial` and names it, an absent record reads\n  `absent`, and a design `designs.js` does not carry reads absent on all six.\n- **`Board.test.tsx`** \u2014 slice 6. The row count equals the designs it was given, one row\n  per design. Each row states the stage its design records. Each row carries one mark per\n  `RECORD_KINDS` entry, in that order. A design with no record renders six dashed marks\n  and a design with all six renders six solid ones. A `goal.json`-only design's goal mark\n  names the empty part, because the goal records `challenge_stage_run` false. The order\n  follows the lane rule, and a superseded design sorts after every live stage. A stage\n  outside the vocabulary sorts last. The board draws no section strip, no pager bar, no\n  level progress bar, and no reading-progress strip.\n- **The rendered page** \u2014 slices 6 and 7. The bare route renders the board and not the\n  unknown-id error. The rail's `Work` entry returns to it. A row's href is that item's\n  route, and a press lands on that item's Work surface at its first level. A sparse design\n  opens. The pane owns the scroll, and the document does not.\n\n**The third group has no runner yet, and that gap is known.** The repository holds no\nbrowser driver. The Python suite under `tests/` checks packaging invariants, and vitest\nruns in jsdom without a served bundle. The Gate 4c rubrics therefore score the page-level\nclaims above, through the ChromeDevTools MCP tools. A later session that adds a browser\nharness should move them there. Their absence from CI is a known gap, not an\noversight.\n\n## Risks & Open Questions\n\n- **Two board implementations exist in the tree.** `src/components/work/WorkBoard.tsx`\n  holds the lane arrangement with cards, taken from the approved static prototype, and\n  `src/shell/Board.tsx` holds the flat list this epic ships. Two boards that\n  disagree about one bundle is a real hazard. Either somebody deletes the lane board when E19\n  lands, or it stays as a named alternative the way `variations/app-shell/` is. This\n  design ships\n  the flat list and leaves the older file in place, and that is a decision a reader should\n  confirm.\n- **The readiness derivation reaches into record shapes.** `narrative.json` wraps its\n  three levels under `levels` in one design and authors them at the top level in others.\n  The rule reads both shapes, because a rule that saw only the flat one reported three\n  levels missing while the text sat one key away. A third shape would need the same\n  treatment.\n- **`challenge_stage_run` is the one goal field that decides `partial`.** A backlog entry\n  records it false, and the verdict names design mode's stages 2 to 7 as the missing part.\n  A design whose goal omits the field entirely reads `present`, which may be generous.\n  Measured on 2026-09-22: of the seven sparse designs, five record the field false and read\n  `partial`, and two record it true and read `present` while no `intent.json`,\n  `narrative.json`, or `assessment.json` exists beside their goal. The rule trusts the\n  recorded field, so the board reports those two as whole. A stricter rule would\n  cross-check the sibling records. That change is not made here.\n- **The board has no filter and no search.** Fifteen rows is a readable list. A bundle\n  with sixty designs would not be, and nothing in this epic says what happens then.\n- **The board states completeness, which no other panel does.** Every panel in this shell\n  states absence and never presence. The board breaks that rule on purpose, because its\n  job is to let a reader compare two items before opening either. A later session that\n  \"fixes\" the board to state absence only would remove the reason it exists.\n- **The three readiness words are new to a reader here.** The key explains them, and the\n  key is a paragraph of prose above the list. If a later change removes the key, the marks\n  become unreadable.\n- **The board's address rule repeats two rules the model owns.** `model.ts` sets\n  `levelsOf`'s `intent.available` to `record !== undefined`, and `gatesOf`'s `build` to\n  `work.epics.length >= 1`. `Board.tsx`'s `rowSection` states both again. They agree today,\n  so no row names a section the shell redirects away from. A later change to either model\n  rule would not reach the board. The board cannot call `levelsOf`, because that function\n  takes a `WorkItem` and the board takes `DesignRow[]`. The fix is to lift the rule into one\n  exported function in `model.ts` that both callers use. It is not made here.\n", "epic-E2-design.md": "# Epic Technical Solution Design: E2 \u2014 The build pipeline\n\nFeature: cobuilder-viewer\nEpic ID: cobuilder-viewer/E2\n\n## Scope and Intent\n\nE2 makes `plugins/artifact/viewer/index.html` a build output. Today a hand-written file\nsits there. `vite.config.ts` writes its build to `../dist` instead, because\nADR-0023's output rule was still under revision when that config landed. E2 settles it:\nthe build writes the committed file, and a test rebuilds it and fails on any difference.\n\nThis epic carries the program's riskiest unknown. A guarded artifact is only a guard if\ntwo builds produce the same bytes, so the question comes first and the pipeline second.\n\nThe boundary. E2 changes how the build produces that file, and nothing about what the file contains.\nIt adds no panel, no route, and no record read. It does not touch the exporter beyond\nthe named markers E1 puts in the output. It does not change the bundle, the record\nindex, or any script outside `plugins/artifact/viewer/`.\n\n## Files Touched\n\n- `plugins/artifact/viewer/vite.config.ts` \u2014 modified. `build.outDir` moves from\n  `../dist` to the plugin root, so the build writes `index.html` in place. The\n  single-file plugin and the `@` alias stay as they are.\n- `plugins/artifact/viewer/package.json` \u2014 modified. The build script gains the\n  `tsc --noEmit` step it already carries, and a `build:check` script the test calls.\n- `plugins/artifact/viewer/index.html` \u2014 modified by every build from here on. It\n  becomes a build artifact, and no hand edit to it survives a rebuild.\n- `plugins/artifact/viewer/src/main.tsx` \u2014 modified. It mounts the shell the build\n  emits, and it is where the named markers reach the output.\n- `plugins/artifact/viewer/src/index.html` \u2014 modified. The dev entry gains the same\n  marker comments the build passes through, so dev and built output agree.\n- `plugins/artifact/viewer/dist/` \u2014 deleted. The scratch output has no reader once the\n  build writes the committed file.\n- `tests/test_viewer_build.py` \u2014 new. The byte-equal guard.\n- `plugins/artifact/viewer/package-lock.json` \u2014 unchanged, and load-bearing. The\n  byte-equal test compares two builds from this one lockfile.\n- `.nvmrc` or `package.json`'s `engines` field \u2014 modified. The Node major pins too, for\n  the same reason the lockfile does.\n\n## Types & Signatures\n\nE2 carries no application type. Its contracts are the build's output path, the marker\nnames, and the Python helpers the guard calls.\n\n```ts\n/* vite.config.ts \u2014 the output contract. */\nexport default defineConfig({\n  root: \"src\",\n  build: {\n    outDir: \"..\",          // the plugin root, so the build writes index.html in place\n    emptyOutDir: false,    // never true here: the outDir holds package.json and src/\n    target: \"es2022\",\n  },\n});\n```\n\n```python\n# tests/test_viewer_build.py\nVIEWER = REPO_ROOT / \"plugins\" / \"artifact\" / \"viewer\"\nCOMMITTED = VIEWER / \"index.html\"\n\ndef npm_available() -> bool: ...\ndef run_build() -> bytes:\n    \"\"\"Run the viewer's build and return the bytes it wrote to COMMITTED.\"\"\"\ndef committed_bytes() -> bytes: ...\ndef marker_names() -> list[str]:\n    \"\"\"The names export_artifact.py matches, read from the exporter itself.\"\"\"\n```\n\n**The marker contract.** E1 puts a small set of named markers in the built output:\none in the document head, one where the per-pull-request data block begins, and one\nwhere it ends. The exporter matches those names and never a literal that sits between\nthem. E2 asserts the names survive a build, and it does not own their spelling.\n\n**The determinism contract.** Two runs of `npm ci && npm run build`, on one machine,\nfrom one lockfile, with one Node major, produce the same bytes. That is the property\nslice 2 measures, and slice 3 is the guard that depends on it.\n\n## Slice Decomposition\n\nPer `docs/plans/cobuilder-viewer/04-slices.md`, in build order. E1's slice 1 runs\nfirst, because the markers it adds are what the build carries through.\n\n- **Slice 2 \u2014 Two builds produce the same bytes.** Depends on: nothing in this epic.\n  Runs the build twice on the same input and compares. Its end is a measurement: either\n  the bytes match, or the spike reports what varies.\n- **Slice 3 \u2014 The build owns the committed file.** Depends on: slice 2, because the\n  guard is meaningless while the output varies. Wires the output path, commits the\n  built file, and adds the test that fails on any difference.\n\nSlice 3 is not slice 2's edge cases. They are two states: a toolchain that can\nreproduce itself, and a pipeline that holds the committed file to it.\n\n## Test Plan\n\n`tests/test_viewer_build.py`, run by `uv run --with pytest pytest tests/ -v`. Every\ncase skips with a clear reason when `npm` or `node_modules` is absent, so a checkout\nwith no Node still passes the suite.\n\n- `test_two_builds_produce_the_same_bytes` \u2014 slice 2. Build twice, compare, and report\n  the first differing byte offset when they differ.\n- `test_build_reproduces_the_committed_viewer` \u2014 slice 3. Compare a fresh build against\n  `index.html`.\n- `test_editing_the_output_fails_the_test` \u2014 slice 3. Write one byte into a temporary\n  copy of the committed file and assert the comparison fails. A guard that cannot fail\n  proves nothing.\n- `test_every_marker_name_survives_a_build` \u2014 slice 3. Read the names from\n  `export_artifact.py` and assert each one appears in the built output.\n- `test_out_dir_is_the_plugin_root` \u2014 slice 3. Read `vite.config.ts` and assert\n  `build.outDir` resolves to the plugin root, so a later edit cannot quietly restore\n  `../dist`.\n- `test_the_build_does_not_empty_the_plugin_root` \u2014 slice 3. Assert `emptyOutDir` is\n  false. A build that empties the plugin root deletes `package.json` and `src/`.\n\n## Risks & Open Questions\n\n- **The output path is the epic's open problem.** `vite.config.ts` writes to `../dist`\n  today, with its own comment saying ADR-0023's output rule is under revision while the\n  shipped file keeps working. E2 moves the output to the commit, and that is a real\n  change to a shipped file: every publish after it rewrites a build artifact. The\n  byte-equal guard is the only thing standing between that and a stale commit, so the\n  guard is a precondition of the move rather than a companion to it.\n- **`emptyOutDir` must be false.** The output directory becomes the plugin root, which\n  holds `package.json`, `src/`, and `node_modules/`. A build that empties its own\n  output directory deletes the project.\n- **Byte-equality across two machines is unproven.** The lockfile pins dependencies and\n  the engines field pins Node. Neither pins the operating system, the file ordering a\n  filesystem reports, or a locale. Slice 2 answers this for one machine. The second\n  machine is a real question and this design does not settle it.\n- **A contributor now needs Node and npm to change the viewer.** The repository has\n  never required either. It is a stated risk in `intent.json`, and no work in this\n  program answers it.\n- **The tests skip when Node is absent.** That keeps the suite runnable. It also\n  means a CI runner without Node passes the guard's cases by not running them. Whoever\n  wires CI must add Node, or the guard is nominal.\n- **The build's dependency on the markers is one-way.** E1 asserts the names exist in\n  the source. E2 asserts they survive the build. If the single-file plugin ever\n  rewrites an HTML comment, both pass and publishing breaks. Slice 2's byte comparison\n  is the only case that would notice.\n", "epic-E5-design.md": "# Epic Technical Solution Design: E5 \u2014 The Work surface\n\nFeature: cobuilder-viewer\nEpic ID: cobuilder-viewer/E5\n\n## Scope and Intent\n\nE5 is the Work surface: one work item, four levels that page their sections, and the\npanels that read the bundle's records. It carries the section model ADR-0028 decided,\nand it is the largest epic in the narrowed program at six slices.\n\nThe three claims the epic exists for:\n\n1. **A level is a sequence of sections.** One section is on screen at a time, on a\n   horizontal track, and the box owns the scroll rather than the pane.\n2. **One index drives the strip, the pager bar, and the two arrow keys.** The index is\n   view state, so a step writes no route.\n3. **The progress strip measures the level**, as `(index + within) / count`, where a box\n   with no scroll range counts as fully read.\n\nThe boundary. E5 renders one work item that a reader already chose. It does not own the\nboard that lists them (E19), the FlightDeck surface (E6, E7), the record Sheet's own\nlayout beyond the row that opens it, or any publishing path. It reads the record index\nand derives no join.\n\n`plugins/artifact/viewer/src/variations/sections-e/` is the built reference. The\nprototype holds the model as measured, and the numbers in this design come from it.\n\n## Files Touched\n\n- `plugins/artifact/viewer/src/shell/App.tsx` \u2014 new. The boot, the route, the frame,\n  the rail, the top bar, and the pane.\n- `plugins/artifact/viewer/src/shell/Pager.tsx` \u2014 new. `SectionStrip`, `SectionStage`,\n  `SectionPager`, `LevelProgress`, `useSectionPaging`, and `withinOf`.\n- `plugins/artifact/viewer/src/shell/model.ts` \u2014 new. `buildWorkItems`, `gatesOf`,\n  `levelsOf`, `readRoute`, `routeHref`, `epicGroups`, `boardHref`.\n- `plugins/artifact/viewer/src/shell/hooks.ts` \u2014 new. `useIndexLoad`, `useHashRoute`,\n  `useDocumentNoScroll`, `useVisibleWidthCap`, `useCollapsedRail`, `useFocusOnChange`,\n  `useScrollResetOnRoute`, `useSectionAvailability`.\n- `plugins/artifact/viewer/src/shell/panels/Intent.tsx` \u2014 new. Why, Done when, Abort if,\n  Out of scope.\n- `plugins/artifact/viewer/src/shell/panels/ProblemSolution.tsx` \u2014 new. Problem and\n  solution, Risks, Assessment, Unknowns.\n- `plugins/artifact/viewer/src/shell/panels/Architecture.tsx` \u2014 new. Diagrams,\n  Architecture Decisions, Boundaries, Districts and alternatives considered.\n- `plugins/artifact/viewer/src/shell/panels/Build.tsx` \u2014 new. The epic runs, the slices,\n  the rubrics.\n- `plugins/artifact/viewer/src/shell/panels/PullRequests.tsx` \u2014 new. The envisioned pull\n  request first, then the real ones, then the FlightDeck entry.\n- `plugins/artifact/viewer/src/shell/panels/Shipped.tsx` \u2014 new. The stage, the\n  publications, and the missing deploy record.\n- `plugins/artifact/viewer/src/shell/atoms.tsx` \u2014 new. `Panel`, `Box`, `Chip`,\n  `TextList`, `StateBadge`, `TONE_PILL`, `TONE_MARK`, and the band and tint classes.\n- `plugins/artifact/viewer/src/shell/DiagramTiles.tsx` \u2014 new. The tiles, the dialog, the\n  zoom, and the offline source fallback.\n- `plugins/artifact/viewer/src/shell/Sheet.tsx` \u2014 new. The record sheet and its\n  jumplink row.\n- `plugins/artifact/viewer/src/shell/Rail.tsx`, `TopBar.tsx` \u2014 new. The traverse and the\n  work item.\n- `plugins/artifact/viewer/src/index.css` \u2014 modified. The token set the surface reads.\n- `tests/test_sections.py` \u2014 new. The section model's claims against the served viewer.\n\n## Types & Signatures\n\n```ts\n/* Pager.tsx \u2014 ADR-0028's shape. */\nexport interface Paging {\n  index: number;\n  count: number;\n  select(index: number): void;\n  previous(): void;\n  next(): void;\n}\n\n/** The active section. It clamps to the list, and a route change resets it to `start`. */\nexport function useSectionPaging(count: number, routeKey: string, start?: number): Paging;\n\n/** How far through one box the reader is. A box with no scroll range counts as read. */\nexport function withinOf(box: HTMLElement | null): number;\n\nexport function SectionStrip(props: {\n  targets: JumpTarget[]; activeIndex: number; onSelect(index: number): void;\n}): JSX.Element;\n\nexport function SectionStage(props: {\n  index: number;\n  activeBoxRef?: RefObject<HTMLDivElement | null>;\n  children: ReactNode;\n}): JSX.Element;\n\nexport function SectionPager(props: {\n  index: number; count: number; onPrevious(): void; onNext(): void;\n}): JSX.Element;\n\n/* model.ts */\nexport type SectionKey =\n  | \"intent\" | \"problem-and-solution\" | \"architecture\"\n  | \"build\" | \"pull-requests\" | \"shipped\";\n\nexport type LevelKey = \"intent\" | \"problem-and-solution\" | \"architecture\";\n\nexport interface Route {\n  workId: string | null; section: SectionKey;\n  sub: string | null; subId: string | null;\n}\n\nexport interface LevelState { key: LevelKey; available: boolean; missing: string[] }\nexport interface Gates { build: boolean; pullRequests: boolean; shipped: boolean; rubrics: boolean }\n\nexport function readRoute(): Route;\nexport function routeHref(workId: string, section: SectionKey, tail?: string): string;\nexport function levelsOf(work: WorkItem): Record<LevelKey, LevelState>;\nexport function gatesOf(work: WorkItem): Gates;\n/** The Build level's sections: the epics in delivery order, six to a section. */\nexport function epicGroups(work: WorkItem): EpicEntity[][];\n\n/* DiagramTiles.tsx */\nexport function loadMermaid(theme: Theme): Promise<MermaidApi>;\nexport function uncap(svg: string): string;\nexport function DiagramTiles(props: {\n  levels: string[]; sources: Record<string, string>; theme: Theme;\n}): JSX.Element;\n\n/* Sheet.tsx */\nexport interface SheetSubject { /* one member per record kind */ }\nexport function useSheetHeadings(scroll: HTMLElement | null, keys: readonly unknown[]): SheetHeading[];\n```\n\n**The section lists, and where each comes from.** Intent holds Diagrams (the bundle's\nfirst diagram level), Why, Done when, Abort if, and Out of scope. Problem & Solution\nholds Problem and solution, Risks, Assessment, and Unknowns. Architecture holds the\nmechanism diagrams, Architecture Decisions, Boundaries, and Districts and alternatives\nconsidered. Build holds its epic runs. The first three are fixed lists; Build's comes\nfrom `epicGroups`.\n\n**A paged section carries no fold.** Every panel of a paged section renders open, so\n`Panel` receives no `collapsible` prop on these levels.\n\n## Slice Decomposition\n\nPer `docs/plans/cobuilder-viewer/04-slices.md`, in build order.\n\n- **Slice 8 \u2014 The section model.** Depends on: slice 7 (E19 opens a work item), slice 4\n  (the typed model), slice 5 (the approved prototype). The track, the strip, the pager,\n  the arrow keys, one box on screen, and no pane scroll.\n- **Slice 9 \u2014 The level's progress.** Depends on: slice 8, because the strip measures\n  the box the model puts on screen.\n- **Slice 10 \u2014 Every level renders its own sections.** Depends on: slice 8. The six\n  sections' panels, and the envisioned pull request leading Pull requests.\n- **Slice 11 \u2014 The diagram tiles open their drawing.** Depends on: slice 10, because the\n  tiles live in Architecture's Diagrams section and Intent's first section.\n- **Slice 12 \u2014 A record opens in the Sheet.** Depends on: slice 10, because a Sheet\n  opens from a control inside a panel.\n- **Slice 13 \u2014 A goal.json-only design renders.** Depends on: slice 10. Seven designs in\n  this repository carry one record, and each must render every level it can fill.\n\nSlice 9 does not fold into slice 8. They are two states: a model that moves one box, and\na reading that reports the level's position. ADR-0028 states them as two claims.\n\n## Test Plan\n\n`tests/test_sections.py`, run by `uv run --with pytest pytest tests/ -v`. The harness\nserves the bundle rooted at `.cobuilder-architect/self/`, which is the parent of\n`viewer/`, and measures the DOM. The Gate 4c rubrics score the same claims on the built\nsurface, because the repository's suite holds no browser driver today.\n\n**What `tests/test_sections.py` can measure, and what it cannot.** The file cannot\nmeasure the served page. The repository holds no browser driver, and a Python test\nreaches the DOM only through jsdom, which holds no layout engine. jsdom reports zero\nfor `scrollHeight`, for `clientHeight`, and for a bounding rect, and its computed style\ncarries no layout-derived value. So the file measures the tree, the roles, the\nattributes, and the class logic. The geometry claims in this document's test list \u2014 a\npane whose scroll height equals its client height, one box's rect inside the pane's, a\ntrack transform of one box width, and a progress reading \u2014 need a real browser. Those\nclaims belong to the Gate 4c rubrics, scored through the ChromeDevTools MCP tools, and\n`epic-E19-design.md` states the same rule.\n\n- `test_paged_level_pane_does_not_scroll` \u2014 slice 8. On each of the four paged levels,\n  the pane's `scrollHeight - clientHeight` is zero.\n- `test_one_box_is_in_view` \u2014 slice 8. One box's rect sits inside the pane's, and no\n  other box's does.\n- `test_strip_count_matches_box_count` \u2014 slice 8. The strip's headings equal the boxes,\n  and the pager reads `Section 1 of N` for that N.\n- `test_next_moves_exactly_one_box` \u2014 slice 8. The track's transform moves by exactly\n  one box width, forward and back.\n- `test_arrow_keys_step_and_are_guarded` \u2014 slice 8. The two arrow keys step, and a press\n  inside an `input`, a `textarea`, or a `select`, or with a modifier held, does not.\n- `test_progress_is_level_progress` \u2014 slice 9. The reading is 0 at the first section's\n  top, one count's share higher mid-box, and the full walk never decreases.\n- `test_box_with_no_range_reads_as
