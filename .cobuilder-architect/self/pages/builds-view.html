 taller than the box | the box is the only region that scrolls on a paged level. The stage clips the track, never a box's content |\n| The section strip | itself, sideways, when the headings exceed the width | a record with many sections keeps every heading reachable |\n| The pager bar | none | it holds one row of two controls and a count |\n| The rail | itself, when its items exceed the viewport | a long rail must stay usable, and the rail never scrolls the pane |\n| The top bar | none | it holds one line at every width |\n| The work-item switcher list | itself | its list can exceed the viewport |\n| The diagram dialog's body | both axes | a drawing at 400 % is far wider and taller than the dialog |\n| The record sheet's container | both axes | an ADR body holds tables and long prose |\n| A tooltip | none | it is transient and never scrolls |\n| The section-link bar | none. It is `sticky` inside the pane, so it rides the pane's own scroll and adds no region | it holds one row of links, and it never scrolls anything |\n| The progress strip | none. It holds one 4 px bar | on a paged level it reports the level's own position, and on a section that stacks it reports the pane's offset |\n\nThe document never scrolls, so `html` and `body` carry no overflow. Every wheel\nevent not consumed by a nested region scrolls the innermost region that can take\nit. Where two regions could claim a gesture, the innermost owner wins, and the\nouter region does not move.\n\n**A section link moves the pane element, never the window.** The document cannot\nscroll at all, so a hash write or a `window.scrollTo` would land nowhere. The\nlink intercepts the press, measures the target against the pane, and sets the\npane's own offset. Under `prefers-reduced-motion: reduce` the pane arrives in\none frame instead of animating.\n\n**A section heading in the strip moves nothing at all except the index.** On a\npaged level the pane cannot scroll, so there is no offset to set. The press sets\nthe shared index, and the track slides one box. The box then owns its own scroll.\nThe heading stays focusable, and the press is prevented so the route never moves.\n\n**The progress strip measures the level on a paged level and the pane on a\nsection that stacks.** The document cannot scroll, so a window-scoped progress\nbar would read zero at every position. On a section that stacks the strip takes\nthe pane's own element and reports that element's offset, as it always has. On a\npaged level the strip instead reports `(index + within) / count`. `within` is the\nactive box's own scroll progress, and a box with no scroll range counts as fully\nread. That value answers how far through the level a reader is. A pane-scoped bar\ncannot answer that question once the pane stops scrolling. The strip spans the\nlevel's full width and sits above the section strip.\n\n**Five rules make \"no scroll\" safe rather than a way to hide content.** A layout\nthat fills the viewport and hides its overflow will clip whatever does not fit,\nand the reader has no way to reach it. These rules prevent that.\n\n1. **The shell fills its parent, never the viewport.** It uses `h-full`, not\n   `h-dvh`. The viewport height belongs to whoever owns the page. When a host\n   renders the shell beneath its own chrome, `h-dvh` makes the shell taller than\n   the space it was given, and the surplus is clipped at one edge.\n2. **The scrolling region scrolls on both axes.** `overflow: auto`, never\n   `overflow-y: auto` with `overflow-x: hidden`. A region that hides its\n   horizontal overflow clips a wide table with no scrollbar and no way to reach\n   it. The region is the pane on a section that stacks. It is the section box on a\n   paged level, where the pane itself has nothing to scroll.\n3. **A wide block scrolls itself.** Every table, code block, and diagram wraps in\n   its own `overflow-x: auto` container, so the region keeps its own scroll and the\n   wide block keeps its integrity.\n4. **Every flex and grid child carries `min-w-0`.** A flex child defaults to its\n   content width, so one wide row stretches the region and pushes its siblings off\n   the edge.\n5. **The shell fills the visible screen, never the whole window.** It caps itself\n   to the narrower of the window and the screen. This rule is the price of rule 2,\n   and it exists because of a real failure. A reader ran a 1600 px window on a\n   1512 px screen. The surplus 88 px sat outside the display. A normal page would\n   let them scroll sideways to reach it. This shell cannot, on purpose, so 88 px\n   of content was unreachable and no scrollbar could appear to say so. The reader\n   reported it as clipping, which is exactly what it looked like. A window is not\n   a screen, and a shell with no document scroll must never assume it is.\n\n**On a paged level, the stage clips only the track.** The stage's outer element\nis `overflow: hidden`, and what it hides is the boxes either side of the one on\nscreen. It never hides a box's content. Each box is its own two-axis scroll\nregion, and the boxes off screen carry `inert`. So nothing focusable sits where a\nreader cannot see it. This is the one clip box in the shell, and it is the reason\nrule 3 holds rather than bends on a paged level.\n\nMeasured on the mockup at 1600x1000 on 2026-09-19. The pane reported\n`overflow-x: hidden`, which is rule 2's defect: any block wider than the pane\nclipped with no scrollbar and no way to reach it. Rule 1 is a guard rather than a\nrepair. The shell did fit its parent, at 919 px against 919 px. The rule stays\nbecause the host, not the shell, owns the viewport height, and a host that does\nnot give the shell a definite height will break it.\n\n---\n\n## 12. Future Considerations\n\n1. **No deploy record exists.** The Shipped section reports `stage` and the\n   publication entities, and states the gap. A future record type would fill it.\n2. **`feature_gates` is empty.** Rubrics have nothing to read until it populates.\n3. **The epic and slice vocabularies need a schema change.** The build loop\n   produces six epic states and seven slice states. The corpus carries four and\n   one.\n4. **Epic outcomes are absent from the index.** They live in `goal.epics[]`, so\n   the Why line must read a second source and say so.\n5. **`epic.design_doc` misses five documents.** It builds a key from the design id\n   and compares against the planning slug, so `plugin-split`'s five documents do\n   not resolve. `shared/build_index.py` owns that fix.\n6. **The three variations remain useful.** Their tile arrangements are inputs to\n   the level panels inside the scroll pane.\n7. **The theme switcher persists nothing.** A published file cannot store a\n   preference.\n\n---\n\n## Document Validation Checklist\n\n- [x] Every interactive component has a state table in section 3.2.\n- [x] Every component marks exactly one initial state.\n- [x] Every timer names its arming event and its reset event. The only deferred\n      load is the diagram render, and it starts when its section mounts.\n- [x] Every control with a conditional existence appears in section 3.3.\n- [x] Every multi-valued setting appears in section 2.3 with a default.\n- [x] Every state change appears in section 4.1 with a source and target state.\n- [x] Every duration in section 4.1 names a token from section 4.2.\n- [x] Every flow names its entry condition and its edge cases.\n- [x] Every floating surface names a layer from section 11.1.\n- [x] Every control names its hit target element and its clickable bounds.\n- [x] Every overlapping region names the surface that owns the gesture.\n- [x] No section depends on the mockup for an answer.\n", "rubric-1": "# Rubric: Slice 1 \u2014 tracer bullet: two plugins, one shared module\n\nFeature: cobuilder-family\nEpic: plugin-split/E2\nSlice goal: Two throwaway plugins install from a local marketplace and both resolve `shared/_bundle_meta.py` from their own cache.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 A local marketplace installs two sibling plugins [CRITICAL]\n**Must be true:** A person adds the marketplace from a local path and installs both plugins. Neither is nested inside the other.\n**Evidence to check:**\n- `claude plugin validate` on each plugin directory, exit 0.\n- The installed cache holds two separate plugin directories.\n**Scoring:**\n- 1.0 \u2014 both install, both validate, neither path contains the other.\n- 0.5 \u2014 one installs, or both install only after a manual step not in the docs.\n- 0.0 \u2014 the marketplace does not resolve, or a plugin fails to install.\n\n### C2 \u2014 The shared module resolves from each plugin's own cache [CRITICAL]\n**Must be true:** Each installed plugin reads `shared/_bundle_meta.py` through its own `${CLAUDE_PLUGIN_ROOT}` and prints `SCHEMA_VERSION`. Neither reads the marketplace source tree, and neither reads the other's cache.\n**Evidence to check:**\n- Run each plugin's command. Both print the same version string.\n- Delete or rename the marketplace source directory, then run both again. Both still work.\n**Scoring:**\n- 1.0 \u2014 both print the version, and both survive the source directory going away.\n- 0.5 \u2014 both print the version while the source tree is present, and one fails once it is gone. This is the copy-not-happening failure and it must be reported, not rounded up.\n- 0.0 \u2014 either plugin cannot resolve the module.\n\n### C3 \u2014 The symlink dereference is proved for a directory, not a file\n**Must be true:** `shared/` holds more than one Python module and at least one nested directory, and every file arrives in each cache.\n**Evidence to check:** List the installed cache for each plugin and compare against `shared/`.\n**Scoring:** 1.0 \u2014 every file present in both. 0.5 \u2014 the top level copies and a nested directory does not. 0.0 \u2014 nothing copies.\n\n### C4 \u2014 The result is written down where the next slice will read it\n**Must be true:** The outcome, including a failure, is recorded in `00-status.md`.\n**Evidence to check:** Read `docs/plans/cobuilder-family/00-status.md`.\n**Scoring:** 1.0 \u2014 the outcome and the exact commands are recorded. 0.5 \u2014 an outcome with no commands. 0.0 \u2014 nothing recorded.\n\n## Regression check\n- No existing script, skill, or command changes in this slice.\n- The throwaway plugins live outside the shipped tree and are removed or clearly marked before slice 6.\n\n## Out of scope \u2014 do not penalise\n- Any real plugin content. These two plugins print a constant and nothing else.\n- `require_compatible()`, the index, the viewer, and the ledger.\n- The copy-before-publish fallback. It is only designed if C2 fails.\n", "rubric-2": "# Rubric: Slice 2 \u2014 the compatibility gate exists\n\nFeature: cobuilder-family\nEpic: plugin-split/E3\nSlice goal: `require_compatible()` and `stamp_generator()` pass their tests, called by nothing yet.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 A bundle that demands a newer reader is refused [CRITICAL]\n**Must be true:** Writing into a bundle whose `min_reader_schema` exceeds the running code's `SCHEMA_VERSION` raises, rather than writing and corrupting.\n**Evidence to check:** `pytest tests/ -k require_compatible -v`, and read the raising branch.\n**Scoring:** 1.0 \u2014 raises a named exception with the two versions in the message. 0.5 \u2014 raises a bare exception, or warns and continues. 0.0 \u2014 writes anyway.\n\n### C2 \u2014 A newer bundle format is refused\n**Must be true:** A `bundle_format` above the running code's is refused on the same path.\n**Evidence to check:** The matching test.\n**Scoring:** 1.0 \u2014 refused. 0.5 \u2014 refused only in one of the two code paths. 0.0 \u2014 accepted.\n\n### C3 \u2014 A new bundle is not treated as incompatible\n**Must be true:** A missing `bundle.json` means a new bundle and passes.\n**Evidence to check:** The matching test.\n**Scoring:** 1.0 \u2014 passes silently. 0.5 \u2014 passes with a spurious warning. 0.0 \u2014 raises.\n\n### C4 \u2014 Recording one plugin's version does not drop another's\n**Must be true:** Stamping as one plugin preserves every other entry in the generators map.\n**Evidence to check:** The matching test, with two plugins already present.\n**Scoring:** 1.0 \u2014 both survive. 0.5 \u2014 order or formatting churns but both survive. 0.0 \u2014 an entry is lost.\n\n## Regression check\n- Every test that passed before this slice still passes.\n- No caller is changed. Scope is the shared version module and its tests.\n\n## Out of scope \u2014 do not penalise\n- Wiring the gate into the existing writers. That is slice 3.\n- The migration ladder and `min_reader_schema` being written anywhere real.\n", "rubric-3": "# Rubric: Slice 3 \u2014 the gate is wired and the bundle migrates\n\nFeature: cobuilder-family\nEpic: plugin-split/E3\nSlice goal: Format 3, `min_reader_schema`, the generators map, and every writer gated.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 Every script that writes into a bundle calls the gate first [CRITICAL]\n**Must be true:** No writer stamps a schema version without checking compatibility. The three that do so today are named in `03-program-design.md`.\n**Evidence to check:** The static test that scans each writer, plus a read of each call site.\n**Scoring:** 1.0 \u2014 every writer gated, and the test fails when a call is removed. 0.5 \u2014 writers gated but no test guards it. 0.0 \u2014 a writer still stamps unchecked.\n\n### C2 \u2014 An existing bundle migrates without losing authored content [CRITICAL]\n**Must be true:** A real bundle from before this change steps to format 3, and every authored field is byte-identical afterwards.\n**Evidence to check:** Run the migration against a copy of the committed self-bundle. Diff the authored fields before and after.\n**Scoring:** 1.0 \u2014 layout and schema step forward, authored fields unchanged, a backup exists. 0.5 \u2014 correct result with no backup written. 0.0 \u2014 an authored field changes, or the run half-writes.\n\n### C3 \u2014 The scalar generator version becomes a map\n**Must be true:** The single generator string is replaced by a map keyed by plugin, and the old value is preserved as the first entry rather than discarded.\n**Evidence to check:** The migration test, and the migrated `bundle.json`.\n**Scoring:** 1.0 \u2014 preserved and keyed correctly. 0.5 \u2014 map created, old value dropped. 0.0 \u2014 field unchanged or removed.\n\n### C4 \u2014 A migration that touches an unexpected authored field stops before writing\n**Must be true:** The existing authored-field guard still holds at the new version, and a violation writes nothing at all.\n**Evidence to check:** The guard test, driven by a deliberately bad migration step.\n**Scoring:** 1.0 \u2014 nothing reaches disk. 0.5 \u2014 it writes then reports. 0.0 \u2014 it writes silently.\n\n### C5 \u2014 The viewer copy refreshes unconditionally\n**Must be true:** The viewer refresh is not gated on a version check.\n**Evidence to check:** Read the migration entry point, and the test that asserts a refresh at an unchanged version.\n**Scoring:** 1.0 \u2014 unconditional and tested. 0.5 \u2014 unconditional and untested. 0.0 \u2014 behind a version gate.\n\n## Regression check\n- Every bundle in the repo still passes verification after migrating.\n- The three committed bundles are migrated, not regenerated.\n\n## Out of scope \u2014 do not penalise\n- Any rename, any directory split, the index, the viewer modes, and the ledger.\n", "rubric-4": "# Rubric: Slice 4 \u2014 renames inside today's single plugin\n\nFeature: cobuilder-family\nEpic: plugin-split/E1\nSlice goal: Six architecture modes, `explore-design` deleted, and the pull-request modes rotated.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 Every command still dispatches to something that exists [CRITICAL]\n**Must be true:** Every command file names a skill and a mode the skill actually handles.\n**Evidence to check:** The test that reads each command file, extracts the skill and mode, and checks the skill declares it.\n**Scoring:** 1.0 \u2014 all resolve and the test guards it. 0.5 \u2014 all resolve, no test. 0.0 \u2014 a command names a mode nothing handles.\n\n### C2 \u2014 The duplicate command is gone and its behaviour is not [CRITICAL]\n**Must be true:** `explore-design` no longer exists as a user-facing command, and divergent exploration still runs as a stage inside Design mode.\n**Evidence to check:** The command file is deleted. Read Design mode's procedure for the exploration stage.\n**Scoring:** 1.0 \u2014 deleted, and the stage is still named in the procedure. 0.5 \u2014 deleted, and the stage reference went with it. 0.0 \u2014 still a command.\n\n### C3 \u2014 No document claims a count that is now wrong\n**Must be true:** Every place that counts the architecture modes says six.\n**Evidence to check:** Grep the repo for the mode counts in prose.\n**Scoring:** 1.0 \u2014 every count correct. 0.5 \u2014 one stale count. 0.0 \u2014 several.\n\n### C4b \u2014 The rename is a rotation and nothing is lost [CRITICAL]\n**Must be true:** `submit` becomes `generate`, and the old `generate`, which narrates merged history, becomes `review`. The word `generate` therefore means one thing before the change and a different thing after it. Every procedure, command, and citation ends up pointing at the mode that does the work it describes.\n**Evidence to check:** Open the new `generate` and confirm it interviews the author, assesses the change, writes the narrative, and opens the pull request. Open the new `review` and confirm it narrates merged history. Grep for every mention of both words and check each one against the meaning it now needs.\n**Scoring:**\n- 1.0 \u2014 both modes do the right work and every citation points at the right one.\n- 0.5 \u2014 the modes are correct and at least one citation still means the old sense of `generate`, which is the exact trap this rotation sets.\n- 0.0 \u2014 a mode was split, dropped, or renamed to something the plan does not name.\n\n### C4 \u2014 A rename does not silently change behaviour\n**Must be true:** A renamed mode does the same work it did before, and any behaviour change is deliberate and written down.\n**Evidence to check:** Diff each renamed procedure against its previous version.\n**Scoring:** 1.0 \u2014 renames only, or a change recorded in the plan. 0.5 \u2014 an undocumented small change. 0.0 \u2014 a behaviour change nobody recorded.\n\n## Regression check\n- The repo is still one plugin at the end of this slice.\n- No path in `scripts/` changes.\n\n## Out of scope \u2014 do not penalise\n- The 33 cross-pillar references. That is slice 5.\n- Any directory split.\n", "rubric-5": "# Rubric: Slice 5 \u2014 the 33 cross-pillar references are fixed\n\nFeature: cobuilder-family\nEpic: plugin-split/E1\nSlice goal: The grep regression test passes on a repo that is still one plugin.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 No reference crosses a pillar [CRITICAL]\n**Must be true:** No file under one pillar's skill directory resolves a path into another pillar's skill directory.\n**Evidence to check:** The regression test that scans for cross-pillar paths, run against the whole repo.\n**Scoring:** 1.0 \u2014 zero found and the test guards it. 0.5 \u2014 zero found, no test. 0.0 \u2014 any remain.\n\n### C2 \u2014 The test tells a vendored reference apart from a cross-pillar one [CRITICAL]\n**Must be true:** A reference to a vendored shared skill passes. A reference to the other pillar fails. `02-architecture.md` records five of the first kind.\n**Evidence to check:** Feed the test one of each and check the verdicts.\n**Scoring:** 1.0 \u2014 both verdicts correct. 0.5 \u2014 it flags the safe five as well, which makes it noise. 0.0 \u2014 it passes a real cross-pillar reference.\n\n### C3 \u2014 A runtime reference is replaced, not deleted\n**Must be true:** The two references that resolve at runtime still reach their content after the fix, by vendoring, by inlining, or by a documented drop.\n**Evidence to check:** Read both call sites and follow what they now point at.\n**Scoring:** 1.0 \u2014 both reach real content. 0.5 \u2014 one is dropped with no note. 0.0 \u2014 a procedure now cites nothing.\n\n### C4 \u2014 A prose citation that only goes stale is fixed too\n**Must be true:** The prose references are corrected, not left because they do not break at runtime.\n**Evidence to check:** Count what the scan reports before and after.\n**Scoring:** 1.0 \u2014 all fixed. 0.5 \u2014 the runtime ones only. 0.0 \u2014 the count is unchanged.\n\n## Regression check\n- The repo is still one plugin and every command still works.\n- No procedure loses a step to make a reference disappear.\n\n## Out of scope \u2014 do not penalise\n- The directory split. This slice fixes references while everything still lives together.\n", "rubric-6": "# Rubric: Slice 6 \u2014 five plugins, five manifests\n\nFeature: cobuilder-family\nEpic: plugin-split/E1\nSlice goal: `claude plugin validate` passes on each, and the family installs.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 Each plugin validates and installs alone [CRITICAL]\n**Must be true:** Each of the five installs from the marketplace on its own and its commands appear.\n**Evidence to check:** Validate each manifest. Install each alone into a clean cache and list its commands.\n**Scoring:** 1.0 \u2014 all five. 0.5 \u2014 four. 0.0 \u2014 any fails to validate, or one needs another to install.\n\n### C2 \u2014 The umbrella plugin brings the other four [CRITICAL]\n**Must be true:** Installing the full-lifecycle plugin installs the other four through its dependency list.\n**Evidence to check:** Install it into a clean cache and list what arrived.\n**Scoring:** 1.0 \u2014 all four arrive. 0.5 \u2014 they arrive after a manual step. 0.0 \u2014 the dependency list does nothing.\n\n### C3 \u2014 The install surface is unchanged\n**Must be true:** No plugin ships an agent, a hook, or an MCP server.\n**Evidence to check:** Read all five manifests and scan each plugin tree.\n**Scoring:** 1.0 \u2014 none present. 0.0 \u2014 any present. There is no half credit on this one.\n\n### C4 \u2014 Each plugin carries its own copy of what it shares\n**Must be true:** Each installed cache holds a real copy of the shared modules and the shared skills. No cache reaches outside itself.\n**Evidence to check:** List each cache. Rename the marketplace source and re-run one command per plugin.\n**Scoring:** 1.0 \u2014 every cache self-contained. 0.5 \u2014 self-contained only while the source tree exists. 0.0 \u2014 a plugin reads outside its root.\n\n### C5 \u2014 Two plugins can be different versions without corrupting a bundle\n**Must be true:** An older plugin and a newer one against the same bundle produce a refusal rather than a bad write.\n**Evidence to check:** Set an older version constant in one cache and run it against a newer bundle.\n**Scoring:** 1.0 \u2014 refused with a clear message. 0.5 \u2014 refused with an unclear one. 0.0 \u2014 it writes.\n\n### C6 \u2014 The temporary command name from slice 4 is undone [CRITICAL]\n**Must be true:** `cobuilder-pr` ships `commands/review.md`, and no command file anywhere is named `odyssey-review.md`. Slice 4 used that name only because one `commands/` directory cannot hold two files named `review.md`. The split removes the collision, so the workaround must go with it.\n**Evidence to check:** List every command file of every plugin. Confirm `cobuilder-architect` and `cobuilder-pr` each carry their own `review.md`, and that both resolve as separate commands.\n**Scoring:**\n- 1.0 \u2014 both plugins carry `review.md`, and `odyssey-review` exists nowhere.\n- 0.5 \u2014 the file is renamed and a document still refers to `odyssey-review`.\n- 0.0 \u2014 the workaround ships.\n\n*Added during the build, on 2026-08-21, after slice 4 surfaced the collision. Recorded here rather than fixed silently, so the rubric stays the record of what is required.*\n\n## Regression check\n- Every bundle in the repo still verifies.\n- Every command that worked at slice 5 still works.\n\n## Out of scope \u2014 do not penalise\n- The index, the viewer modes, and the ledger.\n- The `cobuilder-implement` port. That is slice 7.\n", "rubric-7": "# Rubric: Slice 7 \u2014 the two ports land\n\nFeature: cobuilder-family\nEpic: plugin-split/E1\nSlice goal: `cobuilder-implement` renamed and shipped, `collaborate-with-user` folded in, and the orientation skill written.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 The build skill ships as a plugin and runs its own gates [CRITICAL]\n**Must be true:** The personal skill is now an installed plugin under its new name, and running it on a small change produces the four gate documents and the rubrics.\n**Evidence to check:** Install it alone. Run it on a one-file change and list what it wrote.\n**Scoring:** 1.0 \u2014 four gate documents and one rubric per slice. 0.5 \u2014 the documents, no rubrics. 0.0 \u2014 it does not run from the installed copy.\n\n### C2 \u2014 The old name survives nowhere except as recorded lineage\n**Must be true:** No path, command, or procedure uses the old name. One lineage note may keep it, marked as history.\n**Evidence to check:** Grep the repo for the old name.\n**Scoring:** 1.0 \u2014 only the lineage note. 0.5 \u2014 one or two stale mentions. 0.0 \u2014 paths or commands still carry it.\n\n### C3 \u2014 The presentation skill is folded in, not bolted on [CRITICAL]\n**Must be true:** Its rules live inside the artifact plugin's own skill and references, and it is not a separate skill directory. The established skill-authoring practice was followed.\n**Evidence to check:** Read the artifact plugin's skill and references. Confirm the honesty rule, the theme-token rules, and the composition rules all survive.\n**Scoring:** 1.0 \u2014 folded in with every rule intact. 0.5 \u2014 folded in with a rule lost. 0.0 \u2014 still a separate skill, or rules dropped without a note.\n\n### C4 \u2014 The orientation skill routes rather than duplicates\n**Must be true:** The umbrella plugin's skill names each mode and when to reach for it, and it does not restate another plugin's procedure.\n**Evidence to check:** Read it. Check every mode it names exists.\n**Scoring:** 1.0 \u2014 every mode named and correct, no duplication. 0.5 \u2014 a named mode does not exist. 0.0 \u2014 it copies another plugin's procedure.\n\n## Regression check\n- Every plugin still validates and installs.\n- No page or report changes appearance because a rule was lost in the fold.\n\n## Out of scope \u2014 do not penalise\n- Moving pages out of `.lavish/`. That is slice 10.\n- Any index or ledger work.\n", "rubric-8": "# Rubric: Slice 8 \u2014 the index holds the entities\n\nFeature: cobuilder-family\nEpic: plugin-split/E4\nSlice goal: The index builder emits every entity, and the two scripts it replaces are gone.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 Every entity type appears with a stable id [CRITICAL]\n**Must be true:** Decisions, designs, epics, contexts, districts, boundary rules, pull requests, slices, and publications all appear, each with the id the program design specifies.\n**Evidence to check:** Build the index against this repo. Count each type against the source directories.\n**Scoring:** 1.0 \u2014 every type present and every count matches. 0.5 \u2014 one type missing or one count off. 0.0 \u2014 several missing.\n\n### C2 \u2014 An epic id is scoped to its design [CRITICAL]\n**Must be true:** Two designs that both name an epic `E1` produce two distinct ids.\n**Evidence to check:** The test with two such designs.\n**Scoring:** 1.0 \u2014 distinct. 0.0 \u2014 collide. No half credit; a collision silently merges records.\n\n### C3 \u2014 The build is a full rebuild\n**Must be true:** Deleting a source document and rebuilding removes it from the index.\n**Evidence to check:** The matching test.\n**Scoring:** 1.0 \u2014 removed. 0.5 \u2014 removed only after deleting the index first. 0.0 \u2014 it lingers.\n\n### C4 \u2014 The two replaced scripts are gone, not left beside it\n**Must be true:** The decision and design projection scripts are deleted, and nothing calls them.\n**Evidence to check:** The files are absent. Grep for callers.\n**Scoring:** 1.0 \u2014 deleted, no callers. 0.5 \u2014 deleted, a stale caller remains. 0.0 \u2014 still present.\n\n### C5 \u2014 The viewer reads the index and still renders\n**Must be true:** The existing viewer modes work from the new projection.\n**Evidence to check:** Serve a bundle and open the existing modes.\n**Scoring:** 1.0 \u2014 unchanged behaviour. 0.5 \u2014 one mode degraded. 0.0 \u2014 the viewer breaks.\n\n### C6 \u2014 Nothing is written into the authored tree\n**Must be true:** The builder reads the authored documents and writes only into the bundle.\n**Evidence to check:** The test that builds and then checks the authored tree is untouched.\n**Scoring:** 1.0 \u2014 untouched. 0.0 \u2014 anything written.\n\n## Regression check\n- Every existing viewer mode behaves as it did.\n- Every bundle still verifies.\n\n## Out of scope \u2014 do not penalise\n- The joins, the freshness block, and the three new modes. Those are slices 9 and 10.\n", "rubric-9": "# Rubric: Slice 9 \u2014 the index resolves the joins\n\nFeature: cobuilder-family\nEpic: plugin-split/E4\nSlice goal: Every join resolves, freshness is recorded, and uncovered districts are listed.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 A decision reaches its pull request by both paths [CRITICAL]\n**Must be true:** A record that names its source pull request resolves directly. A record that does not resolves through its design, its epic, and that epic's branch.\n**Evidence to check:** The two tests, plus the resolved join for a real record in this repo.\n**Scoring:** 1.0 \u2014 both paths work and the result records which one was used. 0.5 \u2014 the direct path only. 0.0 \u2014 neither resolves, or the indirect one guesses from touched files.\n\n### C2 \u2014 An unstarted epic is reported unstarted, not missing [CRITICAL]\n**Must be true:** An epic with no branch produces no pull request and no error, and the index says it has not started.\n**Evidence to check:** The matching test, against the nine epics in this repo, eight of which have no branch.\n**Scoring:** 1.0 \u2014 reported as unstarted. 0.5 \u2014 silently absent. 0.0 \u2014 an error, or a wrong pull request attached.\n\n### C3 \u2014 A district reaches a context, and an uncovered one is listed\n**Must be true:** A boundary record's declared districts resolve both ways, and every district no context covers appears in the uncovered list.\n**Evidence to check:** The two tests, plus the real list for this repo.\n**Scoring:** 1.0 \u2014 both directions resolve and the uncovered list is correct. 0.5 \u2014 one direction. 0.0 \u2014 no join.\n\n### C4 \u2014 A slice reaches its epic\n**Must be true:** Every slice declares an epic and the join resolves.\n**Evidence to check:** The test that every slice line names an epic that exists.\n**Scoring:** 1.0 \u2014 every slice joins. 0.5 \u2014 the join exists but a slice is unassigned. 0.0 \u2014 no join.\n\n### C4b \u2014 No join is resolved by a heuristic [CRITICAL]\n**Must be true:** Every join reads an identifier the source states. No join guesses, scores, or matches on prose similarity. When a source is ambiguous, the builder reports the join as unresolved and names the ambiguity.\n**Evidence to check:** Read the resolution code for each join. Look for any comparison of words, any similarity score, and any fallback that picks the most likely candidate. Feed the builder a slice whose epic id is bare rather than scoped, and confirm it refuses rather than choosing.\n**Scoring:**\n- 1.0 \u2014 every join reads a stated identifier, and an ambiguous source produces an unresolved join with a named reason.\n- 0.5 \u2014 the joins resolve correctly today, and one path falls back to a guess when the identifier is missing.\n- 0.0 \u2014 a join resolves by matching prose.\n\n*Added during the build, on 2026-08-22. The epic-first restructure of `04-slices.md` dropped the scoped epic id and left a bare `E1`, which three designs share. That ambiguity forced the first implementation into a word-overlap match. The source is now fixed to carry the scoped id, and this criterion exists so the guess does not survive the fix.*\n\n### C5 \u2014 Staleness is detected on both signals\n**Must be true:** Changing an authored document marks the index stale. Moving the git head does too.\n**Evidence to check:** The two tests.\n**Scoring:** 1.0 \u2014 both. 0.5 \u2014 one. 0.0 \u2014 neither.\n\n## Regression check\n- Every entity from slice 8 is still present with the same id.\n- The build is still a full rebuild.\n\n## Out of scope \u2014 do not penalise\n- Rendering any of this. That is slice 10.\n", "rubric-10": "# Rubric: Slice 10 \u2014 the Decisions and Contexts modes\n\nFeature: cobuilder-family\nEpic: plugin-split/E5\nSlice goal: A person browses every decision and every context, with the anchor distinction visible.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 A person browses the decisions rather than stumbles on one [CRITICAL]\n**Must be true:** The Decisions mode lists every record with its state and what it anchors to, including any record no change happens to cite.\n**Evidence to check:** Serve a bundle. Count the rows against the record count. Confirm the record with no inbound reference is present.\n**Scoring:** 1.0 \u2014 every record listed, including the unreferenced one. 0.5 \u2014 the referenced ones only, which reproduces today's problem. 0.0 \u2014 records missing.\n\n### C2 \u2014 The anchor column shows which joins resolve and which do not [CRITICAL]\n**Must be true:** A record resolving to a verified context is visibly distinct from one resolving only to an inferred district.\n**Evidence to check:** Open the mode against this repo, where the split between the two is uneven and visible.\n**Scoring:** 1.0 \u2014 the two states are distinct at a glance. 0.5 \u2014 the anchor is shown without distinguishing them. 0.0 \u2014 no anchor column, which makes it a list without the point.\n\n### C3 \u2014 Contexts leads with the violations\n**Must be true:** Boundary violations appear first, each marked as a decision candidate, and the districts no context covers are listed.\n**Evidence to check:** Open the Contexts mode against the context in this repo, which records seven findings.\n**Scoring:** 1.0 \u2014 violations first, marked, uncovered districts listed. 0.5 \u2014 rendered but not led with. 0.0 \u2014 violations not shown.\n\n### C4 \u2014 A boundary record reads as rules, not as raw configuration\n**Must be true:** The boundary record renders as a readable rule list rather than as its file format.\n**Evidence to check:** Open a context and read it.\n**Scoring:** 1.0 \u2014 readable rules with their reasons. 0.5 \u2014 the raw file, pretty-printed. 0.0 \u2014 not rendered.\n\n### C5 \u2014 Both modes are reachable and the current one is obvious\n**Must be true:** A person can tell which mode they are in and reach the other in one action.\n**Evidence to check:** Switch between every mode present at this slice.\n**Scoring:** 1.0 \u2014 obvious and one action. 0.5 \u2014 reachable, current mode unclear. 0.0 \u2014 a mode is unreachable.\n\n## Regression check\n- The existing modes behave as they did.\n- Every join from slice 9 still resolves.\n\n## Out of scope \u2014 do not penalise\n- The Builds mode, the Backlog lane, and moving pages. Those are slice 11.\n- Commenting and anchoring. Those are slices 12 to 14.\n", "rubric-11": "# Rubric: Slice 11 \u2014 the Builds mode and the Backlog lane\n\nFeature: cobuilder-family\nEpic: plugin-split/E5\nSlice goal: Gates driven by the status document, the Backlog lane computed from the index, and pages moved into the bundle.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 The Backlog lane shows what is planned and not started [CRITICAL]\n**Must be true:** The Builds mode carries a Backlog lane holding every epic with no branch and every slice not yet scored. Each epic shows what it is, not only its id, and the slices that advance it.\n**Evidence to check:** Open the Builds mode against this repo. Confirm the epic count against `goal.json`. Confirm an epic with no slice is shown as deferred rather than omitted.\n**Scoring:** 1.0 \u2014 correct count, each epic legible, its slices listed, the deferred one visible. 0.5 \u2014 present but showing ids without their work, which is the failure this slice exists to fix. 0.0 \u2014 absent.\n\n### C2 \u2014 The lane is computed, not authored [CRITICAL]\n**Must be true:** The lane is a query over the index. No authored backlog file feeds it, and adding an epic to a design makes it appear with no other edit.\n**Evidence to check:** Grep for any backlog document. Add an epic to a design, rebuild, and open the mode.\n**Scoring:** 1.0 \u2014 computed, and a new epic appears with no other edit. 0.5 \u2014 computed from a file that a person maintains. 0.0 \u2014 the list is authored.\n\n### C3 \u2014 Builds is driven by the status document, not showing it\n**Must be true:** Approval marks and slice scores are chrome derived from the status document, and that document is not rendered as a panel of its own.\n**Evidence to check:** Open the Builds mode and check the gate rail against the real states.\n**Scoring:** 1.0 \u2014 driven and correct at every gate. 0.5 \u2014 driven, one state wrong. 0.0 \u2014 shown as a document.\n\n### C4 \u2014 The epic to slice join is proved by being used\n**Must be true:** The lane lists the slices under each epic, taken from the declared join rather than guessed from the files a slice touches.\n**Evidence to check:** Change one slice's declared epic, rebuild, and confirm it moves.\n**Scoring:** 1.0 \u2014 it moves. 0.5 \u2014 the grouping is hardcoded. 0.0 \u2014 no grouping.\n\n### C5 \u2014 Pages live in the bundle, not in a foreign tool's directory\n**Must be true:** Generated pages are written under the bundle, the existing pages have moved, and their published addresses still work.\n**Evidence to check:** List the bundle page directory. Confirm nothing writes to the old location. Republish one page and confirm the address is unchanged.\n**Scoring:** 1.0 \u2014 moved and an address preserved. 0.5 \u2014 moved and an address lost. 0.0 \u2014 still writing to the old location.\n\n### C6 \u2014 Five modes stay navigable\n**Must be true:** With all five present, a person can tell which mode they are in and reach any other in one action.\n**Evidence to check:** Switch between all five.\n**Scoring:** 1.0 \u2014 obvious and one action. 0.5 \u2014 reachable, current mode unclear. 0.0 \u2014 a mode is unreachable.\n\n## Regression check\n- The Decisions and Contexts modes from slice 10 behave as they did.\n- Publishing a page still produces a working page.\n\n## Out of scope \u2014 do not penalise\n- Ranking the lane by dependent decision count. Slice-count ranking is acceptable here, and the richer ranking is a later refinement.\n- Commenting and anchoring. Those are slices 12 to 14.\n", "rubric-12": "# Rubric: Slice 12 \u2014 the ledger and its projection\n\nFeature: cobuilder-family\nEpic: plugin-split/E6\nSlice goal: Append, fold, and project, with no server involved.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 A read never deletes [CRITICAL]\n**Must be true:** Reading the ledger, folding a thread, and building the projection all leave the file byte-identical.\n**Evidence to check:** The test that hashes the ledger before and after each read path.\n**Scoring:** 1.0 \u2014 identical after all three. 0.0 \u2014 any read changes it. No half credit; this is the whole reason the record exists.\n\n### C2 \u2014 An append never rewrites an earlier line [CRITICAL]\n**Must be true:** Appending leaves every earlier line untouched, and two appends that race both survive intact.\n**Evidence to check:** The concurrency test, and a diff of the earlier lines.\n**Scoring:** 1.0 \u2014 both survive, earlier lines untouched. 0.5 \u2014 sequential appends are safe and the concurrent case interleaves. 0.0 \u2014 a line is lost or rewritten.\n\n### C3 \u2014 The current state is a lookup, and the history is still there\n**Must be true:** The projection gives a thread's state in one lookup, and it records who moved it and when. The transitions remain readable in the ledger.\n**Evidence to check:** The projection test, plus a read of a thread with two transitions.\n**Scoring:** 1.0 \u2014 the lookup is correct and the history is intact. 0.5 \u2014 the lookup works and the actor or the time is missing. 0.0 \u2014 the state is only recoverable by folding.\n\n### C4 \u2014 The projection is disposable\n**Must be true:** Deleting the projection and appending once rebuilds it correctly from the ledger.\n**Evidence to check:** The matching test.\n**Scoring:** 1.0 \u2014 rebuilt and identical. 0.5 \u2014 rebuilt and incomplete. 0.0 \u2014 it does not rebuild.\n\n### C5 \u2014 A comment falls under the guard that protects irreplaceable content\n**Must be true:** The migration guard covers the ledger from this slice onward, so no migration can regenerate over it.\n**Evidence to check:** The guard test with a migration that tries to touch the ledger.\n**Scoring:** 1.0 \u2014 refused before writing. 0.5 \u2014 warned. 0.0 \u2014 allowed.\n\n### C6 \u2014 An agent reply is a record, not a chat message\n**Must be true:** A reply carries an author of agent and names the thread it answers, and folding places it under that thread in append order.\n**Evidence to check:** The matching test.\n**Scoring:** 1.0 \u2014 both fields present and the fold is ordered. 0.5 \u2014 present, unordered. 0.0 \u2014 a reply cannot be told from a root comment.\n\n## Regression check\n- Every bundle still verifies.\n- The view server is unchanged in this slice.\n\n## Out of scope \u2014 do not penalise\n- The write endpoint, the click-to-anchor drawer, and the background wake command. Those are slices 13 and 14.\n- Rendering replies as a conversation. That is E7, a backlog epic. A flat list is correct here.\n", "rubric-13": "# Rubric: Slice 13 \u2014 the anchor and the write endpoint\n\nFeature: cobuilder-family\nEpic: plugin-split/E6\nSlice goal: Click to anchor a sentence, `POST /feedback` appends, and the drawer keeps the text in view.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 A reader points at one sentence, not a whole section [CRITICAL]\n**Must be true:** Clicking an element, or selecting part of one, produces an anchor holding a selector, the selection range, and the quoted text. Nothing was tagged when the page was built.\n**Evidence to check:** Comment on a mid-paragraph selection in a served bundle and read the stored record.\n**Scoring:** 1.0 \u2014 all three parts stored and the quote matches the selection. 0.5 \u2014 element-level only, with no partial selection. 0.0 \u2014 still whole-section, or the page needed build-time tags.\n\n### C2 \u2014 The reader sees the text while writing about it [CRITICAL]\n**Must be true:** The drawer opens on the click with the target already anchored, and the page shifts rather than being covered.\n**Evidence to check:** Open a bundle, click a paragraph, and confirm the drawer and that paragraph are visible together.\n**Scoring:** 1.0 \u2014 opens on the click and the text stays visible. 0.5 \u2014 opens on the click and covers the text. 0.0 \u2014 still a keyboard-only mode.\n\n### C3 \u2014 The server accepts exactly one write and nothing else [CRITICAL]\n**Must be true:** The feedback route appends. Every other write route is rejected. The server binds the loopback address only.\n**Evidence to check:** The route tests and the bind test.\n**Scoring:** 1.0 \u2014 one route, everything else rejected, loopback only. 0.5 \u2014 correct routes, binds a routable address. 0.0 \u2014 another write route exists.\n\n### C4 \u2014 A comment survives with no server\n**Must be true:** With writes disabled the reader still gets local persistence and the markdown hand-off, and is told the thread is local.\n**Evidence to check:** Serve read-only and comment.\n**Scoring:** 1.0 \u2014 falls back and says so. 0.5 \u2014 falls back silently. 0.0 \u2014 the comment is lost.\n\n### C5 \u2014 A stale selector recovers through the quote\n**Must be true:** When a regenerated page moves the anchored element, the comment still shows what it referred to.\n**Evidence to check:** Regenerate a page so the selector no longer matches, then open the thread.\n**Scoring:** 1.0 \u2014 the quote is shown and the thread is marked as needing re-anchoring. 0.5 \u2014 the quote is shown with no marking. 0.0 \u2014 the comment shows nothing.\n\n## Regression check\n- The ledger guarantees from slice 12 hold under the server.\n- Serving for reading works with writes disabled, which stays the default.\n\n## Out of scope \u2014 do not penalise\n- The background wake command and the end-to-end run. Those are slice 14.\n- Rendering replies as a conversation. That is E7.\n", "rubric-14": "# Rubric: Slice 14 \u2014 the wake command and the whole loop\n\nFeature: cobuilder-family\nEpic: plugin-split/E6\nSlice goal: The background command blocks and returns new threads, and the loop runs once end to end.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 The command distinguishes new work from no work [CRITICAL]\n**Must be true:** It blocks until the ledger grows, prints only the new lines, and exits with a different code on a timeout than on new content.\n**Evidence to check:** Two tests, one appending and one timing out.\n**Scoring:** 1.0 \u2014 distinct codes and only new lines printed. 0.5 \u2014 correct output, same exit code. 0.0 \u2014 it does not block, or it reprints the whole file.\n\n### C2 \u2014 It never waits forever\n**Must be true:** A timeout ends the wait, so a session does not hang on a reader who left.\n**Evidence to check:** The timeout test, and a read of the default.\n**Scoring:** 1.0 \u2014 a sane default and an override. 0.5 \u2014 a default with no override. 0.0 \u2014 it can block indefinitely.\n\n### C3 \u2014 Each reader tracks its own place in the ledger\n**Must be true:** Two readers at different offsets both receive the lines they have not seen, and neither consumes the other's.\n**Evidence to check:** The two-reader test.\n**Scoring:** 1.0 \u2014 both receive their own. 0.5 \u2014 the second must start from the beginning. 0.0 \u2014 one reader's read hides lines from the other.\n\n### C4 \u2014 The whole loop runs once, by hand [CRITICAL]\n**Must be true:** A comment made in the viewer reaches the wake command's output with its quote intact, an agent reply is appended, and the projection shows the new state.\n**Evidence to check:** Do it once end to end and record the result, including the commands, in the status document.\n**Scoring:** 1.0 \u2014 done and recorded. 0.5 \u2014 every part passes its own test and nobody ran the whole loop, which is the failure mode this criterion exists for. 0.0 \u2014 the loop does not complete.\n\n## Regression check\n- Every guarantee from slices 12 and 13 still holds.\n- No plugin gained an agent, a hook, or an MCP server to make this work.\n\n## Out of scope \u2014 do not penalise\n- Rendering a thread as a conversation. That is E7.\n- Merging these threads with a published page's own threads. Gate 3 records that this needs its own decision record.\n", "rubric-manifest": "```yaml\nfeature: cobuilder-family\ntest_command: \"uv run --with pytest pytest tests/ -v\"\nthresholds:\n  accept: 0.90\n  investigate: 0.70\nmax_attempts: 3\nepics:\n  - { id: \"plugin-split/E1\", name: \"one plugin becomes five\",        slices: [4, 5, 6, 7] }\n  - { id: \"plugin-split/E2\", name: \"shared code survives an install\", slices: [1] }\n  - { id: \"plugin-split/E3\", name: \"the seam is version-safe\",        slices: [2, 3] }\n  - { id: \"plugin-split/E4\", name: \"the record index\",                slices: [8, 9] }\n  - { id: \"plugin-split/E5\", name: \"one lifecycle surface\",           slices: [10, 11] }\n  - { id: \"plugin-split/E6\", name: \"the reply channel\",               slices: [12, 13, 14] }\n  - { id: \"plugin-split/E7\", name: \"threads read as conversations\",   slices: [] }\nslices:\n  - { id: 1,  name: \"tracer bullet: two plugins, one shared module\", epic: \"plugin-split/E2\", weight: 0.12 }\n  - { id: 2,  name: \"the compatibility gate exists\",                 epic: \"plugin-split/E3\", weight: 0.05 }\n  - { id: 3,  name: \"the gate is wired and the bundle migrates\",     epic: \"plugin-split/E3\", weight: 0.09 }\n  - { id: 4,  name: \"renames inside today's single plugin\",          epic: \"plugin-split/E1\", weight: 0.05 }\n  - { id: 5,  name: \"the 33 cross-pillar references are fixed\",      epic: \"plugin-split/E1\", weight: 0.07 }\n  - { id: 6,  name: \"five plugins, five manifests\",                  epic: \"plugin-split/E1\", weight: 0.11 }\n  - { id: 7,  name: \"the two ports land\",                            epic: \"plugin-split/E1\", weight: 0.07 }\n  - { id: 8,  name: \"the index holds the 3, when the engineer narrowed the scope to the Work surface and FlightDeck at parity. The shell had no landing surface before it: a reader arrived on a route that named a work item, and nothing listed the bundle's designs. The board lists them, says what each one holds, and opens one.", "state": "planned", "branch": "design/cobuilder-viewer/work-prototype", "pr": null, "slices": [{"n": 6, "name": "The shell lands on the bundle's designs", "score": "1.00", "state": "completed"}, {"n": 7, "name": "A row opens the item's Work surface", "score": "1.00", "state": "completed"}], "adrs": ["ADR-0023", "ADR-0027", "ADR-0001", "ADR-0018", "ADR-0019"]}, {"id": "E1", "key": "design-mode/E1", "design": "design-mode", "note": "Design mode as a pre-code interview and challenge gate. Shares a branch and a pull request with the cobuilder-implement design. See ADR-0013: a branch may carry more than one design.", "state": "open", "branch": "design/design-mode", "pr": 11, "slices": [], "adrs": ["ADR-0011", "ADR-0014", "ADR-0015"]}, {"id": "E1", "key": "gate-doc-surfacing/E1", "design": "gate-doc-surfacing", "note": "shared/build_index.py: add PROGRAM_DESIGN_FIELDS and EPIC_DESIGN_FIELDS projection tuples plus project_program_design/project_epic_design, following the project_fields(source, fields) pattern used by project_goal/project_intent/project_assessment. Parse docs/plans/<slug>/03-program-design.md and epic-<id>-design.md; emit program_design and epic_design entities into data/index.json. Extend feature_gates join entries with a doc reference where one exists.", "state": "open", "branch": "design/gate-doc-surfacing", "pr": 19, "slices": [], "adrs": ["ADR-0022", "ADR-0018", "ADR-0020"]}, {"id": "E2", "key": "gate-doc-surfacing/E2", "design": "gate-doc-surfacing", "note": "plugins/artifact/viewer/index.html: make gate-rail-grid cards (renderBuildsMainContent, ~line 3249) clickable, opening a gate-doc sheet modeled on openAdrSheet. Add a design-doc chip to renderEpicCard (~line 3282) for epics with an epic_design entity.", "state": "open", "branch": "design/gate-doc-surfacing", "pr": 19, "slices": [], "adrs": ["ADR-0022", "ADR-0018", "ADR-0020"]}, {"id": "E1", "key": "gate-state-resolution/E1", "design": "gate-state-resolution", "note": "Teach both Builds views the three meanings of a gate state. `is_resolved(state)` in `plugins/artifact/scripts/build_builds_view.py` holds the test, and `current_doc()` receives the document map filtered to the files the plan holds, so a returned document always exists. The static page gains the `na` treatment and stops printing the text `undefined` for a Gate 2b document. The viewer rail gains the `is-na` card class, the `na` pill class, the words \"Not applicable\", and a header count of approved gates. Slices 1 and 2.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0024"]}, {"id": "E1", "key": "inflight-record-store/E1", "design": "inflight-record-store", "note": "Open pull requests become entities. collect_pull_requests() merges gh pr list --state all metadata over the narrated story.json entities. An open pull request gets an entity with state: \"open\" and a narrated: false flag. This removes the placeholder in refine_epic_status(). It reads metadata only, checks out no branch, and creates no conflict. This is the tracer bullet, and it is useful on its own. It does not depend on E2, E3, or E4, and can ship alone.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0018"]}, {"id": "E2", "key": "inflight-record-store/E2", "design": "inflight-record-store", "note": "A record store with a merge strategy. One file per record, append-only, with a defined resolution rule for a concurrent write. Modelled on beads. This epic decides the storage shape and nothing else.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0018"]}, {"id": "E3", "key": "inflight-record-store/E3", "design": "inflight-record-store", "note": "Cross-branch collection without a conflict. Records written by a session on a branch reach the shared view without any branch writing a shared generated file.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0018"]}, {"id": "E4", "key": "inflight-record-store/E4", "design": "inflight-record-store", "note": "The active-work view. The viewer renders in-flight work beside merged history, so a reader sees one timeline rather than two.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0018"]}, {"id": "E1", "key": "interaction-design-gate/E1", "design": "interaction-design-gate", "note": "Vendor the skill into `plugins/implement/skills/design-to-code/` and trim it from five steps to three. Step 1 goes because Gate 1 `01-product.md` already holds the product intent, and Step 4 goes because the slice loop owns code. The four concepts the gate depends on, initial state plus timer arming, transitions on state change, visibility gating, and declared defaults, reach the specification through the rewritten template, the JSONC schema, and the implementation rules. Slices 1 and 2.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0024", "ADR-0017", "ADR-0013"]}, {"id": "E2", "key": "interaction-design-gate/E2", "design": "interaction-design-gate", "note": "Add Gate 2b to the build workflow. A tracked line in `00-status.md` between Gate 2 and Gate 3, a `## Gate 2b` section in `build/SKILL.md`, the `2b` line in the status template, the resume rule that keeps Gate 3 from starting early, and the two consumption rules that let `rubric-authoring.md` and `slice-loop.md` read the artifacts. Slices 3 and 4.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0024", "ADR-0017", "ADR-0013"]}, {"id": "E3", "key": "interaction-design-gate/E3", "design": "interaction-design-gate", "note": "Make the gate mechanical rather than remembered. A `2b` group in `verify_gate.py`, a `2b` label in both gate-line regexes, `GATE_DOCS[\"2b\"]`, an `interaction_design` entity in the index, and the Builds view rail. Three call sites assume the last gate is number 4, so this epic is larger than it looks. It is the epic to cut. Slices 5 to 7.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0024", "ADR-0017", "ADR-0013"]}, {"id": "E1", "key": "lean-bundle-diffs/E1", "design": "lean-bundle-diffs", "note": "Decide the replacement shape: the viewer reads a diff by running git diff against the PR's recorded commit SHAs at serve time (view mode already runs from inside the repo), versus keeping diffs-pr{N}.js exactly as it is today but gitignoring it, regenerating it from git on demand the way exports/branch-*/diff.json already works for generate mode. Either removes the committed weight; they differ in whether a served bundle still needs a live git checkout next to it.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": []}, {"id": "E2", "key": "lean-bundle-diffs/E2", "design": "lean-bundle-diffs", "note": "Whichever shape E1 picks, implement it in extract_diffs.py and, if the viewer starts requesting diffs at view time instead of reading a static file, in artifact's serve_bundle.py. Update verify_bundle.py's expectations accordingly.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": []}, {"id": "E3", "key": "lean-bundle-diffs/E3", "design": "lean-bundle-diffs", "note": "Migrate the existing committed bundles (self, and the two fixture bundles) so history stops growing: remove the checked-in diffs-pr{N}.js files, or move them under .gitignore, per E1's decision. This does not touch story.json's authored fields, so it is a bundle-file change, not a schema migration.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": []}, {"id": "E1", "key": "maintainable-viewer/E1", "design": "maintainable-viewer", "note": "The build exists and is guarded. build_viewer.py concatenates ordered parts under viewer/src/ into the committed viewer/index.html, and a test rebuilds from the parts and fails on any difference. The first split is mechanical only, cut at the file's own 35 banner comments, with no line rewritten. This epic is the tracer bullet: it proves or disproves that the single IIFE separates by concatenation alone, which is the abort condition the whole design rests on.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0020", "ADR-0001", "ADR-0018", "ADR-0019"]}, {"id": "E2", "key": "maintainable-viewer/E2", "design": "maintainable-viewer", "note": "The exporter seam becomes declared. export_artifact.py stops matching incidental literals and matches named markers the parts emit deliberately. Today it hard-errors with not-found-verbatim when a literal moves, so the publish pipeline breaks silently under any refactor until somebody publishes. This must land before the parts are rewritten, not after, or every later epic risks breaking publishing without a test noticing.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0020", "ADR-0001", "ADR-0018", "ADR-0019"]}, {"id": "E3", "key": "maintainable-viewer/E3", "design": "maintainable-viewer", "note": "One definition per fragment. A template layer replaces the 45 innerHTML string blocks, and the rail-item, empty-card, and empty-detail fragments collapse from 4, 16, and 18 copies to one each. The viewer uses no template element today, so the mechanism is a design choice this epic makes and does not inherit.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0020", "ADR-0001", "ADR-0018", "ADR-0019"]}, {"id": "E4", "key": "maintainable-viewer/E4", "design": "maintainable-viewer", "note": "Each mode owns its own part. The five view modes stop interleaving: the 50 scattered mode-predicate calls collapse into one registry, and renderContextsMainContent, renderBuildsMainContent, and renderMainContent stop being three functions of over 200 lines that live beside each other. Adding a sixth mode becomes one new part plus one registry entry.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0020", "ADR-0001", "ADR-0018", "ADR-0019"]}, {"id": "E1", "key": "plugin-split/E1", "design": "plugin-split", "note": "One plugin becomes five. The whole packaging split: the mode renames inside today's single plugin, the deleted duplicate explore-design command, the 33 cross-pillar references, the five manifests, and the two ports. The rename is a rotation, not a split: odyssey submit becomes cobuilder-pr:generate, and the old odyssey generate, which narrates merged history, becomes cobuilder-pr:review. Four slices.", "state": "open", "branch": "design/design-mode", "pr": 11, "slices": [], "adrs": ["ADR-0016", "ADR-0017", "ADR-0015", "ADR-0006"]}, {"id": "E2", "key": "plugin-split/E2", "design": "plugin-split", "note": "Shared code survives an install. Prove the marketplace symlink dereference, then vendor the four bundle modules and the two shared skills. One slice, because it is a spike whose result decides whether the rest of the design stands. goal.json.abort_if names its failure.", "state": "open", "branch": "design/design-mode", "pr": 11, "slices": [], "adrs": ["ADR-0016", "ADR-0017", "ADR-0015", "ADR-0006"]}, {"id": "E3", "key": "plugin-split/E3", "design": "plugin-split", "note": "The seam is version-safe. require_compatible(), min_reader_schema, the generators map, bundle format 3, and schema 1.3, so two plugins at different versions cannot corrupt one bundle. Two slices.", "state": "open", "branch": "design/design-mode", "pr": 11, "slices": [], "adrs": ["ADR-0016", "ADR-0017", "ADR-0015", "ADR-0006"]}, {"id": "E4", "key": "plugin-split/E4", "design": "plugin-split", "note": "The record index. build_index.py replaces the two projection scripts, emits every entity with a stable id, and resolves every join including an ADR to its pull request. Two slices.", "state": "open", "branch": "design/design-mode", "pr": 11, "slices": [], "adrs": ["ADR-0016", "ADR-0017", "ADR-0015", "ADR-0006"]}, {"id": "E5", "key": "plugin-split/E5", "design": "plugin-split", "note": "One lifecycle surface. The Decisions, Contexts, and Builds modes, the Backlog lane, and moving generated pages out of the foreign directory into the bundle. Two slices (10, 11).", "state": "open", "branch": "design/design-mode", "pr": 11, "slices": [], "adrs": ["ADR-0016", "ADR-0017", "ADR-0015", "ADR-0006"]}, {"id": "E6", "key": "plugin-split/E6", "design": "plugin-split", "note": "The reply channel. The append-only ledger and its projection, the anchor computed from the live DOM, the write endpoint, and the background wake command. Three slices (12, 13, 14).", "state": "open", "branch": "design/design-mode", "pr": 11, "slices": [], "adrs": ["ADR-0016", "ADR-0017", "ADR-0015", "ADR-0006"]}, {"id": "E7", "key": "plugin-split/E7", "design": "plugin-split", "note": "Threads read as conversations. The drawer renders a reply under the comment it answers. Deferred past E6 on purpose: E6 ships the record shape, so this epic adds no migration and carries no slice yet.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0016", "ADR-0017", "ADR-0015", "ADR-0006"]}, {"id": "E8", "key": "plugin-split/E8", "design": "plugin-split", "note": "The cobuilder- prefix drops from the four non-umbrella plugins named in E1's table (cobuilder-architect, cobuilder-pr, cobuilder-artifact, cobuilder-implement become architect, pr, artifact, implement), since it duplicates the marketplace repo's own name. cobuilder-full-lifecycle keeps its prefix, being the umbrella the repo's own name already carries. Merged as PR #17, then a same-epic follow-up (uncommitted at the time this entry was written) fixes a second-order bug the rename introduced: two of the four renamed plugins (implement, artifact) already shipped a skill folder named after themselves, and once the plugin took that same name too, Skill() resolution inside Claude Code broke -- reproduced directly, not environment-specific. Fixed by renaming the colliding skill folders (implement's skill to build, its command to start; artifact's skill to cobuilder-artifacts) and, for consistency, cobuilder-full-lifecycle's orientation skill to cobuilder-full. See ADR-0016's addendum.", "state": "merged", "branch": "rename-plugins-drop-cobuilder-prefix", "pr": 17, "slices": [], "adrs": ["ADR-0016", "ADR-0017", "ADR-0015", "ADR-0006"]}, {"id": "E1", "key": "react-viewer/E1", "design": "react-viewer", "note": "The exporter rewrites the viewer by verbatim string replacement today and hard-errors when a literal moves. A bundled build moves every literal, so this seam must become explicit before any build lands.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0023", "ADR-0001", "ADR-0018", "ADR-0019", "ADR-0020"]}, {"id": "E2", "key": "react-viewer/E2", "design": "react-viewer", "note": "Vite plus vite-plugin-singlefile, a lockfile, and a pinned Node version. This epic starts with a spike, at the engineer's direction: publish one throwaway bundled page and measure the byte-equal rebuild across two machines, the size with React inlined, and whether a Claude Artifact renders a Mermaid block that React injects after page load. Two of the three abort conditions are settled by that spike, before five epics of work depend on the answer.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0023", "ADR-0001", "ADR-0018", "ADR-0019", "ADR-0020"]}, {"id": "E3", "key": "react-viewer/E3", "design": "react-viewer", "note": "The viewer resolves joins by hand in each render path today. index.json already computed them. This epic makes the index the source and the types the contract.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0023", "ADR-0001", "ADR-0018", "ADR-0019", "ADR-0020"]}, {"id": "E4", "key": "react-viewer/E4", "design": "react-viewer", "note": "The prototype of 2026-09-07 is the reference for this surface.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0023", "ADR-0001", "ADR-0018", "ADR-0019", "ADR-0020"]}, {"id": "E5", "key": "react-viewer/E5", "design": "react-viewer", "note": "Parity covers the four levels, diagrams, scene art, narration audio, the diff, and the intent and assessment sheet.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0023", "ADR-0001", "ADR-0018", "ADR-0019", "ADR-0020"]}, {"id": "E6", "key": "react-viewer/E6", "design": "react-viewer", "note": "tests/test_viewer_modes.py asserts the five data-mode buttons. That test changes with this epic, and the change is the point, not a regression.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0023", "ADR-0001", "ADR-0018", "ADR-0019", "ADR-0020"]}, {"id": "E7", "key": "react-viewer/E7", "design": "react-viewer", "note": "Closes the loop on E1. Measures the real budget with React inlined, and settles the Mermaid question the third abort condition names.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0023", "ADR-0001", "ADR-0018", "ADR-0019", "ADR-0020"]}, {"id": "E8", "key": "react-viewer/E8", "design": "react-viewer", "note": "build-workflow-polish is superseded by this design at the engineer's direction. Its E4, the tab-based viewer layout, is absorbed by E4 and E5 here. Its other three epics are not viewer work and would be lost silently: E1 adds the pointer from design mode stage 7 to /implement:start, E2 states the six-column slice-table shape that shared/slice_table.py parses, and E3 commits an accepted slice without a second prompt. They are carried here so the supersede is safe.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0023", "ADR-0001", "ADR-0018", "ADR-0019", "ADR-0020"]}, {"id": "E9", "key": "react-viewer/E9", "design": "react-viewer", "note": "The comment mech
