id: security-secrets-management-001
name: Secrets Management and Credential Hygiene
category: security
canonical_tags: ['security', 'secrets', 'credential-management', 'owasp-a02']
sources:
  - owasp/top-ten.md
  - sans/top-25.md
summary: >
  API keys, tokens, passwords, and private keys must never appear in source
  code, version control, or log output. Use environment variables, secret
  managers, and rotation policies. Detect secret patterns (sk-, AKIA,
  -----BEGIN PRIVATE KEY, etc.) early with automated scanners. Hardcoded
  credentials in source code are equivalent to publishing them on the
  internet: every clone, fork, and CI log is a potential leak. The remedial
  action after a leaked credential is always rotation — deletion from git
  history is insufficient because the credential is already compromised.
examples:
  - language: python
    bad: |
      import logging
      import os

      logger = logging.getLogger(__name__)

      # ---- Hardcoded API key in source code ----
      OPENAI_API_KEY = "sk-proj-abc123def456ghi789jkl012mno345pqr678"

      def call_llm(prompt: str) -> str:
          import openai
          client = openai.OpenAI(api_key=OPENAI_API_KEY)
          return client.chat.completions.create(
              model="gpt-4", messages=[{"role": "user", "content": prompt}]
          )


      # ---- Credentials in log output ----
      def connect_database():
          db_url = os.environ["DATABASE_URL"]
          logger.info(f"Connecting to database: {db_url}")
          # Log output: "Connecting to database: postgres://admin:s3cret@db.internal:5432/prod"
          # The password "s3cret" is now in every log aggregator, SIEM, and debug dump.
          engine = create_engine(db_url)
          return engine
    good: |
      import logging
      import os
      from pydantic import Field
      from pydantic_settings import BaseSettings

      logger = logging.getLogger(__name__)


      # ---- Secrets via environment variables with validation ----
      class Settings(BaseSettings):
          openai_api_key: str = Field(alias="OPENAI_API_KEY")
          database_url: str = Field(alias="DATABASE_URL")

          class Config:
              env_file = ".env"
              env_file_encoding = "utf-8"


      _settings: Settings | None = None


      def get_settings() -> Settings:
          """Load settings once; fail fast if required env vars are missing."""
          global _settings
          if _settings is None:
              _settings = Settings()  # raises ValidationError if missing
          return _settings


      def call_llm(prompt: str) -> str:
          import openai
          # Key loaded from env var, never hardcoded
          client = openai.OpenAI(api_key=get_settings().openai_api_key)
          return client.chat.completions.create(
              model="gpt-4", messages=[{"role": "user", "content": prompt}]
          )


      # ---- Redacted logging: never log credential values ----
      def connect_database():
          db_url = get_settings().database_url
          # Log a safe label, never the URL with password
          logger.info("Connecting to database: <DATABASE_URL>")
          engine = create_engine(db_url)
          return engine


      # ---- Secret pattern detection (add to CI; <src>/ = substitute your source dir) ----
      # grep -rn 'sk-[a-zA-Z0-9]' "<src>/"          # OpenAI keys
      # grep -rn 'AKIA[A-Z0-9]\{16\}' "<src>/"      # AWS access keys
      # grep -rn '-----BEGIN.*PRIVATE KEY' "<src>/" # Private keys
      # trufflehog git file://. --only-verified        # Comprehensive scanner
heuristics:
  - >
    Never hardcode credentials in source code. A committed secret is a
    published secret: every clone, fork, CI artifact, and code search
    engine is a vector. The only remediation after exposure is rotation.
  - >
    Load secrets from environment variables or a secret manager at runtime.
    Use pydantic-settings or similar to validate that required secrets are
    present at startup — fail fast rather than at 3 AM with a cryptic
    authentication error.
  - >
    Never log credential values. Redact database URLs, strip auth headers
    from request logs, and mask token values in debug output. A log
    aggregator with 90 days of retention is a 90-day window for anyone
    with read access to find your keys.
  - >
    Add secret pattern detection to CI. Tools like trufflehog, git-secrets,
    and detect-secrets catch what code review misses. Grep for common
    patterns (sk-, AKIA, -----BEGIN PRIVATE KEY) as a minimum baseline.
  - >
    Rotate credentials on a schedule and after any suspected exposure.
    Short-lived tokens (OAuth, STS) are better than long-lived API keys.
    If a key has no expiration, it has no recovery path.
  - >
    Separate secrets from configuration. Config (database host, feature
    flags) goes in version control. Secrets (passwords, keys) go in
    environment variables or a secret manager. Mixing them means one
    .env.example file can leak real credentials.
  - >
    In Python, avoid os.environ["KEY"] scattered across the codebase. Use
    a centralized settings module (pydantic-settings, dynaconf) that loads
    secrets in one place and provides typed access everywhere. This makes
    audit and rotation a single-point change.
