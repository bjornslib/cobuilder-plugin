      // }

heuristics:
  - >
    "Scale out via the process model. Processes are a first class citizen.
    The developer assigns each type of work to a process type" (12factor.net).
  - >
    Use process types for workload diversity: web for HTTP, worker for
    background jobs, clock for scheduled tasks. Each type scales
    independently — more web processes don't affect worker count.
  - >
    The process formation is the array of process types and their counts.
    Deploy with `web: 3, worker: 2` and scale to `web: 10, worker: 5`
    without code changes.
  - >
    Twelve-factor processes should never daemonize or write PID files.
    Rely on the OS process manager (systemd, k8s, Foreman) to manage
    lifecycle, restarts, and output streams.
  - >
    The process model doesn't exclude internal concurrency. Use threads,
    async/await, or evented I/O within a process. But vertical scaling
    has limits — horizontal scaling via process count is the escape hatch.
  - >
    A process type can be instantiated into zero or more processes. A
    clock process type runs with count=1. A web process type runs with
    count=N. The formation is declarative.
  - >
    In development, use Foreman or Honcho with a Procfile. In production,
    the platform (Heroku, Kubernetes, Nomad) reads the Procfile or
    equivalent to determine the formation.
  - >
    When adding a new workload type (e.g., a metrics collector), add a new
    process type. Don't stuff it into the web or worker type — separate
    concerns, separate process types.
  - >
    The share-nothing property of processes means scaling out is safe.
    No process depends on in-memory state of another process. Adding
    a process is a pure capacity increase.

