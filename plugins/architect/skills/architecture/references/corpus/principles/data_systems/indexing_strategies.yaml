    good: |
      // -- Schema with indexes chosen per query pattern --
      // model Event {
      //   id        Int      @id
      //   tenantId  String
      //   userId    String
      //   eventType String
      //   createdAt DateTime
      //   payload   String?
      //
      //   // Composite index: user events by time
      //   @@index([userId, createdAt])
      //   // Composite index: events by type (recent first)
      //   @@index([eventType, createdAt(sort: Desc)])
      //   // Partial: only critical event types indexed
      //   @@index([createdAt])
      // }

      import { PrismaClient } from "@prisma/client";

      const prisma = new PrismaClient();

      interface IndexUsageStats {
        indexName: string;
        scans: number;
        rowsRead: number;
        lastUsed: Date | null;
      }

      // -- Query patterns that leverage the indexes --
      async function getUserEvents(userId: string, since: Date): Promise<Event[]> {
        return prisma.event.findMany({
          where: { userId, createdAt: { gte: since } },
          orderBy: { createdAt: "desc" },
          select: { id: true, eventType: true, createdAt: true, payload: true },
        });
      }

      async function getRecentByType(eventType: string): Promise<Event[]> {
        // Uses @@index([eventType, createdAt(sort: Desc)]) — no sort needed
        return prisma.event.findMany({
          where: { eventType },
          orderBy: { createdAt: "desc" },
          take: 50,
        });
      }

      // Covering index via select: only request indexed columns, skip table access
      async function getDashboardCounts(tenantId: string): Promise<unknown[]> {
        return prisma.$queryRaw`
          SELECT DATE(created_at) as day, event_type, COUNT(*) as cnt
          FROM "Event"
          WHERE tenant_id = ${tenantId}
          GROUP BY day, event_type
          ORDER BY day DESC
          LIMIT 30
        `;
      }

      // -- Dead index detection: find indexes that never get used --
      async function findUnusedIndexes(): Promise<string[]> {
        // PostgreSQL: SELECT indexrelname FROM pg_stat_user_indexes WHERE idx_scan = 0
        // MySQL: SELECT * FROM sys.schema_unused_indexes
        const result = await prisma.$queryRaw<Array<{ indexrelname: string }>>`
          SELECT indexrelname
          FROM pg_stat_user_indexes
          WHERE idx_scan = 0
            AND indexrelname NOT LIKE '%pkey'
        `;
        return result.map((r) => r.indexrelname);
      }

      // -- LSM-tree write optimization (in-memory buffer with periodic flush) --
      class LSMMemtable<K, V> {
        private memtable = new Map<K, V>();
        private maxSize: number;

        constructor(maxSize = 10_000) {
          this.maxSize = maxSize;
        }

        put(key: K, value: V, onFlush?: () => void): void {
          this.memtable.set(key, value);
          if (this.memtable.size >= this.maxSize) {
            onFlush?.();
            this.memtable.clear();
          }
        }

        get(key: K): V | undefined {
          return this.memtable.get(key);
        }

        get size(): number {
          return this.memtable.size;
        }
      }

      // -- Index recommendation: analyze query patterns and suggest indexes --
      async function recommendIndexes(): Promise<string[]> {
        // PostgreSQL: pg_stat_statements + pg_missing_indexes equivalent
        const slowQueries = await prisma.$queryRaw<Array<{ query: string }>>`
          SELECT query
          FROM pg_stat_statements
          WHERE mean_exec_time > 100  -- 100ms
            AND calls > 100
          ORDER BY mean_exec_time DESC
          LIMIT 10
        `;
        return slowQueries.map((q) => `Consider index for: ${q.query.slice(0, 80)}...`);
      }

      // -- Full-text search via inverted index with relevance ranking --
      class FullTextSearchEngine {
        private inverted: Map<string, Set<number>> = new Map();
        private documents: Map<number, string> = new Map();
        private docFrequency: Map<string, number> = new Map();
        private nextId = 0;

        index(text: string): number {
          const docId = this.nextId++;
          this.documents.set(docId, text);
          const tokens = this.tokenize(text);
          const seen = new Set<string>();
          for (const token of tokens) {
            if (!this.inverted.has(token)) this.inverted.set(token, new Set());
            this.inverted.get(token)!.add(docId);
            if (!seen.has(token)) {
              this.docFrequency.set(token, (this.docFrequency.get(token) ?? 0) + 1);
              seen.add(token);
            }
          }
          return docId;
        }

        search(query: string, limit = 10): Array<[number, number]> {
          const qTokens = this.tokenize(query);
          if (qTokens.length === 0) return [];
          const scores = new Map<number, number>();
          const docCount = this.documents.size || 1;
          for (const token of qTokens) {
            const tf = qTokens.filter((t) => t === token).length / qTokens.length;
            const df = this.docFrequency.get(token) ?? 0;
            const idf = Math.log(docCount / (df + 1));
            for (const docId of this.inverted.get(token) ?? new Set()) {
              const docText = this.documents.get(docId) ?? "";
              const docWords = docText.split(/\s+/).length || 1;
              const docTf = (docText.toLowerCase().match(new RegExp(token, "g")) ?? []).length / docWords;
              scores.set(docId, (scores.get(docId) ?? 0) + tf * idf * docTf);
            }
          }
          return [...scores.entries()].sort((a, b) => b[1] - a[1]).slice(0, limit);
        }

        private tokenize(text: string): string[] {
          return text.toLowerCase().match(/\w+/g) ?? [];
        }
      }

      // -- Materialized view: cache expensive query results --
      class MaterializedViewManager {
        private views: Map<string, unknown[]> = new Map();
        private staleViews: Set<string> = new Set();

        constructor(private prisma: PrismaClient) {}

        async createView(name: string, query: string): Promise<void> {
          // Register in metadata table
          await this.prisma.$executeRaw`
            INSERT INTO mv_definitions(view_name, query_sql) VALUES (${name}, ${query})
          `;
          await this.refresh(name);
        }

        async refresh(name: string): Promise<void> {
          const rows = await this.prisma.$queryRawUnsafe<Array<Record<string, unknown>>>(
            `SELECT query_sql FROM mv_definitions WHERE view_name = $1`, name
          );
          if (rows.length === 0) throw new Error(`Unknown view: ${name}`);
          const result = await this.prisma.$queryRawUnsafe(rows[0].query_sql as string);
          this.views.set(name, result);
          this.staleViews.delete(name);
        }

        query(name: string): unknown[] {
          return this.views.get(name) ?? [];
        }

        invalidate(name: string): void {
          this.staleViews.add(name);
        }

        get stale(): string[] {
          return [...this.staleViews];
        }
      }
heuristics:
  - Indexes are derived data — they exist to answer queries faster at the cost of write amplification.
  - Choose index types by query access patterns: hash (point lookups), B-tree (range scans), LSM (write-heavy), full-text (search).
  - Composite indexes serve multi-column queries: order columns by selectivity (most selective first).
  - Covering indexes include all columns a query needs — the database answers from the index without touching the table.
  - Partial indexes index only a subset of rows (WHERE clause) — useful for sparse but important values.
  - Full-text search uses inverted indexes: tokenize documents → map term → doc_ids → rank by TF-IDF/BM25.
  - Materialized views cache precomputed query results; they trade freshness for speed and must be refreshed on a schedule or invalidated on write.
  - Unused indexes are dead weight: every write must update them. Monitor index usage and drop unused ones.
  - Write-heavy workloads prefer LSM-trees (append-only, periodic compaction) over B-trees (in-place updates).
  - Read-heavy workloads with range scans prefer B-trees over hash indexes.
  - Every index is a trade-off: document which query each index serves and what writes it slows down.
