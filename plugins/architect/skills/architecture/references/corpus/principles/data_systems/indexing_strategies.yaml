id: indexing-strategies-001
name: Indexing Strategies
category: data_systems
canonical_tags: ['data-systems', 'performance', 'storage']
sources:
  - books/designing-data-intensive-applications.md
summary: >
  Indexes are derived data structures that speed up reads at the cost of write
  overhead and storage. Choose index types based on query patterns, not based on
  what the database defaults to. Hash indexes provide O(1) point lookups but no
  range scans. B-trees and LSM-trees are the two dominant on-disk index families
  — B-trees optimize for reads, LSM-trees optimize for writes. Secondary indexes
  add query flexibility but incur write amplification. Covering indexes and
  composite indexes reduce trips to the primary store. Full-text search uses
  inverted indexes and relevance ranking to handle natural-language queries that
  standard B-tree indexes cannot serve efficiently — they tokenize, normalize,
  and rank documents by term frequency. Materialized views precompute and cache
  expensive query results (aggregations, joins), trading staleness for query
  speed; they are the read-side equivalent of write-ahead logs. Every index is
  a trade-off: it accelerates a specific set of queries in exchange for slower
  writes and more storage. Indexes must be monitored for bloat, fragmentation,
  and staleness; unused indexes are dead weight that slows every write.
examples:
  - language: python
    bad: |
      import sqlite3
      from typing import Any


      class NoIndexingStrategy:
          """Table with no indexes — full table scans on every query."""

          def __init__(self, db_path: str) -> None:
              self._conn = sqlite3.connect(db_path)
              self._conn.execute("""
                  CREATE TABLE IF NOT EXISTS events (
                      id INTEGER PRIMARY KEY,
                      user_id TEXT,
                      event_type TEXT,
                      created_at TEXT,
                      payload TEXT
                  )
              """)
              # No indexes on user_id, event_type, or created_at
              # Every query scans the entire table

          def get_user_events(self, user_id: str, since: str) -> list[dict]:
              """Full table scan — O(N) every time."""
              cur = self._conn.execute(
                  "SELECT * FROM events WHERE user_id = ? AND created_at > ?",
                  (user_id, since),
              )
              return [dict(zip([d[0] for d in cur.description], row)) for row in cur]

          def get_recent_by_type(self, event_type: str) -> list[dict]:
              """Another full table scan."""
              cur = self._conn.execute(
                  "SELECT * FROM events WHERE event_type = ? ORDER BY created_at DESC LIMIT 50",
                  (event_type,),
              )
              return [dict(zip([d[0] for d in cur.description], row)) for row in cur]
    good: |
      import sqlite3
      import time
      from datetime import datetime, timedelta, timezone
      from typing import Any


      class IndexedEventStore:
          """Indexes chosen by query pattern — each index serves specific queries."""

          def __init__(self, db_path: str) -> None:
              self._conn = sqlite3.connect(db_path)
              self._conn.execute("PRAGMA journal_mode=WAL")
              self._conn.execute("PRAGMA synchronous=NORMAL")
              self._conn.execute("""
                  CREATE TABLE IF NOT EXISTS events (
                      id INTEGER PRIMARY KEY,
                      tenant_id TEXT NOT NULL,
                      user_id TEXT NOT NULL,
                      event_type TEXT NOT NULL,
                      created_at TEXT NOT NULL,
                      payload TEXT
                  )
              """)
              # Index 1: composite — covers "get user events by time"
              self._conn.execute("""
                  CREATE INDEX IF NOT EXISTS idx_user_created
                  ON events(user_id, created_at)
              """)
              # Index 2: composite — covers "get events by type (recent first)"
              self._conn.execute("""
                  CREATE INDEX IF NOT EXISTS idx_type_created
                  ON events(event_type, created_at DESC)
              """)
              # Index 3: covering — avoids trip to primary store for dashboard
              self._conn.execute("""
                  CREATE INDEX IF NOT EXISTS idx_tenant_date_counts
                  ON events(tenant_id, date(created_at), event_type)
              """)
              # Index 4: partial — only active (rare) event types need fast lookup
              self._conn.execute("""
                  CREATE INDEX IF NOT EXISTS idx_critical_events
                  ON events(created_at)
                  WHERE event_type IN ('payment', 'login', 'error')
              """)
              self._index_usage: dict[str, int] = {}

          def get_user_events(self, user_id: str, since: str) -> list[dict]:
              """Uses idx_user_created — O(log N) lookup."""
              cur = self._conn.execute(
                  "SELECT * FROM events WHERE user_id = ? AND created_at > ? ORDER BY created_at DESC",
                  (user_id, since),
              )
              cols = [d[0] for d in cur.description]
              return [dict(zip(cols, row)) for row in cur]

          def get_recent_by_type(self, event_type: str, limit: int = 50) -> list[dict]:
              """Uses idx_type_created — no sort needed, index is ordered."""
              cur = self._conn.execute(
                  "SELECT * FROM events WHERE event_type = ? ORDER BY created_at DESC LIMIT ?",
                  (event_type, limit),
              )
              cols = [d[0] for d in cur.description]
              return [dict(zip(cols, row)) for row in cur]

          def get_dashboard_counts(self, tenant_id: str) -> list[dict]:
              """Covering index: query answered entirely from index, no table access."""
              cur = self._conn.execute("""
                  SELECT date(created_at) as day, event_type, COUNT(*) as cnt
                  FROM events
                  WHERE tenant_id = ?
                  GROUP BY day, event_type
                  ORDER BY day DESC
                  LIMIT 30
              """, (tenant_id,))
              cols = [d[0] for d in cur.description]
              return [dict(zip(cols, row)) for row in cur]

          def get_critical_events(self, since_hours: int = 24) -> list[dict]:
              """Partial index — only scans relevant rows."""
              cutoff = (datetime.now(timezone.utc) - timedelta(hours=since_hours)).isoformat()
              cur = self._conn.execute("""
                  SELECT * FROM events
                  WHERE event_type IN ('payment', 'login', 'error')
                    AND created_at > ?
                  ORDER BY created_at DESC
              """, (cutoff,))
              cols = [d[0] for d in cur.description]
              return [dict(zip(cols, row)) for row in cur]

          def list_unused_indexes(self) -> list[str]:
              """Query SQLite's index usage stats to find dead weight."""
              cur = self._conn.execute(
                  "SELECT name FROM sqlite_master WHERE type='index'"
              )
              defined = {row[0] for row in cur if not row[0].startswith("sqlite_")}
              # In production, use pg_stat_user_indexes or sys.dm_db_index_usage_stats
              return sorted(defined - set(self._index_usage))


      class LSMWriteOptimizer:
          """LSM-tree pattern: buffer writes in memory, flush sorted segments."""

          def __init__(self, flush_callback: Any) -> None:
              self._memtable: dict[str, str] = {}
              self._flush = flush_callback
              self._memtable_limit = 10_000

          def put(self, key: str, value: str) -> None:
              self._memtable[key] = value
              if len(self._memtable) >= self._memtable_limit:
                  self.flush()

          def get(self, key: str) -> str | None:
              # Check memtable first, then SSTables newest-to-oldest
              if key in self._memtable:
                  return self._memtable[key]
              return self._flush.read_from_disk(key)

          def flush(self) -> None:
              """Sort memtable and write as immutable SSTable."""
              sorted_entries = sorted(self._memtable.items())
              self._flush.write_sstable(sorted_entries)
              self._memtable.clear()
      #
      # -- Full-text search via inverted index --
      #
      class FullTextSearchEngine:
          """Inverted index with TF-IDF ranking for full-text search."""

          def __init__(self) -> None:
              self._inverted: dict[str, set[int]] = {}
              self._documents: dict[int, str] = {}
              self._doc_freq: dict[str, int] = {}
              self._next_id = 0

          def index(self, text: str) -> int:
              """Tokenize and index a document."""
              doc_id = self._next_id
              self._next_id += 1
              self._documents[doc_id] = text
              tokens = self._tokenize(text)
              seen: set[str] = set()
              for token in tokens:
                  self._inverted.setdefault(token, set()).add(doc_id)
                  if token not in seen:
                      self._doc_freq[token] = self._doc_freq.get(token, 0) + 1
                      seen.add(token)
              return doc_id

          def search(self, query: str, limit: int = 10) -> list[tuple[int, float]]:
              """Search with TF-IDF scoring."""
              q_tokens = self._tokenize(query)
              if not q_tokens:
                  return []
              scores: dict[int, float] = {}
              doc_count = len(self._documents) or 1
              for token in q_tokens:
                  tf = q_tokens.count(token) / len(q_tokens)
                  df = self._doc_freq.get(token, 0)
                  idf = math.log(doc_count / (df + 1))
                  for doc_id in self._inverted.get(token, set()):
                      doc_tf = self._documents[doc_id].lower().count(token) / max(
                          len(self._documents[doc_id].split()), 1
                      )
                      scores[doc_id] = scores.get(doc_id, 0) + tf * idf * doc_tf
              return sorted(scores.items(), key=lambda x: x[1], reverse=True)[:limit]

          @staticmethod
          def _tokenize(text: str) -> list[str]:
              """Lowercase, split, strip punctuation — production uses stemming."""
              return re.findall(r"\w+", text.lower())

      #
      # -- Materialized view: precompute expensive queries --
      #
      class MaterializedViewManager:
          """Cache query results; refresh on write or on a schedule."""

          def __init__(self, conn: sqlite3.Connection) -> None:
              self._conn = conn
              self._view: dict[str, list[dict]] = {}
              self._stale: set[str] = set()

          def create_view(self, name: str, query: str) -> None:
              """Register a materialized view with its backing query."""
              self._conn.execute(
                  "INSERT INTO mv_definitions(view_name, query_sql) VALUES (?, ?)",
                  (name, query),
              )
              self.refresh(name)

          def refresh(self, name: str) -> None:
              """Recompute the view from the base tables."""
              cur = self._conn.execute(
                  "SELECT query_sql FROM mv_definitions WHERE view_name = ?", (name,)
              )
              row = cur.fetchone()
              if row is None:
                  raise ValueError(f"Unknown view: {name}")
              result = self._conn.execute(row[0])
              cols = [d[0] for d in result.description]
              self._view[name] = [dict(zip(cols, r)) for r in result]
              self._stale.discard(name)

          def query(self, name: str) -> list[dict]:
              """Read from cached view; may be stale."""
              if name not in self._view:
                  return []
              return self._view[name]

          def invalidate(self, name: str) -> None:
              """Mark as stale after a write to the underlying table."""
              self._stale.add(name)

          @property
          def stale_views(self) -> list[str]:
              return sorted(self._stale)
