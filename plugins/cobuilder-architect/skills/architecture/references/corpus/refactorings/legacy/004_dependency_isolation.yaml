examples:
  python:
    bad: |
      def is_promotion_active(promotion: Promotion) -> bool:
          now = datetime.now()  # Untestable: depends on real clock
          return promotion.start <= now <= promotion.end

      def load_user_prefs(user_id: str) -> dict:
          path = f"/data/users/{user_id}/prefs.json"
          return json.loads(open(path).read())  # Untestable: depends on filesystem

      def process_payment(order: Order) -> None:
          logger = logging.getLogger("payments")
          logger.info(f"Processing {order.id}")
          StripeClient.instance().charge(order.total)  # Untestable: global singleton
    good: |
      def is_promotion_active(promotion: Promotion, *, clock: Clock = None) -> bool:
          now = (clock or SystemClock()).now()
          return promotion.start <= now <= promotion.end

      class FileSystem:
          def read(self, path: str) -> str:
              with open(path) as f:
                  return f.read()

      def load_user_prefs(user_id: str, *, fs: FileSystem = None) -> dict:
          path = f"/data/users/{user_id}/prefs.json"
          return json.loads((fs or FileSystem()).read(path))

      def process_payment(
          order: Order,
          *,
          payment_gateway: PaymentGateway = None,
          logger: Logger = None,
      ) -> None:
          log = logger or get_logger("payments")
          gw = payment_gateway or StripeGateway()
          log.info(f"Processing {order.id}")
          gw.charge(order.total)
  typescript:
    bad: |
      // All hard dependencies — cannot be tested in isolation
      async function getExchangeRate(from: string, to: string): Promise<number> {
        const res = await fetch(`https://api.example.com/rates?from=${from}&to=${to}`);
        const data = await res.json();
        return data.rate;
      }

      class AnalyticsTracker {
        track(event: string): void {
          const ts = Date.now();  // Hard: time
          console.log(`${ts}: ${event}`);  // Hard: stdout
          fetch('https://analytics.example.com/track', {  // Hard: network
            method: 'POST', body: JSON.stringify({ event, ts })
          });
        }
      }
    good: |
      interface HttpClient {
        get(url: string): Promise<{ json(): Promise<any> }>;
        post(url: string, body: any): Promise<void>;
      }

      interface Clock {
        now(): number;
      }

      async function getExchangeRate(
        from: string, to: string,
        http: HttpClient = new FetchClient()
      ): Promise<number> {
        const res = await http.get(`https://api.example.com/rates?from=${from}&to=${to}`);
        const data = await res.json();
        return data.rate;
      }

      class AnalyticsTracker {
        constructor(
          private clock: Clock = new SystemClock(),
          private http: HttpClient = new FetchClient()
        ) {}

        track(event: string): void {
          const ts = this.clock.now();
          this.http.post('https://analytics.example.com/track', { event, ts });
        }
      }
