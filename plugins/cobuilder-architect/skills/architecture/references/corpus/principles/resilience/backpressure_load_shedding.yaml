    good: |
      import { EventEmitter } from "events";


      // ======================================================================
      // 1. TOKEN BUCKET — rate limiter with burst tolerance
      // ======================================================================
      class TokenBucket {
        private tokens: number;
        private lastRefill: number;
        private totalConsumed = 0;
        private totalRejected = 0;

        constructor(
          private readonly refillRate: number,    // tokens/sec
          private readonly capacity: number,       // burst size
        ) {
          this.tokens = capacity;
          this.lastRefill = Date.now();
        }

        refill(): void {
          const now = Date.now();
          const elapsed = (now - this.lastRefill) / 1000;
          this.tokens = Math.min(this.capacity, this.tokens + elapsed * this.refillRate);
          this.lastRefill = now;
        }

        tryConsume(tokens: number = 1): boolean {
          this.refill();
          if (this.tokens >= tokens) {
            this.tokens -= tokens;
            this.totalConsumed++;
            return true;
          }
          this.totalRejected++;
          return false;
        }

        get stats() {
          return {
            available: this.tokens,
            capacity: this.capacity,
            consumed: this.totalConsumed,
            rejected: this.totalRejected,
          };
        }
      }


      // ======================================================================
      // 2. LEAKY BUCKET — smooths bursty traffic into steady outflow
      // ======================================================================
      class LeakyBucket<T> {
        private queue: T[] = [];
        private processing = false;

        constructor(
          private readonly capacity: number,
          private readonly drainIntervalMs: number,  // time between processing each item
          private readonly processFn: (item: T) => Promise<void>,
        ) {}

        enqueue(item: T): boolean {
          if (this.queue.length >= this.capacity) return false;
          this.queue.push(item);
          if (!this.processing) {
            this.processing = true;
            this.drain();
          }
          return true;
        }

        private async drain(): Promise<void> {
          while (this.queue.length > 0) {
            const item = this.queue.shift()!;
            try {
              await this.processFn(item);
            } catch {
              // Poison item: log and continue
            }
            await new Promise((r) => setTimeout(r, this.drainIntervalMs));
          }
          this.processing = false;
        }

        get queueDepth(): number {
          return this.queue.length;
        }
      }


      // ======================================================================
      // 3. BOUNDED QUEUE WITH BACKPRESSURE SIGNALS
      // ======================================================================
      interface QueueStats {
        depth: number;
        max: number;
        utilization: number;
        accepted: number;
        rejected: number;
      }

      type EnqueueResult =
        | { accepted: true; status: "ok" | "backpressure" }
        | { accepted: false; status: "rejected" };

      class BackpressureQueue<T> {
        private queue: T[] = [];
        private accepted = 0;
        private rejected = 0;

        constructor(
          private readonly maxSize: number,
          private readonly warnPct: number = 0.7,
          private readonly rejectPct: number = 0.9,
        ) {}

        tryEnqueue(item: T): EnqueueResult {
          const depth = this.queue.length;
          const rejectAt = Math.floor(this.maxSize * this.rejectPct);
          const warnAt = Math.floor(this.maxSize * this.warnPct);

          if (depth >= rejectAt) {
            this.rejected++;
            return { accepted: false, status: "rejected" };
          }

          this.queue.push(item);
          this.accepted++;

          if (depth >= warnAt) {
            return { accepted: true, status: "backpressure" };
          }
          return { accepted: true, status: "ok" };
        }

        tryDequeue(): T | null {
          return this.queue.shift() ?? null;
        }

        get stats(): QueueStats {
          return {
            depth: this.queue.length,
            max: this.maxSize,
            utilization: this.queue.length / this.maxSize,
            accepted: this.accepted,
            rejected: this.rejected,
          };
        }
      }


      // ======================================================================
      // 4. ADMISSION CONTROL WITH PRIORITY SHEDDING
      // ======================================================================
      enum Priority {
        CRITICAL = 0,
        HIGH = 1,
        NORMAL = 2,
        LOW = 3,
        BACKGROUND = 4,
      }

      interface AdmissionDecision {
        admitted: boolean;
        reason: string;
      }

      class AdmissionController {
        constructor(private readonly maxCpuUtil: number = 0.85) {}

        admit(priority: Priority, cpuUtil: number): AdmissionDecision {
          // Healthy: admit everything
          if (cpuUtil < 0.70) return { admitted: true, reason: "admitted" };

          // Critical always admitted
          if (priority === Priority.CRITICAL) return { admitted: true, reason: "admitted" };

          // Severe overload: only CRITICAL and HIGH survive
          if (cpuUtil > 0.95) {
            if (priority === Priority.HIGH) return { admitted: true, reason: "admitted" };
            return { admitted: false, reason: "shed: overload" };
          }

          // High load: shed BACKGROUND + LOW
          if (cpuUtil > 0.85) {
            if (priority <= Priority.NORMAL) return { admitted: true, reason: "admitted" };
            return { admitted: false, reason: "shed: high-load" };
          }

          // Moderate load (70-85%): shed BACKGROUND only
          if (priority === Priority.BACKGROUND) {
            return { admitted: false, reason: "shed: moderate-load" };
          }
          return { admitted: true, reason: "admitted" };
        }
      }


      // ======================================================================
      // 5. REACTIVE BACKPRESSURE — consumer-driven demand signaling
      // ======================================================================
      class ReactiveChannel<T> {
        private buffer: T[] = [];
        private demand = 0;
        private resolvers: Array<() => void> = [];

        constructor(private readonly maxInflight: number) {}

        /** Consumer: signal that it can accept n more items */
        request(n: number): void {
          this.demand = Math.min(this.maxInflight, this.demand + n);
          // Wake any waiting producer
          while (this.resolvers.length > 0 && this.demand > 0) {
            this.resolvers.shift()!();
          }
        }

        /** Producer: wait until consumer has signaled demand */
        async produce(item: T): Promise<void> {
          while (this.demand <= 0 || this.buffer.length >= this.maxInflight) {
            await new Promise<void>((resolve) => {
              this.resolvers.push(resolve);
            });
          }
          this.buffer.push(item);
          this.demand--;
        }

        /** Consumer: take the next available item */
        consume(): T | null {
          return this.buffer.shift() ?? null;
        }

        get stats() {
          return {
            buffered: this.buffer.length,
            demand: this.demand,
            maxInflight: this.maxInflight,
          };
        }
      }


      // ======================================================================
      // 6. COMPOSED GATEWAY MIDDLEWARE
      // ======================================================================
      import { Request, Response, NextFunction } from "express";

      class ResilientMiddleware {
        constructor(
          private readonly rateLimiter: TokenBucket,
          private readonly admission: AdmissionController,
          private readonly queue: BackpressureQueue<string>,
        ) {}

        handler(req: Request, res: Response, next: NextFunction): void {
          // Resolve priority from request (default NORMAL)
          const priority = (req.headers["x-priority"] as string)
            ? parseInt(req.headers["x-priority"] as string, 10)
            : Priority.NORMAL;

          // Fake CPU util — in production, read from a shared atomic gauge
          const cpuUtil = 0.72;

          // 1. Admission control
          const decision = this.admission.admit(priority, cpuUtil);
          if (!decision.admitted) {
            res.status(503).json({ error: "overloaded", reason: decision.reason });
            return;
          }

          // 2. Rate limiting
          if (!this.rateLimiter.tryConsume()) {
            res.status(429).json({ error: "rate_limited", retryAfterMs: 1000 });
            return;
          }

          // 3. Queue enrollment with backpressure
          const result = this.queue.tryEnqueue(req.ip ?? "unknown");
          if (!result.accepted) {
            res.status(503).json({ error: "queue_saturated" });
            return;
          }

          if (result.status === "backpressure") {
            res.setHeader("X-Backpressure", "1");
            res.setHeader("Retry-After", "2");
          }

          next();
        }
      }


      // ---- Usage ----
      const gateway = new ResilientMiddleware(
        new TokenBucket(100, 200),           // 100 req/s, burst 200
        new AdmissionController(0.85),        // shed at 85% CPU
        new BackpressureQueue(10_000, 0.7),  // 10K capacity, warn at 7K
      );

      const app = express();
      app.use((req, res, next) => gateway.handler(req, res, next));
heuristics:
  - >
    "The system must have a strategy for overload. Reject, defer, queue, or
    degrade intentionally. Unbounded acceptance of work is forbidden" (Release
    It!). Every entry point must decide what to do when demand exceeds capacity
    — the worst choice is to pretend it doesn't.
  - >
    Token bucket is the right default for API rate limiting: it allows bursts
    (the bucket's capacity) while enforcing a long-term average rate (the refill
    rate). Use it when you want to say "100 req/s average, but tolerate short
    bursts of 200." Leaky bucket is for traffic shaping: it enforces a strict
    maximum processing rate regardless of arrival pattern. Use it when you need
    a hard ceiling on downstream throughput, not just an average.
  - >
    Backpressure must propagate. A full queue must translate into a signal the
    producer can act on: HTTP 429 with Retry-After, gRPC RESOURCE_EXHAUSTED, a
    rejected Promise, or a Reactive Streams request(n) going to zero. A full
    queue that silently accepts more work is not backpressure — it's a memory
    leak.
  - >
    Reactive streams invert the control flow: the consumer PULLS, the producer
    waits for demand. This eliminates unbounded buffering entirely. Use reactive
    backpressure when data flows through pipelines of stages with different
    processing speeds — a slow downstream stage naturally throttles upstream
    stages without any separate rate limiter.
  - >
    Load shedding must be priority-ordered. Shed low-value work first:
    analytics events, log enrichment, non-critical recommendations, dashboard
    widgets. Preserve CRITICAL (payments, auth) and HIGH (core user flows)
    under all but the most extreme load. The priority ladder gives you a
    graduated degradation surface instead of a binary on/off switch.
  - >
    Every queue must be bounded with a defined behavior at capacity: reject
    (drop the item), block (wait for space), or drop-oldest (ring buffer). An
    unbounded queue is a deferred crash — it works fine until the one day
    producers outpace consumers and memory fills.
  - >
    Queue metrics are mandatory: depth, age of oldest item, throughput, and
    rejection rate. A queue at 80% capacity with zero age is healthy; a queue
    at 30% capacity where the oldest item is 30 seconds old means the consumer
    is dead and the buffer is just delaying the inevitable.
  - >
    Admission control should reject work at the boundary — early rejection is
    orders of magnitude cheaper than accepting work, starting processing,
    allocating resources, and THEN failing. A 503 at the edge costs
    microseconds. A timeout deep in the call stack costs seconds and burns
    threads, connections, and memory.
  - >
    "Know what happens when producers outpace consumers" (Release It!). The
    system behavior under sustained overload must be designed, not discovered
    in production. Run overload tests: push the system past its capacity and
    verify that latency stays bounded, rejection rates rise predictably, and
    core functions survive.
  - >
    Rate limiting, admission control, backpressure, and load shedding compose
    into a layered defense: admission control sheds by priority classes, rate
    limiting enforces per-client quotas, backpressure tells callers to slow
    down, and load shedding drops optional work when none of that is enough.
    Together they ensure the system degrades predictably under load rather
    than collapsing nonlinearly.
  - >
    Token bucket parameters must be measured, not guessed. Start with:
    capacity = expected p99 burst size (requests arriving within one refill
    interval), refill_rate = steady-state throughput. Monitor rejection rate
    and tune. A bucket that never rejects is oversized; a bucket that
    constantly rejects is undersized.
