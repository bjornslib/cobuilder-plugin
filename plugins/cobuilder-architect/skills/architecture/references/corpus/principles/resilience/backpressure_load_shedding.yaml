      // ---- Unbounded event emitter — no backpressure, no drop ----
      class FirehoseProcessor extends EventEmitter {
        private handlers: Map<string, Array<(data: unknown) => void>> = new Map();

        push(event: string, data: unknown): void {
          // Always emits. Always. No check on listener backlog.
          this.emit(event, data);
        }
