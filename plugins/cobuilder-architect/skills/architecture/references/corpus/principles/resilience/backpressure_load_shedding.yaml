id: backpressure-load-shedding-001
name: Backpressure and Load Shedding
category: resilience
canonical_tags: ['resilience', 'release-it', 'production-readiness', 'ddia']
sources:
  - books/release-it.md
  - books/designing-data-intensive-applications.md
summary: >
  Every system has finite capacity. When demand exceeds capacity, the system
  must choose: degrade intentionally or collapse indiscriminately. Backpressure
  propagates saturation signals upstream so producers slow down before queues
  overflow. Load shedding drops low-value work at the boundary to preserve
  core function. Together they form the overload strategy: backpressure tells
  callers to stop sending so much; load shedding decides what to drop when
  they don't. Rate limiting algorithms (token bucket, leaky bucket) enforce
  these boundaries; queue management ensures buffers are bounded and observable;
  admission control rejects work early rather than accepting it and failing
  later. Without these, a system under load does not degrade gracefully — it
  accelerates toward collapse as queues fill memory, latencies spike, retries
  amplify, and the whole thing tips over.
examples:
  - language: python
    bad: |
      import asyncio
      from collections import deque
      from typing import Any


      # ---- Unbounded queue: accepts work forever, memory grows without limit ----
      class BackgroundWorker:
          """No backpressure. Queue grows until OOM."""

          def __init__(self) -> None:
              self._queue: deque[Any] = deque()
              self._running = True

          def enqueue(self, task: Any) -> None:
              """Always accepts. Always. Even when 100K items deep."""
              self._queue.append(task)

          async def run(self) -> None:
              while self._running:
                  if self._queue:
                      task = self._queue.popleft()
                      await self._process(task)
                  else:
                      await asyncio.sleep(0.01)


      # ---- No rate limiting: one misbehaving caller floods the API ----
      import asyncio
      from typing import Optional
      import httpx


      class ApiGateway:
          """Every request passes through. No admission control."""

          def __init__(self, backend_url: str) -> None:
              self._backend = backend_url
              self._client = httpx.AsyncClient()

          async def handle(self, request: Any) -> dict:
              """No limit check. If 10K req/s arrive, we try to serve 10K."""
              resp = await self._client.post(
                  f"{self._backend}/process",
                  json=request,
                  timeout=30.0,  # at least there's a timeout, but too late
              )
              return resp.json()


      # ---- No load shedding: everything is critical, nothing is optional ----
      class RecommendationService:
          """Treats recommendations as critical as payments."""

          async def get_dashboard(self, user_id: str) -> dict:
              # Payment fetch
              balance = await self._fetch_balance(user_id)
              # Recommendations: same priority, will block dashboard if slow
              recs = await self._fetch_recommendations(user_id)
              # Analytics: also blocks the response
              await self._track_page_view(user_id)
              return {"balance": balance, "recommendations": recs}

          async def _fetch_balance(self, user_id: str) -> float:
              ...

          async def _fetch_recommendations(self, user_id: str) -> list:
              ...

          async def _track_page_view(self, user_id: str) -> None:
              ...
    good: |
      import asyncio
      import time
      import asyncio
      from collections import deque
      from dataclasses import dataclass, field
      from enum import Enum
      from typing import Any, Optional
      import threading


      # ======================================================================
      # 1. TOKEN BUCKET — rate limiter with burst tolerance
      # ======================================================================
      @dataclass
      class TokenBucket:
          """
          Classic token bucket algorithm.

          Tokens refill at a steady rate (refill_rate/sec) up to a maximum
          capacity (burst). Each request consumes one token. If no tokens
          are available, the request is rejected immediately.

          Unlike a simple counter, the bucket allows bursts up to 'capacity'
          while enforcing a long-term average rate.
          """
          refill_rate: float       # tokens per second
          capacity: int            # max tokens (burst size)
          _tokens: float = field(init=False, default=0.0)
          _last_refill: float = field(init=False, default_factory=time.monotonic)
          _lock: threading.Lock = field(init=False, default_factory=threading.Lock)

          def __post_init__(self) -> None:
              self._tokens = float(self.capacity)

          def _refill(self) -> None:
              now = time.monotonic()
              elapsed = now - self._last_refill
              self._tokens = min(
                  float(self.capacity),
                  self._tokens + elapsed * self.refill_rate,
              )
              self._last_refill = now

          def try_consume(self, tokens: int = 1) -> bool:
              """Return True if tokens were consumed, False if rate limited."""
              with self._lock:
                  self._refill()
                  if self._tokens >= tokens:
                      self._tokens -= tokens
                      return True
                  return False

          @property
          def available(self) -> float:
              with self._lock:
                  self._refill()
                  return self._tokens


      # ======================================================================
      # 2. LEAKY BUCKET — smooths bursty traffic into steady outflow
      # ======================================================================
      class LeakyBucket:
          """
          Leaky bucket algorithm.

          Requests arrive at variable rates. The bucket processes them at a
          fixed rate. If the bucket is full, arriving requests are dropped.
          This enforces a strict upper bound on processing rate independent
          of arrival pattern — traffic shaping, not just rate limiting.
          """
          def __init__(self, capacity: int, drain_rate_per_sec: float) -> None:
              self._capacity = capacity
              self._drain_interval = 1.0 / drain_rate_per_sec
              self._queue: deque[Any] = deque()
              self._lock = threading.Lock()
              self._processing = False

          def enqueue(self, item: Any) -> bool:
              """Return True if accepted, False if bucket full."""
              with self._lock:
                  if len(self._queue) >= self._capacity:
                      return False
                  self._queue.append(item)
                  if not self._processing:
                      self._processing = True
                      threading.Thread(target=self._drain, daemon=True).start()
                  return True

          def _drain(self) -> None:
              while True:
                  with self._lock:
                      if not self._queue:
                          self._processing = False
                          return
                      item = self._queue.popleft()
                  # Process the item
                  self._process(item)
                  time.sleep(self._drain_interval)

          def _process(self, item: Any) -> None:
              """Override or replace to define processing logic."""
              ...

          @property
          def queue_depth(self) -> int:
              with self._lock:
                  return len(self._queue)


      # ======================================================================
      # 3. BOUNDED QUEUE WITH BACKPRESSURE — propagate saturation upstream
      # ======================================================================
      class BackpressureQueue:
          """
          A bounded queue that applies backpressure when near capacity.

          Three thresholds:
          - GREEN (< warn_pct): accept normally
          - YELLOW (warn_pct to reject_pct): accept but emit backpressure
            signal so upstream callers slow down
          - RED (> reject_pct): reject outright

          Backpressure signals propagate upstream: an HTTP 429 or a gRPC
          RESOURCE_EXHAUSTED tells the producer to throttle. Without this,
          the queue fills silently until OOM.
          """
          def __init__(
              self,
              max_size: int,
              warn_threshold_pct: float = 0.7,
              reject_threshold_pct: float = 0.9,
          ) -> None:
              self._max_size = max_size
              self._warn_at = int(max_size * warn_threshold_pct)
              self._reject_at = int(max_size * reject_threshold_pct)
              self._queue: deque[Any] = deque()
              self._lock = threading.Lock()
              self._total_accepted = 0
              self._total_rejected = 0

          def try_enqueue(self, item: Any) -> tuple[bool, str]:
              """
              Return (accepted, status) where status is 'ok', 'backpressure',
              or 'rejected'.
              """
              with self._lock:
                  depth = len(self._queue)

                  if depth >= self._reject_at:
                      self._total_rejected += 1
                      return False, "rejected"

                  self._queue.append(item)
                  self._total_accepted += 1

                  if depth >= self._warn_at:
                      return True, "backpressure"
                  return True, "ok"

          def try_dequeue(self) -> Optional[Any]:
              with self._lock:
                  if self._queue:
                      return self._queue.popleft()
                  return None

          @property
          def stats(self) -> dict:
              with self._lock:
                  return {
                      "depth": len(self._queue),
                      "max": self._max_size,
                      "warn_at": self._warn_at,
                      "reject_at": self._reject_at,
                      "accepted": self._total_accepted,
                      "rejected": self._total_rejected,
                      "utilization": len(self._queue) / self._max_size,
                  }


      # ======================================================================
      # 4. ADMISSION CONTROL — reject early, fail fast
      # ======================================================================
      class Priority(Enum):
          CRITICAL = 0    # payments, auth — never shed
          HIGH = 1        # user-facing core — rarely shed
          NORMAL = 2      # standard API — shed under moderate load
          LOW = 3         # analytics, logging — first to go
          BACKGROUND = 4  # batch ETL, reporting — shed aggressively


      @dataclass
      class AdmissionController:
          """
          Reject low-priority work before the system saturates.

          Under load, shed work in priority order: BACKGROUND first, then
          LOW, then NORMAL. CRITICAL traffic is always admitted. The
          controller uses CPU utilization or queue depth as its saturation
          signal.
          """
          max_cpu_utilization: float = 0.85

          def admit(
              self,
              priority: Priority,
              current_cpu_util: float,
          ) -> tuple[bool, str]:
              """
              Decision matrix:
              - CPU < 70%: admit everything
              - CPU 70-85%: shed BACKGROUND
              - CPU 85-95%: shed BACKGROUND + LOW
              - CPU > 95%: shed BACKGROUND + LOW + NORMAL
              """
              if current_cpu_util < 0.70:
                  return True, "admitted"

              if priority == Priority.CRITICAL:
                  return True, "admitted"

              if current_cpu_util > 0.95:
                  if priority in (Priority.HIGH, Priority.CRITICAL):
                      return True, "admitted"
                  return False, "shed: overload"

              if current_cpu_util > 0.85:
                  if priority in (Priority.HIGH, Priority.CRITICAL, Priority.NORMAL):
                      return True, "admitted"
                  return False, "shed: high-load"

              # 70-85%
              if priority == Priority.BACKGROUND:
                  return False, "shed: moderate-load"
              return True, "admitted"


      # ======================================================================
      # 5. REACTIVE-STREAM BACKPRESSURE — async producer-consumer with demand
      # ======================================================================
      @dataclass
      class ReactivePipe:
          """
          A bounded async channel that propagates backpressure via demand
          signaling — the reactive streams pattern.

          The producer only produces when the consumer has signaled demand.
          This is the inverse of a queue: instead of pushing into a buffer
          and hoping the consumer keeps up, the consumer PULLS. This
          eliminates unbounded buffer growth entirely.
          """
          max_inflight: int
          _requests: int = field(default=0, init=False)
          _condition: asyncio.Condition = field(
              init=False,
              default_factory=asyncio.Condition,
          )

          async def request(self, n: int = 1) -> None:
              """Consumer signals demand: 'I can handle n more items'."""
              async with self._condition:
                  self._requests += n
                  self._condition.notify_all()

          async def produce(self, items: int = 1) -> None:
              """
              Producer waits until the consumer has requested capacity.
              Blocks (async) when there is no demand — this IS backpressure.
              """
              async with self._condition:
                  while self._requests < items:
                      await self._condition.wait()
                  self._requests -= items


      # ======================================================================
      # 6. COMPOSED SERVICE WITH ALL MECHANISMS
      # ======================================================================
      @dataclass
      class ResilientGateway:
          rate_limiter: TokenBucket
          queue: BackpressureQueue
          admission: AdmissionController

          async def handle_request(
              self,
              priority: Priority,
              payload: Any,
              cpu_util: float,
          ) -> tuple[int, dict]:
              """
              Full admission pipeline:
              1. Admission control — shed low-priority work first
              2. Rate limiting — enforce per-client quotas
              3. Queue with backpressure — accept, warn, or reject
              """
              # Step 1: Admission control
              admitted, reason = self.admission.admit(priority, cpu_util)
              if not admitted:
                  return 503, {"error": "service overloaded", "reason": reason}

              # Step 2: Rate limiting (token bucket)
              if not self.rate_limiter.try_consume():
                  return 429, {"error": "rate limited", "retry_after_ms": 1000}

              # Step 3: Queue with backpressure
              accepted, status = self.queue.try_enqueue(payload)
              if not accepted:
                  return 503, {"error": "queue saturated", "status": status}

              # Emit backpressure signal to caller
              headers = {}
              if status == "backpressure":
                  headers["X-Backpressure"] = "1"
                  headers["Retry-After"] = "2"

              # Process the request
              return 200, {"status": "accepted", "queue_status": status}


      # ---- Usage ----
      gateway = ResilientGateway(
          rate_limiter=TokenBucket(refill_rate=100.0, capacity=200),
          queue=BackpressureQueue(max_size=10000, warn_threshold_pct=0.7),
          admission=AdmissionController(),
      )


      async def api_handler(request: Any) -> tuple[int, dict]:
          return await gateway.handle_request(
              priority=Priority.NORMAL,
              payload=request,
              cpu_util=0.72,  # from metrics
          )
