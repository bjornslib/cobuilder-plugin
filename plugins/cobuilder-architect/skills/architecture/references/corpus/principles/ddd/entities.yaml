id: entities-001
name: "Domain-Driven Design — Entities: Identity, Lifecycle, and Behavioral Integrity"
category: architecture
canonical_tags: ['ddd', 'entities']
sources:
  - books/domain-driven-design.md
  - books/domain-driven-design-distilled.md
  - books/implementing-domain-driven-design.md
summary: >
  Entities are the domain objects defined by their identity, not their attributes.
  An entity's identity persists across state changes and across time — you care about
  *which one* it is, not just *what value* it holds. Entities own their lifecycle
  and guard meaningful state transitions through intention-revealing behavior.
  They must never be passive record bags in behavior-rich domains: public setters,
  ORM shells, and external orchestration of entity state are the canonical anti-patterns.
  When business rules depend on identity, continuity, or valid transition sequences,
  model the concept as an entity and put the behavior on the entity itself.
examples:
  - language: python
    bad: |
      # Anemic entity: public setters, no behavior, external code owns all transitions
      from dataclasses import dataclass

      @dataclass
      class Account:
          id: str
          balance: float = 0.0
          status: str = "active"

      # Application code making all domain decisions externally
      def withdraw(account: Account, amount: float) -> None:
          if account.status != "active":
              raise ValueError("Account not active")
          if amount > account.balance:
              raise ValueError("Insufficient funds")
          account.balance -= amount  # direct mutation, no domain logic on entity

      def close_account(account: Account) -> None:
          if account.balance > 0:
              raise ValueError("Cannot close account with positive balance")
          account.status = "closed"  # bypasses any lifecycle rules
    good: |
      from __future__ import annotations

      from dataclasses import dataclass
      from decimal import Decimal
      from typing import Protocol
      from uuid import UUID, uuid4

      @dataclass(frozen=True)
      class Money:
          amount: Decimal
          currency: str = "USD"

          def __post_init__(self) -> None:
              if self.amount < 0:
                  raise ValueError("Money cannot be negative")

          def __sub__(self, other: Money) -> Money:
              if self.currency != other.currency:
                  raise ValueError("Currency mismatch")
              return Money(self.amount - other.amount, self.currency)

          def __add__(self, other: Money) -> Money:
              if self.currency != other.currency:
                  raise ValueError("Currency mismatch")
              return Money(self.amount + other.amount, self.currency)

      class Account:
          """Entity: identity-driven with protected lifecycle transitions."""

          def __init__(self, account_id: UUID, initial_balance: Money = Money(Decimal("0"))) -> None:
              self._id = account_id
              self._balance = initial_balance
              self._status = "active"

          # --- Identity ---

          @property
          def id(self) -> UUID:
              return self._id

          @property
          def balance(self) -> Money:
              return self._balance

          @property
          def status(self) -> str:
              return self._status

          # --- Intention-revealing behavior, not setters ---

          def deposit(self, amount: Money) -> None:
              if self._status != "active":
                  raise ValueError(f"Cannot deposit into a {self._status} account")
              self._balance = self._balance + amount

          def withdraw(self, amount: Money) -> None:
              if self._status != "active":
                  raise ValueError(f"Cannot withdraw from a {self._status} account")
              if amount.amount > self._balance.amount:
                  raise ValueError("Insufficient funds")
              self._balance = self._balance - amount

          def close(self) -> None:
              if self._status == "closed":
                  raise ValueError("Account is already closed")
              if self._balance.amount > 0:
                  raise ValueError("Cannot close account with positive balance")
              self._status = "closed"

          def freeze(self, reason: str) -> None:
              if self._status != "active":
                  raise ValueError(f"Cannot freeze a {self._status} account")
              if not reason.strip():
                  raise ValueError("Freeze requires a reason")
              self._status = "frozen"

      # --- Repository port ---
      class AccountRepository(Protocol):
          def get_by_id(self, account_id: UUID) -> Account: ...
          def save(self, account: Account) -> None: ...

      # --- Application service: coordination only ---
      class TransferUseCase:
          def __init__(self, repo: AccountRepository) -> None:
              self._repo = repo

          def execute(self, from_id: UUID, to_id: UUID, amount: Money) -> None:
              source = self._repo.get_by_id(from_id)
              target = self._repo.get_by_id(to_id)
              source.withdraw(amount)
              target.deposit(amount)
              self._repo.save(source)
              self._repo.save(target)

  - language: typescript
    bad: |
      // Passive record with public fields — external code owns all decisions
      class Account {
        public id: string;
        public balance: number = 0;
        public status: string = "active";

        constructor(id: string) {
          this.id = id;
        }
      }

      // Business rules scattered across application handlers
      function withdraw(account: Account, amount: number): void {
        if (account.status !== "active") throw new Error("Account not active");
        if (amount > account.balance) throw new Error("Insufficient funds");
        account.balance -= amount; // direct mutation
      }

      function close(account: Account): void {
        if (account.balance > 0) throw new Error("Cannot close with positive balance");
        account.status = "closed"; // no lifecycle enforcement
      }
    good: |
      class Money {
        constructor(
          public readonly amount: number,
          public readonly currency: string = "USD",
        ) {
          if (amount < 0) throw new Error("Money cannot be negative");
        }

        subtract(other: Money): Money {
          if (this.currency !== other.currency) throw new Error("Currency mismatch");
          return new Money(this.amount - other.amount, this.currency);
        }

        add(other: Money): Money {
          if (this.currency !== other.currency) throw new Error("Currency mismatch");
          return new Money(this.amount + other.amount, this.currency);
        }
      }

      class Account {
        private _balance: Money;
        private _status: string = "active";

        constructor(
          public readonly id: string,
          initialBalance: Money = new Money(0),
        ) {
          this._balance = initialBalance;
        }

        get balance(): Money {
          return this._balance;
        }

        get status(): string {
          return this._status;
        }

        // --- Intention-revealing behavior ---

        deposit(amount: Money): void {
          if (this._status !== "active")
            throw new Error(`Cannot deposit into a ${this._status} account`);
          this._balance = this._balance.add(amount);
        }

        withdraw(amount: Money): void {
          if (this._status !== "active")
            throw new Error(`Cannot withdraw from a ${this._status} account`);
          if (amount.amount > this._balance.amount)
            throw new Error("Insufficient funds");
          this._balance = this._balance.subtract(amount);
        }

        close(): void {
          if (this._status === "closed") throw new Error("Already closed");
          if (this._balance.amount > 0) throw new Error("Positive balance");
          this._status = "closed";
        }

        freeze(reason: string): void {
          if (this._status !== "active")
            throw new Error(`Cannot freeze a ${this._status} account`);
          if (!reason.trim()) throw new Error("Freeze requires a reason");
          this._status = "frozen";
        }
      }

      interface AccountRepository {
        getById(id: string): Promise<Account>;
        save(account: Account): Promise<void>;
      }

      class TransferUseCase {
        constructor(private readonly repo: AccountRepository) {}

        async execute(fromId: string, toId: string, amount: Money): Promise<void> {
          const source = await this.repo.getById(fromId);
          const target = await this.repo.getById(toId);
          source.withdraw(amount);
          target.deposit(amount);
          await this.repo.save(source);
          await this.repo.save(target);
        }
      }
