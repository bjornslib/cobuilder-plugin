feature: mechanical-smells
test_command: "uv run pytest tests -q && (cd plugins/artifact/viewer && npm run typecheck && npm run test)"
baseline: "1620 passed, 1 skipped (pytest); 252 passed (vitest)"
thresholds:
  accept: 0.90
  investigate: 0.70
max_attempts: 3
slices:
  - {id: 1, name: "The logic layer: data/* and shell/model.ts (tracer bullet)", weight: 0.20}
  - {id: 2, name: "The atoms and sections", weight: 0.14}
  - {id: 3, name: "The change surface", weight: 0.14}
  - {id: 4, name: "The shell and chrome", weight: 0.18}
  - {id: 5, name: "The viewer test files", weight: 0.14}
  - {id: 6, name: "The comments in viewer source", weight: 0.10}
  - {id: 7, name: "The comments in viewer tests", weight: 0.10}
