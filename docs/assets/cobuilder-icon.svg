<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- CoBuilder: four tiles placed, the fifth lifted from its socket. -->
  <rect width="512" height="512" fill="#F5EFE4"/>
  <!-- the socket the lifted tile came from -->
  <rect x="280" y="88" width="144" height="144" rx="30" fill="none" stroke="#2A2620" stroke-opacity="0.25" stroke-width="6"/>
  <!-- three placed tiles -->
  <rect x="84" y="84" width="152" height="152" rx="34" fill="#2A2620"/>
  <rect x="84" y="276" width="152" height="152" rx="34" fill="#2A2620"/>
  <rect x="276" y="276" width="152" height="152" rx="34" fill="#2A2620"/>
  <!-- the lifted tile, drawn last so it covers most of its socket -->
  <g transform="translate(24 -24) rotate(8 352 160)">
    <rect x="276" y="84" width="152" height="152" rx="34" fill="#D97757"/>
  </g>
</svg>