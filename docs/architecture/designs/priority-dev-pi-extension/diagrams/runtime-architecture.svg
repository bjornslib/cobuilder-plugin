      <path d="M300 708 Q410.0 694 520 708 L520 752 L300 752 Z" fill="#F0EEE6" stroke="#3D3D3A" stroke-width="1.5"/>
      <path d="M300 708 Q410.0 722 520 708" fill="none" stroke="#3D3D3A" stroke-width="1"/>
      <text x="310" y="724" fill="#141413">Claude Code JSONL</text>
      <text x="310" y="738" fill="#87867F" font-size="10">~/.claude/projects</text>
    </g>
    <g id="n-pifile">
      <title>Pi and OMP session JSONL tree with a session header</title>
      <path d="M560 708 Q670.0 694 780 708 L780 752 L560 752 Z" fill="#F0EEE6" stroke="#3D3D3A" stroke-width="1.5"/>
      <path d="M560 708 Q670.0 722 780 708" fill="none" stroke="#3D3D3A" stroke-width="1"/>
      <text x="570" y="724" fill="#141413">Pi / OMP JSONL</text>
      <text x="570" y="738" fill="#87867F" font-size="10">session tree</text>
    </g>
    <g id="n-marks">
      <title>Readings and marks: $.store in Claude Code, appendEntry and a local file in Pi</title>
      <path d="M820 708 Q930.0 694 1040 708 L1040 752 L820 752 Z" fill="#F0EEE6" stroke="#3D3D3A" stroke-width="1.5"/>
      <path d="M820 708 Q930.0 722 1040 708" fill="none" stroke="#3D3D3A" stroke-width="1"/>
      <text x="830" y="724" fill="#141413">readings + marks</text>
      <text x="830" y="738" fill="#87867F" font-size="10">local only</text>
    </g>
  </g>
  <g id="bound-durable">
    <title>durable boundary: Pi Durable on Cloudflare, planned epics E8 to E10</title>
    <rect x="1190" y="40" width="390" height="560" fill="none" stroke="#3D3D3A" stroke-width="1.5" rx="8" stroke-dasharray="6 4"/>
    <text x="1202" y="60" fill="#87867F">durable (planned)</text>
    <g id="n-child">
      <title>Child agent started by the orchestrator. Probe E8 picks its form: first candidate a container that runs the Pi agent with pi/cobuilder-priority, second a native Pi Durable extension with afterRun</title>
      <rect x="1210" y="90" width="350" height="52" rx="10" fill="#F0EEE6" stroke="#3D3D3A" stroke-width="1.5"/>
      <text x="1220" y="110" fill="#141413">child agent (form by E8)</text>
      <text x="1220" y="124" fill="#87867F" font-size="10">1: container + Pi package</text>
      <rect x="1502" y="81" width="54" height="16" rx="8" fill="#D97757"/>
      <text x="1508" y="93" fill="#FFFFFF" font-size="10">pending</text>
    </g>
    <g id="n-orch">
      <title>Orchestrator Durable Object: the advisor proposes an answer or a notification</title>
      <rect x="1210" y="210" width="350" height="52" rx="10" fill="#F0EEE6" stroke="#3D3D3A" stroke-width="1.5"/>
      <text x="1220" y="230" fill="#141413">orchestrator DO</text>
      <text x="1220" y="244" fill="#87867F" font-size="10">advisor proposes</text>
      <rect x="1502" y="201" width="54" height="16" rx="8" fill="#D97757"/>
      <text x="1508" y="213" fill="#FFFFFF" font-size="10">pending</text>
    </g>
    <g id="n-act">
      <title>Actuator: intent, evaluate again, send, effect; idempotency key is the action hash</title>
      <rect x="1210" y="320" width="350" height="52" rx="10" fill="#F0EEE6" stroke="#3D3D3A" stroke-width="1.5"/>
      <text x="1220" y="340" fill="#141413">actuator</text>
      <text x="1220" y="354" fill="#87867F" font-size="10">submit, steer, signal</text>
      <rect x="1502" y="311" width="54" height="16" rx="8" fill="#D97757"/>
      <text x="1508" y="323" fill="#FFFFFF" font-size="10">pending</text>
    </g>
    <g id="n-endpoint">
      <title>Reader for a child: in candidate 1, priority read runs as a local process inside the container; the route is an output of probe E8, not a decision</title>
      <rect x="1210" y="440" width="350" height="52" rx="10" fill="#F0EEE6" stroke="#3D3D3A" stroke-width="1.5"/>
      <text x="1220" y="460" fill="#141413">child reader</text>
      <text x="1220" y="474" fill="#87867F" font-size="10">route is E8 output</text>
      <rect x="1502" y="431" width="54" height="16" rx="8" fill="#D97757"/>
      <text x="1508" y="443" fill="#FFFFFF" font-size="10">pending</text>
    </g>
  </g>
  <g id="bound-external">
    <title>external boundary: the model service</title>
    <rect x="1190" y="630" width="390" height="200" fill="none" stroke="#3D3D3A" stroke-width="1.5" rx="8"/>
    <text x="1202" y="650" fill="#87867F">external</text>
    <g id="n-model">
      <title>Model service of the priority-dev CLI (OpenRouter)</title>
