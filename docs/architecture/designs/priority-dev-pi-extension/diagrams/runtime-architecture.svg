<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="12" aria-labelledby="doc-title">
  <title id="doc-title">Runtime architecture of the priority-dev-pi-extension design (a prediction): host sessions and host adapters, the shared priority core, the priority-dev reader with transcript adapters, session files and stores, the planned Pi Durable orchestrator, and outside services</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3D3D3A"/></marker></defs>
  <g id="bound-client">
    <title>client boundary: the person and any coding agent</title>
    <rect x="20" y="40" width="220" height="400" fill="none" stroke="#3D3D3A" stroke-width="1.5" rx="8"/>
    <text x="32" y="60" fill="#87867F">client</text>
    <g id="n-person">
      <title>Person: switches the reader on, reads cards, marks, presses Send</title>
      <rect x="30" y="90" width="200" height="52" rx="10" fill="#F0EEE6" stroke="#3D3D3A" stroke-width="1.5"/>
      <text x="40" y="110" fill="#141413">Person</text>
      <text x="40" y="124" fill="#87867F" font-size="10">marks, Send, Edit</text>
    </g>
    <g id="n-agent">
      <title>Any coding agent: runs priority read on a session file (agent mode)</title>
      <rect x="30" y="220" width="200" height="52" rx="10" fill="#F0EEE6" stroke="#3D3D3A" stroke-width="1.5"/>
      <text x="40" y="240" fill="#141413">Coding agent</text>
      <text x="40" y="254" fill="#87867F" font-size="10">agent mode</text>
    </g>
    <g id="n-notif">
      <title>Notification surface for the person: Web Push, Slack, or email (planned)</title>
      <rect x="30" y="350" width="200" height="52" rx="10" fill="none" stroke="#3D3D3A" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="40" y="370" fill="#141413">Notifications</text>
      <text x="40" y="384" fill="#87867F" font-size="10">push, Slack (planned)</text>
    </g>
  </g>
  <g id="bound-hosts">
    <title>hosts boundary: harness sessions and their host adapters</title>
    <rect x="280" y="40" width="260" height="560" fill="none" stroke="#3D3D3A" stroke-width="1.5" rx="8"/>
    <text x="292" y="60" fill="#87867F">hosts</text>
    <g id="n-cc">
      <title>Claude Code session with plugins/cobuilder-priority, moved onto the core</title>
      <rect x="300" y="90" width="230" height="52" rx="10" fill="#F0EEE6" stroke="#3D3D3A" stroke-width="1.5"/>
      <text x="310" y="110" fill="#141413">Claude Code + plugin</text>
      <text x="310" y="124" fill="#87867F" font-size="10">plugins/cobuilder-priority</text>
    </g>
    <g id="n-pi">
      <title>Pi session (pi coding agent 1.6) with the pi/cobuilder-priority package</title>
      <rect x="300" y="200" width="230" height="52" rx="10" fill="#F0EEE6" stroke="#3D3D3A" stroke-width="1.5"/>
      <text x="310" y="220" fill="#141413">Pi session</text>
      <text x="310" y="234" fill="#87867F" font-size="10">agent_settled</text>
    </g>
    <g id="n-omp">
      <title>OMP session (oh-my-pi 19.1) with the same pi/cobuilder-priority package</title>
      <rect x="300" y="290" width="230" height="52" rx="10" fill="#F0EEE6" stroke="#3D3D3A" stroke-width="1.5"/>
      <text x="310" y="310" fill="#141413">OMP session</text>
      <text x="310" y="324" fill="#87867F" font-size="10">session_stop</text>
    </g>
    <g id="n-pipkg">
      <title>pi/cobuilder-priority: stop hook, pane component, question hook, priority_read tool</title>
      <rect x="300" y="400" width="230" height="52" rx="10" fill="#F0EEE6" stroke="#3D3D3A" stroke-width="1.5"/>
      <text x="310" y="420" fill="#141413">pi/cobuilder-priority</text>
      <text x="310" y="434" fill="#87867F" font-size="10">one package, no fork</text>
      <rect x="472" y="391" width="54" height="16" rx="8" fill="#D97757"/>
      <text x="478" y="403" fill="#FFFFFF" font-size="10">pending</text>
    </g>
  </g>
  <g id="bound-core">
    <title>core boundary: the shared TypeScript core under shared/, no host engine import</title>
    <rect x="580" y="40" width="250" height="560" fill="none" stroke="#3D3D3A" stroke-width="1.5" rx="8"/>
    <text x="592" y="60" fill="#87867F">core (shared/)</text>
    <g id="n-core">
      <title>shared/priority-core: Reading types, card view, draft, reader queue, ports</title>
      <rect x="595" y="150" width="220" height="52" fill="#F0EEE6" stroke="#3D3D3A" stroke-width="1.5"/>
      <text x="605" y="170" fill="#141413">shared/priority-core</text>
      <text x="605" y="184" fill="#87867F" font-size="10">contract + ports</text>
      <rect x="757" y="141" width="54" height="16" rx="8" fill="#D97757"/>
      <text x="763" y="153" fill="#FFFFFF" font-size="10">pending</text>
    </g>
    <g id="n-eval">
      <title>evaluate(action, state): pure policy, deny list, rule id and hashes</title>
      <rect x="595" y="290" width="220" height="52" fill="#F0EEE6" stroke="#3D3D3A" stroke-width="1.5"/>
      <text x="605" y="310" fill="#141413">evaluate</text>
      <text x="605" y="324" fill="#87867F" font-size="10">policy (E9)</text>
      <rect x="757" y="281" width="54" height="16" rx="8" fill="#D97757"/>
      <text x="763" y="293" fill="#FFFFFF" font-size="10">pending</text>
    </g>
    <g id="n-golden">
      <title>Golden readings: Reading in, card view and draft text out</title>
      <path d="M595 428 Q705.0 414 815 428 L815 472 L595 472 Z" fill="#F0EEE6" stroke="#3D3D3A" stroke-width="1.5"/>
      <path d="M595 428 Q705.0 442 815 428" fill="none" stroke="#3D3D3A" stroke-width="1"/>
      <text x="605" y="444" fill="#141413">golden readings</text>
      <text x="605" y="458" fill="#87867F" font-size="10">fixtures</text>
      <rect x="757" y="411" width="54" height="16" rx="8" fill="#D97757"/>
      <text x="763" y="423" fill="#FFFFFF" font-size="10">pending</text>
    </g>
  </g>
  <g id="bound-reader">
    <title>reader boundary: priority-dev, Python, called only as a process (ADR-0045)</title>
    <rect x="870" y="40" width="280" height="560" fill="none" stroke="#3D3D3A" stroke-width="1.5" rx="8"/>
    <text x="882" y="60" fill="#87867F">reader (priority-dev)</text>
    <g id="n-read">
      <title>priority read: digest then interpret, prints one Reading as JSON</title>
      <rect x="890" y="90" width="240" height="52" rx="10" fill="#F0EEE6" stroke="#3D3D3A" stroke-width="1.5"/>
      <text x="900" y="110" fill="#141413">priority read</text>
      <text x="900" y="124" fill="#87867F" font-size="10">uv run, JSON out</text>
      <rect x="1072" y="81" width="54" height="16" rx="8" fill="#D97757"/>
      <text x="1078" y="93" fill="#FFFFFF" font-size="10">pending</text>
    </g>
    <g id="n-adapters">
      <title>Transcript adapters: claude-code and pi dialects to a priority transcript</title>
      <rect x="890" y="200" width="240" height="52" rx="10" fill="#F0EEE6" stroke="#3D3D3A" stroke-width="1.5"/>
      <text x="900" y="220" fill="#141413">transcript adapters</text>
      <text x="900" y="234" fill="#87867F" font-size="10">claude-code, pi</text>
      <rect x="1072" y="191" width="54" height="16" rx="8" fill="#D97757"/>
      <text x="1078" y="203" fill="#FFFFFF" font-size="10">pending</text>
    </g>
    <g id="n-brief">
      <title>brief builder: reads only the priority transcript</title>
      <rect x="890" y="310" width="240" height="52" rx="10" fill="#F0EEE6" stroke="#3D3D3A" stroke-width="1.5"/>
      <text x="900" y="330" fill="#141413">brief builder</text>
      <text x="900" y="344" fill="#87867F" font-size="10">priority/brief</text>
    </g>
    <g id="n-interp">
      <title>Digest and Interpreter (DSPy, program D1)</title>
      <rect x="890" y="420" width="240" height="52" rx="10" fill="#F0EEE6" stroke="#3D3D3A" stroke-width="1.5"/>
      <text x="900" y="440" fill="#141413">digest + interpret</text>
      <text x="900" y="454" fill="#87867F" font-size="10">DSPy, D1</text>
    </g>
    <g id="n-dstore">
      <title>Digest store: keyed by session id</title>
      <path d="M890 528 Q1010.0 514 1130 528 L1130 572 L890 572 Z" fill="#F0EEE6" stroke="#3D3D3A" stroke-width="1.5"/>
      <path d="M890 528 Q1010.0 542 1130 528" fill="none" stroke="#3D3D3A" stroke-width="1"/>
      <text x="900" y="544" fill="#141413">digest store</text>
      <text x="900" y="558" fill="#87867F" font-size="10">log dir</text>
    </g>
  </g>
  <g id="bound-data">
    <title>data boundary: session files and local stores</title>
    <rect x="280" y="630" width="870" height="200" fill="none" stroke="#3D3D3A" stroke-width="1.5" rx="8"/>
    <text x="292" y="650" fill="#87867F">data</text>
