<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 700" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="12" aria-labelledby="doc-title">
  <title id="doc-title">Runtime architecture of the linear-tracker-adapter design (a prediction): people and CoBuilder sessions, tracker.py and the readers, the tracker port with the unchanged beads adapter, the proposed linear adapter modules, the repo files and the API key, and the Linear API with its board.</title>
