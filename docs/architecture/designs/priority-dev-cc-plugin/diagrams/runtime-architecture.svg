<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 940" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="11" role="img" aria-labelledby="cprt-title">
  <title id="cprt-title">Runtime architecture of cobuilder-priority: the engineer, the Claude Code session, the hooks module, the session state, the reading store, the priority pane, the priority CLI in the priority-dev checkout, the live logs, the transcript file, and the Mercury model service</title>
  <defs>
    <marker id="cprt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A5854"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="940" rx="12" fill="#FAF9F5"/>
  <text x="24" y="30" font-size="14" fill="#141413">cobuilder-priority runtime, a prediction from ADR-0049</text>
  <g id="bound-client">
    <title>client</title>
    <rect x="20" y="80" width="170" height="130" rx="8" fill="none" stroke="#3D3D3A" stroke-width="1.5"/>
    <text x="32" y="98" font-size="11" fill="#3D3D3A">client</text>
  </g>
  <g id="bound-engine">
    <title>engine: Claude Code session</title>
    <rect x="250" y="80" width="1010" height="140" rx="8" fill="none" stroke="#3D3D3A" stroke-width="1.5"/>
    <text x="262" y="98" font-size="11" fill="#3D3D3A">engine: Claude Code session</text>
  </g>
  <g id="bound-plugin">
    <title>cobuilder-priority mod, hooks/register.ts</title>
    <rect x="250" y="280" width="1010" height="250" rx="8" fill="none" stroke="#3D3D3A" stroke-width="1.5"/>
    <text x="700" y="298" font-size="11" fill="#3D3D3A">cobuilder-priority mod, hooks/register.ts</text>
  </g>
  <g id="bound-priority-dev">
    <title>priority-dev checkout, the folder in priority_dev_dir</title>
    <rect x="250" y="570" width="1010" height="140" rx="8" fill="none" stroke="#3D3D3A" stroke-width="1.5"/>
    <text x="960" y="588" font-size="11" fill="#3D3D3A">priority-dev checkout, priority_dev_dir</text>
  </g>
  <g id="bound-external">
    <title>external services and files</title>
    <rect x="250" y="780" width="1010" height="100" rx="8" fill="none" stroke="#3D3D3A" stroke-width="1.5"/>
    <text x="1000" y="798" font-size="11" fill="#3D3D3A">external services and files</text>
  </g>
  <g id="n-person">
    <title>Engineer: turns the reader on and marks each reading</title>
    <rect x="30" y="122" width="150" height="66" rx="10" fill="#F0EEE6" stroke="#3D3D3A" stroke-width="1.4"/>
    <text x="40" y="144" font-size="11" fill="#141413">Engineer</text>
    <text x="40" y="160" font-size="10" fill="#5E5D59">turns the reader on</text>
    <text x="40" y="175" font-size="10" fill="#5E5D59">marks each reading</text>
  </g>
  <g id="n-session">
    <title>Claude Code session: runs the main loop and fires Stop at the end of each turn</title>
    <rect x="300" y="115" width="190" height="80" rx="10" fill="#FFFFFF" stroke="#3D3D3A" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="310" y="137" font-size="11" fill="#141413">Claude Code session</text>
    <text x="310" y="153" font-size="10" fill="#5E5D59">main loop, fires Stop</text>
    <text x="310" y="168" font-size="10" fill="#5E5D59">writes the transcript</text>
  </g>
  <g id="n-pane">
    <title>Priority pane: one card for each stop, newest first, with right, wrong, and note (pending)</title>
    <rect x="1010" y="115" width="240" height="80" rx="10" fill="#E3DACC" stroke="#3D3D3A" stroke-width="1.4"/>
    <text x="1020" y="137" font-size="11" fill="#141413">Priority pane</text>
    <text x="1020" y="153" font-size="10" fill="#5E5D59">Priority reader: on or off</text>
    <text x="1020" y="168" font-size="10" fill="#5E5D59">one card a stop, marks</text>
    <rect x="1190" y="123" width="52" height="14" rx="4" fill="#FAF9F5" stroke="#D97757" stroke-width="1"/>
    <text x="1196" y="134" font-size="9" fill="#D97757">pending</text>
  </g>
  <g id="n-state">
    <title>Session state: $.state holds the switch, the one waiting stop, and the running flag (pending)</title>
    <path d="M 300 345 A 90 10 0 0 1 480 345 V 415 A 90 10 0 0 1 300 415 Z" fill="#788C5D" fill-opacity="0.16" stroke="#788C5D" stroke-width="1.4"/>
    <ellipse cx="390" cy="345" rx="90" ry="10" fill="none" stroke="#788C5D" stroke-width="1.4"/>
    <text x="310" y="371" font-size="11" fill="#141413">Session state</text>
    <text x="310" y="387" font-size="10" fill="#5E5D59">$.state: switch,</text>
    <text x="310" y="402" font-size="10" fill="#5E5D59">queue, running</text>
    <rect x="420" y="425" width="52" height="14" rx="4" fill="#FAF9F5" stroke="#D97757" stroke-width="1"/>
    <text x="426" y="436" font-size="9" fill="#D97757">pending</text>
  </g>
  <g id="n-hooks">
    <title>Hooks module: classic.Stop and command.run hooks, one reading at a time (pending)</title>
    <rect x="540" y="330" width="420" height="170" rx="10" fill="#E3DACC" stroke="#3D3D3A" stroke-width="1.4"/>
    <text x="550" y="352" font-size="11" fill="#141413">Hooks module, hooks/register.ts</text>
    <text x="550" y="370" font-size="10" fill="#5E5D59">1  switch off: next(e) only</text>
    <text x="550" y="386" font-size="10" fill="#5E5D59">2  switch on: queue the stop, next(e) at once</text>
    <text x="550" y="402" font-size="10" fill="#5E5D59">3  one reading at a time, newest stop waits</text>
    <text x="550" y="418" font-size="10" fill="#5E5D59">4  digest, then interpret, timeoutMs each</text>
    <text x="550" y="434" font-size="10" fill="#5E5D59">5  store the reading, done or failed</text>
    <rect x="898" y="338" width="52" height="14" rx="4" fill="#FAF9F5" stroke="#D97757" stroke-width="1"/>
    <text x="904" y="349" font-size="9" fill="#D97757">pending</text>
  </g>
  <g id="n-store">
    <title>Reading store: $.store keys readings/session id and marks/session id/stop (pending)</title>
    <path d="M 1010 345 A 120 10 0 0 1 1250 345 V 415 A 120 10 0 0 1 1010 415 Z" fill="#788C5D" fill-opacity="0.16" stroke="#788C5D" stroke-width="1.4"/>
    <ellipse cx="1130" cy="345" rx="120" ry="10" fill="none" stroke="#788C5D" stroke-width="1.4"/>
    <text x="1020" y="371" font-size="11" fill="#141413">Reading store, $.store</text>
    <text x="1020" y="387" font-size="10" fill="#5E5D59">readings/session id</text>
    <text x="1020" y="402" font-size="10" fill="#5E5D59">marks/session id/stop</text>
    <rect x="1190" y="425" width="52" height="14" rx="4" fill="#FAF9F5" stroke="#D97757" stroke-width="1"/>
    <text x="1196" y="436" font-size="9" fill="#D97757">pending</text>
  </g>
  <g id="n-digest">
    <title>priority digest: saves the digest of this stop in the live logs</title>
    <rect x="270" y="605" width="170" height="80" rx="10" fill="#FFFFFF" stroke="#3D3D3A" stroke-width="1.2"/>
    <text x="280" y="627" font-size="11" fill="#141413">priority digest</text>
    <text x="280" y="643" font-size="10" fill="#5E5D59">uv run, Python CLI</text>
    <text x="280" y="658" font-size="10" fill="#5E5D59">saves this digest</text>
  </g>
  <g id="n-logs">
    <title>Live logs: reports/logs/live holds the saved digests, Git-ignored</title>
    <path d="M 490 620 A 80 10 0 0 1 650 620 V 670 A 80 10 0 0 1 490 670 Z" fill="#788C5D" fill-opacity="0.16" stroke="#788C5D" stroke-width="1.4"/>
    <ellipse cx="570" cy="620" rx="80" ry="10" fill="none" stroke="#788C5D" stroke-width="1.4"/>
    <text x="500" y="645" font-size="11" fill="#141413">Live logs</text>
    <text x="500" y="661" font-size="10" fill="#5E5D59">reports/logs/live</text>
  </g>
  <g id="n-interpret">
    <title>priority interpret: reads the stop with the D1 program, digest as CURRENT RUN, prints JSON (the --digest flag is pending)</title>
    <rect x="710" y="605" width="200" height="80" rx="10" fill="#FFFFFF" stroke="#3D3D3A" stroke-width="1.2"/>
    <text x="720" y="627" font-size="11" fill="#141413">priority interpret</text>
    <text x="720" y="643" font-size="10" fill="#5E5D59">--program D1</text>
    <text x="720" y="658" font-size="10" fill="#5E5D59">--digest current</text>
    <text x="720" y="673" font-size="10" fill="#5E5D59">prints JSON</text>
    <rect x="850" y="613" width="52" height="14" rx="4" fill="#FAF9F5" stroke="#D97757" stroke-width="1"/>
    <text x="856" y="624" font-size="9" fill="#D97757">pending</text>
  </g>
  <g id="n-transcript">
    <title>Transcript file: the JSONL record of the session at transcript_path</title>
    <path d="M 270 815 A 90 10 0 0 1 450 815 V 860 A 90 10 0 0 1 270 860 Z" fill="#788C5D" fill-opacity="0.16" stroke="#788C5D" stroke-width="1.4" stroke-dasharray="5 4"/>
    <ellipse cx="360" cy="815" rx="90" ry="10" fill="none" stroke="#788C5D" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="280" y="840" font-size="11" fill="#141413">Transcript file</text>
    <text x="280" y="855" font-size="10" fill="#5E5D59">transcript_path, JSONL</text>
  </g>
  <g id="n-mercury">
    <title>Mercury model service: outside service, two calls for each stop</title>
    <rect x="700" y="805" width="210" height="60" rx="10" fill="#FFFFFF" stroke="#3D3D3A" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="710" y="827" font-size="11" fill="#141413">Mercury model service</text>
    <text x="710" y="843" font-size="10" fill="#5E5D59">two calls for each stop</text>
  </g>
  <g id="e-person-session">
    <title>Engineer to Claude Code session: types /priority-on or :off</title>
    <path d="M 180 155 H 300" fill="none" stroke="#5A5854" stroke-width="1.4" marker-end="url(#cprt-arrow)"/>
    <text x="240" y="140" font-size="10" fill="#3D3D3A" text-anchor="middle" stroke="#FAF9F5" stroke-width="4" stroke-linejoin="round" paint-order="stroke">/cobuilder-</text>
    <text x="240" y="152" font-size="10" fill="#3D3D3A" text-anchor="middle" stroke="#FAF9F5" stroke-width="4" stroke-linejoin="round" paint-order="stroke">priority:on</text>
  </g>
  <g id="e-session-hooks">
    <title>Claude Code session to hooks module: classic.Stop on the main loop, command.run for the commands</title>
    <path d="M 440 195 V 260 H 620 V 330" fill="none" stroke="#5A5854" stroke-width="1.4" marker-end="url(#cprt-arrow)"/>
    <text x="450" y="276" font-size="10" fill="#3D3D3A" stroke="#FAF9F5" stroke-width="4" stroke-linejoin="round" paint-order="stroke">classic.Stop, command.run</text>
  </g>
  <g id="e-hooks-session">
    <title>Hooks module to Claude Code session: returns next(e) at once, no block, no context</title>
    <path d="M 660 330 V 240 H 470 V 195" fill="none" stroke="#5A5854" stroke-width="1.4" marker-end="url(#cprt-arrow)"/>
    <text x="480" y="236" font-size="10" fill="#3D3D3A" stroke="#FAF9F5" stroke-width="4" stroke-linejoin="round" paint-order="stroke">next(e) at once</text>
  </g>
  <g id="e-hooks-state">
    <title>Hooks module to session state: reads and writes $.state</title>
    <path d="M 540 380 H 480" fill="none" stroke="#5A5854" stroke-width="1.4" marker-end="url(#cprt-arrow)"/>
    <text x="488" y="373" font-size="10" fill="#3D3D3A" stroke="#FAF9F5" stroke-width="4" stroke-linejoin="round" paint-order="stroke">$.state</text>
  </g>
  <g id="e-hooks-store">
    <title>Hooks module to reading store: adds each reading with $.store</title>
    <path d="M 960 380 H 1010" fill="none" stroke="#5A5854" stroke-width="1.4" marker-end="url(#cprt-arrow)"/>
    <text x="964" y="373" font-size="10" fill="#3D3D3A" stroke="#FAF9F5" stroke-width="4" stroke-linejoin="round" paint-order="stroke">$.store</text>
  </g>
  <g id="e-store-pane">
    <title>Reading store to priority pane: ui.render draws the cards</title>
    <path d="M 1100 335 V 195" fill="none" stroke="#5A5854" stroke-width="1.4" marker-end="url(#cprt-arrow)"/>
    <text x="1108" y="268" font-size="10" fill="#3D3D3A" stroke="#FAF9F5" stroke-width="4" stroke-linejoin="round" paint-order="stroke">ui.render</text>
  </g>
  <g id="e-pane-store">
    <title>Priority pane to reading store: each mark goes to $.store</title>
    <path d="M 1220 195 V 335" fill="none" stroke="#5A5854" stroke-width="1.4" marker-end="url(#cprt-arrow)"/>
    <text x="1180" y="300" font-size="10" fill="#3D3D3A" stroke="#FAF9F5" stroke-width="4" stroke-linejoin="round" paint-order="stroke">mark</text>
  </g>
  <g id="e-pane-person">
    <title>Priority pane to engineer: the pane on screen shows each reading</title>
    <path d="M 1230 115 V 52 H 90 V 122" fill="none" stroke="#5A5854" stroke-width="1.4" marker-end="url(#cprt-arrow)"/>
    <text x="300" y="46" font-size="10" fill="#3D3D3A" stroke="#FAF9F5" stroke-width="4" stroke-linejoin="round" paint-order="stroke">pane on screen</text>
  </g>
  <g id="e-person-pane">
    <title>Engineer to priority pane: marks right, wrong, or a note in the pane</title>
    <path d="M 150 122 V 66 H 1060 V 115" fill="none" stroke="#5A5854" stroke-width="1.4" marker-end="url(#cprt-arrow)"/>
    <text x="700" y="62" font-size="10" fill="#3D3D3A" stroke="#FAF9F5" stroke-width="4" stroke-linejoin="round" paint-order="stroke">right, wrong, note</text>
  </g>
  <g id="e-hooks-digest">
    <title>Hooks module to priority digest: $.process.run, uv run, step 1</title>
    <path d="M 600 500 V 590 H 355 V 605" fill="none" stroke="#5A5854" stroke-width="1.4" marker-end="url(#cprt-arrow)"/>
    <text x="365" y="584" font-size="10" fill="#3D3D3A" stroke="#FAF9F5" stroke-width="4" stroke-linejoin="round" paint-order="stroke">1 digest</text>
    <text x="608" y="522" font-size="10" fill="#3D3D3A" stroke="#FAF9F5" stroke-width="4" stroke-linejoin="round" paint-order="stroke">$.process.run, uv run</text>
  </g>
  <g id="e-hooks-interpret">
    <title>Hooks module to priority interpret: $.process.run, uv run, step 2</title>
    <path d="M 800 500 V 605" fill="none" stroke="#5A5854" stroke-width="1.4" marker-end="url(#cprt-arrow)"/>
    <text x="808" y="560" font-size="10" fill="#3D3D3A" stroke="#FAF9F5" stroke-width="4" stroke-linejoin="round" paint-order="stroke">2 interpret</text>
  </g>
  <g id="e-digest-logs">
    <title>priority digest to live logs: fs write of the digest</title>
    <path d="M 440 645 H 490" fill="none" stroke="#5A5854" stroke-width="1.4" marker-end="url(#cprt-arrow)"/>
    <text x="443" y="638" font-size="10" fill="#3D3D3A" stroke="#FAF9F5" stroke-width="4" stroke-linejoin="round" paint-order="stroke">write</text>
  </g>
  <g id="e-logs-interpret">
    <title>Live logs to priority interpret: fs read of the digest as CURRENT RUN</title>
    <path d="M 650 645 H 710" fill="none" stroke="#5A5854" stroke-width="1.4" marker-end="url(#cprt-arrow)"/>
    <text x="664" y="638" font-size="10" fill="#3D3D3A" stroke="#FAF9F5" stroke-width="4" stroke-linejoin="round" paint-order="stroke">read</text>
  </g>
  <g id="e-digest-transcript">
    <title>priority digest to transcript file: fs read</title>
    <path d="M 320 685 V 805" fill="none" stroke="#5A5854" stroke-width="1.4" marker-end="url(#cprt-arrow)"/>
    <text x="276" y="740" font-size="10" fill="#3D3D3A" stroke="#FAF9F5" stroke-width="4" stroke-linejoin="round" paint-order="stroke">fs read</text>
  </g>
  <g id="e-interpret-transcript">
    <title>priority interpret to transcript file: fs read</title>
    <path d="M 720 685 V 760 H 420 V 805" fill="none" stroke="#5A5854" stroke-width="1.4" marker-end="url(#cprt-arrow)"/>
    <text x="560" y="773" font-size="10" fill="#3D3D3A" stroke="#FAF9F5" stroke-width="4" stroke-linejoin="round" paint-order="stroke">fs read</text>
  </g>
  <g id="e-digest-mercury">
    <title>priority digest to Mercury model service: HTTPS, the digest call</title>
    <path d="M 400 685 V 745 H 760 V 805" fill="none" stroke="#5A5854" stroke-width="1.4" marker-end="url(#cprt-arrow)"/>
    <text x="560" y="740" font-size="10" fill="#3D3D3A" stroke="#FAF9F5" stroke-width="4" stroke-linejoin="round" paint-order="stroke">HTTPS</text>
  </g>
  <g id="e-interpret-mercury">
    <title>priority interpret to Mercury model service: HTTPS, the reading call</title>
    <path d="M 860 685 V 805" fill="none" stroke="#5A5854" stroke-width="1.4" marker-end="url(#cprt-arrow)"/>
    <text x="868" y="740" font-size="10" fill="#3D3D3A" stroke="#FAF9F5" stroke-width="4" stroke-linejoin="round" paint-order="stroke">HTTPS</text>
  </g>
  <g id="legend">
    <title>legend: box, dashed box, cylinder, pending badge, and edge label meanings</title>
    <rect x="262" y="900" width="40" height="16" rx="6" fill="#E3DACC" stroke="#3D3D3A" stroke-width="1.2"/>
    <text x="310" y="912" font-size="10" fill="#5E5D59">module part</text>
    <rect x="410" y="900" width="40" height="16" rx="6" fill="#FFFFFF" stroke="#3D3D3A" stroke-width="1.2"/>
    <text x="458" y="912" font-size="10" fill="#5E5D59">process</text>
    <rect x="530" y="900" width="40" height="16" rx="6" fill="#FFFFFF" stroke="#3D3D3A" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="578" y="912" font-size="10" fill="#5E5D59">external</text>
    <rect x="650" y="900" width="40" height="16" rx="6" fill="#788C5D" fill-opacity="0.16" stroke="#788C5D" stroke-width="1.2"/>
    <text x="698" y="912" font-size="10" fill="#5E5D59">store or file</text>
    <rect x="800" y="901" width="52" height="14" rx="4" fill="#FAF9F5" stroke="#D97757" stroke-width="1"/>
    <text x="806" y="912" font-size="9" fill="#D97757">pending</text>
    <text x="860" y="912" font-size="10" fill="#5E5D59">proposed</text>
    <path d="M 940 908 H 980" fill="none" stroke="#5A5854" stroke-width="1.4" marker-end="url(#cprt-arrow)"/>
    <text x="990" y="912" font-size="10" fill="#5E5D59">label names the protocol</text>
  </g>
</svg>
