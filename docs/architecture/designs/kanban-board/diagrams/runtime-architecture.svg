  <text x="36" y="440" fill="#87867F" font-size="10">loadIndex()</text>
  <path d="M113 364 L113 468" fill="none" stroke="#3D3D3A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="119" y="430" fill="#87867F" font-size="10">its rows</text>
  <path d="M300 538 L300 620 L1112 620 L1112 196 L1102 196" fill="none" stroke="#3D3D3A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="600" y="614" fill="#87867F" font-size="10">fetch or inline global</text>
  <path d="M802 195 L835 195 L835 90 L1275 90 L1275 250" fill="none" stroke="#3D3D3A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="900" y="84" fill="#87867F" font-size="10">fs read</text>
  <path d="M655 205 L655 250" fill="none" stroke="#3D3D3A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="661" y="232" fill="#87867F" font-size="10">Python import</text>
  <path d="M655 310 L655 350" fill="none" stroke="#3D3D3A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="661" y="334" fill="#87867F" font-size="10">adapter call</text>
  <path d="M802 382 L835 382 L835 480 L868 480" fill="none" stroke="#3D3D3A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="856" y="430" fill="#87867F" font-size="10">bd read/write</text>
  <path d="M802 170 L835 170 L835 60 L985 60 L985 150" fill="none" stroke="#3D3D3A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="880" y="54" fill="#87867F" font-size="10">fs write</text>
