  <text x="700" y="38" fill="#87867F" font-size="10">clipboard write</text>
  <g id="legend">
    <title>Legend: border and badge meanings, and the read-only rule of the board</title>
    <text x="20" y="664" fill="#87867F" font-size="10">solid: exists today. dashed: external system.</text>
    <text x="20" y="678" fill="#87867F" font-size="10">pending badge: proposed, not built.</text>
    <text x="20" y="692" fill="#87867F" font-size="10">The board draws no write edge and calls no tracker command.</text>
  </g>
</svg>
