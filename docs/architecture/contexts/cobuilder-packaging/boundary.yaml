# Boundary record for the cobuilder-packaging bounded context.
# Machine-diffable architecture baseline — ../../standard.md §5.2.
# Authoring procedure: skills/architecture/references/architecture-documentation.md.
# Every edge below was checked against code. Re-verified as of 2026-10-08.
# The 2026-08-21 record described one plugin with commands/, skills/, scripts/, viewer/ at the root.
# That shape is gone. This record describes the marketplace and its five plugins.

id: cobuilder-packaging
path: .claude-plugin
name: "Plugin packaging and dispatch"
verified_at: 1f34d98c5eaf563a499dfa33c12e678d21a1c23b

# What other contexts and operators may use: the install surface.
public_interface:
  - .claude-plugin/marketplace.json
  - plugins/architect/.claude-plugin/plugin.json
  - plugins/pr/.claude-plugin/plugin.json
  - plugins/artifact/.claude-plugin/plugin.json
  - plugins/implement/.claude-plugin/plugin.json
  - plugins/cobuilder-full-lifecycle/.claude-plugin/plugin.json
  - "skills/cobuilder-full (Skill name \"cobuilder-full\", the orientation router)"
  - plugins/cobuilder-full-lifecycle/scripts/watch_feedback.py
  - scripts/export-agent-skills.sh

# Context-ids this context may depend on. The umbrella plugin depends on the other four in plugin.json.
allowed_dependencies:
  - architect
  - pr
  - artifact
  - implement
  - shared

context_map:
  - with: architect
    pattern: open-host-service
    note: "Lists and versions the plugin in marketplace.json. Never reads its files."
  - with: pr
    pattern: open-host-service
    note: "Same as architect."
  - with: artifact
    pattern: open-host-service
    note: "Same as architect. SMELL: marketplace.json lists it twice."
  - with: implement
    pattern: open-host-service
    note: "Same as architect."
  - with: shared
    pattern: shared-kernel
    shared: [ledger.LedgerPaths, ledger.watch_feedback]
    note: "plugins/cobuilder-full-lifecycle/scripts/watch_feedback.py imports ledger through its shared symlink."
  - with: bundle-directory
    pattern: open-host-service
    note: "Not a documented context. Scripts write the bundle and the viewer reads it. Versioned by bundle.json and story.json meta.schema_version."

forbidden_dependencies:
  - target: "another plugin's files"
    why: "ADR-0016: 'No plugin reads or imports another plugin's files. A plugin may hand off to another plugin's mode by name, and the state that crosses the handoff travels in the bundle and in docs/.' Re-verified on 2026-10-08. Grep of Python imports found no cross-plugin import. Grep of path strings found one plugin path in a comment (see the implement and shared records). Grep of prose found architect and pr citing each other's reference files (see those records)."

  - target: "duplicate plugin entry"
    from: .claude-plugin/marketplace.json
    why: "SMELL: the plugins array lists 'artifact' twice (the second entry repeats the first, source ./plugins/artifact, version 0.10.0). A duplicate name can make the install pick either entry, and a version bump must change both. Remove one entry. ADR candidate only if the duplicate is deliberate."

  - target: "stale maps_to anchor in ADRs"
    from: docs/architecture/adr
    why: "SMELL: ADR-0016 maps_to.modules is [.claude-plugin/, commands/, skills/, scripts/, viewer/]. Those root paths no longer exist after the split, and 20 other ADRs anchor to context cobuilder-packaging instead of the plugin context they changed. ADR candidate: re-anchor ADRs to architect, pr, artifact, implement, or shared."

  - target: "shared/ imported as a Python package from the root"
    why: "Rule holding, not a smell: each plugin reaches shared through its own symlink plugins/<name>/shared -> ../../shared (5 symlinks, verified with ls -la). Scripts use sys.path.insert on parent.parent/shared."

  - target: "agents/ and hooks/ outside plugins/implement"
    why: "CLAUDE.md principle 5 and ADR-0025. Verified: only plugins/implement has agents/ and hooks/. No plugin ships an MCP server."

modules:
  - id: marketplace-manifest
    path: .claude-plugin
    public_interface: [marketplace.json]
    allowed_inbound: []
    allowed_outbound: []
    rule: "Static JSON read by the Claude Code harness. Each plugin version must equal its plugin.json version (a test checks it). SMELL: artifact appears twice."

  - id: plugin-architect
    path: plugins/architect
    public_interface: ["context architect"]
    allowed_inbound: [plugin-cobuilder-full-lifecycle]
    allowed_outbound: [plugin-artifact, shared-symlinks]
    rule: "Documented in the architect context. Its manifest depends on artifact."

  - id: plugin-pr
    path: plugins/pr
    public_interface: ["context pr"]
    allowed_inbound: [plugin-cobuilder-full-lifecycle]
    allowed_outbound: [plugin-architect, plugin-artifact, shared-symlinks]
    rule: "Documented in the pr context. SMELL: calls architect but declares only artifact in its manifest."

  - id: plugin-artifact
    path: plugins/artifact
    public_interface: ["context artifact"]
    allowed_inbound: [plugin-cobuilder-full-lifecycle, plugin-architect, plugin-pr, plugin-implement]
    allowed_outbound: [shared-symlinks]
    rule: "Documented in the artifact context. The leaf plugin: it calls no other plugin."

  - id: plugin-implement
    path: plugins/implement
    public_interface: ["context implement"]
    allowed_inbound: [plugin-cobuilder-full-lifecycle]
    allowed_outbound: [plugin-architect, plugin-artifact, shared-symlinks]
    rule: "Documented in the implement context. The only plugin with agents and a hook."

  - id: plugin-cobuilder-full-lifecycle
    path: plugins/cobuilder-full-lifecycle
    members: [".claude-plugin/plugin.json", "skills/cobuilder-full/SKILL.md", "scripts/watch_feedback.py"]
    public_interface: ["Skill(\"cobuilder-full\")", "watch_feedback.py"]
    allowed_inbound: []
    allowed_outbound: [plugin-architect, plugin-pr, plugin-artifact, plugin-implement, shared-symlinks]
    rule: "The umbrella. Its manifest lists the four other plugins as dependencies. The skill routes by mode name and runs no procedure. watch_feedback.py sits here by decision (CLAUDE.md known gaps)."

  - id: shared-symlinks
    path: plugins
    members: ["architect/shared", "pr/shared", "artifact/shared", "implement/shared", "cobuilder-full-lifecycle/shared"]
    public_interface: []
    allowed_inbound: [plugin-architect, plugin-pr, plugin-artifact, plugin-implement, plugin-cobuilder-full-lifecycle]
    allowed_outbound: []
    rule: "Five symlinks to ../../shared (ADR-0017). Code in shared is documented in the shared context."

  - id: tests
    path: tests
    public_interface: []
    allowed_inbound: []
    allowed_outbound: [plugin-architect, plugin-pr, plugin-artifact, plugin-implement, shared-symlinks]
    rule: "The pytest suite reads every plugin to check packaging, scripts, and gates. It is the only place allowed to name plugin paths."

# Districts (inventory.yaml world.districts) this context covers.
verifies:
  - commands
  - skills
  - scripts
  - viewer
  - docs

governed_by:
  - ADR-0016
  - ADR-0017
  - ADR-0024
