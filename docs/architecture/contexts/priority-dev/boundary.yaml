# Boundary record for the priority-dev bounded context.
# Machine-diffable architecture baseline — ../../standard.md §5.2.
# Edges checked against code: AST import graph of priority-dev/src/priority and grep of path strings. Grounded as of 2026-11-23 (commit d5e49a42).

id: priority-dev
path: priority-dev
name: "priority.dev: stop-brief interpreter, evaluation, optimiser, and replay for coding sessions"
verified_at: d5e49a42

public_interface:
  - "console script: priority = priority.cli:main (the only entry point other contexts use, as a process; see the cli_contract block)"
  - "priority.brief.StopBrief, priority.brief.build_brief"
  - "priority.interpreter.Interpreter, priority.interpreter.DigestRun, priority.interpreter.RunDigest"
  - "priority.optimise (optimiser run; imported lazily by cli.py)"
  - "priority.replay.options, priority.replay.runner"
  - "priority.evaluation.check, priority.evaluation.runner, priority.evaluation.judge_check"

# The CLI is the contract with plugins/cobuilder-priority, which starts it as a process
# (`uv run priority ...` in priority-dev, hooks/cli.ts) and parses stdout as JSON. It never imports priority.*.
cli_contract:
  transcript_shape: "Claude Code JSONL. One JSON object per line. brief/transcript.py read_records keeps type user and assistant, and drops isSidechain and isMeta records and lines that are not JSON. A user record has message.content as a string, or as a list of text and tool_result blocks (tool_use_id, content, is_error). An assistant record has message.id, message.model, and message.content as a list of text and tool_use blocks (id, name, input). A model of <synthetic> or isApiErrorMessage marks a client line. The records carry uuid, and the session id is the transcript file stem."
  commands:
    - "priority digest <transcript> [--stop N] [--log-dir DIR]: builds the brief with the digest model as the shrink model, runs DigestRun up to 3 times, prints one RunDigest or Abstain as JSON, and saves it to <log-dir>/digests/<stem>.json when --log-dir is set"
    - "priority interpret <transcript> [--stop N] [--log-dir DIR] [--program FILE] [--digest current|previous] [--open-question FILE]: prints one JSON object with status, needs_human, priority, steps, abstain, and stop_kind (question when --open-question is given, else turn_end). An Abstain also exits 0. A missing program file or a bad question file exits 1 before the model call"
    - "--open-question FILE: a non-empty JSON list of questions in the AskUserQuestion input shape. Each item has question (text) and options (a non-empty list of objects with label)"
    - "--digest: whether the digest stored under --log-dir for this transcript stem is of the run before (previous, the default) or of this run (current)"
    - "priority brief <transcript> [--stop N]: prints the stop brief text, or the abstain reason"

# priority-dev is self-contained: it imports no plugin and no shared module.
allowed_dependencies:
  - "dspy==3.4.1 (declared in priority-dev/pyproject.toml)"
  - "litellm, pydantic (imported; not declared in pyproject.toml, so they arrive through dspy [INFERENCE])"

context_map:
  - neighbour: plugins/cobuilder-priority
    pattern: "Open Host Service: the priority CLI is the host. The plugin is a downstream client that starts it as a process and reads JSON from stdout. It never imports priority.*. Its priority_dev_dir option names this folder."

forbidden_dependencies:
  - target: "plugins/<name>/ and shared/ as Python import or path"
    why: "Grep of every .py file in priority-dev/src, tools, tests, and probes finds no plugins/ or shared/ path. The package imports only priority.* and third-party packages."

  - target: "priority-dev/.env and fixtures/real as a read at import time"
    why: "config.py names ENV_PATH = priority-dev/.env and cli.py defaults --labels to fixtures/real. Both are read only when a command runs, never at import."

  - target: "other repo contexts importing priority.* (inbound)"
    why: "Zero Python imports of priority.* from outside priority-dev/. plugins/cobuilder-priority/hooks/*.ts reaches the context only through the CLI process."

  - target: "priority.brief importing priority.config, priority.evaluation, priority.replay, or any optimiser module"
    why: "brief imports only its own files and priority.interpreter (brief/shrink.py takes CallRecorder, Abstain, and shorten). Checked with the AST import graph."

  - target: "priority.interpreter importing priority.brief, priority.evaluation, priority.replay, or any optimiser module"
    why: "interpreter imports only config, run_folder, and its own files. Its Interpreter takes brief text as a string, so brief depends on interpreter and never the reverse."

  - target: "priority.evaluation importing priority.replay or any optimiser module"
    why: "The optimiser modules import evaluation. A reverse import would make a cycle."

modules:
  - id: config
    path: priority-dev/src/priority/config.py
    public_interface: ["priority.config (model, base_url, judge_*, reflection_*, load_key)"]
    allowed_inbound: [interpreter, evaluation/judge.py, optimiser]
    allowed_outbound: []
    rule: "Reads environment and .env at call time. interpreter/module.py, interpreter/digest.py, evaluation/judge.py, gepa_log.py, optimise.py, and optimise_report.py import it. brief and replay do not."

  - id: shared-leaves
    path: priority-dev/src/priority
    members: [run_folder.py, brief/models.py, brief/redact.py, brief/questions.py, interpreter/models.py, evaluation/labels.py, evaluation/split.py, evaluation/payload_rules.py, evaluation/judge_probe.py, evaluation/judge_check_store.py, replay/store.py, replay/figures.py, replay/options.py]
    allowed_inbound: [all modules]
    allowed_outbound: []
    rule: "Leaves: no import of another priority module (checked in the AST graph)."

  - id: brief
    path: priority-dev/src/priority/brief
    public_interface: ["priority.brief.StopBrief", "priority.brief.build_brief"]
    allowed_inbound: [cli, evaluation, replay, trainset]
    allowed_outbound: [interpreter]
    rule: "Builds the stop brief from a coding transcript. transcript.py is the only reader of the Claude Code JSONL shape (cli_contract.transcript_shape). shrink.py imports interpreter.calls, interpreter.models, and interpreter.shrink."

  - id: interpreter
    path: priority-dev/src/priority/interpreter
    public_interface: ["priority.interpreter.Interpreter", "priority.interpreter.DigestRun", "priority.interpreter.RunDigest"]
    allowed_inbound: [cli, brief, evaluation, replay, optimiser, digest_store]
    allowed_outbound: [config, run_folder]
    rule: "Imports dspy. Its digest and module files read config. It never imports brief."

  - id: digest-store
    path: priority-dev/src/priority/digest_store.py
    public_interface: ["priority.digest_store (digest_path, load_digest, save_digest)"]
    allowed_inbound: [cli, replay]
    allowed_outbound: [interpreter]
    rule: "Keeps one RunDigest file for each transcript stem in <log-dir>/digests/."

  - id: evaluation
    path: priority-dev/src/priority/evaluation
    public_interface: ["priority.evaluation.check", "priority.evaluation.runner", "priority.evaluation.judge_check"]
    allowed_inbound: [cli, optimiser]
    allowed_outbound: [config, interpreter, brief]
    rule: "Scores interpreter output against labels."

  - id: replay
    path: priority-dev/src/priority/replay
    public_interface: ["priority.replay.options", "priority.replay.runner"]
    allowed_inbound: [cli]
    allowed_outbound: [brief, interpreter, digest_store]
    rule: "replay/drills.py imports litellm. Only replay/runner.py and the cli import the package, and no other module imports replay."

  - id: optimiser
    path: priority-dev/src/priority/optimise*.py
    members: [optimise.py, optimise_report.py, gepa_log.py, gepa_proposer.py, proposer_reference.py, trainset.py, valset.py, valset_mix.py, structure_diff.py]
    public_interface: ["priority.optimise"]
    allowed_inbound: [cli]
    allowed_outbound: [config, evaluation, brief, interpreter, run_folder]
    rule: "Runs the GEPA search for one optimiser run. cli.py imports valset at module level (METHODS, ValsetSize) and imports optimise lazily. optimise_report.py probes optuna with find_spec only."

verifies:
  - tests
