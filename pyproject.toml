# Dev environment for the test suite only. This repo ships no Python package.
# Plugin scripts keep their own PEP 723 inline dependencies.
[project]
name = "cobuilder-plugin-dev"
version = "0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "pillow",
    "google-genai",
    "python-dotenv",
    "pyyaml",
    "requests",
]

[tool.uv]
package = false
python-preference = "only-managed"

# For habit-hooks, not for the test suite. habit-hooks runs every language
# sensor over its whole file scope, so the python sensor hands each .ts and
# .tsx file to ruff. Ruff has no TypeScript config to read, and parses the
# file as Python. That wrote 174,458 false parse errors over this repo, one
# run, and buried the real findings. These two lines keep ruff on Python
# files. force-exclude makes ruff skip an excluded file even when a caller
# names it directly, which is exactly what the hooks run does.
[tool.ruff]
force-exclude = true
extend-exclude = ["**/*.ts", "**/*.tsx"]
