    good: |
      import { v4 as uuid } from "uuid";

      // -- Domain Events (immutable, serializable facts) --
      interface DomainEvent {
        eventId: string;
        occurredAt: Date;
        eventType: string;
      }

      interface AccountOpened extends DomainEvent {
        eventType: "AccountOpened";
        accountId: string;
        owner: string;
      }

      interface MoneyDeposited extends DomainEvent {
        eventType: "MoneyDeposited";
        accountId: string;
        amount: number;
      }

      interface MoneyWithdrawn extends DomainEvent {
        eventType: "MoneyWithdrawn";
        accountId: string;
        amount: number;
      }

      interface AccountClosed extends DomainEvent {
        eventType: "AccountClosed";
        accountId: string;
        reason: string;
      }

      type AccountEvent = AccountOpened | MoneyDeposited | MoneyWithdrawn | AccountClosed;

      // -- Commands (requests, may be rejected) --
      interface OpenAccount { accountId: string; owner: string; }
      interface DepositMoney { accountId: string; amount: number; }
      interface WithdrawMoney { accountId: string; amount: number; }
      interface CloseAccount { accountId: string; reason: string; }
      type AccountCommand = OpenAccount | DepositMoney | WithdrawMoney | CloseAccount;

      // -- Aggregate: validates commands, produces events --
      class AccountAggregate {
        private uncommittedEvents: AccountEvent[] = [];
        private version = 0;

        id: string;
        balance = 0;
        owner = "";
        status: "open" | "closed" = "open";

        constructor(accountId: string) {
          this.id = accountId;
        }

        open(cmd: OpenAccount): void {
          if (this.version > 0) throw new Error("Account already exists");
          this.applyEvent({ eventId: uuid(), occurredAt: new Date(), eventType: "AccountOpened", accountId: cmd.accountId, owner: cmd.owner });
        }

        deposit(cmd: DepositMoney): void {
          if (cmd.amount <= 0) throw new Error("Amount must be positive");
          if (this.status === "closed") throw new Error("Account is closed");
          this.applyEvent({ eventId: uuid(), occurredAt: new Date(), eventType: "MoneyDeposited", accountId: cmd.accountId, amount: cmd.amount });
        }

        withdraw(cmd: WithdrawMoney): void {
          if (cmd.amount <= 0) throw new Error("Amount must be positive");
          if (this.balance < cmd.amount) throw new Error("Insufficient funds");
          if (this.status === "closed") throw new Error("Account is closed");
          this.applyEvent({ eventId: uuid(), occurredAt: new Date(), eventType: "MoneyWithdrawn", accountId: cmd.accountId, amount: cmd.amount });
        }

        close(cmd: CloseAccount): void {
          if (this.status === "closed") throw new Error("Already closed");
          this.applyEvent({ eventId: uuid(), occurredAt: new Date(), eventType: "AccountClosed", accountId: cmd.accountId, reason: cmd.reason });
        }

        private applyEvent(event: AccountEvent): void {
          this.mutateState(event);
          this.uncommittedEvents.push(event);
          this.version++;
        }

        private mutateState(event: AccountEvent): void {
          switch (event.eventType) {
            case "AccountOpened":
              this.id = event.accountId;
              this.owner = event.owner;
              this.status = "open";
              break;
            case "MoneyDeposited":
              this.balance += event.amount;
              break;
            case "MoneyWithdrawn":
              this.balance -= event.amount;
              break;
            case "AccountClosed":
              this.status = "closed";
              break;
          }
        }

        collectEvents(): AccountEvent[] {
          const events = [...this.uncommittedEvents];
          this.uncommittedEvents = [];
          return events;
        }

        getVersion(): number { return this.version; }

        static fromHistory(accountId: string, events: AccountEvent[]): AccountAggregate {
          const agg = new AccountAggregate(accountId);
          for (const event of events) {
            agg.mutateState(event);
            agg.version++;
          }
          return agg;
        }
      }

      // -- Event Store: append-only with optimistic concurrency --
      class EventStore {
        private streams = new Map<string, AccountEvent[]>();

        append(streamId: string, events: AccountEvent[], expectedVersion: number): void {
          const current = this.streams.get(streamId) ?? [];
          if (current.length !== expectedVersion) {
            throw new ConcurrencyError(`Expected v${expectedVersion}, got v${current.length}`);
          }
          this.streams.set(streamId, [...current, ...events]);
        }

        readStream(streamId: string): AccountEvent[] {
          return [...(this.streams.get(streamId) ?? [])];
        }

        readAllEvents(): AccountEvent[] {
          const all: AccountEvent[] = [];
          for (const events of this.streams.values()) {
            all.push(...events);
          }
          all.sort((a, b) => a.occurredAt.getTime() - b.occurredAt.getTime());
          return all;
        }
      }

      class ConcurrencyError extends Error {}

      // -- Snapshots: fast hydration without full replay --
      interface Snapshot {
        accountId: string;
        balance: number;
        owner: string;
        status: "open" | "closed";
        version: number;
      }

      class SnapshotStore {
        private snapshots = new Map<string, Snapshot>();

        save(snapshot: Snapshot): void { this.snapshots.set(snapshot.accountId, snapshot); }
        load(accountId: string): Snapshot | undefined { return this.snapshots.get(accountId); }
      }

      // -- Repository with snapshot optimization --
      class EventSourcedRepository {
        private readonly SNAPSHOT_INTERVAL = 50;

        constructor(
          private events: EventStore,
          private snapshots: SnapshotStore,
        ) {}

        load(accountId: string): AccountAggregate {
          const snapshot = this.snapshots.load(accountId);
          if (snapshot) {
            const allEvents = this.events.readStream(accountId);
            const postSnapshot = allEvents.slice(snapshot.version);
            const agg = new AccountAggregate(accountId);
            agg.balance = snapshot.balance;
            agg.owner = snapshot.owner;
            agg.status = snapshot.status;
            for (const event of postSnapshot) {
              (agg as any).mutateState(event);
              (agg as any).version++;
            }
            return agg;
          }
          // Full replay
          const events = this.events.readStream(accountId);
          return AccountAggregate.fromHistory(accountId, events);
        }

        save(aggregate: AccountAggregate): void {
          const events = aggregate.collectEvents();
          if (events.length === 0) return;
          const expectedVersion = aggregate.getVersion() - events.length;
          this.events.append(aggregate.id, events, expectedVersion);

          if (aggregate.getVersion() % this.SNAPSHOT_INTERVAL === 0) {
            this.snapshots.save({
              accountId: aggregate.id,
              balance: aggregate.balance,
              owner: aggregate.owner,
              status: aggregate.status,
              version: aggregate.getVersion(),
            });
          }
        }
      }

      // -- Projection: rebuildable materialized view --
      class AccountBalanceProjection {
        private balances = new Map<string, number>();

        apply(event: AccountEvent): void {
          switch (event.eventType) {
            case "MoneyDeposited":
              this.balances.set(event.accountId, (this.balances.get(event.accountId) ?? 0) + event.amount);
              break;
            case "MoneyWithdrawn":
              this.balances.set(event.accountId, (this.balances.get(event.accountId) ?? 0) - event.amount);
              break;
          }
        }

        rebuild(events: AccountEvent[]): void {
          this.balances.clear();
          for (const event of events) this.apply(event);
        }

        balanceOf(accountId: string): number {
          return this.balances.get(accountId) ?? 0;
        }
      }
heuristics:
  - The event log is the source of truth; current state is derived from it. Never mutate state without recording an event.
  - Commands are requests that may be rejected; events are immutable facts that already happened. Validate in the command handler, apply in the event handler.
  - Event application must be deterministic and idempotent: replaying the same events must produce the same state.
  - Snapshots reduce hydration cost: replay events only since the last snapshot, not from the beginning of time.
  - Optimistic concurrency (expected version on append) prevents conflicting concurrent writes without distributed locks.
  - Projections (read models) are derived from events and must be discardable and rebuildable.
  - Upcasting handles schema evolution: when events change shape, transform old events to the new schema during replay.
  - Event sourcing pairs naturally with CQRS: separate write models (aggregates) from read models (projections).
  - Event sourcing enables temporal queries ("what was the state at time T?"), which are impossible with CRUD.
  - The trade-off: event sourcing adds complexity in writes and queries, but provides perfect audit, replayability, and the ability to derive new insights from historical events.
related_tags: [event-sourcing, domain-events, aggregate, cqrs, snapshot, replay, projection, upcasting, audit-log, data-systems, ddia]
