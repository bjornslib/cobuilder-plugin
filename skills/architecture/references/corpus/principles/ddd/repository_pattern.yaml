  - language: typescript
    bad: |
      // Generic IRepository<T> — CRUD for everything, domain meaning nowhere.
      // Specifications are ad-hoc filter objects with no business language.
      // Collection and persistence semantics mushed together.

      // --- GENERIC REPOSITORY ---
      interface IRepository<T> {
        getById(id: string): Promise<T | null>;
        find(criteria: Record<string, unknown>): Promise<T[]>;  // Not a spec
        add(entity: T): Promise<void>;
        remove(entity: T): Promise<void>;
        save(entity: T): Promise<void>;  // add AND save? Pick one.
        flush(): Promise<void>;
      }

      // --- ANEMIC MODEL ---
      interface InvoiceData {
        id: string;
        customerId: string;
        amount: number;
        dueDate: string;
        status: "paid" | "overdue" | "draft";
      }

      class Invoice implements InvoiceData {
        constructor(
          public id: string,
          public customerId: string,
          public amount: number,
          public dueDate: string,
          public status: "paid" | "overdue" | "draft",
        ) {}
        // No behavior. Just a bag of mutable fields.
      }

      // --- BUSINESS LOGIC IN INFRASTRUCTURE ---
      class SqlInvoiceRepository implements IRepository<Invoice> {
        async save(invoice: Invoice): Promise<void> {
          // Business rule in infrastructure!
          if (invoice.amount > 10000 && invoice.status === "draft") {
            throw new Error("Large invoices require manager approval");
          }
          await this.db.query("INSERT INTO invoices ...", [invoice]);
        }

        async find(criteria: Record<string, unknown>): Promise<Invoice[]> {
          let query = "SELECT * FROM invoices WHERE 1=1";
          if (criteria["status"]) {
            query += ` AND status = '${criteria["status"]}'`;  // SQL injection
          }
          const rows = await this.db.query(query);
          return rows.map(r => new Invoice(r.id, r.customer_id, r.amount, r.due_date, r.status));
        }
      }

    good: |
      // Focused repository per aggregate. Collection-oriented with Unit of Work.
      // Specification is a composable domain predicate.
      // Three-level testing: mock, fake, integration.

      // ====================================================================
      // DOMAIN LAYER
      // ====================================================================

      // --- VALUE OBJECTS ---

      class Money {
        constructor(
          public readonly amount: number,
          public readonly currency: string = "USD",
        ) {
          if (amount < 0) throw new Error(`Money cannot be negative: ${amount}`);
        }

        greaterThan(other: Money): boolean {
          if (this.currency !== other.currency) throw new Error("Currency mismatch");
          return this.amount > other.amount;
        }

        add(other: Money): Money {
          if (this.currency !== other.currency) throw new Error("Currency mismatch");
          return new Money(this.amount + other.amount, this.currency);
        }

        subtract(other: Money): Money {
          if (this.currency !== other.currency) throw new Error("Currency mismatch");
          return new Money(this.amount - other.amount, this.currency);
        }

        equals(other: Money): boolean {
          return this.amount === other.amount && this.currency === other.currency;
        }
      }

      // --- SPECIFICATIONS: composable domain predicates ---

      interface InvoiceSpecification {
        isSatisfiedBy(invoice: Invoice): boolean;
        and(other: InvoiceSpecification): InvoiceSpecification;
        or(other: InvoiceSpecification): InvoiceSpecification;
        not(): InvoiceSpecification;
      }

      class AndSpecification implements InvoiceSpecification {
        constructor(
          private readonly left: InvoiceSpecification,
          private readonly right: InvoiceSpecification,
        ) {}

        isSatisfiedBy(invoice: Invoice): boolean {
          return this.left.isSatisfiedBy(invoice) && this.right.isSatisfiedBy(invoice);
        }

        and(other: InvoiceSpecification): InvoiceSpecification {
          return new AndSpecification(this, other);
        }
        or(other: InvoiceSpecification): InvoiceSpecification {
          return new OrSpecification(this, other);
        }
        not(): InvoiceSpecification {
          return new NotSpecification(this);
        }
      }

      class OrSpecification implements InvoiceSpecification {
        constructor(
          private readonly left: InvoiceSpecification,
          private readonly right: InvoiceSpecification,
        ) {}

        isSatisfiedBy(invoice: Invoice): boolean {
          return this.left.isSatisfiedBy(invoice) || this.right.isSatisfiedBy(invoice);
        }

        and(other: InvoiceSpecification): InvoiceSpecification {
          return new AndSpecification(this, other);
        }
        or(other: InvoiceSpecification): InvoiceSpecification {
          return new OrSpecification(this, other);
        }
        not(): InvoiceSpecification {
          return new NotSpecification(this);
        }
      }

      class NotSpecification implements InvoiceSpecification {
        constructor(private readonly spec: InvoiceSpecification) {}

        isSatisfiedBy(invoice: Invoice): boolean {
          return !this.spec.isSatisfiedBy(invoice);
        }

        and(other: InvoiceSpecification): InvoiceSpecification {
          return new AndSpecification(this, other);
        }
        or(other: InvoiceSpecification): InvoiceSpecification {
          return new OrSpecification(this, other);
        }
        not(): InvoiceSpecification {
          return this.spec;  // Double negation
        }
      }

      class InvoiceIsOverdue implements InvoiceSpecification {
        isSatisfiedBy(invoice: Invoice): boolean {
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          return invoice.status === "issued" && invoice.dueDate < today;
        }

        and(other: InvoiceSpecification): InvoiceSpecification {
          return new AndSpecification(this, other);
        }
        or(other: InvoiceSpecification): InvoiceSpecification {
          return new OrSpecification(this, other);
        }
        not(): InvoiceSpecification {
          return new NotSpecification(this);
        }
      }

      class InvoiceAmountExceeds implements InvoiceSpecification {
        constructor(private readonly threshold: Money) {}

        isSatisfiedBy(invoice: Invoice): boolean {
          return invoice.totalAmount.greaterThan(this.threshold);
        }

        and(other: InvoiceSpecification): InvoiceSpecification {
          return new AndSpecification(this, other);
        }
        or(other: InvoiceSpecification): InvoiceSpecification {
          return new OrSpecification(this, other);
        }
        not(): InvoiceSpecification {
          return new NotSpecification(this);
        }
      }

      // Composed specification
      function shouldEscalateInvoice(): InvoiceSpecification {
        return new InvoiceIsOverdue().and(
          new InvoiceAmountExceeds(new Money(5000, "USD"))
        );
      }

      // --- AGGREGATE ROOT ---

      interface PaymentData {
        amount: Money;
        paidAt: Date;
      }

      class Payment {
        constructor(
          public readonly amount: Money,
          public readonly paidAt: Date,
        ) {}
      }

      class Invoice {
        private _status: string = "draft";
        private readonly _payments: Payment[] = [];

        constructor(
          public readonly id: string,
          public readonly customerId: string,
          private readonly _amount: Money,
          public readonly dueDate: Date,
        ) {}

        // --- Queries ---
        get status(): string { return this._status; }

        get totalAmount(): Money {
          if (this._payments.length === 0) return this._amount;
          return this._payments.reduce(
            (remaining, p) => remaining.subtract(p.amount),
            this._amount,
          );
        }

        // --- Identity equality ---
        equals(other: Invoice): boolean {
          return this.id === other.id;
        }

        // --- Domain behavior ---

        issue(): void {
          if (this._status !== "draft")
            throw new Error(`Cannot issue a ${this._status} invoice`);
          if (this._amount.amount === 0)
            throw new Error("Cannot issue a zero-amount invoice");
          this._status = "issued";
        }

        recordPayment(payment: Payment): void {
          if (this._status !== "issued" && this._status !== "partially_paid")
            throw new Error(`Cannot pay a ${this._status} invoice`);
          this._payments.push(payment);
          if (this.totalAmount.amount <= 0) {
            this._status = "paid";
          } else {
            this._status = "partially_paid";
          }
        }

        cancel(reason: string): void {
          if (this._status === "paid")
            throw new Error("Cannot cancel a paid invoice");
          if (!reason.trim())
            throw new Error("Cancellation requires a reason");
          this._status = "cancelled";
        }
      }

      // --- REPOSITORY INTERFACE: collection-oriented ---

      interface InvoiceRepository {
        add(invoice: Invoice): void;
        remove(invoice: Invoice): void;
        findById(id: string): Invoice | null;
        findSatisfying(spec: InvoiceSpecification): Invoice[];
        findOverdue(asOf?: Date): Invoice[];
      }

      // --- UNIT OF WORK ---

      interface UnitOfWork {
        invoices: InvoiceRepository;
        commit(): Promise<void>;
        rollback(): Promise<void>;
      }

      // ====================================================================
      // APPLICATION LAYER
      // ====================================================================

      class ProcessOverdueInvoicesUseCase {
        constructor(
          private readonly uowFactory: () => UnitOfWork,
        ) {}

        async execute(): Promise<string[]> {
          const escalated: string[] = [];
          const uow = this.uowFactory();
          try {
            const overdue = uow.invoices.findOverdue();
            const escalateSpec = shouldEscalateInvoice();
            for (const inv of overdue) {
              if (escalateSpec.isSatisfiedBy(inv)) {
                escalated.push(inv.id);
              }
            }
            await uow.commit();
          } catch (e) {
            await uow.rollback();
            throw e;
          }
          return escalated;
        }
      }

      // ====================================================================
      // TESTING: THREE LEVELS
      // ====================================================================

      // --- Level 1: Mock repository ---

      test("should escalate overdue large invoice", () => {
        const inv = new Invoice(
          "inv-1", "cust-1",
          new Money(6000, "USD"),
          new Date("2024-01-01"),
        );
        inv.issue();

        const spec = shouldEscalateInvoice();
        expect(spec.isSatisfiedBy(inv)).toBe(true);
      });

      test("use case escalates overdue invoices via mock", async () => {
        const overdueInv = new Invoice(
          "inv-1", "cust-1",
          new Money(6000, "USD"),
          new Date("2024-01-01"),
        );
        overdueInv.issue();

        const mockRepo: InvoiceRepository = {
          add: jest.fn(),
          remove: jest.fn(),
          findById: jest.fn(),
          findSatisfying: jest.fn(),
          findOverdue: jest.fn().mockReturnValue([overdueInv]),
        };

        const mockUow: UnitOfWork = {
          invoices: mockRepo,
          commit: jest.fn().mockResolvedValue(undefined),
          rollback: jest.fn().mockResolvedValue(undefined),
        };

        const useCase = new ProcessOverdueInvoicesUseCase(() => mockUow);
        const escalated = await useCase.execute();

        expect(escalated).toEqual(["inv-1"]);
        expect(mockUow.commit).toHaveBeenCalledTimes(1);
      });

      // --- Level 2: In-memory fake ---

      class InMemoryInvoiceRepository implements InvoiceRepository {
        private readonly invoices = new Map<string, Invoice>();

        add(invoice: Invoice): void {
          this.invoices.set(invoice.id, invoice);
        }

        remove(invoice: Invoice): void {
          this.invoices.delete(invoice.id);
        }

        findById(id: string): Invoice | null {
          return this.invoices.get(id) ?? null;
        }

        findSatisfying(spec: InvoiceSpecification): Invoice[] {
          return Array.from(this.invoices.values()).filter(inv =>
            spec.isSatisfiedBy(inv)
          );
        }

        findOverdue(asOf?: Date): Invoice[] {
          return this.findSatisfying(new InvoiceIsOverdue());
        }
      }

      test("fake repository catches lifecycle transitions", () => {
        const repo = new InMemoryInvoiceRepository();
        const inv1 = new Invoice(
          "inv-1", "cust-1",
          new Money(100, "USD"),
          new Date(Date.now() + 30 * 86400000),
        );
        const inv2 = new Invoice(
          "inv-2", "cust-2",
          new Money(200, "USD"),
          new Date(Date.now() - 5 * 86400000),
        );
        inv2.issue();

        repo.add(inv1);
        repo.add(inv2);

        expect(repo.findOverdue()).toHaveLength(1);
        expect(repo.findOverdue()[0].id).toBe("inv-2");

        // Pay inv2 — should leave overdue list
        inv2.recordPayment(new Payment(new Money(200, "USD"), new Date()));
        expect(repo.findOverdue()).toHaveLength(0);
      });

      // --- Level 3: Integration test ---
      // Requires database — see CI for Postgres testcontainer setup

heuristics:
  - "One repository per aggregate root. If you have more repositories than aggregates, you're modeling your database, not your domain."
  - "The repository interface lives in the domain layer and speaks domain language. The implementation lives in infrastructure. Never import infrastructure types into the repository interface."
  - "Collection-oriented if you have rich domain logic and Unit of Work. Persistence-oriented for transaction scripts and simple CRUD. Don't hybridize — pick one mental model and commit."
  - "A specification is a predicate, not a query. If you can't evaluate `isSatisfiedBy()` on a plain domain object, you've built a query builder, not a specification."
  - "Compose specifications with AND/OR/NOT. The whole point is building complex rules from simple ones without writing new conditional code."
  - "Translate specifications to queries in infrastructure, never in the specification itself. The spec says 'what' in domain language; the repo says 'how' in SQL."
  - "Test repositories at three levels: mock for domain logic speed, fake for object-lifecycle correctness, integration for SQL/mapping correctness. Skip any level at your peril."
  - "If mocking your repository is hard, your interface is wrong. A good repo interface has focused, domain-named methods — `findOverdue()` mocks in one line."
  - "The repository should reconstruct full aggregates from persistence. Partial loads (selective column fetching, lazy loading) create objects that can't enforce invariants."
  - "Do not call repositories from domain objects. Aggregate roots don't fetch their own children — the application service loads the aggregate and passes it in."
  - "`save()` is a smell in a pure collection-oriented repository. The repository should track dirtied objects (via UoW) and persist on commit, not on demand."
  - "Repository query methods should not take raw SQL, ORM criteria, or filter maps. If you need ad-hoc querying, create a separate query service — don't corrupt the repository abstraction."

