id: security-supply-chain-001
name: Dependency and Supply-Chain Security
category: security
canonical_tags: ['security', 'supply-chain', 'dependencies', 'slsa']
sources:
  - slsa/framework.md
  - osv/database.md
  - npm/audit.md
  - pip-audit/docs.md
summary: >
  Every dependency is an attack surface. Use lockfiles, audit for known CVEs,
  verify package integrity, and watch for typosquatting. Build reproducibility
  requires pinned versions and checksums. Supply-chain attacks — malicious
  packages published with names similar to popular libraries, compromised
  maintainer accounts, or injected install scripts — exploit the trust
  developers place in the package ecosystem. Defense layers: pin versions
  with lockfiles, audit with pip-audit/npm audit, verify integrity with
  hashes, and minimize the dependency surface by preferring stdlib and
  well-maintained packages over niche alternatives.
examples:
  - language: python
    bad: |
      # ---- requirements.txt: unpinned, no hashes ----
      # Any version of any package resolves. A compromised release of
      # any transitive dep runs arbitrary code at install time.
      requests
      flask
      sqlalchemy
      pydantic


      # ---- No lockfile: builds are non-reproducible ----
      # pip install -r requirements.txt today != pip install -r requirements.txt tomorrow
      # because new patch releases may have been published between installs.


      # ---- Install without verification ----
      # pip install some-package
      # No integrity check. A MITM attacker or compromised mirror can
      # substitute a malicious wheel.
    good: |
      # ---- pyproject.toml with pinned versions ----
      [project]
      name = "my-app"
      version = "1.0.0"
      dependencies = [
          "requests==2.32.3",
          "flask==3.0.3",
          "sqlalchemy==2.0.31",
          "pydantic==2.8.0",
      ]


      # ---- uv.lock (or poetry.lock): reproducible builds ----
      # Generated by: uv lock
      # Pins every transitive dependency with hashes for integrity.
      # Commit to version control so every install is identical.
      # uv sync --frozen  (refuses to update the lockfile)


      # ---- requirements.txt with hashes (CI fallback) ----
      # Generated by: pip-compile --generate-hashes
      requests==2.32.3 \
          --hash=sha256:a1b2c3d4e5f6...
      urllib3==2.2.2 \
          --hash=sha256:g7h8i9j0k1l2...


      # ---- CI pipeline: audit on every build ----
      # pip-audit checks against OSV database for known CVEs
      # pip-audit -r requirements.txt --strict
      # --strict fails on any vulnerability, not just high severity

      # For Go:
      # go.sum provides checksums for every module
      # govulncheck ./... checks for known vulnerabilities
heuristics:
  - >
    Pin every direct dependency to an exact version. Unpinned deps
    (requests without ==x.y.z) resolve differently across installs,
    making builds non-reproducible and opening a window for compromised
    releases. Pin direct deps; let the lockfile pin transitive deps.
  - >
    Commit the lockfile (uv.lock, poetry.lock, go.sum, package-lock.json)
    to version control. The lockfile is the single source of truth for
    reproducible builds. Without it, CI and production may resolve
    different versions of transitive dependencies.
  - >
    Run pip-audit (Python), govulncheck (Go), or npm audit (Node) in CI
    on every push and on a daily schedule. Treat newly disclosed CVEs
    in existing dependencies with the same urgency as a direct security
    bug in your code.
  - >
    Verify package integrity with hashes. pip-compile --generate-hashes
    or uv.lock with hashes ensures the installed package matches the
    registry checksum. This defeats MITM attacks and compromised mirrors.
  - >
    Minimize the dependency surface. Prefer stdlib (pathlib, json,
    logging, sqlite3) over third-party packages for simple tasks. Every
    dependency is a maintenance burden, an attack surface, and a license
    obligation. Audit the full tree (pip-audit shows transitive deps).
  - >
    Watch for typosquatting: packages with names similar to popular
    libraries (e.g., python-requests vs requests, flaskk vs flask).
    Install only from verified PyPI/NPM registries. In CI, use
    --only-binary or --no-binary flags to limit install vectors.
  - >
    Review dependency changes in PRs. A new dependency in pyproject.toml
    or go.mod deserves the same scrutiny as a code change. Check: Is the
    package maintained? Does it have known CVEs? Is the license compatible?
    Is it widely used or a niche package with few maintainers?
related_tags:
  [security, supply-chain, dependencies, lockfiles, pip-audit, govulncheck,
   npm-audit, slsa, typosquatting, reproducible-builds, cve, osv,
   integrity-hashes, pyproject-toml, go-sum]