      // One handler doing everything: HTTP, SQL, Stripe, email, Slack.
      // No adapter seams — testing requires the full stack running.

      import { Router, Request, Response } from "express";
      import { Pool } from "pg";
      import Stripe from "stripe";
      import nodemailer from "nodemailer";

      const router = Router();
      const pool = new Pool({ connectionString: process.env.DATABASE_URL });
      const stripe = new Stripe(process.env.STRIPE_SECRET!);

      router.post("/checkout/:userId", async (req: Request, res: Response) => {
        const { items, stripeToken } = req.body;
        const userId = parseInt(req.params.userId);

        // Direct SQL
        const ids = items.map((i: any) => i.productId);
        const { rows: products } = await pool.query(
          "SELECT id, price, stock FROM products WHERE id = ANY($1)",
          [ids],
        );

        let total = 0;
        for (const item of items) {
          const prod = products.find((p: any) => p.id === item.productId);
          if (!prod) return res.status(400).json({ error: "Unknown product" });
          if (item.qty > prod.stock) return res.status(400).json({ error: "No stock" });
          total += prod.price * item.qty;
        }

        // Direct Stripe
        const charge = await stripe.charges.create({
          amount: Math.round(total * 100),
          currency: "usd",
          source: stripeToken,
          metadata: { userId: userId.toString() },
        });

        // Direct SQL write
        await pool.query(
          "INSERT INTO orders (user_id, total, stripe_charge_id) VALUES ($1, $2, $3)",
          [userId, total, charge.id],
        );

        // Direct email + Slack
        const { rows: [user] } = await pool.query("SELECT email FROM users WHERE id = $1", [userId]);
        await transporter.sendMail({ to: user.email, subject: "Order confirmed", text: `Total: $${total}` });
        await fetch("https://hooks.slack.com/xxx", {
