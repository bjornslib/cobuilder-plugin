        });

        res.json({ status: "ok", chargeId: charge.id });
      });

    good: |
      // Six adapter types, each implementing a port owned by the core.

      // ═══════════════════════════════════════════════════════
      // DOMAIN + APPLICATION LAYER (ports only)
      // ═══════════════════════════════════════════════════════

      interface Product { id: string; price: number; stock: number; }
      interface Order { id: number | null; userId: number; items: CartItem[]; total: number; }

      // Port 1: Product Repository
      interface ProductRepository {
        findByIds(ids: string[]): Promise<Product[]>;
      }

      // Port 2: Order Repository
      interface OrderRepository {
        save(order: Order): Promise<Order>;
      }

      // Port 3: Payment Gateway
      interface PaymentGateway {
        charge(amountCents: number, token: string, meta: Record<string, string>): Promise<string>;
      }

      // Port 4: User Lookup
      interface UserLookup {
        findEmail(userId: number): Promise<string>;
      }

      // Port 5: Order Notifier
      interface OrderNotifier {
        notifyPlaced(order: Order, userEmail: string): Promise<void>;
      }

      // Port 6: Checkout Presenter
      interface CheckoutPresenter {
        present(result: CheckoutResult): unknown;
      }

      interface CheckoutResult { orderId: number; total: number; chargeId: string; }

      // USE CASE
      export class CheckoutUseCase {
        constructor(
          private products: ProductRepository,
          private orders: OrderRepository,
          private payment: PaymentGateway,
          private users: UserLookup,
          private notifier: OrderNotifier,
          private presenter: CheckoutPresenter,
        ) {}

        async execute(userId: number, items: CartItem[], token: string): Promise<unknown> {
          const prodIds = items.map(i => i.productId);
          const products = await this.products.findByIds(prodIds);
          const map = new Map(products.map(p => [p.id, p]));

          let total = 0;
          for (const item of items) {
            const p = map.get(item.productId);
            if (!p) throw new Error(`Unknown: ${item.productId}`);
            if (item.quantity > p.stock) throw new Error(`No stock: ${item.productId}`);
            total += p.price * item.quantity;
          }

          const chargeId = await this.payment.charge(
            Math.round(total * 100), token, { userId: String(userId) }
          );
          const saved = await this.orders.save({ id: null, userId, items, total });
          const email = await this.users.findEmail(userId);
          await this.notifier.notifyPlaced(saved, email);

          return this.presenter.present({ orderId: saved.id!, total, chargeId });
        }
      }

      // ═══════════════════════════════════════════════════════
      // ADAPTERS
      // ═══════════════════════════════════════════════════════

      // Adapter 1: Repository (PostgreSQL)
      import { Pool } from "pg";
      export class PgProductRepository implements ProductRepository {
        constructor(private pool: Pool) {}
        async findByIds(ids: string[]): Promise<Product[]> {
          const { rows } = await this.pool.query(
            "SELECT id, price, stock FROM products WHERE id = ANY($1)", [ids]
          );
          return rows.map(r => ({ id: r.id, price: Number(r.price), stock: r.stock }));
        }
      }

      // Adapter 2: Gateway (Stripe)
      import Stripe from "stripe";
      export class StripePaymentGateway implements PaymentGateway {
        constructor(private client: Stripe) {}
        async charge(amountCents: number, token: string, meta: Record<string, string>): Promise<string> {
          const c = await this.client.charges.create({ amount: amountCents, currency: "usd", source: token, metadata: meta });
          return c.id;
        }
      }

      // Adapter 3: Controller (Express)
      import { Router, Request, Response } from "express";
      export function checkoutRoutes(uc: CheckoutUseCase): Router {
        const r = Router();
        r.post("/checkout/:userId", async (req: Request, res: Response) => {
          try {
            const result = await uc.execute(parseInt(req.params.userId), req.body.items, req.body.stripeToken);
            res.status(201).json(result);
          } catch (e: any) { res.status(400).json({ error: e.message }); }
        });
        return r;
      }

      // Adapter 4: Presenter (JSON:API)
      export class JsonApiPresenter implements CheckoutPresenter {
        present(r: CheckoutResult) {
          return { data: { type: "orders", id: String(r.orderId), attributes: { total: `$${r.total.toFixed(2)}`, chargeId: r.chargeId } } };
        }
      }

      // Adapter 5: Mapper
      export function mapProductRow(row: any): Product {
        return { id: row.id, price: Number(row.price), stock: row.stock };
      }

      // Adapter 6: Anticorruption Layer (legacy inventory)
      export class LegacyInventoryACL {
        constructor(private legacy: LegacyClient) {}
        async check(productId: string, qty: number): Promise<boolean> {
          const resp = await this.legacy.query("CHECK", { sku: `WDGT-${productId.split("-")[1].toUpperCase()}` });
          return resp.status === "AVL";
        }
      }

heuristics:
  - >
    Repository adapters: implement data access contracts defined by the domain/application
    layer. They reconstitute aggregates and persist them. Repository interfaces should
    reflect aggregate access patterns and domain intent — `OrderRepository.findPending()`,
    not `GenericRepository<Order>`.
  - >
    Gateway adapters: wrap external APIs (payment processors, email services, message
    brokers, vendor SDKs). They translate domain concepts into vendor-specific calls
    and vendor responses back into domain objects. The core never imports the vendor SDK.
  - >
    Controller adapters: translate delivery input (HTTP requests, CLI args, queue messages)
    into use-case input models. A controller should be thin — extract data, call the use
    case, return the result. If the controller contains if/else branching on business
    conditions, those branches belong in the use case.
  - >
    Presenter adapters: format use-case output for a specific delivery mechanism
    (JSON:API, GraphQL response shapes, HTML templates, CSV exports, CLI tables).
    The use case returns plain data; the presenter decides how to present it.
  - >
    Mapper adapters: explicit, testable translation between external representations
    (ORM rows, DTOs, wire formats) and domain models. Mapping must be explicit and
    testable — hide complex mapping in dedicated mapper objects, not scattered through
    controllers and repositories.
  - >
    Anticorruption layers (ACL): protect a clean domain model from a foreign, legacy,
    or partner system with its own terminology, schemas, and constraints. The ACL
    translates foreign concepts into local domain language and vice versa. The local
    core never imports a legacy type directly.
  - >
    All adapters share one rule: the dependency arrow points inward. An adapter imports
    the port it implements (from the inner layer), never the reverse. The inner layer
    does not know which adapter is connected at runtime.
  - >
    Name adapters by the detail they adapt: `PostgresOrderRepository`, `StripePaymentGateway`,
    `HttpUserController`, `JsonApiPresenter`. The name tells readers exactly which external
    system is being adapted without reading the implementation.
  - >
    Test each adapter class in isolation: repository adapters against a test database,
    gateway adapters against a vendor sandbox, controller adapters with mock use cases,
    presenter adapters with sample output models. Integration tests belong at the adapter
    boundary, not inside business logic tests.
  - >
    When swapping infrastructure (PostgreSQL → MongoDB, REST → gRPC, Stripe → Braintree),
    only the adapter changes. The port stays the same, the use case stays the same, the
    tests stay green. This is the adapter pattern's design goal: replaceable shells
    around a stable core.
