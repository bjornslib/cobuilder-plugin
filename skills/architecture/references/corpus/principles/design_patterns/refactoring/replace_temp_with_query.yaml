id: replace-temp-with-query-001
name: "Refactoring — Replace Temp with Query"
category: design-patterns
canonical_tags: ['refactoring', 'composing-methods', 'replace-temp-with-query', 'extract-method', 'readability']
sources:
  - books/refactoring.md
  - open_sources/design_patterns/refactoring-guru-patterns.txt
  - open_sources/design_patterns/augmentcode-refactoring.html
summary: >
  Replace Temp with Query eliminates temporary local variables by extracting the
  expression that computes them into a named method (query). The temp's name
  becomes the method name; every reference to the temp becomes a method call.
  This is a preparatory refactoring that unlocks Extract Method: temps tether
  code to a local scope and force extracted methods to carry them as parameters.
  Queries dissolve that tether — extracted methods call the query directly.
  Apply when a temp is assigned once from a side-effect-free expression and is
  used in multiple places, or when the expression deserves a name that reveals
  intent better than the raw computation. Do NOT apply when the expression has
  observable side effects (I/O, mutation, non-determinism) or when the temp
  is truly used exactly once for an obvious, trivial value.
examples:
  - language: python
    bad: |
      # Temps for base_price, discount, and tax create coupling between the
      # computation site and every line that reads them. If you want to extract
      # `format_receipt` or `apply_loyalty_discount`, you must pass these temps
      # as parameters — the method signature grows with every intermediate value.

      from dataclasses import dataclass
      from typing import Sequence


      @dataclass
      class Item:
          name: str
          price: float
          quantity: int


      @dataclass
      class Customer:
          name: str
          loyalty_years: int


      def calculate_total(items: Sequence[Item], customer: Customer) -> str:
          # temp 1: base price — used in discount AND tax AND total
          base_price = sum(item.price * item.quantity for item in items)

          # temp 2: discount — computed from base_price + customer
          if customer.loyalty_years >= 5:
              discount = base_price * 0.15
          elif customer.loyalty_years >= 2:
              discount = base_price * 0.05
          else:
              discount = 0.0

          # temp 3: tax — computed from (base_price - discount)
          taxable = base_price - discount
          tax = taxable * 0.08

          # temp 4: total — depends on all three temps above
          total = base_price - discount + tax

          # Every temp must be passed if we extract this line
          return f"Total for {customer.name}: ${total:.2f} (${base_price:.2f} base)"
    good: |
      # Replace Temp with Query: each temp becomes a method whose name reveals
      # intent. Extract Method is now trivial — `format_receipt` calls query
      # methods directly instead of requiring 4 parameters.

      from dataclasses import dataclass
      from typing import Sequence


      @dataclass
      class Item:
          name: str
          price: float
          quantity: int


      @dataclass
      class Customer:
          name: str
          loyalty_years: int


      # --- Query methods: pure functions, no side effects ---

      def base_price(items: Sequence[Item]) -> float:
          """Total undiscounted price of all items."""
          return sum(item.price * item.quantity for item in items)


      def loyalty_discount(items: Sequence[Item], customer: Customer) -> float:
          """Percentage discount based on customer loyalty tier."""
          bp = base_price(items)
          if customer.loyalty_years >= 5:
              return bp * 0.15
          if customer.loyalty_years >= 2:
              return bp * 0.05
          return 0.0


      def tax(items: Sequence[Item], customer: Customer) -> float:
          """8% tax on the post-discount amount."""
          return (base_price(items) - loyalty_discount(items, customer)) * 0.08


      # --- Orchestrating method: reads like a spec, not a computation ---

      def calculate_total(items: Sequence[Item], customer: Customer) -> str:
          bp = base_price(items)
          disc = loyalty_discount(items, customer)
          tx = tax(items, customer)
          total = bp - disc + tx
          return f"Total for {customer.name}: ${total:.2f} (${bp:.2f} base)"


      # --- Extract Method is now easy — no temp parameters needed ---

      def format_receipt(items: Sequence[Item], customer: Customer) -> str:
          return (
              f"Receipt for {customer.name}\n"
              f"  Base:       ${base_price(items):.2f}\n"
              f"  Discount:  -${loyalty_discount(items, customer):.2f}\n"
              f"  Tax:        ${tax(items, customer):.2f}\n"
              f"  Total:      ${base_price(items) - loyalty_discount(items, customer) + tax(items, customer):.2f}"
          )


      # A deeper extract: `discount_breakdown` becomes independently testable
      def discount_breakdown(items: Sequence[Item], customer: Customer) -> dict[str, float]:
          return {
              "base": base_price(items),
              "loyalty_saved": loyalty_discount(items, customer),
              "tax": tax(items, customer),
          }

  - language: typescript
    bad: |
      // Temps for subtotal, discount, and shipping tether every line to
      // calculateOrder. Extracting `buildConfirmationEmail` or `applyPromoCode`
      // forces you to thread these temps through every extracted function.

      interface LineItem {
        name: string;
        unitPrice: number; // in cents
        quantity: number;
      }

      interface Customer {
        id: string;
        email: string;
        loyaltyTier: "bronze" | "silver" | "gold";
      }

      function calculateOrder(
        items: LineItem[],
        customer: Customer,
        promoCode?: string,
      ): { totalCents: number; breakdown: string } {
        // temp: subtotal
        const subtotal = items.reduce(
          (sum, item) => sum + item.unitPrice * item.quantity,
          0,
        );

        // temp: loyalty discount (percentage off)
        const loyaltyMultiplier =
          customer.loyaltyTier === "gold"
            ? 0.85
            : customer.loyaltyTier === "silver"
              ? 0.93
              : 1.0;
        const loyaltyDiscount = subtotal * (1 - loyaltyMultiplier);

        // temp: promo discount
        const promoAmount = promoCode === "WELCOME10" ? subtotal * 0.10 : 0;

        // temp: shipping
        const shipping =
          subtotal - loyaltyDiscount - promoAmount > 5000 ? 0 : 799;

        // final total depends on all four temps
        const totalCents =
          subtotal - loyaltyDiscount - promoAmount + shipping;

        // If we want to extract this line, we need 5 parameters
        return {
          totalCents,
          breakdown: [
            `Subtotal: $${(subtotal / 100).toFixed(2)}`,
            `Loyalty: -$${(loyaltyDiscount / 100).toFixed(2)}`,
            `Promo:   -$${(promoAmount / 100).toFixed(2)}`,
            `Shipping: $${(shipping / 100).toFixed(2)}`,
            `Total:    $${(totalCents / 100).toFixed(2)}`,
          ].join("\n"),
        };
      }
    good: |
      // Replace Temp with Query: temps → pure query functions. Extract Method
      // calls queries directly — no parameter threading, no scope coupling.

      interface LineItem {
        name: string;
        unitPrice: number; // cents
        quantity: number;
      }

      interface Customer {
        id: string;
        email: string;
        loyaltyTier: "bronze" | "silver" | "gold";
      }

      interface OrderBreakdown {
        subtotal: number;
        loyaltyDiscount: number;
        promoDiscount: number;
        shipping: number;
        totalCents: number;
      }

      // --- Query functions: pure, intention-revealing names ---

      function subtotal(items: LineItem[]): number {
        return items.reduce(
          (sum, item) => sum + item.unitPrice * item.quantity,
          0,
        );
      }

      function loyaltyDiscount(
        items: LineItem[],
        customer: Customer,
      ): number {
        const tierMultiplier: Record<Customer["loyaltyTier"], number> = {
          gold: 0.85,
          silver: 0.93,
          bronze: 1.0,
        };
        return subtotal(items) * (1 - tierMultiplier[customer.loyaltyTier]);
      }

      function promoDiscount(items: LineItem[], code?: string): number {
        if (code === "WELCOME10") return subtotal(items) * 0.10;
        return 0;
      }

      function shipping(
        items: LineItem[],
        customer: Customer,
        code?: string,
      ): number {
        const afterDiscounts =
          subtotal(items) -
          loyaltyDiscount(items, customer) -
          promoDiscount(items, code);
        return afterDiscounts > 5000 ? 0 : 799; // free shipping above $50
      }

      function totalCents(
        items: LineItem[],
        customer: Customer,
        code?: string,
      ): number {
        return (
          subtotal(items) -
          loyaltyDiscount(items, customer) -
          promoDiscount(items, code) +
          shipping(items, customer, code)
        );
      }

      function breakdown(
        items: LineItem[],
        customer: Customer,
        code?: string,
      ): OrderBreakdown {
        return {
          subtotal: subtotal(items),
          loyaltyDiscount: loyaltyDiscount(items, customer),
          promoDiscount: promoDiscount(items, code),
          shipping: shipping(items, customer, code),
          totalCents: totalCents(items, customer, code),
        };
      }

      // --- Orchestrating function: declarative, no intermediate temps ---

      function calculateOrder(
        items: LineItem[],
        customer: Customer,
        promoCode?: string,
      ): { totalCents: number; breakdown: string } {
        const b = breakdown(items, customer, promoCode);
        const fmt = (cents: number) => `$${(cents / 100).toFixed(2)}`;
        return {
          totalCents: b.totalCents,
          breakdown: [
            `Subtotal: ${fmt(b.subtotal)}`,
            `Loyalty: -${fmt(b.loyaltyDiscount)}`,
            `Promo:   -${fmt(b.promoDiscount)}`,
            `Shipping: ${fmt(b.shipping)}`,
            `Total:    ${fmt(b.totalCents)}`,
          ].join("\n"),
        };
      }

      // --- Extract Method is now trivial: no temps to pass ---

      function buildOrderConfirmationEmail(
        items: LineItem[],
        customer: Customer,
        promoCode?: string,
      ): string {
        const b = breakdown(items, customer, promoCode);
        const fmt = (cents: number) =>
          new Intl.NumberFormat("en-US", {
            style: "currency",
            currency: "USD",
          }).format(cents / 100);

        // Free shipping announcement is a business rule, independently testable
        const shippingNote = b.shipping === 0 ? "🚚 Free shipping!" : "";

        return [
          `Hi ${customer.email},`,
          "",
          `Your order summary:`,
          `  Subtotal:   ${fmt(b.subtotal)}`,
          `  Saved:     -${fmt(b.loyaltyDiscount + b.promoDiscount)}`,
          `  Shipping:   ${fmt(b.shipping)} ${shippingNote}`,
          `  Total:      ${fmt(b.totalCents)}`,
          "",
          "Thank you for your order!",
        ].join("\n");
      }

      // Independently testable — no need to construct a full order scenario
      test("gold customers get 15% off", () => {
        const items = [{ name: "widget", unitPrice: 1000, quantity: 1 }];
        const customer = { id: "1", email: "a@b.com", loyaltyTier: "gold" };
        expect(loyaltyDiscount(items, customer)).toBe(150);
      });

heuristics:
  - >
    "Replace Temp with Query is often a vital step before Extract Method. Local
    variables make it difficult to extract, because the extracted method needs
    them as parameters. Replacing temps with queries removes the need to pass
    them" (Fowler, Refactoring).
  - "Apply when a temp is assigned exactly once from a side-effect-free expression. The expression must be deterministic: no I/O, no mutation of shared state, no `Date.now()` or `Math.random()`, no database or network calls."
  - The temp should be used more than once, or the expression should be complex
    enough to deserve a name. Replacing a single-use trivial temp (`const tax =
    0.08`) with a query adds ceremony, not clarity.
  - Name the query method after what the value represents, not how it's computed.
    `basePrice()` is better than `sumAllItemPrices()`. The name should read
    naturally in the calling context.
  - " This refactoring changes runtime performance: the expression is now evaluated on every call instead of once. For expensive computations (sorting, large aggregations) called in hot loops, consider memoization, caching, or keeping the temp."
  - >
    Replace Temp with Query is a prerequisite for Extract Method. Temps are local
    scope glue — they force extracted methods to carry them as parameters. Queries
    break the glue: extracted methods call the query directly. A method with 4 temps
    becomes a method with 0 parameters plus 4 query calls.
  - >
    After replacing temps with queries, the orchestrating method often reads like a
    declarative spec: `finalPrice = basePrice - discounts + tax + shipping`. The
    how is hidden in the queries; the method shows only the what.
  - " Combine with Extract Method bottom-up: first replace temps with queries, then extract groups of queries + their consumers into cohesive sub-methods. Each extraction becomes a one-line change because no temp threading is needed."
  - Do NOT apply when the expression has observable side effects — e.g. an API call
    that charges a credit card, a log statement, or a counter increment. Turning
    that into a query hides the side effect from the caller and makes the code
    harder to reason about.
  - In class methods, consider whether the query should be a method on the same
    class (uses object state) or a free function / static method (pure computation
    from parameters). Prefer the latter when the query doesn't need instance state —
    it's easier to test and harder to accidentally couple.
  - " Performance-sensitive paths: a temp computed once and read 50 times becomes 50 query calls after the refactoring. If profiling shows this matters, keep the temp or add a cheap memoization layer. Correctness first, performance second — but document deliberate performance temps so they aren't \"cleaned up\" later."
  - Temps that are mutated (assigned more than once) are NOT candidates. Use Split
    Temporary Variable first, then Replace Temp with Query on each split temp that
    qualifies.
  - " Inline Temp is the inverse refactoring: when a query method is trivial (one-line accessor with no logic), inline it back to a temp. Use Replace Temp with Query to pull complexity into named methods; use Inline Temp to remove indirection from trivial queries."

