ish` go to `cobuilder-artifact` instead |\n| `skills/ste-writing/`, `skills/mermaid/` | `shared/skills/` | both are cited from both pillars, which is exactly what vendoring is for |\n| `.claude/skills/collaborate-with-user/` | `cobuilder-artifact`, folded into its `SKILL.md` and `references/` | it presents a decision, which is the artifact pillar's job |\n| `viewer/index.html` | `cobuilder-artifact` | the reading surface |\n| `extract_story.py`, `extract_diffs.py`, `generate_prompts.py`, `generate_audio.py`, `build_diagrams.py`, `render_review.py` | `cobuilder-pr` | all six only run inside the per-PR sweep or submit |\n| `build_adrs.py`, `build_designs.py` | deleted | `build_index.py` replaces both, see below |\n| `validate_decision_state.py`, `compute_scores.py`, `html_to_pdf.py` | `cobuilder-architect` | decisions mode and the two review reports |\n| `export_artifact.py`, `export_index.py`, `record_publish.py` | `cobuilder-artifact` | publish |\n| `_bundle_meta.py`, `_manifest.py`, `migrate_bundle.py`, `verify_bundle.py` | `shared/` | every plugin that touches a bundle needs all four |\n| `~/.claude/skills/cobuilder-factory/` | `cobuilder-implement` | the port and the rename |\n\n### New files\n\n| File | Plugin | Purpose |\n|---|---|---|\n| `scripts/build_index.py` | `cobuilder-artifact` | builds `data/index.json` and `index.js` |\n| `scripts/serve_bundle.py` | `cobuilder-artifact` | replaces `python3 -m http.server`, adds `POST /feedback` |\n| `scripts/watch_feedback.py` | `cobuilder-artifact` | the background wake command |\n| `skills/orientation/SKILL.md` | `cobuilder-full-lifecycle` | names the four modes and when to reach for each |\n\n**`build_index.py` lives in the artifact plugin and reads what the other\npillars wrote.** Not only `cobuilder-architect`'s ADRs, designs, and\ncontexts. Also `cobuilder-pr`'s `story.json`, its assessments, and its\n`docs/pull-requests/`, and `cobuilder-implement`'s `docs/plans/`. That is not\na seam violation. Every one of those paths is inside the *target repo* or\ninside the bundle. None resolves into another plugin's root. This is the\ndistinction ADR-0016 draws, and it is the one an implementing agent is most\nlikely to get wrong.\n\nSettled at Gate 3 review: the index is a repo-wide artifact rather than one\npillar's output, so it belongs with the pillar that presents the repo.\n\n### `cobuilder-artifact` owns the authoring skill as well as the viewer\n\n`collaborate-with-user` does not travel as a separate skill directory. Its\nrules become part of `cobuilder-artifact`'s own `SKILL.md`, with the long\nmaterial in `references/`: the composition rules, the theme-token rules, the\nhonesty rule, and the relationship to the architecture skill's two report\ntemplates. One plugin then owns both halves of presenting something to a\nperson \u2014 the page it builds and the answer it collects.\n\n**The agent doing this work must invoke the `skill-development` skill first.**\nFolding a standalone `SKILL.md` into another plugin's skill is exactly the\njob that has established practice, and this build should follow it rather\nthan reinvent a layout.\n\n### Pages leave `.lavish/`\n\n`.lavish/` is another tool's directory and this plugin's pages have no\nbusiness in it. A generated page belongs in the bundle, because it is derived\nfrom an authored markdown file and a rebuild can reproduce it:\n\n```\n<bundle-dir>/pages/<slug>.html          the generated page\n<bundle-dir>/exports/publish-manifest.json   already records the URL\n```\n\nThe markdown stays the source of record in `docs/`, unchanged. Moving the\nexisting six pages is part of E5, and each keeps its published URL, because\na URL is bound to the artifact rather than to the local path.\n\n## Types and signatures\n\n### `shared/_bundle_meta.py`\n\n```python\nSCHEMA_VERSION = \"1.3\"                            # was \"1.2\"\nSCHEMA_VERSION_KNOWN = {\"1.0\", \"1.1\", \"1.2\", \"1.3\"}\nCURRENT_BUNDLE_FORMAT = 3                         # was 2\n\nclass BundleIncompatible(RuntimeError):\n    \"\"\"Raised when a bundle demands a reader this plugin cannot be.\"\"\"\n\ndef require_compatible(bundle_dir: Path, plugin: str) -> None:\n    \"\"\"Refuse to write into a bundle this plugin is too old to read.\n\n    Reads <bundle_dir>/bundle.json. Raises BundleIncompatible when\n    min_reader_schema > SCHEMA_VERSION, or when bundle_format >\n    CURRENT_BUNDLE_FORMAT. Returns None and is silent otherwise.\n    A missing bundle.json is a new bundle and is compatible.\n    \"\"\"\n\ndef stamp_generator(bundle_dir: Path, plugin: str, version: str) -> None:\n    \"\"\"Record this plugin's version in bundle.json's generators map.\"\"\"\n```\n\nEvery script that writes into a bundle calls `require_compatible()` as its\nfirst statement after argument parsing. Today three scripts stamp\n`SCHEMA_VERSION` with no check at all: `extract_story.py:599`,\n`export_artifact.py:428`, and `_manifest.py:76`.\n\n### `bundle.json`, at format 3\n\n```json\n{\n  \"bundle_format\": 3,\n  \"schema_version\": \"1.3\",\n  \"min_reader_schema\": \"1.3\",\n  \"generators\": {\n    \"cobuilder-pr\": \"0.5.0\",\n    \"cobuilder-artifact\": \"0.5.0\"\n  },\n  \"migrated_at\": \"2026-08-21T09:00:00Z\"\n}\n```\n\n`generator_version`, a scalar, becomes `generators`, a map keyed by plugin.\n`min_reader_schema` is the floor a reader must meet and is raised only by a\nmigration that makes a bundle unreadable to an older plugin. A migration that\nonly adds an optional field leaves it alone.\n\n### `scripts/build_index.py`\n\n```python\ndef build_index(repo: Path, bundle_dir: Path) -> dict:\n    \"\"\"Full rebuild. Reads docs/ plus git. Never merges, never authors.\"\"\"\n\ndef collect_adrs(repo: Path)      -> list[dict]\ndef collect_designs(repo: Path)   -> list[dict]\ndef collect_contexts(repo: Path)  -> list[dict]   # includes boundary rules\ndef collect_districts(bundle: Path) -> list[dict] # from inventory.yaml\ndef collect_plans(repo: Path)     -> list[dict]   # gates and slices\ndef collect_pull_requests(repo: Path) -> list[dict]  # git plus gh\ndef resolve_joins(entities: dict) -> dict\ndef compute_sources(repo: Path)   -> dict         # freshness\n\ndef is_stale(index: dict, repo: Path) -> bool:\n    \"\"\"True when any tracked subtree hash or the git head has moved.\"\"\"\n```\n\n`index.json`:\n\n```json\n{\n  \"schema_version\": \"1.3\",\n  \"sources\": {\n    \"git_head\": \"642ecb3\",\n    \"trees\": {\"docs/architecture/adr\": \"sha256:\u2026\",\n              \"docs/architecture/designs\": \"sha256:\u2026\",\n              \"docs/architecture/contexts\": \"sha256:\u2026\",\n              \"docs/plans\": \"sha256:\u2026\"}\n  },\n  \"entities\": {\n    \"adr\": [...], \"design\": [...], \"epic\": [...],\n    \"context\": [...], \"district\": [...], \"boundary_rule\": [...],\n    \"pull_request\": [...], \"slice\": [...], \"publication\": [...]\n  },\n  \"joins\": {\n    \"adr_to_context\":  {\"ADR-0016\": \"cobuilder-packaging\"},\n    \"adr_to_district\": {\"ADR-0007\": \"viewer\"},\n    \"context_verifies_district\": {\"cobuilder-packaging\": [\"packaging\"]},\n    \"adr_to_pull_request\": {\"ADR-0016\": {\"pr\": 11, \"via\": \"epic\",\n                                         \"path\": [\"plugin-split/E1\"]}},\n    \"slice_to_epic\": {\"cobuilder-family/3\": \"plugin-split/E1\"},\n    \"epic_to_pull_request\": {\"plugin-split/E1\": 11},\n    \"district_uncovered\": [\"narrative\", \"audio\"]\n  }\n}\n```\n\n`joins` is materialised rather than computed in the viewer. A join resolved\nonce in Python is a join the viewer cannot get wrong, and `district_uncovered`\nis the describe backlog ADR-0018 names.\n\n### An ADR is not an epic\n\nThey are different things and neither contains the other.\n\nAn **ADR** is a decision. It outlives the work that carried it out, it can be\nchallenged years later, and its state machine describes the life of the\ndecision. An **epic** is a unit of work with a branch and an end.\n\nThe relation is many-to-many. One epic can carry several decisions: E1 lands\nthe renames and every ADR the renames settle. One decision can take several\nepics: ADR-0016 needs E1, E1b, E2, and E3 before the code matches it. That is\nexactly why the code-matches-the-decision axis is derived rather than stored\non the ADR.\n\n### How `adr_to_pull_request` is derived\n\nTwo paths, tried in order. Nothing is authored.\n\n1. **Direct.** The ADR's frontmatter carries `source_pr`. Retro-extraction\n   sets it, because the record was written from a merged pull request. Done.\n2. **Through the design and the epic.** Otherwise:\n\n```\nADR-NNNN\n  \u2192 design            the design whose adr list names it, or whose\n                      directory the ADR's `related` paths point into\n  \u2192 epic              goal.json.epics[] entries belonging to that design\n  \u2192 branch            epics[].branch\n  \u2192 pull_request      the PR whose head branch equals that branch,\n                      from `gh pr list --head <branch> --state all`\n```\n\n`via` records which path resolved, and `path` records the epics it went\nthrough. A reader can then see *why* an ADR is attached to a pull request,\nwhich matters when the answer is wrong.\n\n**The gap this exposes: a slice names no epic today.** `04-slices.md` lists\nslices in build order and nothing ties a slice to the epic it advances. The\njoin therefore stops at the epic and cannot reach a slice. Gate 4 fixes this\nat the source: **every slice line declares `epic: <design>/<epic-id>`.** The\nalternative is to guess from the files a slice touches, which is a heuristic\nin a chain built to avoid them.\n\n**What stays underivable.** An epic with no branch has no pull request, and\nthat is correct rather than missing \u2014 it is work that has not started. The\nindex reports it as unstarted and does not search for a PR.\n\n### `scripts/serve_bundle.py`\n\n```python\ndef serve(bundle_dir: Path, port: int, allow_write: bool) -> None:\n    \"\"\"Static files, plus POST /feedback when allow_write is true.\n\n    Binds 127.0.0.1 only. Never binds a routable address.\n    \"\"\"\n\ndef append_thread(bundle_dir: Path, record: dict) -> str:\n    \"\"\"Validate, assign a ulid, append one line, return the id.\n    Opens with 'a' and one write call, so a concurrent append cannot\n    interleave. Never rewrites and never truncates.\n    \"\"\"\n```\n\nAccepted routes: `GET` for any file under the bundle root, and\n`POST /feedback`. Nothing else. A `DELETE` is not implemented, because a read\nnever deletes and neither does anything else.\n\n### `scripts/watch_feedback.py`\n\n```python\ndef watch(bundle_dir: Path, since: int, timeout: int = 900) -> list[dict]:\n    \"\"\"Block until threads.ndjson grows past byte offset `since`, or the\n    timeout expires. Print the new lines as JSON and exit 0. Exit 2 on\n    timeout with no new lines, so a caller can tell the two apart.\n    \"\"\"\n```\n\nPolls the file size once a second. It does not watch the filesystem, because\na watcher is a dependency and this is a local file the same machine writes.\n\n### The comment record\n\nExactly as ADR-0019 specifies, including the agent reply that carries\n`\"author\": \"agent\"` and `\"replies_to\": \"<thread id>\"`, and the state change\nthat carries only `id`, `state`, and `ts`. **The ledger is append-only, so a\nstate is the last line that names it, not a field edited in place.**\n\n```python\ndef thread_view(bundle_dir: Path, thread_id: str) -> dict:\n    \"\"\"Fold every line naming this id into one thread: the root comment,\n    its replies in append order, and the transition history.\"\"\"\n\ndef project_threads(bundle_dir: Path) -> dict:\n    \"\"\"Fold the whole ledger once into feedback/threads-state.json:\n    {thread_id: {state, updated_by, updated_at, reply_count, offset}}.\n    Rewritten in full after each append. Never authored.\n    \"\"\"\n```\n\n**The current state is a field, and the log is still append-only.** The\nearlier draft had every reader fold the file to learn a state, and that was\nthe wrong trade. `threads-state.json` is a projection rebuilt from the\nledger, so a reader gets the state in one lookup and keeps the audit trail\nthat says who moved it and when. The projection is derived and disposable \u2014\ndelete it and the next append rebuilds it from the ledger.\n\nThe rule the projection must not break: **the ledger is the truth and the\nfield is the cache.** A writer appends to the ledger first and projects\nsecond. A projection that disagrees with the ledger is a bug in the\nprojection, and `project_threads()` is cheap enough to rebuild whenever the\nanswer is in doubt. This is the same shape as `index.json` \u2014 derived, full\nrebuild, never merged \u2014 so it needs no new idea, only the same discipline.\n\nE6 ships `thread_view()`, `project_threads()`, and the reply record. It does\nnot ship the conversation interface \u2014 the drawer lists replies flat.\nRendering a thread as a conversation is a later slice, and the record shape\nexists now so that slice adds no migration.\n\n## Call stack\n\n### Publishing a design, end to end\n\n```\n/cobuilder-architect:design\n  \u2192 migrate_bundle.py --bundle-dir \u2026            (shared, unconditional)\n  \u2192 require_compatible(bundle, \"cobuilder-architect\")\n  \u2192 interview, explore, challenge                (Claude judgment)\n  \u2192 write docs/architecture/designs/<name>/*.json\n  \u2192 write docs/architecture/adr/ADR-NNNN-*.md\n  \u2192 when no context covers the region:\n        describe procedure, in-process\n        \u2192 write docs/architecture/contexts/<id>/{canvas.md,boundary.yaml}\n        \u2192 boundary.verifies = [districts covered]\n  \u2192 validate_decision_state.py\n  \u2192 hand off: name cobuilder-implement, stop\n```\n\n### Building the index and reading it\n\n```\nany cobuilder-artifact mode\n  \u2192 migrate_bundle.py\n  \u2192 is_stale(index, repo)?\n        yes \u2192 build_index.py\n                collect_* \u00d76  \u2192  resolve_joins  \u2192  compute_sources\n                write data/index.json and data/index.js\n  \u2192 serve_bundle.py --allow-write\n        viewer/index.html\n          <script src=\"../data/index.js\">  \u2192  window.INDEX\n          renderMode(mode)  \u2192  Designs | Pull requests | Decisions\n                               | Contexts | Builds\n```\n\n### A comment, end to end\n\n```\nreader clicks any element in the viewer\n  \u2192 onSelect(event)\n      computeSelector(el)     walk \u22645 ancestors, short-circuit on an id\n      captureRange(selection) node path plus character offset per end\n      openDrawer(anchor)      shifts the page, does not cover it\n  \u2192 reader types, submits\n      POST /feedback  \u2192  append_thread()  \u2192  ulid returned\n      fallback when the server is read-only: localStorage, then the\n      existing \"Copy review as markdown\" hand-off\n  \u2192 agent side\n      watch_feedback.py --since <offset>\n        blocks \u2192 prints new lines \u2192 exits 0\n        harness re-invokes the session with the threads in hand\n      agent acts, appends a reply line, appends a state line\n```\n\n## Test plan\n\n**This repository has no test suite today.** Gate 3 introduces one, because\nthe red-green-validate loop of `cobuilder-implement` cannot run without it.\n`tests/` at the marketplace root, run with\n`uv run --with pytest pytest tests/`. No CI. No package manager. The\nconstraint that this repo stays prose plus PEP-723 scripts holds, and pytest\narrives through `--with` rather than through a lockfile.\n\n### Compatibility gate\n\n- `test_require_compatible_passes_on_equal_schema`\n- `test_require_compatible_raises_when_bundle_demands_newer_reader` \u2014\n  `min_reader_schema` `1.4` against a `1.3` plugin raises `BundleIncompatible`\n- `test_require_compatible_raises_on_newer_bundle_format`\n- `test_require_compatible_allows_missing_bundle_json` \u2014 a new bundle\n- `test_write_scripts_call_require_compatible_first` \u2014 greps each writer for\n  the call. Crude, and it is the test that actually prevents the regression.\n- `test_stamp_generator_preserves_other_plugins` \u2014 writing as\n  `cobuilder-pr` must not drop `cobuilder-artifact`'s entry\n\n### Migration to format 3\n\n- `test_scalar_generator_version_becomes_a_map`\n- `test_migration_refuses_when_an_authored_field_changes_outside_touches`\n- `test_migration_writes_a_backup_before_it_writes_the_new_story`\n- `test_viewer_refreshes_unconditionally` \u2014 no version gate, the bug that\n  motivated the mechanism\n\n### The index\n\n- `test_index_resolves_an_adr_to_its_context`\n- `test_index_resolves_an_adr_to_a_context_through_a_district` \u2014 the join\n  ADR-0018 adds\n- `test_district_with_no_context_appears_in_district_uncovered`\n- `test_epic_id_is_scoped_to_its_design` \u2014 two designs both carrying `E1`\n- `test_is_stale_detects_a_changed_adr`\n- `test_is_stale_detects_a_moved_git_head`\n- `test_index_is_a_full_rebuild` \u2014 deleting an ADR removes it from the index\n- `test_build_index_never_writes_into_docs`\n\n### The ledger\n\n- `test_append_thread_assigns_a_ulid_and_returns_it`\n- `test_append_thread_never_rewrites_an_existing_line`\n- `test_two_concurrent_appends_both_survive`\n- `test_state_change_is_a_new_line_not_an_edit`\n- `test_read_does_not_delete` \u2014 the point of departure from the lavish CLI\n- `test_thread_view_folds_a_reply_under_its_root`\n- `test_an_agent_reply_carries_author_agent_and_replies_to`\n- `test_projection_state_equals_the_last_transition_in_the_ledger`\n- `test_deleting_the_projection_rebuilds_it_from_the_ledger`\n- `test_projection_records_who_moved_the_state_and_when`\n- `test_watch_exits_2_on_timeout_with_no_new_lines`\n- `test_serve_rejects_a_post_to_any_path_other_than_feedback`\n- `test_serve_binds_loopback_only`\n\n### The split itself\n\n- `test_no_plugin_path_reference_crosses_a_pillar` \u2014 greps every plugin for\n  `${CLAUDE_PLUGIN_ROOT}/skills/<other pillar>`. This is the E1b regression\n  guard, and it is the single most valuable test in the list.\n- `test_every_plugin_manifest_validates` \u2014 `claude plugin validate` on each\n- `test_no_page_is_written_into_dot_lavish`\n- `test_slice_declares_an_epic` \u2014 every line in `04-slices.md` names one\n- `test_adr_reaches_a_pull_request_through_its_epic` \u2014 the two-path derivation\n- `test_an_epic_with_no_branch_is_reported_unstarted_not_missing`\n- `test_shared_symlink_dereferences_to_a_real_directory` \u2014 E2's proof,\n  written as a test rather than as a one-off check\n\n## Found while writing this document\n\n**`explore-design` and `design` are the same command, and the command goes.**\n`commands/explore-design.md:27` dispatches `Skill(\"architecture\", args=\"design\n$ARGUMENTS\")`, which is character-for-character what `commands/design.md`\ndispatches. Divergent exploration is stage 3 of Design mode and runs either\nway, so the second command adds a name and no behaviour. **Decided: delete\nthe command. Divergent exploration stays an agent-invoked step inside Design\nmode and is not a user-facing entry point.** `cobuilder-architect` ships six\nmodes. E1 carries the deletion.\n\n**The backlog already exists and nobody was reading it.** Deferred work has a\nhome, and it is `goal.json.epics[]`. Each entry carries an `id`, a `branch`,\na `pr`, and a `state`, and an epic with a null branch is work that is planned\nand not started. That is a backlog item. Nothing new is needed to hold one.\n\nSo the three levels are:\n\n| Level | Where it lives | Lifetime |\n|---|---|---|\n| **Epic** | `goal.json.epics[]` in a design | survives the session, survives the branch |\n| **Slice** | `04-slices.md` for a feature, one line each in build order | survives the session, dies with the feature |\n| **Task** | inside a slice, in the session doing it | dies with the session, deliberately |\n\nA task below slice level is not durable and should not be. A slice is small\nenough that its tasks are the work of one sitting, and writing them down\ncosts more than redoing them.\n\n**The Builds view gains a Backlog lane**, and it is a query rather than a\nfile: every epic with a null branch, plus every slice not yet scored, ranked\nby the count of ADRs that depend on the epic. Nothing authors it, and nothing\ncan go stale against a list it computes.\n\n`plugin-split/goal.json` is now the real list. It held five epics from the\nfirst draft while `02-architecture.md` had grown to eight. It carries all\nnine, including **E8, rendering a thread as a conversation** \u2014 which is the\nanswer to where that deferred work went.\n\n**Rendering a thread as a conversation needs no ADR.** ADR-0019 already\ndecides the reply channel, the record shape, and that `replies_to` exists.\nRendering those replies as a thread is deferred work under that decision, not\na competing option, and a record with no rejected alternative is a task in\nADR clothing. One thing would earn its own record: if the viewer's threads\nand the Artifact platform's threads have to merge into one inbox, that is a\nreal decision with real alternatives. It is not in scope for E6.\n\n## Least confident decisions\n\n1. **`serve_bundle.py` replaces `python3 -m http.server` outright.** A\n   smaller change keeps the stock server for reading and adds the write\n   endpoint only under a flag. That leaves two servers to keep in step. One\n   server with `--allow-write` off by default is simpler and it is still a\n   real application where there used to be none.\n\n2. **Materialised `joins` in `index.json`.** It duplicates what the entities\n   already state, and it goes stale in exactly the same rebuild the entities\n   do, so the duplication costs size rather than correctness. The argument\n   against is that a viewer bug and an index bug now look identical.\n\n3. **pytest through `uv run --with`.** It keeps the no-package-manager\n   constraint and it re-resolves pytest on every run. A slow test command is\n   a test command people skip.\n\n4. **A projection file beside the ledger.** It is a second file that can\n   disagree with the first. The alternative is a fold on every read, which\n   was the earlier draft and which made the common operation the expensive\n   one. Two files with a stated direction of truth is the better trade, and\n   it is the trade `index.json` already makes.\n\n5. **`shared/` as a sibling of `plugins/` rather than duplicated content in\n   git.** Everything rests on the symlink dereference. If E2 finds it does\n   not work for a directory of Python, the fallback is a copy step before\n   publish, and that fallback is a build step in a repo that has none.\n", "04-slices.md": "# Slices: the cobuilder family\n\nGate 4a. One line per slice in build order. Every slice ends in a working,\ntestable state. Every slice declares the epic it advances, which is the join\nGate 3 found missing.\n\nTest command: `uv run --with pytest pytest tests/ -v`\n\nRubrics: `.cobuilder/rubrics/cobuilder-family/slice-N.md`, written before any\nimplementation exists.\n\n## The ladder\n\nSix epics carry fourteen slices. A seventh epic is deferred and carries none.\nAn epic is a body of work that maps to one pull request. A slice is one\nvertical, testable step inside it. This table groups slices under the epic\nthat owns them. Build order does not match table order \u2014 see the note below\nthe table.\n\n| # | Epic | Slice | Ends with |\n|---|---|---|---|\n| | **`plugin-split/E1` \u2014 One plugin becomes five.** The mode renames, the deleted duplicate `explore-design` command, the 33 cross-pillar references, the five manifests, and the two ports. The rename is a rotation, not a split. | | |\n| 4 | | Renames inside today's single plugin | Six architecture modes, `explore-design` deleted, `submit` renamed to `generate`, and the old `generate` renamed to `review` |\n| 5 | | The 33 cross-pillar references are fixed | The grep regression test passes while the repo is still one plugin |\n| 6 | | Five plugins, five manifests | `claude plugin validate` passes on each, and the family installs |\n| 7 | | The two ports land | `cobuilder-implement` renamed and shipped, `collaborate-with-user` folded in, the orientation skill written |\n| | **`plugin-split/E2` \u2014 Shared code survives an install.** Prove the marketplace symlink dereference, then vendor the four bundle modules and the two shared skills. | | |\n| 1 | | **Tracer bullet: two plugins, one shared module** | Two throwaway plugins install from a local marketplace and both resolve the shared module from their own cache |\n| | **`plugin-split/E3` \u2014 The seam is version-safe.** `require_compatible()`, `min_reader_schema`, the generators map, bundle format 3, and schema 1.3. | | |\n| 2 | | The compatibility gate exists | `require_compatible()` and `stamp_generator()` pass their tests, called by nothing yet |\n| 3 | | The gate is wired and the bundle migrates | Format 3, `min_reader_schema`, the generators map, every writer gated |\n| | **`plugin-split/E4` \u2014 The record index.** `build_index.py` replaces the two projection scripts and resolves every join, including an ADR to its pull request. | | |\n| 8 | | The index holds the entities | `build_index.py` emits every entity, and the two scripts it replaces are gone |\n| 9 | | The index resolves the joins | `adr_to_pull_request`, `slice_to_epic`, `district_uncovered`, and freshness |\n| | **`plugin-split/E5` \u2014 One lifecycle surface.** The Decisions, Contexts, and Builds modes, the Backlog lane, and generated pages moved into the bundle. | | |\n| 10 | | The Decisions and Contexts modes | A person browses every decision and every context, with the anchor distinction visible |\n| 11 | | The Builds mode and the Backlog lane | Gates driven by the status document, the Backlog lane computed from the index, pages moved into the bundle |\n| | **`plugin-split/E6` \u2014 The reply channel.** The append-only ledger and its projection, the anchor computed from the live DOM, the write endpoint, and the background wake command. | | |\n| 12 | | The ledger and its projection | Append, fold, and project, with no server involved |\n| 13 | | The anchor and the write endpoint | Click to anchor a sentence, `POST /feedback` appends, the drawer keeps the text in view |\n| 14 | | The wake command and the whole loop | The background command blocks and returns new threads, and the loop runs once end to end |\n| | **`plugin-split/E7` \u2014 Threads read as conversations.** The drawer renders a reply under the comment it answers. Deferred, and carries no slice yet. | | |\n\nEvery epic header row carries the scoped id `<design>/<epic-id>`, not the\nbare `E1`. Three designs in this repository each name an epic `E1`, so a bare\nid does not identify one. A reader and a script must both resolve it without\nguessing.\n\nBuild order is slice 1 first, then 2 and 3, then 4 through 7, then 8 through\n14. This is not the table order above. The table groups slices by the epic\nthey advance, and the build runs slices 2 and 3 (`E3`) before slices 4\nthrough 7 (`E1`).\n\n**E2 carries one slice on purpose.** It is a spike, not a feature. Its whole\njob is to answer a question that `goal.json.abort_if` says can stop the\nbuild, and a spike that needs a second slice is no longer a spike.\n\n## Why this order\n\n**Slice 1 is the tracer bullet and it is also the riskiest thing in the\nbuild.** ADR-0017 rests on a symlink dereference that nobody has run, and\n`goal.json.abort_if` names that failure as a reason to stop. Two throwaway\nplugins that print a constant prove the mechanism in an afternoon. Everything\nafter slice 1 assumes it works, so it goes first and alone.\n\n**Slices 2 through 5 stay inside today's single plugin.** The compatibility\ngate, the renames, and the 33 references are all changes that can land, be\ntested, and be merged before the directory split makes every path move.\nDoing them after the split would mean debugging a rename and a packaging\nchange in the same diff.\n\n**Slice 5 before slice 6, deliberately.** The regression test that proves no\ncross-pillar reference survives is written and passing while the repo is\nstill one plugin. It then guards the split rather than reporting on it.\n\n**Slices 8 through 11 are vertical, not horizontal.** Slice 8 ships entities\nwith no joins and a viewer that reads them, so there is something to look at.\nSlice 9 adds the joins. Slice 10 adds the two modes that read them, and slice\n11 adds the mode that needs the joins most. Building all of the index, then\nall of the viewer, is the banned shape.\n\n**The Backlog lane is a required part of slice 11, not polish.** It is the\none place a person sees what is planned and not started, and it is a query\nrather than a file: every epic with a null branch, plus every slice not yet\nscored. A Builds view without it shows only what is finished, which is the\nhalf a person does not need to plan from. This slice also proves the epic to\nslice join, because the lane cannot be built without it.\n\n**Slice 12 has no server in it.** The ledger, the fold, and the projection\nare file operations and they are testable without HTTP. Slice 13 adds the\nserver and the anchor, and slice 14 adds the wake command. Splitting here\nkeeps the one slice that changes what `view` mode *is* as small as it can be,\nand it keeps the end-to-end run as its own acceptance step.\n\n## Out of scope for every slice\n\n- Rendering a thread as a conversation. That is E7.\n- Merging viewer threads with the Artifact platform's threads into one inbox.\n  Gate 3 records that this would need its own ADR.\n- Any change to the corpus, the Gemini art pipeline, or the audio pipeline.\n- `--format notion`. It stays a reserved flag value with nothing behind it.\n\n## Escalation\n\n`max_attempts: 3` per slice, then escalate rather than loop. An escalated\nslice is recorded in `00-status.md` with the reason and the follow-up, and it\nis never silently accepted below threshold.\n", "rubric-1": "# Rubric: Slice 1 \u2014 tracer bullet: two plugins, one shared module\n\nFeature: cobuilder-family\nEpic: plugin-split/E2\nSlice goal: Two throwaway plugins install from a local marketplace and both resolve `shared/_bundle_meta.py` from their own cache.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 A local marketplace installs two sibling plugins [CRITICAL]\n**Must be true:** A person adds the marketplace from a local path and installs both plugins. Neither is nested inside the other.\n**Evidence to check:**\n- `claude plugin validate` on each plugin directory, exit 0.\n- The installed cache holds two separate plugin directories.\n**Scoring:**\n- 1.0 \u2014 both install, both validate, neither path contains the other.\n- 0.5 \u2014 one installs, or both install only after a manual step not in the docs.\n- 0.0 \u2014 the marketplace does not resolve, or a plugin fails to install.\n\n### C2 \u2014 The shared module resolves from each plugin's own cache [CRITICAL]\n**Must be true:** Each installed plugin reads `shared/_bundle_meta.py` through its own `${CLAUDE_PLUGIN_ROOT}` and prints `SCHEMA_VERSION`. Neither reads the marketplace source tree, and neither reads the other's cache.\n**Evidence to check:**\n- Run each plugin's command. Both print the same version string.\n- Delete or rename the marketplace source directory, then run both again. Both still work.\n**Scoring:**\n- 1.0 \u2014 both print the version, and both survive the source directory going away.\n- 0.5 \u2014 both print the version while the source tree is present, and one fails once it is gone. This is the copy-not-happening failure and it must be reported, not rounded up.\n- 0.0 \u2014 either plugin cannot resolve the module.\n\n### C3 \u2014 The symlink dereference is proved for a directory, not a file\n**Must be true:** `shared/` holds more than one Python module and at least one nested directory, and every file arrives in each cache.\n**Evidence to check:** List the installed cache for each plugin and compare against `shared/`.\n**Scoring:** 1.0 \u2014 every file present in both. 0.5 \u2014 the top level copies and a nested directory does not. 0.0 \u2014 nothing copies.\n\n### C4 \u2014 The result is written down where the next slice will read it\n**Must be true:** The outcome, including a failure, is recorded in `00-status.md`.\n**Evidence to check:** Read `docs/plans/cobuilder-family/00-status.md`.\n**Scoring:** 1.0 \u2014 the outcome and the exact commands are recorded. 0.5 \u2014 an outcome with no commands. 0.0 \u2014 nothing recorded.\n\n## Regression check\n- No existing script, skill, or command changes in this slice.\n- The throwaway plugins live outside the shipped tree and are removed or clearly marked before slice 6.\n\n## Out of scope \u2014 do not penalise\n- Any real plugin content. These two plugins print a constant and nothing else.\n- `require_compatible()`, the index, the viewer, and the ledger.\n- The copy-before-publish fallback. It is only designed if C2 fails.\n", "rubric-2": "# Rubric: Slice 2 \u2014 the compatibility gate exists\n\nFeature: cobuilder-family\nEpic: plugin-split/E3\nSlice goal: `require_compatible()` and `stamp_generator()` pass their tests, called by nothing yet.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 A bundle that demands a newer reader is refused [CRITICAL]\n**Must be true:** Writing into a bundle whose `min_reader_schema` exceeds the running code's `SCHEMA_VERSION` raises, rather than writing and corrupting.\n**Evidence to check:** `pytest tests/ -k require_compatible -v`, and read the raising branch.\n**Scoring:** 1.0 \u2014 raises a named exception with the two versions in the message. 0.5 \u2014 raises a bare exception, or warns and continues. 0.0 \u2014 writes anyway.\n\n### C2 \u2014 A newer bundle format is refused\n**Must be true:** A `bundle_format` above the running code's is refused on the same path.\n**Evidence to check:** The matching test.\n**Scoring:** 1.0 \u2014 refused. 0.5 \u2014 refused only in one of the two code paths. 0.0 \u2014 accepted.\n\n### C3 \u2014 A new bundle is not treated as incompatible\n**Must be true:** A missing `bundle.json` means a new bundle and passes.\n**Evidence to check:** The matching test.\n**Scoring:** 1.0 \u2014 passes silently. 0.5 \u2014 passes with a spurious warning. 0.0 \u2014 raises.\n\n### C4 \u2014 Recording one plugin's version does not drop another's\n**Must be true:** Stamping as one plugin preserves every other entry in the generators map.\n**Evidence to check:** The matching test, with two plugins already present.\n**Scoring:** 1.0 \u2014 both survive. 0.5 \u2014 order or formatting churns but both survive. 0.0 \u2014 an entry is lost.\n\n## Regression check\n- Every test that passed before this slice still passes.\n- No caller is changed. Scope is the shared version module and its tests.\n\n## Out of scope \u2014 do not penalise\n- Wiring the gate into the existing writers. That is slice 3.\n- The migration ladder and `min_reader_schema` being written anywhere real.\n", "rubric-3": "# Rubric: Slice 3 \u2014 the gate is wired and the bundle migrates\n\nFeature: cobuilder-family\nEpic: plugin-split/E3\nSlice goal: Format 3, `min_reader_schema`, the generators map, and every writer gated.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 Every script that writes into a bundle calls the gate first [CRITICAL]\n**Must be true:** No writer stamps a schema version without checking compatibility. The three that do so today are named in `03-program-design.md`.\n**Evidence to check:** The static test that scans each writer, plus a read of each call site.\n**Scoring:** 1.0 \u2014 every writer gated, and the test fails when a call is removed. 0.5 \u2014 writers gated but no test guards it. 0.0 \u2014 a writer still stamps unchecked.\n\n### C2 \u2014 An existing bundle migrates without losing authored content [CRITICAL]\n**Must be true:** A real bundle from before this change steps to format 3, and every authored field is byte-identical afterwards.\n**Evidence to check:** Run the migration against a copy of the committed self-bundle. Diff the authored fields before and after.\n**Scoring:** 1.0 \u2014 layout and schema step forward, authored fields unchanged, a backup exists. 0.5 \u2014 correct result with no backup written. 0.0 \u2014 an authored field changes, or the run half-writes.\n\n### C3 \u2014 The scalar generator version becomes a map\n**Must be true:** The single generator string is replaced by a map keyed by plugin, and the old value is preserved as the first entry rather than discarded.\n**Evidence to check:** The migration test, and the migrated `bundle.json`.\n**Scoring:** 1.0 \u2014 preserved and keyed correctly. 0.5 \u2014 map created, old value dropped. 0.0 \u2014 field unchanged or removed.\n\n### C4 \u2014 A migration that touches an unexpected authored field stops before writing\n**Must be true:** The existing authored-field guard still holds at the new version, and a violation writes nothing at all.\n**Evidence to check:** The guard test, driven by a deliberately bad migration step.\n**Scoring:** 1.0 \u2014 nothing reaches disk. 0.5 \u2014 it writes then reports. 0.0 \u2014 it writes silently.\n\n### C5 \u2014 The viewer copy refreshes unconditionally\n**Must be true:** The viewer refresh is not gated on a version check.\n**Evidence to check:** Read the migration entry point, and the test that asserts a refresh at an unchanged version.\n**Scoring:** 1.0 \u2014 unconditional and tested. 0.5 \u2014 unconditional and untested. 0.0 \u2014 behind a version gate.\n\n## Regression check\n- Every bundle in the repo still passes verification after migrating.\n- The three committed bundles are migrated, not regenerated.\n\n## Out of scope \u2014 do not penalise\n- Any rename, any directory split, the index, the viewer modes, and the ledger.\n", "rubric-4": "# Rubric: Slice 4 \u2014 renames inside today's single plugin\n\nFeature: cobuilder-family\nEpic: plugin-split/E1\nSlice goal: Six architecture modes, `explore-design` deleted, and the pull-request modes rotated.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 Every command still dispatches to something that exists [CRITICAL]\n**Must be true:** Every command file names a skill and a mode the skill actually handles.\n**Evidence to check:** The test that reads each command file, extracts the skill and mode, and checks the skill declares it.\n**Scoring:** 1.0 \u2014 all resolve and the test guards it. 0.5 \u2014 all resolve, no test. 0.0 \u2014 a command names a mode nothing handles.\n\n### C2 \u2014 The duplicate command is gone and its behaviour is not [CRITICAL]\n**Must be true:** `explore-design` no longer exists as a user-facing command, and divergent exploration still runs as a stage inside Design mode.\n**Evidence to check:** The command file is deleted. Read Design mode's procedure for the exploration stage.\n**Scoring:** 1.0 \u2014 deleted, and the stage is still named in the procedure. 0.5 \u2014 deleted, and the stage reference went with it. 0.0 \u2014 still a command.\n\n### C3 \u2014 No document claims a count that is now wrong\n**Must be true:** Every place that counts the architecture modes says six.\n**Evidence to check:** Grep the repo for the mode counts in prose.\n**Scoring:** 1.0 \u2014 every count correct. 0.5 \u2014 one stale count. 0.0 \u2014 several.\n\n### C4b \u2014 The rename is a rotation and nothing is lost [CRITICAL]\n**Must be true:** `submit` becomes `generate`, and the old `generate`, which narrates merged history, becomes `review`. The word `generate` therefore means one thing before the change and a different thing after it. Every procedure, command, and citation ends up pointing at the mode that does the work it describes.\n**Evidence to check:** Open the new `generate` and confirm it interviews the author, assesses the change, writes the narrative, and opens the pull request. Open the new `review` and confirm it narrates merged history. Grep for every mention of both words and check each one against the meaning it now needs.\n**Scoring:**\n- 1.0 \u2014 both modes do the right work and every citation points at the right one.\n- 0.5 \u2014 the modes are correct and at least one citation still means the old sense of `generate`, which is the exact trap this rotation sets.\n- 0.0 \u2014 a mode was split, dropped, or renamed to something the plan does not name.\n\n### C4 \u2014 A rename does not silently change behaviour\n**Must be true:** A renamed mode does the same work it did before, and any behaviour change is deliberate and written down.\n**Evidence to check:** Diff each renamed procedure against its previous version.\n**Scoring:** 1.0 \u2014 renames only, or a change recorded in the plan. 0.5 \u2014 an undocumented small change. 0.0 \u2014 a behaviour change nobody recorded.\n\n## Regression check\n- The repo is still one plugin at the end of this slice.\n- No path in `scripts/` changes.\n\n## Out of scope \u2014 do not penalise\n- The 33 cross-pillar references. That is slice 5.\n- Any directory split.\n", "rubric-5": "# Rubric: Slice 5 \u2014 the 33 cross-pillar references are fixed\n\nFeature: cobuilder-family\nEpic: plugin-split/E1\nSlice goal: The grep regression test passes on a repo that is still one plugin.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 No reference crosses a pillar [CRITICAL]\n**Must be true:** No file under one pillar's skill directory resolves a path into another pillar's skill directory.\n**Evidence to check:** The regression test that scans for cross-pillar paths, run against the whole repo.\n**Scoring:** 1.0 \u2014 zero found and the test guards it. 0.5 \u2014 zero found, no test. 0.0 \u2014 any remain.\n\n### C2 \u2014 The test tells a vendored reference apart from a cross-pillar one [CRITICAL]\n**Must be true:** A reference to a vendored shared skill passes. A reference to the other pillar fails. `02-architecture.md` records five of the first kind.\n**Evidence to check:** Feed the test one of each and check the verdicts.\n**Scoring:** 1.0 \u2014 both verdicts correct. 0.5 \u2014 it flags the safe five as well, which makes it noise. 0.0 \u2014 it passes a real cross-pillar reference.\n\n### C3 \u2014 A runtime reference is replaced, not deleted\n**Must be true:** The two references that resolve at runtime still reach their content after the fix, by vendoring, by inlining, or by a documented drop.\n**Evidence to check:** Read both call sites and follow what they now point at.\n**Scoring:** 1.0 \u2014 both reach real content. 0.5 \u2014 one is dropped with no note. 0.0 \u2014 a procedure now cites nothing.\n\n### C4 \u2014 A prose citation that only goes stale is fixed too\n**Must be true:** The prose references are corrected, not left because they do not break at runtime.\n**Evidence to check:** Count what the scan reports before and after.\n**Scoring:** 1.0 \u2014 all fixed. 0.5 \u2014 the runtime ones only. 0.0 \u2014 the count is unchanged.\n\n## Regression check\n- The repo is still one plugin and every command still works.\n- No procedure loses a step to make a reference disappear.\n\n## Out of scope \u2014 do not penalise\n- The directory split. This slice fixes references while everything still lives together.\n", "rubric-6": "# Rubric: Slice 6 \u2014 five plugins, five manifests\n\nFeature: cobuilder-family\nEpic: plugin-split/E1\nSlice goal: `claude plugin validate` passes on each, and the family installs.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 Each plugin validates and installs alone [CRITICAL]\n**Must be true:** Each of the five installs from the marketplace on its own and its commands appear.\n**Evidence to check:** Validate each manifest. Install each alone into a clean cache and list its commands.\n**Scoring:** 1.0 \u2014 all five. 0.5 \u2014 four. 0.0 \u2014 any fails to validate, or one needs another to install.\n\n### C2 \u2014 The umbrella plugin brings the other four [CRITICAL]\n**Must be true:** Installing the full-lifecycle plugin installs the other four through its dependency list.\n**Evidence to check:** Install it into a clean cache and list what arrived.\n**Scoring:** 1.0 \u2014 all four arrive. 0.5 \u2014 they arrive after a manual step. 0.0 \u2014 the dependency list does nothing.\n\n### C3 \u2014 The install surface is unchanged\n**Must be true:** No plugin ships an agent, a hook, or an MCP server.\n**Evidence to check:** Read all five manifests and scan each plugin tree.\n**Scoring:** 1.0 \u2014 none present. 0.0 \u2014 any present. There is no half credit on this one.\n\n### C4 \u2014 Each plugin carries its own copy of what it shares\n**Must be true:** Each installed cache holds a real copy of the shared modules and the shared skills. No cache reaches outside itself.\n**Evidence to check:** List each cache. Rename the marketplace source and re-run one command per plugin.\n**Scoring:** 1.0 \u2014 every cache self-contained. 0.5 \u2014 self-contained only while the source tree exists. 0.0 \u2014 a plugin reads outside its root.\n\n### C5 \u2014 Two plugins can be different versions without corrupting a bundle\n**Must be true:** An older plugin and a newer one against the same bundle produce a refusal rather than a bad write.\n**Evidence to check:** Set an older version constant in one cache and run it against a newer bundle.\n**Scoring:** 1.0 \u2014 refused with a clear message. 0.5 \u2014 refused with an unclear one. 0.0 \u2014 it writes.\n\n### C6 \u2014 The temporary command name from slice 4 is undone [CRITICAL]\n**Must be true:** `cobuilder-pr` ships `commands/review.md`, and no command file anywhere is named `odyssey-review.md`. Slice 4 used that name only because one `commands/` directory cannot hold two files named `review.md`. The split removes the collision, so the workaround must go with it.\n**Evidence to check:** List every command file of every plugin. Confirm `cobuilder-architect` and `cobuilder-pr` each carry their own `review.md`, and that both resolve as separate commands.\n**Scoring:**\n- 1.0 \u2014 both plugins carry `review.md`, and `odyssey-review` exists nowhere.\n- 0.5 \u2014 the file is renamed and a document still refers to `odyssey-review`.\n- 0.0 \u2014 the workaround ships.\n\n*Added during the build, on 2026-08-21, after slice 4 surfaced the collision. Recorded here rather than fixed silently, so the rubric stays the record of what is required.*\n\n## Regression check\n- Every bundle in the repo still verifies.\n- Every command that worked at slice 5 still works.\n\n## Out of scope \u2014 do not penalise\n- The index, the viewer modes, and the ledger.\n- The `cobuilder-implement` port. That is slice 7.\n", "rubric-7": "# Rubric: Slice 7 \u2014 the two ports land\n\nFeature: cobuilder-family\nEpic: plugin-split/E1\nSlice goal: `cobuilder-implement` renamed and shipped, `collaborate-with-user` folded in, and the orientation skill written.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 The build skill ships as a plugin and runs its own gates [CRITICAL]\n**Must be true:** The personal skill is now an installed plugin under its new name, and running it on a small change produces the four gate documents and the rubrics.\n**Evidence to check:** Install it alone. Run it on a one-file change and list what it wrote.\n**Scoring:** 1.0 \u2014 four gate documents and one rubric per slice. 0.5 \u2014 the documents, no rubrics. 0.0 \u2014 it does not run from the installed copy.\n\n### C2 \u2014 The old name survives nowhere except as recorded lineage\n**Must be true:** No path, command, or procedure uses the old name. One lineage note may keep it, marked as history.\n**Evidence to check:** Grep the repo for the old name.\n**Scoring:** 1.0 \u2014 only the lineage note. 0.5 \u2014 one or two stale mentions. 0.0 \u2014 paths or commands still carry it.\n\n### C3 \u2014 The presentation skill is folded in, not bolted on [CRITICAL]\n**Must be true:** Its rules live inside the artifact plugin's own skill and references, and it is not a separate skill directory. The established skill-authoring practice was followed.\n**Evidence to check:** Read the artifact plugin's skill and references. Confirm the honesty rule, the theme-token rules, and the composition rules all survive.\n**Scoring:** 1.0 \u2014 folded in with every rule intact. 0.5 \u2014 folded in with a rule lost. 0.0 \u2014 still a separate skill, or rules dropped without a note.\n\n### C4 \u2014 The orientation skill routes rather than duplicates\n**Must be true:** The umbrella plugin's skill names each mode and when to reach for it, and it does not restate another plugin's procedure.\n**Evidence to check:** Read it. Check every mode it names exists.\n**Scoring:** 1.0 \u2014 every mode named and correct, no duplication. 0.5 \u2014 a named mode does not exist. 0.0 \u2014 it copies another plugin's procedure.\n\n## Regression check\n- Every plugin still validates and installs.\n- No page or report changes appearance because a rule was lost in the fold.\n\n## Out of scope \u2014 do not penalise\n- Moving pages out of `.lavish/`. That is slice 10.\n- Any index or ledger work.\n", "rubric-8": "# Rubric: Slice 8 \u2014 the index holds the entities\n\nFeature: cobuilder-family\nEpic: plugin-split/E4\nSlice goal: The index builder emits every entity, and the two scripts it replaces are gone.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 Every entity type appears with a stable id [CRITICAL]\n**Must be true:** Decisions, designs, epics, contexts, districts, boundary rules, pull requests, slices, and publications all appear, each with the id the program design specifies.\n**Evidence to check:** Build the index against this repo. Count each type against the source directories.\n**Scoring:** 1.0 \u2014 every type present and every count matches. 0.5 \u2014 one type missing or one count off. 0.0 \u2014 several missing.\n\n### C2 \u2014 An epic id is scoped to its design [CRITICAL]\n**Must be true:** Two designs that both name an epic `E1` produce two distinct ids.\n**Evidence to check:** The test with two such designs.\n**Scoring:** 1.0 \u2014 distinct. 0.0 \u2014 collide. No half credit; a collision silently merges records.\n\n### C3 \u2014 The build is a full rebuild\n**Must be true:** Deleting a source document and rebuilding removes it from the index.\n**Evidence to check:** The matching test.\n**Scoring:** 1.0 \u2014 removed. 0.5 \u2014 removed only after deleting the index first. 0.0 \u2014 it lingers.\n\n### C4 \u2014 The two replaced scripts are gone, not left beside it\n**Must be true:** The decision and design projection scripts are deleted, and nothing calls them.\n**Evidence to check:** The files are absent. Grep for callers.\n**Scoring:** 1.0 \u2014 deleted, no callers. 0.5 \u2014 deleted, a stale caller remains. 0.0 \u2014 still present.\n\n### C5 \u2014 The viewer reads the index and still renders\n**Must be true:** The existing viewer modes work from the new projection.\n**Evidence to check:** Serve a bundle and open the existing modes.\n**Scoring:** 1.0 \u2014 unchanged behaviour. 0.5 \u2014 one mode degraded. 0.0 \u2014 the viewer breaks.\n\n### C6 \u2014 Nothing is written into the authored tree\n**Must be true:** The builder reads the authored documents and writes only into the bundle.\n**Evidence to check:** The test that builds and then checks the authored tree is untouched.\n**Scoring:** 1.0 \u2014 untouched. 0.0 \u2014 anything written.\n\n## Regression check\n- Every existing viewer mode behaves as it did.\n- Every bundle still verifies.\n\n## Out of scope \u2014 do not penalise\n- The joins, the freshness block, and the three new modes. Those are slices 9 and 10.\n", "rubric-9": "# Rubric: Slice 9 \u2014 the index resolves the joins\n\nFeature: cobuilder-family\nEpic: plugin-split/E4\nSlice goal: Every join resolves, freshness is recorded, and uncovered districts are listed.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 A decision reaches its pull request by both paths [CRITICAL]\n**Must be true:** A record that names its source pull request resolves directly. A record that does not resolves through its design, its epic, and that epic's branch.\n**Evidence to check:** The two tests, plus the resolved join for a real record in this repo.\n**Scoring:** 1.0 \u2014 both paths work and the result records which one was used. 0.5 \u2014 the direct path only. 0.0 \u2014 neither resolves, or the indirect one guesses from touched files.\n\n### C2 \u2014 An unstarted epic is reported unstarted, not missing [CRITICAL]\n**Must be true:** An epic with no branch produces no pull request and no error, and the index says it has not started.\n**Evidence to check:** The matching test, against the nine epics in this repo, eight of which have no branch.\n**Scoring:** 1.0 \u2014 reported as unstarted. 0.5 \u2014 silently absent. 0.0 \u2014 an error, or a wrong pull request attached.\n\n### C3 \u2014 A district reaches a context, and an uncovered one is listed\n**Must be true:** A boundary record's declared districts resolve both ways, and every district no context covers appears in the uncovered list.\n**Evidence to check:** The two tests, plus the real list for this repo.\n**Scoring:** 1.0 \u2014 both directions resolve and the uncovered list is correct. 0.5 \u2014 one direction. 0.0 \u2014 no join.\n\n### C4 \u2014 A slice reaches its epic\n**Must be true:** Every slice declares an epic and the join resolves.\n**Evidence to check:** The test that every slice line names an epic that exists.\n**Scoring:** 1.0 \u2014 every slice joins. 0.5 \u2014 the join exists but a slice is unassigned. 0.0 \u2014 no join.\n\n### C4b \u2014 No join is resolved by a heuristic [CRITICAL]\n**Must be true:** Every join reads an identifier the source states. No join guesses, scores, or matches on prose similarity. When a source is ambiguous, the builder reports the join as unresolved and names the ambiguity.\n**Evidence to check:** Read the resolution code for each join. Look for any comparison of words, any similarity score, and any fallback that picks the most likely candidate. Feed the builder a slice whose epic id is bare rather than scoped, and confirm it refuses rather than choosing.\n**Scoring:**\n- 1.0 \u2014 every join reads a stated identifier, and an ambiguous source produces an unresolved join with a named reason.\n- 0.5 \u2014 the joins resolve correctly today, and one path falls back to a guess when the identifier is missing.\n- 0.0 \u2014 a join resolves by matching prose.\n\n*Added during the build, on 2026-08-22. The epic-first restructure of `04-slices.md` dropped the scoped epic id and left a bare `E1`, which three designs share. That ambiguity forced the first implementation into a word-overlap match. The source is now fixed to carry the scoped id, and this criterion exists so the guess does not survive the fix.*\n\n### C5 \u2014 Staleness is detected on both signals\n**Must be true:** Changing an authored document marks the index stale. Moving the git head does too.\n**Evidence to check:** The two tests.\n**Scoring:** 1.0 \u2014 both. 0.5 \u2014 one. 0.0 \u2014 neither.\n\n## Regression check\n- Every entity from slice 8 is still present with the same id.\n- The build is still a full rebuild.\n\n## Out of scope \u2014 do not penalise\n- Rendering any of this. That is slice 10.\n", "rubric-10": "# Rubric: Slice 10 \u2014 the Decisions and Contexts modes\n\nFeature: cobuilder-family\nEpic: plugin-split/E5\nSlice goal: A person browses every decision and every context, with the anchor distinction visible.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 A person browses the decisions rather than stumbles on one [CRITICAL]\n**Must be true:** The Decisions mode lists every record with its state and what it anchors to, including any record no change happens to cite.\n**Evidence to check:** Serve a bundle. Count the rows against the record count. Confirm the record with no inbound reference is present.\n**Scoring:** 1.0 \u2014 every record listed, including the unreferenced one. 0.5 \u2014 the referenced ones only, which reproduces today's problem. 0.0 \u2014 records missing.\n\n### C2 \u2014 The anchor column shows which joins resolve and which do not [CRITICAL]\n**Must be true:** A record resolving to a verified context is visibly distinct from one resolving only to an inferred district.\n**Evidence to check:** Open the mode against this repo, where the split between the two is uneven and visible.\n**Scoring:** 1.0 \u2014 the two states are distinct at a glance. 0.5 \u2014 the anchor is shown without distinguishing them. 0.0 \u2014 no anchor column, which makes it a list without the point.\n\n### C3 \u2014 Contexts leads with the violations\n**Must be true:** Boundary violations appear first, each marked as a decision candidate, and the districts no context covers are listed.\n**Evidence to check:** Open the Contexts mode against the context in this repo, which records seven findings.\n**Scoring:** 1.0 \u2014 violations first, marked, uncovered districts listed. 0.5 \u2014 rendered but not led with. 0.0 \u2014 violations not shown.\n\n### C4 \u2014 A boundary record reads as rules, not as raw configuration\n**Must be true:** The boundary record renders as a readable rule list rather than as its file format.\n**Evidence to check:** Open a context and read it.\n**Scoring:** 1.0 \u2014 readable rules with their reasons. 0.5 \u2014 the raw file, pretty-printed. 0.0 \u2014 not rendered.\n\n### C5 \u2014 Both modes are reachable and the current one is obvious\n**Must be true:** A person can tell which mode they are in and reach the other in one action.\n**Evidence to check:** Switch between every mode present at this slice.\n**Scoring:** 1.0 \u2014 obvious and one action. 0.5 \u2014 reachable, current mode unclear. 0.0 \u2014 a mode is unreachable.\n\n## Regression check\n- The existing modes behave as they did.\n- Every join from slice 9 still resolves.\n\n## Out of scope \u2014 do not penalise\n- The Builds mode, the Backlog lane, and moving pages. Those are slice 11.\n- Commenting and anchoring. Those are slices 12 to 14.\n", "rubric-11": "# Rubric: Slice 11 \u2014 the Builds mode and the Backlog lane\n\nFeature: cobuilder-family\nEpic: plugin-split/E5\nSlice goal: Gates driven by the status document, the Backlog lane computed from the index, and pages moved into the bundle.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 The Backlog lane shows what is planned and not started [CRITICAL]\n**Must be true:** The Builds mode carries a Backlog lane holding every epic with no branch and every slice not yet scored. Each epic shows what it is, not only its id, and the slices that advance it.\n**Evidence to check:** Open the Builds mode against this repo. Confirm the epic count against `goal.json`. Confirm an epic with no slice is shown as deferred rather than omitted.\n**Scoring:** 1.0 \u2014 correct count, each epic legible, its slices listed, the deferred one visible. 0.5 \u2014 present but showing ids without their work, which is the failure this slice exists to fix. 0.0 \u2014 absent.\n\n### C2 \u2014 The lane is computed, not authored [CRITICAL]\n**Must be true:** The lane is a query over the index. No authored backlog file feeds it, and adding an epic to a design makes it appear with no other edit.\n**Evidence to check:** Grep for any backlog document. Add an epic to a design, rebuild, and open the mode.\n**Scoring:** 1.0 \u2014 computed, and a new epic appears with no other edit. 0.5 \u2014 computed from a file that a person maintains. 0.0 \u2014 the list is authored.\n\n### C3 \u2014 Builds is driven by the status document, not showing it\n**Must be true:** Approval marks and slice scores are chrome derived from the status document, and that document is not rendered as a panel of its own.\n**Evidence to check:** Open the Builds mode and check the gate rail against the real states.\n**Scoring:** 1.0 \u2014 driven and correct at every gate. 0.5 \u2014 driven, one state wrong. 0.0 \u2014 shown as a document.\n\n### C4 \u2014 The epic to slice join is proved by being used\n**Must be true:** The lane lists the slices under each epic, taken from the declared join rather than guessed from the files a slice touches.\n**Evidence to check:** Change one slice's declared epic, rebuild, and confirm it moves.\n**Scoring:** 1.0 \u2014 it moves. 0.5 \u2014 the grouping is hardcoded. 0.0 \u2014 no grouping.\n\n### C5 \u2014 Pages live in the bundle, not in a foreign tool's directory\n**Must be true:** Generated pages are written under the bundle, the existing pages have moved, and their published addresses still work.\n**Evidence to check:** List the bundle page directory. Confirm nothing writes to the old location. Republish one page and confirm the address is unchanged.\n**Scoring:** 1.0 \u2014 moved and an address preserved. 0.5 \u2014 moved and an address lost. 0.0 \u2014 still writing to the old location.\n\n### C6 \u2014 Five modes stay navigable\n**Must be true:** With all five present, a person can tell which mode they are in and reach any other in one action.\n**Evidence to check:** Switch between all five.\n**Scoring:** 1.0 \u2014 obvious and one action. 0.5 \u2014 reachable, current mode unclear. 0.0 \u2014 a mode is unreachable.\n\n## Regression check\n- The Decisions and Contexts modes from slice 10 behave as they did.\n- Publishing a page still produces a working page.\n\n## Out of scope \u2014 do not penalise\n- Ranking the lane by dependent decision count. Slice-count ranking is acceptable here, and the richer ranking is a later refinement.\n- Commenting and anchoring. Those are slices 12 to 14.\n", "rubric-12": "# Rubric: Slice 12 \u2014 the ledger and its projection\n\nFeature: cobuilder-family\nEpic: plugin-split/E6\nSlice goal: Append, fold, and project, with no server involved.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 A read never deletes [CRITICAL]\n**Must be true:** Reading the ledger, folding a thread, and building the projection all leave the file byte-identical.\n**Evidence to check:** The test that hashes the ledger before and after each read path.\n**Scoring:** 1.0 \u2014 identical after all three. 0.0 \u2014 any read changes it. No half credit; this is the whole reason the record exists.\n\n### C2 \u2014 An append never rewrites an earlier line [CRITICAL]\n**Must be true:** Appending leaves every earlier line untouched, and two appends that race both survive intact.\n**Evidence to check:** The concurrency test, and a diff of the earlier lines.\n**Scoring:** 1.0 \u2014 both survive, earlier lines untouched. 0.5 \u2014 sequential appends are safe and the concurrent case interleaves. 0.0 \u2014 a line is lost or rewritten.\n\n### C3 \u2014 The current state is a lookup, and the history is still there\n**Must be true:** The projection gives a thread's state in one lookup, and it records who moved it and when. The transitions remain readable in the ledger.\n**Evidence to check:** The projection test, plus a read of a thread with two transitions.\n**Scoring:** 1.0 \u2014 the lookup is correct and the history is intact. 0.5 \u2014 the lookup works and the actor or the time is missing. 0.0 \u2014 the state is only recoverable by folding.\n\n### C4 \u2014 The projection is disposable\n**Must be true:** Deleting the projection and appending once rebuilds it correctly from the ledger.\n**Evidence to check:** The matching test.\n**Scoring:** 1.0 \u2014 rebuilt and identical. 0.5 \u2014 rebuilt and incomplete. 0.0 \u2014 it does not rebuild.\n\n### C5 \u2014 A comment falls under the guard that protects irreplaceable content\n**Must be true:** The migration guard covers the ledger from this slice onward, so no migration can regenerate over it.\n**Evidence to check:** The guard test with a migration that tries to touch the ledger.\n**Scoring:** 1.0 \u2014 refused before writing. 0.5 \u2014 warned. 0.0 \u2014 allowed.\n\n### C6 \u2014 An agent reply is a record, not a chat message\n**Must be true:** A reply carries an author of agent and names the thread it answers, and folding places it under that thread in append order.\n**Evidence to check:** The matching test.\n**Scoring:** 1.0 \u2014 both fields present and the fold is ordered. 0.5 \u2014 present, unordered. 0.0 \u2014 a reply cannot be told from a root comment.\n\n## Regression check\n- Every bundle still verifies.\n- The view server is unchanged in this slice.\n\n## Out of scope \u2014 do not penalise\n- The write endpoint, the click-to-anchor drawer, and the background wake command. Those are slices 13 and 14.\n- Rendering replies as a conversation. That is E7, a backlog epic. A flat list is correct here.\n", "rubric-13": "# Rubric: Slice 13 \u2014 the anchor and the write endpoint\n\nFeature: cobuilder-family\nEpic: plugin-split/E6\nSlice goal: Click to anchor a sentence, `POST /feedback` appends, and the drawer keeps the text in view.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 A reader points at one sentence, not a whole section [CRITICAL]\n**Must be true:** Clicking an element, or selecting part of one, produces an anchor holding a selector, the selection range, and the quoted text. Nothing was tagged when the page was built.\n**Evidence to check:** Comment on a mid-paragraph selection in a served bundle and read the stored record.\n**Scoring:** 1.0 \u2014 all three parts stored and the quote matches the selection. 0.5 \u2014 element-level only, with no partial selection. 0.0 \u2014 still whole-section, or the page needed build-time tags.\n\n### C2 \u2014 The reader sees the text while writing about it [CRITICAL]\n**Must be true:** The drawer opens on the click with the target already anchored, and the page shifts rather than being covered.\n**Evidence to check:** Open a bundle, click a paragraph, and confirm the drawer and that paragraph are visible together.\n**Scoring:** 1.0 \u2014 opens on the click and the text stays visible. 0.5 \u2014 opens on the click and covers the text. 0.0 \u2014 still a keyboard-only mode.\n\n### C3 \u2014 The server accepts exactly one write and nothing else [CRITICAL]\n**Must be true:** The feedback route appends. Every other write route is rejected. The server binds the loopback address only.\n**Evidence to check:** The route tests and the bind test.\n**Scoring:** 1.0 \u2014 one route, everything else rejected, loopback only. 0.5 \u2014 correct routes, binds a routable address. 0.0 \u2014 another write route exists.\n\n### C4 \u2014 A comment survives with no server\n**Must be true:** With writes disabled the reader still gets local persistence and the markdown hand-off, and is told the thread is local.\n**Evidence to check:** Serve read-only and comment.\n**Scoring:** 1.0 \u2014 falls back and says so. 0.5 \u2014 falls back silently. 0.0 \u2014 the comment is lost.\n\n### C5 \u2014 A stale selector recovers through the quote\n**Must be true:** When a regenerated page moves the anchored element, the comment still shows what it referred to.\n**Evidence to check:** Regenerate a page so the selector no longer matches, then open the thread.\n**Scoring:** 1.0 \u2014 the quote is shown and the thread is marked as needing re-anchoring. 0.5 \u2014 the quote is shown with no marking. 0.0 \u2014 the comment shows nothing.\n\n## Regression check\n- The ledger guarantees from slice 12 hold under the server.\n- Serving for reading works with writes disabled, which stays the default.\n\n## Out of scope \u2014 do not penalise\n- The background wake command and the end-to-end run. Those are slice 14.\n- Rendering replies as a conversation. That is E7.\n", "rubric-14": "# Rubric: Slice 14 \u2014 the wake command and the whole loop\n\nFeature: cobuilder-family\nEpic: plugin-split/E6\nSlice goal: The background command blocks and returns new threads, and the loop runs once end to end.\nTest command: `uv run --with pytest pytest tests/ -v`\n\n## Criteria\n\n### C1 \u2014 The command distinguishes new work from no work [CRITICAL]\n**Must be true:** It blocks until the ledger grows, prints only the new lines, and exits with a different code on a timeout than on new content.\n**Evidence to check:** Two tests, one appending and one timing out.\n**Scoring:** 1.0 \u2014 distinct codes and only new lines printed. 0.5 \u2014 correct output, same exit code. 0.0 \u2014 it does not block, or it reprints the whole file.\n\n### C2 \u2014 It never waits forever\n**Must be true:** A timeout ends the wait, so a session does not hang on a reader who left.\n**Evidence to check:** The timeout test, and a read of the default.\n**Scoring:** 1.0 \u2014 a sane default and an override. 0.5 \u2014 a default with no override. 0.0 \u2014 it can block indefinitely.\n\n### C3 \u2014 Each reader tracks its own place in the ledger\n**Must be true:** Two readers at different offsets both receive the lines they have not seen, and neither consumes the other's.\n**Evidence to check:** The two-reader test.\n**Scoring:** 1.0 \u2014 both receive their own. 0.5 \u2014 the second must start from the beginning. 0.0 \u2014 one reader's read hides lines from the other.\n\n### C4 \u2014 The whole loop runs once, by hand [CRITICAL]\n**Must be true:** A comment made in the viewer reaches the wake command's output with its quote intact, an agent reply is appended, and the projection shows the new state.\n**Evidence to check:** Do it once end to end and record the result, including the commands, in the status document.\n**Scoring:** 1.0 \u2014 done and recorded. 0.5 \u2014 every part passes its own test and nobody ran the whole loop, which is the failure mode this criterion exists for. 0.0 \u2014 the loop does not complete.\n\n## Regression check\n- Every guarantee from slices 12 and 13 still holds.\n- No plugin gained an agent, a hook, or an MCP server to make this work.\n\n## Out of scope \u2014 do not penalise\n- Rendering a thread as a conversation. That is E7.\n- Merging these threads with a published page's own threads. Gate 3 records that this needs its own decision record.\n", "rubric-manifest": "```yaml\nfeature: cobuilder-family\ntest_command: \"uv run --with pytest pytest tests/ -v\"\nthresholds:\n  accept: 0.90\n  investigate: 0.70\nmax_attempts: 3\nepics:\n  - { id: \"plugin-split/E1\", name: \"one plugin becomes five\",        slices: [4, 5, 6, 7] }\n  - { id: \"plugin-split/E2\", name: \"shared code survives an install\", slices: [1] }\n  - { id: \"plugin-split/E3\", name: \"the seam is version-safe\",        slices: [2, 3] }\n  - { id: \"plugin-split/E4\", name: \"the record index\",                slices: [8, 9] }\n  - { id: \"plugin-split/E5\", name: \"one lifecycle surface\",           slices: [10, 11] }\n  - { id: \"plugin-split/E6\", name: \"the reply channel\",               slices: [12, 13, 14] }\n  - { id: \"plugin-split/E7\", name: \"threads read as conversations\",   slices: [] }\nslices:\n  - { id: 1,  name: \"tracer bullet: two plugins, one shared module\", epic: \"plugin-split/E2\", weight: 0.12 }\n  - { id: 2,  name: \"the compatibility gate exists\",                 epic: \"plugin-split/E3\", weight: 0.05 }\n  - { id: 3,  name: \"the gate is wired and the bundle migrates\",     epic: \"plugin-split/E3\", weight: 0.09 }\n  - { id: 4,  name: \"renames inside today's single plugin\",          epic: \"plugin-split/E1\", weight: 0.05 }\n  - { id: 5,  name: \"the 33 cross-pillar references are fixed\",      epic: \"plugin-split/E1\", weight: 0.07 }\n  - { id: 6,  name: \"five plugins, five manifests\",                  epic: \"plugin-split/E1\", weight: 0.11 }\n  - { id: 7,  name: \"the two ports land\",                            epic: \"plugin-split/E1\", weight: 0.07 }\n  - { id: 8,  name: \"the index holds the entities\",                  epic: \"plugin-split/E4\", weight: 0.08 }\n  - { id: 9,  name: \"the index resolves the joins\",                  epic: \"plugin-split/E4\", weight: 0.08 }\n  - { id: 10, name: \"the Decisions and Contexts modes\",              epic: \"plugin-split/E5\", weight: 0.06 }\n  - { id: 11, name: \"the Builds mode and the Backlog lane\",          epic: \"plugin-split/E5\", weight: 0.07 }\n  - { id: 12, name: \"the ledger and its projection\",                 epic: \"plugin-split/E6\", weight: 0.05 }\n  - { id: 13, name: \"the anchor and the write endpoint\",             epic: \"plugin-split/E6\", weight: 0.06 }\n  - { id: 14, name: \"the wake command and the whole loop\",           epic: \"plugin-split/E6\", weight: 0.04 }\n\n```"}, "gates": [{"n": "1", "name": "Product", "state": "APPROVED 2026-08-20"}, {"n": "2", "name": "Architecture", "state": "APPROVED 2026-08-21"}, {"n": "3", "name": "Program Design", "state": "APPROVED 2026-08-21"}, {"n": "4", "name": "Slice plan + rubrics", "state": "APPROVED 2026-08-21"}], "epics": [{"id": "E1", "key": "cobuilder-implement/E1", "design": "cobuilder-implement", "note": "Shares a branch and a pull request with the design-mode design. See ADR-0013: a branch may carry more than one design.", "state": "open", "branch": "design/design-mode", "pr": 11, "slices": [], "adrs": ["ADR-0012", "ADR-0011", "ADR-0015"]}, {"id": "E2", "key": "cobuilder-implement/E2", "design": "cobuilder-implement", "note": "Write a technical solution design for each epic, before the slices of that epic are 3, and schema 1.3, so two plugins at different versions cannot corrupt one bundle. Two slices.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0016", "ADR-0017", "ADR-0015", "ADR-0006"]}, {"id": "E4", "key": "plugin-split/E4", "design": "plugin-split", "note": "The record index. build_index.py replaces the two projection scripts, emits every entity with a stable id, and resolves every join including an ADR to its pull request. Two slices.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0016", "ADR-0017", "ADR-0015", "ADR-0006"]}, {"id": "E5", "key": "plugin-split/E5", "design": "plugin-split", "note": "One lifecycle surface. The Decisions, Contexts, and Builds modes, the Backlog lane, and moving generated pages out of the foreign directory into the bundle. Two slices.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0016", "ADR-0017", "ADR-0015", "ADR-0006"]}, {"id": "E6", "key": "plugin-split/E6", "design": "plugin-split", "note": "The reply channel. The append-only ledger and its projection, the anchor computed from the live DOM, the write endpoint, and the background wake command. Three slices.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0016", "ADR-0017", "ADR-0015", "ADR-0006"]}, {"id": "E7", "key": "plugin-split/E7", "design": "plugin-split", "note": "Threads read as conversations. The drawer renders a reply under the comment it answers. Deferred past E6 on purpose: E6 ships the record shape, so this epic adds no migration and carries no slice yet.", "state": "planned", "branch": null, "pr": null, "slices": [], "adrs": ["ADR-0016", "ADR-0017", "ADR-0015", "ADR-0006"]}], "paths": {"00-status.md": "docs/plans/cobuilder-family/00-status.md", "01-product.md": "docs/plans/cobuilder-family/01-product.md", "02-architecture.md": "docs/plans/cobuilder-family/02-architecture.md", "02a-artifact-map.md": "docs/plans/cobuilder-family/02a-artifact-map.m /* ---- minimal markdown renderer: headings, lists, tables, fences, quotes, inline ---- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,function(m,a){return '<code>'+a+'</code>';});
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  return s;
}
function render(md){
  var L=md.split('\n'), out=[], i=0;
  /* strip yaml frontmatter */
  if(L[0]==='---'){var e=L.indexOf('---',1); if(e>0) i=e+1;}
  function tableAt(k){ return /^\s*\|/.test(L[k]||'') && /^\s*\|[\s:|-]+\|\s*$/.test(L[k+1]||''); }
  while(i<L.length){
    var l=L[i];
    if(/^\s*$/.test(l)){i++;continue;}
    if(/^```/.test(l)){
      var buf=[];i++;
      while(i<L.length && !/^```/.test(L[i])){buf.push(L[i]);i++;}
      i++;
      out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>');continue;
    }
    if(tableAt(i)){
      var cells=function(r){var t=r.trim().replace(/^\|/,'').replace(/\|$/,'');return t.split('|').map(function(x){return inline(x.trim());});};
      var head=cells(L[i]); i+=2; var body=[];
      while(i<L.length && /^\s*\|/.test(L[i])){body.push(cells(L[i]));i++;}
      out.push('<div class="tw"><table><thead><tr>'+head.map(function(c){return '<th>'+c+'</th>';}).join('')+
        '</tr></thead><tbody>'+body.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';}).join('')+
        '</tbody></table></div>');continue;
    }
    var h=l.match(/^(#{1,6})\s+(.*)$/);
    if(h){out.push('<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>');i++;continue;}
    if(/^(-{3,}|\*{3,})\s*$/.test(l)){out.push('<hr>');i++;continue;}
    if(/^\s*>/.test(l)){
      var q=[];while(i<L.length && /^\s*>/.test(L[i])){q.push(L[i].replace(/^\s*>\s?/,''));i++;}
      out.push('<blockquote>'+render(q.join('\n'))+'</blockquote>');continue;
    }
    var um=l.match(/^(\s*)([-*+])\s+(.*)$/), om=l.match(/^(\s*)(\d+)\.\s+(.*)$/);
    if(um||om){
      var ord=!!om, items=[], re=ord?/^(\s*)(\d+)\.\s+(.*)$/:/^(\s*)([-*+])\s+(.*)$/;
      while(i<L.length){
        var m=L[i].match(re);
        if(m){items.push(inline(m[3]));i++;
          while(i<L.length && /^\s{2,}\S/.test(L[i]) && !L[i].match(re)){items[items.length-1]+=' '+inline(L[i].trim());i++;}
        } else if(/^\s*$/.test(L[i]) && (L[i+1]||'').match(re)){i++;}
        else break;
      }
      out.push('<'+(ord?'ol':'ul')+'>'+items.map(function(x){return '<li>'+x+'</li>';}).join('')+'</'+(ord?'ol':'ul')+'>');continue;
    }
    var para=[];
    while(i<L.length && !/^\s*$/.test(L[i]) && !/^(#{1,6})\s/.test(L[i]) && !/^```/.test(L[i]) &&
          !/^\s*[-*+]\s/.test(L[i]) && !/^\s*\d+\.\s/.test(L[i]) && !/^\s*>/.test(L[i]) && !tableAt(i) && !/^(-{3,})\s*$/.test(L[i])){
      para.push(L[i]);i++;
    }
    if(para.length) out.push('<p>'+inline(para.join(' '))+'</p>');
  }
  return out.join('\n');
}
