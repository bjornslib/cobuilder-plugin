      h+='<button class="subdoc'+(isRubric?' rubric':'')+'" data-doc="'+f+'" data-gate="'+g.n+'">'+TITLE[f]+'</button>';
    });
  });
  var planned=EP.filter(function(e){return !e.branch;}).length;
  h+='<div class="glabel">Feature</div><button class="subdoc" data-doc="00-status.md" data-gate="0" style="padding-left:11px">Status</button>';
  h+='<button class="subdoc" data-doc="__backlog" data-gate="0" style="padding-left:11px">Backlog <span class="cnt">'+planned+'</span></button>';
  rail.innerHTML=h;
  rail.querySelectorAll('[data-doc]').forEach(function(b){b.addEventListener('click',function(){go(b.dataset.gate,b.dataset.doc);});});
  rail.querySelectorAll('.gate').forEach(function(b){b.addEventListener('click',function(){
    var f=(GATEDOC[b.dataset.gate]||[])[0]; if(f) go(b.dataset.gate,f);});});
}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function backlog(){
  var started=EP.filter(function(e){return e.branch;});
  var planned=EP.filter(function(e){return !e.branch;});
  planned.sort(function(a,b){return (b.slices.length-a.slices.length)||a.key.localeCompare(b.key);});
  function card(e){
    var sl=e.slices.map(function(s){return '<li><button class="slink" data-gate="4" data-doc="rubric-'+s.n+'"><b>'+s.n+'</b> '+esc(s.name)+'</button></li>';}).join('');
    return '<div class="ecard'+(e.branch?' started':'')+'">'+
      '<div class="ehead"><code>'+esc(e.key)+'</code>'+
      '<span class="pill '+(e.branch?'ok':'wait')+'">'+(e.branch?esc(e.state):'not started')+'</span></div>'+
      '<p>'+esc(e.note)+'</p>'+
      (sl?'<div class="elab">Slices that advance it</div><ul class="eslices">'+sl+'</ul>'
         :'<div class="elab none">No slice yet &mdash; this epic is deferred</div>')+
      '</div>';
  }
  return '<div class="crumb"><span>backlog &middot; computed from goal.json, not authored</span>'+
    '<span class="pill wait">'+planned.length+' not started</span></div>'+
    '<div class="note"><h4>The backlog is a query, not a file</h4><p>Every epic with no branch, plus every slice not yet scored. Nothing authors this list, so nothing can go stale against it. Ranked by how many slices advance the epic &mdash; ranking by dependent decision count needs the index, which slice 9 builds.</p></div>'+
    '<div class="egrid">'+planned.map(card).join('')+'</div>'+
    (started.length?'<div class="elab" style="margin-top:22px">Started</div><div class="egrid">'+started.map(card).join('')+'</div>':'');
}
function go(gate,doc){
  cur={gate:gate,doc:doc};
  rail.querySelectorAll('.gate').forEach(function(b){b.setAttribute('aria-current',String(b.dataset.gate===gate));});
  rail.querySelectorAll('.subdoc').forEach(function(b){b.setAttribute('aria-current',String(b.dataset.doc===doc));});
  var g=G.filter(function(x){return x.n===gate;})[0];
  var pill = g ? '<span class="pill '+(cls(g)==='done'?'ok':cls(g)==='now'?'now':'wait')+'">'+g.state+'</span>' : '';
  var note='';
  if(doc===ASKDOC) note='<div class="note"><h4>Rendered from the markdown, not a second copy</h4><p>This page holds <code>'+((PATHS&&PATHS[doc])||doc)+'</code> as text and renders it in the browser. There is one file on disk. Change the markdown, rebuild, and the view follows &mdash; no hand-authored HTML to keep in step.</p></div>';
  if(doc==='__backlog'){
    main.innerHTML=backlog();
    main.querySelectorAll('.slink').forEach(function(b){b.addEventListener('click',function(){go(b.dataset.gate,b.dataset.doc);});});
    main.scrollTop=0; window.scrollTo(0,0); return;
  }
  if(/^rubric-/.test(doc)) note='<div class="note"><h4>A blind rubric</h4><p>A rubric is the blind acceptance sheet. It is written at Gate 4, before any implementation exists. A validator scores the slice against it.</p></div>';
  var path=(PATHS&&PATHS[doc])||doc;
  main.innerHTML='<div class="crumb"><span>'+path+'</span>'+pill+'</div>'+note+'<div class="md">'+render(D[doc]||'')+'</div>'+
   (doc===ASKDOC?'<div class="ask"><h3>Approve Gate '+ASKGATE+', or what should change?</h3><p>'+ASKNOTE+'</p></div>':'');
  main.scrollTop=0; window.scrollTo(0,0);
}
buildRail(); go("4","04-slices.md");
})();
</script>
