--ink:#EEECE6;--ink2:#B3B0A7;--ink3:#7F7C72;--ok:#8CBC99;--ok-bg:#19291D;--now:#D2A34B;--now-bg:#2E2310;--wait:#7F7C72;--wait-bg:#1D1C19;--acc:#8BB1D1;--acc-bg:#14232F;--red:#DA8A84;--red-bg:#321816;}}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.62}
.shell{display:grid;grid-template-columns:1fr;max-width:1180px;margin:0 auto;min-height:100vh}
@media(min-width:900px){.shell{grid-template-columns:264px 1fr}}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0 0 1em}
code{font-family:var(--mono);font-size:.85em;background:var(--sunk);padding:.1em .36em;border-radius:4px}

/* rail */
.rail{border-right:1px solid var(--line);padding:30px 20px 40px;background:var(--bg)}

.mark{font-family:var(--ser);font-size:21px;font-weight:600;letter-spacing:-.01em}

.glabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:26px 0 9px}
.gate{width:100%;text-align:left;background:none;border:0;font-family:var(--sans);padding:9px 11px;border-radius:8px;margin-bottom:3px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;color:inherit}
.gate:hover{background:var(--sunk)}
.gate[aria-current="true"]{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.09)}
.gate .dot{width:17px;height:17px;border-radius:50%;flex:none;margin-top:2px;display:grid;place-items:center;font-size:9px;font-family:var(--mono);border:1px solid var(--line2);color:var(--ink3)}
.gate.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.gate.now .dot{background:var(--now-bg);border-color:var(--now);color:var(--now)}
.gate .nm{font-size:13.5px;font-weight:600;line-height:1.25}

.subdoc:hover{background:var(--sunk);color:var(--ink2)}

.rublabel{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:6px 11px 3px 38px}
.subdoc.rubric{font-size:10px;padding:3px 11px 3px 38px;color:var(--ink3)}
.subdoc.rubric:hover{background:var(--sunk);color:var(--ink2)}
.subdoc.rubric[aria-current="true"]{color:var(--acc);font-weight:500}
.slink{background:none;border:0;padding:0;font:inherit;color:var(--acc);cursor:pointer;text-align:left}
.slink:hover{text-decoration:underline}

main{padding:34px 30px 90px;min-width:0}
.crumb{font-family:var(--mono);font-size:10.5px;color:var(--ink3);letter-spacing:.06em;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.md h3{font-size:17px;font-weight:700;margin:26px 0 8px}
.md h4{font-size:15px;font-weight:700;margin:20px 0 6px}
.md p{color:var(--ink2)}
.md strong{color:var(--ink);font-weight:600}

.md a{color:var(--acc)}
.md ul,.md ol{color:var(--ink2);padding-left:22px;margin:0 0 1em}
.md li{margin-bottom:5px}
.md blockquote{border-left:3px solid var(--line2);margin:0 0 1em;padding:2px 0 2px 16px;color:var(--ink3)}

.md .tw{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--panel);margin:0 0 1.3em}
.md table{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px}
.md th{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:10px 13px;background:var(--sunk);border-bottom:1px solid var(--line2);white-space:nowrap}
.md td{padding:9px 13px;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:top}
.md tbody tr:last-child td{border-bottom:none}
.cnt{font-family:var(--mono);font-size:9px;background:var(--wait-bg);color:var(--wait);border-radius:20px;padding:1px 6px;margin-left:6px}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.ecard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:9px;padding:15px 17px}

.eslices{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}

.note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:9px;padding:15px 17px;margin:0 0 26px;max-width:74ch}
.note h4{font-size:14.5px;font-weight:700;margin-bottom:5px}
.note p{font-size:14px;color:var(--ink2);margin:0}
.ask{margin-top:44px;background:var(--panel);border:2px solid var(--ink);border-radius:12px;padding:24px 26px;max-width:74ch}
.ask h3{font-family:var(--ser);font-size:25px;font-weight:600;margin-bottom:9px}
.ask p{font-size:15px;color:var(--ink2);margin:0}

<script>window.BUILD={"docs": {"00-status.md": "# Status: the cobuilder family\n\nShipping cobuilder as five separately installable plugins: `cobuilder-architect`,\n`cobuilder-pr`, `cobuilder-implement`, `cobuilder-artifact`, and\n`cobuilder-full-lifecycle`. This carries two designs at once, which ADR-0013\npermits.\n\n- Gate 1 \u2014 Product: APPROVED 2026-08-20\n- Gate 2 \u2014 Architecture: APPROVED 2026-08-21\n- Gate 3 \u2014 Program Design: APPROVED 2026-08-21\n- Gate 4 \u2014 Slice plan + rubrics: APPROVED 2026-08-21\n\nHindsight: unavailable (tools advertised in this session but not registered \u2014 substitutes read, see 01-product.md)\n\n## Slices\n\nSix epics, fourteen slices. A seventh epic is deferred and carries none.\n\n**E1 \u2014 one plugin becomes five**\n- [x] Slice 4 \u2014 renames inside today's single plugin              score: 1.00 on attempt 2\n- [x] Slice 5 \u2014 the cross-pillar references are fixed             score: 1.00 on attempt 3\n- [ ] Slice 6 \u2014 five plugins, five manifests                      score: \u2014\n- [ ] Slice 7 \u2014 the two ports land                                score: \u2014\n\n**E2 \u2014 shared code survives an install**\n- [x] Slice 1 \u2014 tracer bullet: two plugins, one shared module     score: 1.00\n\n**E3 \u2014 the seam is version-safe**\n- [x] Slice 2 \u2014 the compatibility gate exists                     score: 1.00\n- [x] Slice 3 \u2014 the gate is wired and the bundle migrates         score: 1.00\n\n**E4 \u2014 the record index**\n- [x] Slice 8 \u2014 the index holds the entities                      score: 1.00\n- [x] Slice 9 \u2014 the index resolves the joins                      score: 1.00\n\n**E5 \u2014 one lifecycle surface**\n- [ ] Slice 10 \u2014 the Decisions and Contexts modes                 score: \u2014\n- [ ] Slice 11 \u2014 the Builds mode and the Backlog lane             score: \u2014\n\n**E6 \u2014 the reply channel**\n- [ ] Slice 12 \u2014 the ledger and its projection                    score: \u2014\n- [ ] Slice 13 \u2014 the anchor and the write endpoint                score: \u2014\n- [ ] Slice 14 \u2014 the wake command and the whole loop              score: \u2014\n\n**E7 \u2014 threads read as conversations**: deferred, no slice yet.\n\nBuild order is slice 1 first, then 2 and 3, then 4 through 7, then 8 through\n14. Rubrics written before any implementation: 14 of 14, in\n`.cobuilder/rubrics/cobuilder-family/`.\n\nA Builds view always presents work epic-first, with each epic's slices nested\nunder it. It is never a flat slice list with an epic column.\n\n## Escalated\n\nNone yet.\n\n## Notes for a fresh session\n\n- The prototype already exists and works: `~/.claude/skills/cobuilder-factory/`\n  is 1390 lines across `SKILL.md`, four references, and one workflow script.\n  This build is a port and a hardening, not a green-field feature.\n- The rename is part of the build. `cobuilder-factory` becomes\n  `cobuilder-implement` everywhere, including the lineage note.\n- Governing records: `ADR-0012` (the skill itself), `ADR-0013` (the join to a\n  design through `intent.json`, and the rule that one branch may carry more\n  than one design).\n- `docs/architecture/designs/cobuilder-implement/goal.json` is `stage:\n  approved` and carries one epic, E1, on branch `design/design-mode`, PR 11.\n- This build runs its own gates on itself. The design's fourth `done_when` is\n  \"cobuilder-implement builds one real change end to end under its own gates\",\n  so this plan is that proof, not a rehearsal of it.\n- Gate 1 approved 2026-08-20. Presented as HTML at\n  `.lavish/gate1-cobuilder-family.html`. The user asked that every gate be\n  presented that way, not as markdown in chat. That request became a scope\n  addition, recorded as a Gate 2 input: a `collaborate-with-user` skill, owned\n  by `cobuilder-artifact`.\n- Gate 2 approved 2026-08-21 after six corrections from the user: a handoff\n  between plugins is allowed and only a file reference is banned, the comment\n  drawer opens on a click rather than on a key, Describe is called by Design\n  rather than run by a person, `pr:generate` carries the interview and the\n  assessment and the narrative, the write endpoint is decided rather than\n  open, and a boundary record now declares the districts it verifies.\n- Every gate is presented in the Builds view at `.lavish/builds-view.html`,\n  which renders the plan markdown rather than a second hand-written copy.\n  `scripts/build_builds_view.py` regenerates it. The payload line carries its\n  own closing `<\/script>` tag, and dropping that tag renders a blank page.\n- ADR-0018 and ADR-0019 approved 2026-08-21.\n- Gate 3 approved 2026-08-21. Two decisions came out of the review:\n  `commands/explore-design.md` is deleted, because divergent exploration is an\n  agent-invoked step of Design mode rather than a user-facing command. And the\n  backlog is `goal.json.epics[]` with a null branch, not a new file.\n- `docs/architecture/designs/plugin-split/goal.json` carries seven epics, E1\n  through E7. The first cut had nine, five of which carried one slice each,\n  which made an epic a label for a slice. Regrouped so an epic is a body of\n  work that maps to one pull request.\n- The Backlog lane in the Builds view is a required part of slice 11, not\n  polish. It is a query over the index: every epic with a null branch plus\n  every slice not yet scored, ranked by dependent ADR count.\n- Threaded agent replies in the viewer are a required part of E6's record\n  shape and a deferred part of its interface. See ADR-0019.\n\n## Slice 1 \u2014 result\n\nThe spike proved ADR-0017's vendoring mechanism. A local marketplace with a\n`shared/` directory and two sibling plugins, each carrying a symlink at\n`<plugin>/shared`, copies the full `shared/` tree, including a nested\nsubdirectory, into each plugin's own install cache.\n\nCommands run, in order:\n\n```\nclaude plugin validate <plugin-a-path>\nclaude plugin validate <plugin-b-path>\nclaude plugin validate <marketplace-path>\nclaude plugin marketplace add <marketplace-path> --scope local\nclaude plugin install spike-plugin-a@slice1-spike-marketplace -s local -y\nclaude plugin install spike-plugin-b@slice1-spike-marketplace -s local -y\nclaude plugin list --json\npython3 -c \"import sys; sys.path.insert(0, '<cache>/shared'); import _bundle_meta; print(_bundle_meta.SCHEMA_VERSION)\"\nmv <marketplace-path> <marketplace-path>-RENAMED-unreachable\npython3 -c \"import sys; sys.path.insert(0, '<cache>/shared'); import _bundle_meta; print(_bundle_meta.SCHEMA_VERSION)\"\nclaude plugin uninstall spike-plugin-a@slice1-spike-marketplace -s local\nclaude plugin uninstall spike-plugin-b@slice1-spike-marketplace -s local\nclaude plugin marketplace remove slice1-spike-marketplace\n```\n\nBoth plugins validated with exit 0, warnings only, no author field. Both\ninstalled to sibling cache directories under\n`~/.claude/plugins/cache/slice1-spike-marketplace/`, neither nested inside\nthe other. Each cache held a real directory at `shared/`, not a symlink,\ncontaining `_bundle_meta.py`, `_greeting.py`, and a `nested/` subdirectory\nholding `_nested_module.py`. Every file in the source `shared/` tree\narrived in both caches, including the nested one.\n\nRename test: the first run inserted the cache path into `sys.path` and read\nthe module directly. That proves the cache holds the files. It does not\nprove that a plugin command resolving `${CLAUDE_PLUGIN_ROOT}/shared/...`\nreaches them, which is the claim the design rests on.\n\nAn independent validator closed that gap. It read the expression written in\neach plugin's own command file, ran that expression with\n`CLAUDE_PLUGIN_ROOT` set to the real cache directory, and did so before and\nafter the marketplace source directory was renamed out of reach. Both\nplugins printed `SCHEMA_VERSION=1.2` in all four runs, with exit 0. Neither\nplugin read the marketplace source tree at run time.\n\n**Validated: ACCEPT, score 1.00 of 1.00**, all four criteria at full credit.\nOne reporting defect was found and is recorded above. A write-up must record\nthe command that matches the claim it makes, rather than a proxy for it.\n\nADR-0017's vendoring mechanism holds. The install copy dereferences a\nsymlinked directory, including a nested subdirectory, and each installed\nplugin's cache is self-contained.\n\n\n## Slice 2 \u2014 result\n\n`scripts/_bundle_meta.py` gained `BundleIncompatible`, `require_compatible()`,\nand `stamp_generator()`. The constants moved to schema 1.3 and bundle format\n3. Nothing calls the two functions yet, which is slice 3.\n\nThe repository gained its first test suite at `tests/`, run with\n`uv run --with pytest pytest tests/ -v`. No package manager configuration was\nadded. Pytest arrives through `--with` alone.\n\n**Validated: ACCEPT, score 1.00 of 1.00.** An independent validator wrote 14\nadversarial tests beyond the implementer's 11. A version comparison uses a\ntuple of integers, so `\"1.10\"` correctly reads as newer than `\"1.9\"`.\n\nAccepted regression: the existing bundles now report `bundle.format: stale:2`\nand `bundle.schema: stale:1.2`. That is staleness and not corruption. Slice 3\nowns the migration that clears it.\n\n**Two findings handed to slice 3.** `require_compatible()` raises a raw\n`json.JSONDecodeError` on a malformed `bundle.json`, and a raw\n`AttributeError` when `min_reader_schema` holds a number. Both are acceptable\nwhile nothing calls the function. Both must be wrapped before a real writer\ndepends on them. A malformed `generators` field is also discarded rather than\nreported.\n\n## Slice 3 \u2014 result\n\n**Validated: ACCEPT, score 1.00 of 1.00.**\n\nEleven writers call `require_compatible()` before their first write, not the\nthree the program design named. The implementer grepped for the full set.\n`verify_bundle.py` is exempt because it never writes. `migrate_bundle.py` is\nexempt because gating the migrator on the check it exists to satisfy would\ndeadlock every bundle it repairs. A validator tested that reasoning rather\nthan accepting it.\n\nAll three bundles stepped to format 3 and schema 1.3. The authored fields and\nevery asset and audio file are byte-identical to the pre-migration backups,\nchecked by an independent checksum comparison. The old scalar\n`generator_version` survives as the first entry of the `generators` map.\n\nProved by behaviour rather than by reading the source:\n\n- A deliberately bad migration step wrote nothing at all. No story file\n  changed and no backup directory appeared. The failure mode is \"no write\".\n- A bundle already at the current version still had its viewer refreshed. A\n  marker file placed there came back as the real viewer.\n- A bundle claiming format 99 was refused. The ladder never steps backwards.\n- A second migration run reports \"already current\" and changes nothing.\n\nA static type checker flagged `migrate_bundle.py:319` as a call on an object.\nIt is a false positive from a loosely typed tuple slot. Every ladder step was\ndriven at run time with no error.\n\n## Slice 4 \u2014 a naming decision that slice 6 must undo\n\nTwo skills each own a mode named `review`. The architecture skill audits a\ncodebase. The odyssey skill narrates merged history. A slash command takes\nits name from its file, so one `commands/` directory cannot hold two files\nnamed `review.md`.\n\nSlice 4 kept `commands/review.md` for the architecture skill and named the\nother `commands/odyssey-review.md`. That is correct today and wrong at the\nend of the build.\n\n**After the split the collision disappears.** `cobuilder-architect:review`\nand `cobuilder-pr:review` are different plugins and different namespaces, so\neach carries its own `commands/review.md`. ADR-0016 records that the split\nresolves this collision structurally, and shipping a command called\n`odyssey-review` would leave the workaround in place after its reason has\ngone.\n\n**Slice 6 must rename `commands/odyssey-review.md` back to `review.md`\ninside `cobuilder-pr`.** The internal mode name is already `review` in both\nskills, so only the file name changes.\n\n## Backlog raised during the build\n\n**A technical solution design per epic, before that epic's slices are built.**\nRecorded as epic E2 of the `cobuilder-implement` design, raised 2026-08-22.\n\nGate 3 writes one program design for a whole feature. That is the right grain\nfor a feature and the wrong grain for an epic that carries four slices. This\nsession skipped the per-epic step and paid for it twice.\n\n- The pull-request mode rename reached a slice brief still carrying a shape\n  the user had already corrected. An epic-level design would have caught the\n  contradiction before an agent acted on it.\n- The `review` command-name collision surfaced while slice 4 was building,\n  not while the epic was being designed. The fix was sound and it arrived\n  late, and it left a temporary command name that slice 6 must undo.\n\n`cobuilder-implement` must produce that per-epic design as part of its own\nworkflow, rather than leaving it to whoever runs the build.\n\n## Slice 4 \u2014 first attempt, RETRY at 0.90\n\nFour criteria at full credit. C4b, the critical one, scored 0.5. The rubric\nnames that case exactly: the two modes are correct, and a citation still\ncarries the old sense of `generate`.\n\nThree files kept the pre-rotation meaning. One of them proves the rubric was\nright to expect this. `README.md` was corrected to say the `review` command\nwarns about a stale baseline, while\n`skills/odyssey/references/baseline-derivation.md` still credited `generate`\nwith the same warning. The fix landed in one place and missed the other.\n\n`decision-records-lite.md` shows the same shape at a smaller scale. Its body\nrotated correctly. Its title and its first heading did not. A file that is\npartly correct is not evidence that it is wholly correct.\n\nAttempt 2 is running, together with slice 5, because both are the same kind\nof work in the same files.\n\n## A measurement that moved\n\n`02-architecture.md` records 33 cross-pillar references, counted 2026-08-21.\nThe count on 2026-08-22 is 25, being 18 from the architecture pillar into the\nodyssey pillar and 7 in the other direction.\n\nThe number moved because slice 4 rewrote many of the citations these\nreferences live in. It is not a correction of a miscount. Both runtime\nreferences named in the plan still exist, and so do the five safe references\nto a vendored shared skill.\n\n## Slice 4 \u2014 attempt 2, ACCEPT at 1.00\n\nAttempt 2 fixed the four leftovers the first validator named, and the\nimplementer's own sweep found three more: the lifecycle summary in\n`README.md`, one further sentence there, and four `Submit-mode` comments in\n`viewer/index.html`.\n\nA second validator traced 271 raw matches and found no leftover. The phrase\n`submit mode` survives nowhere, and no command dispatches that mode.\n\nFour items stay untouched on purpose, and the validator agreed with each. The\ntrigger phrases \"submit this PR\" and \"generate this PR\" are natural language\nrather than mode names. The phrase \"pre-submit run\" is plain English. The\nhistory list in `CLAUDE.md` names the mode as it was called at the time and\nthen records the rename. The ADRs and the pull-request documents are records\nof what was true when they were written.\n\n## Slice 5 \u2014 first attempt, RETRY at 0.75\n\nC1 and C4 are at 1.00. Every one of the 25 cross-pillar references is gone,\nin both directions, and the prose citations were fixed rather than only the\ntwo that resolve at run time.\n\nC2 and C3 each scored 0.5.\n\n**The guard has four holes.** A validator drove the checker with a synthetic\nharness rather than trusting its fixture, and got a cross-pillar reference\npast it four ways: a relative path such as `../<pillar>/...`, a path with no\n`skills/` prefix, a reference inside a Python file, and a reference to or\nfrom a new third pillar that the hardcoded name set does not know. A\nreference inside a fenced code block is caught.\n\nNone of the four exists in the repository today, so the count of zero stands.\nAn unsound guard is still worth less than the count it reports, because the\nnext change walks through the hole and nobody sees it.\n\n**The slice created one stale sentence of its own.**\n`skills/architecture/references/design-mode.md:122` still tells a reader to\nuse the same dual-path guard as `decision-records-lite.md`. That file no\nlonger has a dual-path guard. Attempt 1 replaced it with a fail-loud path and\ndid not correct the sentence that described it.\n\n**A count that three sources disagree about.** `02-architecture.md` records 5\nsafe vendored references, attempt 1 reported 6, and the validator counted 7\nraw matches. Part of the increase is real, because moving `diagram-mode.md`\ninto the mermaid skill added a reference in each pillar. Attempt 2 must count\nthem and state the definition it counted by.\n\n## Slice 5 \u2014 attempt 2, RETRY at 0.875\n\nC1, C3, and C4 reached 1.00 and stay there. Every cross-pillar reference is\ngone, the count is zero, and the stale sentence is corrected.\n\nC2 stayed at 0.5. The four evasions from attempt 1 are genuinely closed, and\na validator proved each one independently rather than trusting the fixture\nthat shipped with the fix. It then found four more.\n\n- A backslash path is not flagged.\n- A path with a `./` prefix is not flagged. The bare-path pattern excludes a\n  slash before the name, so the most ordinary relative path a person writes\n  slips through.\n- A mixed-case pillar name is not flagged, because the pattern is\n  case-sensitive.\n- A reference in a file outside the extension allowlist is invisible,\n  whatever it contains.\n\nNone of these is an adversarial attack. Each is a reference style an author\nproduces without thinking about the guard at all, which is the reason the\nscore did not move.\n\nThe clean side is genuinely clean, and that matters as much. The phrase\n`architecture/tech` in `story-mode.md`, where the slash means \"or\", is not\nflagged. Neither is `docs/architecture/adr/`, nor the corpus directory that\nsits inside the architecture pillar. All seven vendored references pass.\n\nAttempt 3 is running. It is the last before escalation.\n\n## A note on how the loop is behaving\n\nThree slices passed on the first attempt. Two needed a second. The two that\nneeded one share a shape: both are about meaning rather than mechanism, and\nin both the implementer's own tests agreed with the implementer.\n\nEach validator that found a real defect did the same thing. It refused to run\nthe tests that shipped with the work, and wrote its own instead. A validator\nthat reruns the implementer's suite and agrees has measured nothing.\n\n## Slice 8 \u2014 built, one criterion open\n\n`scripts/build_index.py` emits nine entity types and every count matches its\nsource: 19 decision records, 3 designs, 10 epics, 1 context, 6 districts, 16\nboundary rules, 10 pull requests, 14 slices, and 2 publications.\n\nAn epic id is scoped to its design, which was the criterion with no half\ncredit. This repository already carries the collision the rule exists for.\nThree designs each name an epic `E1`, and all three resolve distinctly.\n\nThe script subsumes the two it replaces rather than sitting beside them. It\nregenerates `adrs.json`, `adrs.js`, and `designs.js` in the shape the viewer\nalready reads, so the existing modes need no change. Retiring those globals\nbelongs to the slices that build the new modes.\n\n**C4 is open, and the cause is a constraint I set.** I put `skills/` on the\ndo-not-touch list, because another agent was working there. Ten invocations\nof the two deleted scripts remain in `skills/odyssey/SKILL.md`,\n`skills/odyssey/references/decision-records-lite.md`,\n`skills/architecture/SKILL.md`, and\n`skills/architecture/references/design-mode.md`.\n\nThese are not stale prose. Each is a runnable command naming a file that no\nlonger exists, so each fails the moment a procedure reaches it. The agent\nreported this plainly rather than leaving it silent, which is the behaviour\nthe loop is meant to produce.\n\nA guard caught the same deletion from the other side. `test_gate_hardening.py`\nscans every writer for the compatibility gate call, and two of its cases\nstarted failing with a missing-file error as soon as the scripts went. Nobody\nwired those two things together. The test slice 3 wrote noticed the change\nslice 8 made.\n\n## Slice 5 \u2014 attempt 3, ACCEPT at 1.00\n\nAll four evasions are closed and a validator proved each one with its own\nharness rather than the tests that shipped with the fix. The false-positive\nside stayed clean, which mattered as much: a guard that cries wolf gets\nswitched off.\n\nAttempt 3 decided the extension question instead of widening the allowlist\nagain. The list is gone. Every file is scanned, and binary content is skipped\nby sniffing the first 8 KiB for a null byte rather than by trusting a\nfilename. A test puts pillar-shaped bytes inside a binary file to prove the\nsniff decides, and not the extension. Widening a list closes one hole.\nRemoving the list closes the class.\n\nThree residual gaps are recorded and none blocks acceptance. A path\nsoft-wrapped across two lines never forms a match. A percent-encoded path is\nnever decoded. A double-slash path segment is not caught, which the validator\nfound and the implementer had not declared.\n\nEach needs a mechanical transformation of the path text that nothing in this\nrepository's authoring or tooling produces. Percent-decoding arbitrary prose\nwould also invite the false positives that make a guard useless. The gaps are\nwritten down rather than closed, which is the honest trade.\n\nEpic E1 now has three of its four slices at 1.00. Slice 6 remains.\n\n## Slice 8 \u2014 C4 closed\n\nEleven sites fixed, one more than the ten I named. A grep found\n`skills/architecture/SKILL.md:263` that I had missed. Live references to the\ntwo deleted scripts now stand at zero in `skills/` and `commands/`.\n\nTwo of the sites needed more than a new file name.\n`skills/odyssey/SKILL.md` called `build_designs.py` and then `build_adrs.py`\nas two separate steps. One script now rebuilds both projections, so the two\ncalls became one call and one sentence. A find-and-replace would have left a\nprocedure running the same script twice and calling it two different things.\n\nEvery occurrence under `docs/` stays untouched, and the agent judged each one\nrather than applying a rule. An ADR records a decision as it stood. A plan\ndocuments this migration, and two of those already name the new script. A\npull-request assessment is immutable. None is an instruction a future session\nwould run.\n\n**The guard is worth more than the eleven fixes.**\n`tests/test_script_references.py` scans every skill and command file for a\nrunnable `uv run scripts/<name>.py` line and fails when that script does not\nexist. It is scoped to command lines rather than to any mention of a\nfilename, so a historical note does not fail the build. The agent proved it\nfails by planting a probe file naming a deleted script, watching the\nassertion fire, and removing the probe.\n\nNothing in this repository could previously tell that deleting a script had\norphaned eleven runnable commands. Slice 3's writer scan caught the deletion\nfrom one side by accident. This closes the other side on purpose.\n\nThe suite now runs 193 tests, because the new guard parametrises one case per\nmarkdown file under `skills/` and `commands/`.\n\n## Slices 8 and 9 \u2014 ACCEPT at 1.00 each. Epic E4 is complete.\n\nA validator verified every count against its source rather than reading the\ntable, and attacked both slices rather than confirming them. It built a\nfourth design declaring `E1` to force a collision, deleted and then added a\nrecord to prove the rebuild works in both directions, checksummed every file\nunder `docs/` rather than trusting an mtime, planted a probe naming a missing\nscript to prove the new guard is not a rubber stamp, served the real bundle\nover HTTP and loaded each data file, and put a failing `gh` on the path.\n\nIt also checked the reverse of the staleness test. An unchanged repository\nreports not stale. A check that always fires is not a check.\n\nThe joins against this repository:\n\n- 10 records reach a pull request directly, through a stated `source_pr`.\n- 7 reach one through a design and an epic. Two of those land on an epic with\n  no branch, so they resolve to no pull request and say so.\n- 2 reach no design at all, and are recorded as unresolved rather than\n  guessed.\n- 8 of 10 epics are unstarted. Two carry pull request 11.\n- All 14 slices resolve to a `plugin-split` epic.\n- One district, `.cobuilder-architect`, is covered by no context. That list is\n  the describe backlog.\n\n## What the heuristic episode cost, and what it bought\n\nI introduced the defect. Restructuring the slice table to group by epic\ndropped the scoped id, and three designs each declare an `E1`, so the source\nstopped identifying anything.\n\nSlice 9 filled the gap by matching words between the table prose and each\nepic's authored note. It worked on today's data. Every test passed. The join\nwas correct, and it would have stayed correct until two designs shared\nvocabulary, and then it would have attached slices to the wrong epic in\nsilence.\n\nNo rubric criterion would have caught it, because the rubric was written\nbefore the data broke.\n\nThree things came out of it. The source carries the scoped id again. C4b now\nforbids a heuristic in any join, and scores 0.5 for keeping a guess as a\nfallback rather than as the primary path. And the criterion carries the date\nit was added and the reason, so the rubric records what happened instead of\npretending it always said this.\n\nA validator then swept every other join and found the path-prefix check\ninside the record-to-design step, which is where a loose match would most\nlikely hide. It tested sibling design names `foo` and `foo-bar` and confirmed\nthe trailing slash stops the substring leaking.\n", "01-product.md": "# Product: the cobuilder family\n\n## Problem\n\nA person who wants help with one part of building software has to take all\nof it. Today one install carries the whole lifecycle: designing a change,\nbuilding it, opening and narrating the pull request, and rendering the\nresult. Somebody who only wants their pull requests explained also installs\nthe audit corpus, the picture generator, and the viewer.\n\nThe parts also stop short of each other. The design work records why a\nchange was chosen and what was rejected. Nothing then reads that record and\nbuilds from it, so the person answers the same questions again when the code\nstarts. The half that turns an approved design into working code exists as\none person's private tool. It is not something anybody else can install.\n\nThe words have drifted too. The same short word means two things depending\non which half of the tool a person is in, and the project now keeps a table\nto stop the confusion. A table that exists to stop confusion is a sign that\nthe product is shaped wrong, not that the words are.\n\n## Success metric\n\n**A person installs one part and uses it, without the other four.**\n\nMeasured as: the count of separately installable parts that a person can\ninstall alone and complete a real task with, starting from zero. Today that\nnumber is 1. The target is 5, and the fifth is the one that installs the\nother four together for anybody who wants everything.\n\nTwo supporting numbers, both measured on a real change carried end to end:\n\n- **Questions asked twice: 0.** A change that starts from a recorded design\n  is never re-interviewed about what it is for.\n- **Work accepted on its own word: 0.** Every unit of finished work is\n  scored by something that did not build it.\n\n## Announcement \u2014 the blog post before the feature\n\n**Five tools, one family.**\n\nCobuilder is now five separate things you can install. Take the one you\nneed. **Architect** helps you design a change before you write it, and\nrecords why. **Implement** takes that design and builds it, one small piece\nat a time, and each piece is checked by something that did not write it.\n**PR** opens your pull request, interviews you while you still remember why,\nand later turns the whole history into a story you can read. **Artifact**\nrenders any of it as a page you can share. And **Full lifecycle** installs\nall four at once, for anybody who wants the whole thing.\n\nThe parts are separate, but they are not strangers. A design you record in\nArchitect is the same design Implement builds from, and the same one that\nshows up in your pull request. You answer the question once.\n\n## Screens\n\nNo new screens. The existing viewer already renders both designs and pull\nrequests, and this work adds no page to it.\n\nOne thing a person sees that is not a screen: the install list. Five named\nentries where there was one. That list is the product surface for this work,\nand the names carry it, so they are a product decision rather than a\ntechnical one.\n\n## Prior art checked\n\n**Hindsight: unavailable.** The recall tools are advertised in this session\nbut not registered, so checkpoint H1 could not run as specified. Two\nsubstitutes were read instead, and both are recorded here so a later session\nknows what was and was not consulted.\n\n- **Ask the author, do not infer.** Recorded feedback from an earlier\n  session: when the person who did the work is present, ask them rather than\n  reconstructing intent from the diff. This is the whole reason the design\n  record exists, and it is why \"questions asked twice: 0\" is a success\n  metric rather than a nicety.\n- **The viewer stays build-free.** An earlier session chose a framework for\n  the viewer and then reversed it, because a published page blocks external\n  requests and everything would have to be inlined under a size cap. This\n  work adds no page and must not reopen that.\n\nOne stale note found and not trusted: a stored memory states that only one\nskill ships and that the writing skill is deliberately excluded. Four skills\nship today. The memory records what was true when it was written.\n", "02-architecture.md": "# Architecture: the cobuilder family\n\nGate 2. Written from three inputs, each of which stays readable on its own:\n\n- `02a-artifact-map.md` \u2014 every artifact, its format, its reader, its\n  transport, and whether that reader can answer.\n- `02b-view-designs.md` \u2014 the surface designs and the reply channel.\n- `02c-record-model.md` \u2014 the entities, their identity, and where records live.\n\nTwo further documents sit outside this plan and govern it. `CLAUDE.md`'s\nVocabulary table settles the words. `.lavish/cobuilder-vocabulary.html` records\nthe ten naming and structure decisions this work rests on.\n\nFive decision records govern this architecture:\n\n| Record | State | Covers |\n|---|---|---|\n| ADR-0016 | approved 2026-08-21 | five sibling plugins, the bundle as the only seam |\n| ADR-0017 | approved 2026-08-21 | vendored shared code, the compatibility gate |\n| ADR-0018 | approved 2026-08-21 | one lifecycle surface, the record index |\n| ADR-0019 | approved 2026-08-21 | anchored comments, the durable ledger |\n| ADR-0013 | approved | a branch may carry more than one design |\n\n## Fit\n\nThis work touches every part of the repo except the corpus.\n\n**Packaging.** One plugin becomes five in one marketplace repository:\n`cobuilder-architect`, `cobuilder-pr`, `cobuilder-implement`,\n`cobuilder-artifact`, and `cobuilder-full-lifecycle`. A `shared/` directory at\nthe marketplace root holds the four bundle-core modules and the two shared\nskills, symlinked into each plugin and dereferenced into its own cache at\ninstall.\n\n**The seam.** No plugin reads or imports another plugin's files. They\nintegrate by reading and writing one bundle directory. In domain-driven\nterms the bundle is a Published Language, not a shared kernel.\n\nA plugin may still hand off to another plugin's mode by name, and the\nlifecycle depends on that: a finished design hands off to\n`cobuilder-implement`, and a finished implementation hands off to\n`cobuilder-pr:generate`. The handoff names the mode and stops. The next mode\nreads the design directory and the bundle for itself. A named mode is a\npublic interface. A file path into another plugin's root is not.\n\n**The surface.** `viewer/index.html` grows from two modes to five: Designs,\nPull requests, Decisions, Contexts, Builds. It reads one new projection,\n`data/index.json`, which subsumes `adrs.js` and `designs.js`.\n\n**The reply channel.** The comments drawer at `viewer/index.html:705` is\nupgraded rather than replaced. Its anchor widens from a whole level to a\ncomputed selector plus a DOM range, and its clipboard hand-off gains a ledger\nbehind it.\n\n**Untouched.** The corpus under `skills/architecture/references/corpus/`, the\nGemini art and audio pipeline, and the four-level narrative model.\n\n## The one thing that is measured and must be planned\n\n**33 cross-pillar path references would break under ADR-0016.**\n\nTwenty-two point from `skills/architecture/` into `skills/odyssey/`. Eleven\npoint the other way. Counted on 2026-08-21.\n\nMost are prose citations that would merely go stale. Several resolve at\nruntime and would fail silently:\n\n- `skills/architecture/SKILL.md:222` \u2192 `${CLAUDE_PLUGIN_ROOT}/skills/odyssey/references/diagram-mode.md`\n- `skills/odyssey/references/decision-records-lite.md:21` \u2192 `${CLAUDE_PLUGIN_ROOT}/skills/architecture/SKILL.md`\n\nAfter the split, `${CLAUDE_PLUGIN_ROOT}` resolves to the caller's own cache.\nEach of these resolves to nothing.\n\n**Five more references are safe**, and the difference is the point. They point\nat `${CLAUDE_PLUGIN_ROOT}/skills/ste-writing/` and `/skills/mermaid/`, and\nADR-0017 vendors both into every plugin. So the rule is not \"cross-skill\nreferences break\". It is **cross-pillar references break, vendored shared\nskills survive**. That is the line ADR-0017 draws, now measured rather than\nargued.\n\nNone of this breaks today, because everything ships in one plugin. It was\ninvisible until a boundary record forced the question. Several of these\nreferences were created during this session, when the design-mode move\nrewrote bare `references/x.md` paths into `skills/odyssey/references/x.md`.\nThat was the right fix for a one-plugin repo and it is the wrong shape for a\nfive-plugin one.\n\n## Data\n\n### The index\n\n`<bundle-dir>/data/index.json` plus `index.js`. Derived, full rebuild, never\nauthored. Built by `build_index.py`, which replaces `build_adrs.py` and\n`build_designs.py`.\n\nEntities and their identity:\n\n| Entity | Id | New |\n|---|---|---|\n| `adr` | `ADR-NNNN` | |\n| `design` | directory name | |\n| `context` | directory name | |\n| `epic` | `<design>/<epic-id>` | scoping is new |\n| `pull_request` | integer | |\n| `slice` | `<feature>/<n>` | |\n| `boundary_rule` | `<context>/<kind>/<n>` | yes |\n| `comment` | ulid | yes |\n| `publication` | page path | |\n\nA boundary rule carries a `kind`: `forbidden-dependency`, `module-invariant`,\nor `context-map`. Three shapes, one question \u2014 what may cross this boundary.\n\n### Realisation is derived\n\nThe index holds `pull_request.state` as `open`, `merged`, or `closed`. An ADR\nreaches its pull request through `source_pr`, or through the design and epic\nthat delivered it.\n\nAn ADR's state machine describes the lifecycle of the decision. Whether the\ncode matches it is a different axis and is read from git. No ADR state is\nadded for it. This makes an approved-but-unshipped decision visible, which\nmatters immediately: ADR-0016 describes a target state that 33 references\ncurrently contradict.\n\n### Freshness\n\nThe index records a content hash per `docs/` subtree plus the git head. Any\nmode that reads it compares first and rebuilds on a mismatch, in the same\nplace `migrate_bundle.py` already runs.\n\n### Comments\n\n`<bundle-dir>/feedback/threads.ndjson`. Append-only. A read never deletes.\n\nA comment is the first record that is neither authored in `docs/` nor\nderivable from it, so it comes under the migration guard from the first\ncommit.\n\n## Flow\n\n**Design.** `architect:design` writes a design directory and an ADR. When the\ndesign needs a verified region to anchor against and no context covers it,\ndesign mode calls Describe for itself and writes the context bundle. A person\ndoes not schedule that step and does not need to know it ran. The boundary\nrecord declares `governed_by`, the reverse of the ADR's anchor, and\n`verifies`, the districts it covers. Both halves of both joins are populated\nfor the first time.\n\n**Build.** `implement` runs four gates and then slices, writing to\n`docs/plans/<feature>/`. `00-status.md` drives the Builds view.\n\n**Submit and narrate.** `pr:generate` interviews the author, assesses the\nchange against the bundle, writes the narrative, and opens the pull request.\n`pr:review` narrates the merged history afterwards.\n\n**Index.** `build_index.py` rebuilds `index.json` from all of the above plus\ngit.\n\n**Present.** `artifact:view` serves it. `artifact:publish` exports it.\n`collaborate-with-user` renders a gate or a decision as its own page.\n\n**Answer.** A reader comments on any surface. The thread appends to the\nledger. A background command blocks until the ledger grows, then exits, and\nthe harness re-invokes the session. The agent answers into the same thread\nwith `author: agent`, so the reply sits beside the sentence that prompted it\nrather than in a chat session the reader is not watching.\n\n## External\n\nNo new external service. No account. No daemon beyond the `view` server that\nalready exists.\n\nEnv var names unchanged: `GEMINI_API_KEY` for art and audio, unused by every\npart of this work.\n\nRejected, and worth recording as rejected: Postgres, because it is a service.\nA local SQLite index, because the viewer cannot read it without a WASM build.\nThe lavish CLI, because it needs Node 22, `npx`, and a background Express\nserver.\n\n## Epics\n\nSeven, revised from `plugin-split/goal.json`, which is the source of record.\nAn epic is a body of work that maps to one pull request. `04-slices.md` breaks\neach into vertical, testable slices.\n\n| Epic | Work | Slices |\n|---|---|---|\n| E1 | One plugin becomes five: the renames, the deleted duplicate command, the 33 cross-pillar references, the five manifests, and the two ports. | 4, 5, 6, 7 |\n| E2 | Shared code survives an install. A spike, because `abort_if` names its failure as a reason to stop. | 1 |\n| E3 | The seam is version-safe: `require_compatible()`, `min_reader_schema`, the generators map, schema 1.3. | 2, 3 |\n| E4 | The record index: `build_index.py`, every entity, every join. | 8, 9 |\n| E5 | One lifecycle surface: the three new modes, the Backlog lane, and pages moved into the bundle. | 10, 11 |\n| E6 | The reply channel: the ledger, the projection, the anchor, the endpoint, the wake command. | 12, 13, 14 |\n| E7 | Threads read as conversations. Deferred past E6 on purpose, so it carries no slice. | none |\n\nAn epic with a null branch is a backlog item, so the backlog needs no file of\nits own. The Builds view's Backlog lane is a query over that list.\n\n## Least confident decisions\n\n1. **The symlink dereference for a directory of Python.** Documented for a\n   meta-plugin's `skills/` directory, not for code a skill later runs through\n   `${CLAUDE_PLUGIN_ROOT}`. E2 exists to find out. The fallback is a copy step\n   before publish.\n2. **Five modes in one viewer.** The prototype at\n   `.lavish/decisions-register.html` proves the data supports a Decisions\n   view. It does not prove the mode switch stays navigable at five.\n3. **A selector anchor surviving a regenerated page.** `quote` is the recovery\n   path, and it is human-readable rather than automatic.\n4. **The background poll as the wake path.** It is the only one the install\n   surface allows. It has not been run here.\n\n## Resolved since the first draft\n\n**The write endpoint lands with the anchor, inside E6.** The draft left this\nopen. It is closed. The local viewer is where the reading happens, and a\ncomment held in `localStorage` before the ledger exists has no id and no\nmigration guard. Deferring the endpoint defers the only half that matters.\nSee ADR-0019.\n\n**A district joins to a context.** A boundary record declares `verifies`,\nnaming the districts it covers. Without that edge the inferred layer carried\nno weight, and the 15 ADRs anchored to a district resolved to nothing. With\nit, an existing anchor starts resolving, and a district no context covers\nbecomes the describe backlog. See ADR-0018.\n\n## Prior art\n\nHindsight was unavailable at H1 and again at H2 \u2014 the tools are advertised in\nthis session but not registered. Two substitutes were read and are cited in\n`01-product.md`. Both shaped the work: *ask the author, do not infer* became a\nsuccess metric, and *the viewer stays build-free* is the constraint that ruled\nout SQLite.\n", "02a-artifact-map.md": "# Artifact and transport map: architect:design \u2192 cobuilder-implement\n\nA Gate 2 input. Every artifact the lifecycle produces, grouped by the place a\nperson actually reads it.\n\n## Reading surface \u2014 the organising idea\n\nAn earlier version of this map listed 41 artifacts one per row. That over-counts\nwhat a person experiences. A reader does not open eleven files to review a pull\nrequest. They open one viewer page, and eleven artifacts converge inside it.\n\nA **reading surface** is one place a person looks. Seven exist.\n\n| Surface | What it is | Artifacts that land there |\n|---|---|---|\n| Viewer | the bundle page, over localhost or as a published export | 11 |\n| Chat | the session, including `AskUserQuestion` | 3 |\n| Git diff | a reviewer opening the change | 11 |\n| GitHub PR | the pull request page | 1 |\n| Report file | a standalone HTML file opened in a browser | 3 |\n| Artifact page | a published page with a URL | 3 |\n| None | machine input, never rendered for a person | 9 |\n\n**Direct** means the person sees the artifact itself: a PNG, a rendered\nMarkdown file, an HTML page. **Indirect** means a script compiles it first and\nthe person reads the result: `narrative.json` becomes prose in the viewer,\nnever JSON on a screen.\n\n## The map, grouped by surface\n\n### Surface: the viewer \u2014 11 artifacts, one page\n\nA person opens one page and reads a pull request at four levels, or a design.\nEvery row below is a component of that single reading experience.\n\n| Artifact | Produced by | Format | Direct | Return path |\n|---|---|---|---|---|\n| `story.json` narrative, 4 levels | `pr:review` | JSON \u2192 `story.js` | indirect | none |\n| `assets/pr-N/level-{1,2,3}.png` | `pr:review` | PNG | direct | none |\n| `data/audio/prN_<level>.wav` | `pr:review` | WAV | direct | none |\n| `diffs-prN.js` | `pr:review` | JS projection | indirect | none |\n| `adrs.json` + `adrs.js` | `pr:review` | JSON \u2192 JS | indirect | none |\n| `data/diagrams/prN-level{1,2,3}.mmd` | `pr:review` | Mermaid \u2192 `diagrams.js` | direct | none |\n| `narrative.json` | `design` st.5 | JSON \u2192 `designs.js` | indirect | none |\n| `goal.json` | `design` st.5 | JSON \u2192 `designs.js` | indirect | none |\n| `intent.json` | `design` st.5 | JSON \u2192 `designs.js` | indirect | none |\n| `assessment.json` | `design` st.5 | JSON \u2192 `designs.js` | indirect | none |\n| `designs/<name>/diagrams/level-{1,2,3}.mmd` | `design` st.5 | Mermaid \u2192 `designs.js` | direct | none |\n\n**Nothing on this surface can be answered.** The viewer is read-only, served\nover localhost, and it carries no way to record a reaction.\n\n### Surface: chat \u2014 3 artifacts\n\n| Artifact | Produced by | Format | Direct | Return path |\n|---|---|---|---|---|\n| interview questions | `design` st.0\u20132 | `AskUserQuestion` | direct | direct answer |\n| round churn verdict | `design` st.6 | chat | direct | direct answer |\n| slice score 0.00\u20131.00 | `implement` slice | number | direct | retry or escalate |\n\nFastest return path in the map. It dies with the session unless something\nwrites it to disk.\n\n### Surface: a git diff \u2014 11 artifacts\n\n| Artifact | Produced by | Format | Direct | Return path |\n|---|---|---|---|---|\n| `ADR-NNNN-<slug>.md` | `design` st.5 | Markdown | direct | git review |\n| `pr-draft.md` | `design` st.5 | Markdown | direct | git review |\n| `contexts/<id>/canvas.md` | `describe` | Markdown | direct | git review |\n| `contexts/<id>/boundary.yaml` | `describe` | YAML | direct | git review |\n| `assessment.md` | `pr:assess` | Markdown | direct | git review |\n| `00-status.md` | `implement` G1\u2013G4 | Markdown | direct | chat approval |\n| `01-product.md` | `implement` G1 | Markdown | direct | chat approval |\n| `02-architecture.md` | `implement` G2 | Markdown | direct | chat approval |\n| `03-program-design.md` | `implement` G3 | Markdown | direct | chat approval |\n| `04-slices.md` | `implement` G4 | Markdown | direct | chat approval |\n| failing tests | `implement` slice | source | direct | test run |\n\n### Surface: the GitHub pull request \u2014 1 artifact\n\n| Artifact | Produced by | Format | Direct | Return path |\n|---|---|---|---|---|\n| `description.md` | `pr:generate` | Markdown \u2192 GitHub | direct | PR review comments |\n\nThe richest return path in the map, and exactly one artifact reaches it.\n\n### Surface: a standalone report file \u2014 3 artifacts\n\n| Artifact | Produced by | Format | Direct | Return path |\n|---|---|---|---|---|\n| Technical report | `architect:review` | HTML | direct | **none** |\n| Founder report | `architect:review` | HTML | direct | **none** |\n| `mockups/*.html` | `implement` G1 | HTML | direct | chat iteration |\n\n### Surface: a published Artifact page \u2014 3 artifacts\n\n| Artifact | Produced by | Format | Direct | Return path |\n|---|---|---|---|---|\n| `exports/pr-N.html` | `artifact:publish` | HTML, inlined | direct | Artifact comments |\n| `exports/index.html` | `artifact:publish` | HTML | direct | Artifact comments |\n| `.lavish/<slug>.html` | `collaborate-with-user` | HTML | direct | comments, chat |\n\n### Surface: none \u2014 9 artifacts, machine input only\n\n| Artifact | Produced by | Format | Why no surface |\n|---|---|---|---|\n| `inventory.yaml` | `baseline` | YAML | grounding input for later stages |\n| `story.json` world + districts | `baseline` | JSON | grounding input |\n| divergent options + critic verdicts | `design` st.3 | none | **not written to disk at all** |\n| first branch | `design` st.7 | git ref | state, not a document |\n| `rubrics/manifest.yaml` | `implement` G4 | YAML | hidden from the implementer on purpose |\n| `rubrics/slice-N.md` | `implement` G4 | Markdown | hidden from the implementer on purpose |\n| `evidence/slice-N-attempt-M.md` | `implement` slice | Markdown | loop feedback, gitignored |\n| `branch-<slug>/intent.json` | `pr:generate` | JSON | the join key, consumed by `pr:review` |\n| `publish-manifest.json` | `artifact:publish` | JSON | staleness record |\n\n## Formats, and what each one is for\n\n- **JSON** is the agent-to-agent format. Nothing renders it directly.\n- **YAML** carries authored, human-editable machine records.\n- **Markdown** is the only format both a person and an agent read well, and it\n  is the source of record for every decision.\n- **JS projection** exists for one reason: the viewer is a static page that\n  loads sibling `<script src>` tags. Every projection is a full rebuild.\n- **HTML** is human-only and terminal. Nothing downstream reads it.\n- **PNG and WAV** are paid and unrecoverable. This is why the migration guard\n  refuses to write rather than regenerate.\n\n## Findings\n\n**F1 \u2014 Three HTML conventions, three destinations, three rule sets.**\n`architect:review` writes paired reports to `docs/architecture/review/`.\n`export_artifact.py` inlines a bundle into `exports/pr-N.html`.\n`collaborate-with-user` writes `.lavish/<slug>.html`. All three build a\nself-contained page for a person. None shares a template, a palette, or a\ndestination.\n\n**F2 \u2014 The viewer is the largest reading surface and the only silent one.**\nEleven artifacts converge there, more than any other surface, and none of them\ncan be answered. A person reads a whole pull request as a story and has nowhere\nto put a reaction.\n\n**F3 \u2014 The review reports are the sharpest case.** They are the longest\nhuman-facing output in the system, they carry severity ratings and a phased\nremediation plan, and nothing captures the reader's response.\n\n**F4 \u2014 Divergent exploration persists nothing.** Stage 3 runs isolated frames\nand a critic that scores every candidate, flags traps with reasoning, and stars\nnon-obvious survivors. Only the survivors reach the ADR. This happened in this\nsession: five frames and a critic pass produced material that exists only in\nthe transcript.\n\n**F5 \u2014 Two artifacts hide from a reader on purpose.** The rubrics are written\nfor the validator and withheld from the implementer. Every other artifact wants\nmore readers, not fewer.\n\n**F6 \u2014 Indirect artifacts outnumber direct ones on the viewer surface.** Seven\nof the eleven are compiled before a person sees them. The format answers to the\ntransport rather than to either party.\n\n## Open questions\n\n1. Should the three HTML conventions in F1 converge under `cobuilder-artifact`,\n   or stay separate because they answer to different readers?\n2. Should the viewer surface gain a return path? It is the biggest reading\n   surface in the system and the only large one with no way to reply.\n3. Should stage 3 write its critic output to disk? An `exploration.json` beside\n   `intent.json` would preserve the traps and the scores.\n\n## Unverified\n\n- Artifact comments are documented as a return path. This session has not\n  tested one end to end.\n- Every `implement` row is read from `~/.claude/skills/cobuilder-factory/`, a\n  personal skill outside this repo. It has not been ported, so those rows\n  describe a prototype rather than shipped behaviour.\n", "02b-view-designs.md": "# Three view designs and one response channel\n\nA Gate 2 input, following the artifact map in `02a-artifact-map.md`.\n\n## Settled before designing\n\n**F1 is resolved.** The three HTML conventions serve different readers and\nstay separate. One publish-and-respond mechanism serves all three. A page\ndeclares whether it needs an answer. The mechanism does not care which\nconvention produced it.\n\n**F4 and F5 are accepted as they stand.** Divergent exploration persists\nnothing, and the rubrics stay blind. Neither needs a change.\n\n**One correction to the grouping.** ADRs and bounded contexts are not\npull-request documents. An ADR outlives the change that introduced it, which\nis why `docs/architecture/adr/` is a flat store. `canvas.md` and\n`boundary.yaml` describe a part of the system and are tied to no change at\nall. Only `pr-draft.md` and `assessment.md` are pull-request scoped, and\n`assessment.md` already renders in the viewer's assessment sheet.\n\nChecked against `viewer/index.html`: it holds no reference to\n`docs/architecture/contexts/`, to a canvas, or to a boundary record. The four\nmatches for those words are narrative `kind` labels and\n`assessment.boundary_checks`, which are unrelated. **Bounded contexts have no\nsurface anywhere.** That is the real gap, and it is narrower than \"the pull\nrequest documents need an interface\".\n\n## Design A \u2014 the Build view\n\n**Problem.** `01-product.md` through `04-slices.md` are four documents that\ndescribe one thing: the state of a build. A reader opens four files and\nassembles the picture themselves.\n\n**The insight.** `00-status.md` is not a fifth document to display. It is the\n**state that drives the view**. Approval marks, slice checkmarks, and scores\nare chrome, not content. Treat it as the model and the other four become\npanels inside one page.\n\n**Shape.** A vertical spine, because the gates are sequential and stateful.\nTabs would hide exactly the thing a reader needs: how far along this is.\n\n- A **gate rail** down the left. Four gates, each with its state. The current\n  gate is expanded. An approved gate collapses to one line with its date.\n- The **panel** shows the current gate's document, rendered.\n- A **slice ladder** below the gates. One row per slice, with its score, its\n  attempt count, and its state. An escalated slice is marked, never hidden.\n  The ladder is grouped epic-first, with each epic's slices nested under it,\n  never rendered as a flat slice list with an epic column.\n- The **pending question** is pinned at the bottom, as\n  `collaborate-with-user` requires.\n\n**What it replaces.** Nothing. The five markdown files stay the source of\nrecord. This view presents them.\n\n## Design B \u2014 the Contexts view\n\n**Problem.** Describe mode produces the most carefully verified artifact in\nthe system. Every claim in a `boundary.yaml` is grep-checked against real\nimport edges. None of it is visible anywhere.\n\n**Shape.** A map, not a document list. A bounded context is defined by its\nedges, so the edges are the view.\n\n- A **context grid**. One card per context, showing its modules, its public\n  interface, and its count of forbidden dependencies.\n- Opening a card shows the canvas, and the boundary record beside it as a\n  rule list rather than as YAML.\n- A **violations lane**, shown first when any exists. Describe mode records a\n  boundary violation as a `forbidden_dependencies` entry with a `why` and\n  flags it as an ADR candidate. That flag is a call to action and belongs at\n  the top of the view, not inside a card.\n- Every rule links to the ADR that governs it, through `maps_to.context`.\n  This is the join the ADR template already declares and nothing renders.\n\n**Why this and not a pull-request view.** The pull-request documents already\nhave surfaces. Contexts have none, and they are the artifact whose verification\ncost is highest.\n\n**The join is declared and empty.** A flat ADR store is correct only while the\nrecords are referenced from somewhere. Counted against the tree today:\n\n- 3 designs reference ADRs through `goal.json.adrs[]`, and the viewer renders\n  that.\n- 17 of 17 ADRs declare a `maps_to` block.\n- **15 of 17 carry `unanchored: true`** and map to a *district* rather than a\n  *context*. A district is the inferred, unverified concept. A context is the\n  grep-verified one. The template asks for a context and the corpus gives a\n  district.\n- The 2 anchored records are ADR-0016 and ADR-0017, written yesterday, and the\n  context they name does not exist yet.\n\nSo the reference that would justify the flat store is declared everywhere and\nresolves nowhere. The Contexts view is what renders that join, and writing the\nfirst `boundary.yaml` is what gives it something to render.\n\nOne stale value found while counting: one ADR maps to a district named\n`.prodyssey`, from before the rename.\n\n## Design C \u2014 the response channel\n\n> **ADR-0019 supersedes three points below.** The build-time `data-fb` anchor\n> is rejected in favour of a selector computed from the live DOM at annotation\n> time. The local write endpoint is decided rather than open, and lands in the\n> same epic as the anchor. And the drawer opens on a click on any element,\n> with the page shifted so the reader still sees the text they are commenting\n> on. The rest of this section stands.\n\n**Problem.** The viewer is the largest reading surface and carries no way to\nreply. A person reads a whole pull request and has nowhere to put a reaction.\n\n**The principle.** Do not invent a comment model. The Claude Artifact platform\nalready ships one that works: a thread anchored to a page, a reply from the\nagent, and a resolve. Model the local channel on that same shape, so both\ncollapse into one inbox rather than two.\n\n**The thread record.** One line appended to\n`<bundle-dir>/feedback/threads.ndjson`:\n\n```json\n{\"id\":\"t7\",\"surface\":\"viewer\",\"anchor\":\"pr-11/level-2/para-3\",\n \"quote\":\"the migration ladder runs in memory\",\"body\":\"is this still true after the split?\",\n \"author\":\"human\",\"ts\":\"2026-08-21T14:02:00Z\",\"state\":\"open\"}\n```\n\n- `anchor` is a stable id emitted into the rendered page as `data-fb`. A\n  paragraph, a diagram, a finding, a table row. Anything a reader can point at\n  gets one.\n- `state` is `open`, `answered`, or `resolved`, matching the Artifact model.\n- The agent reads the file, acts, appends a reply line, and resolves.\n\n**Two transports, one record.**\n\n| Surface | How a comment arrives | Status |\n|---|---|---|\n| Published Artifact page | native comment threads | **works today**, no new code |\n| Local viewer | the view server accepts a POST and appends a line | **needs a decision**, see below |\n\n**The decision this forces.** `view` mode currently serves static files with\n`python3 -m http.server`. A POST endpoint makes it a small application. That\nis a real change and it is the cost of the local half. Three ways out:\n\n1. **Publish to comment.** Do nothing locally. A reader who wants to comment\n   publishes the bundle and comments there. Zero new code. It makes commenting\n   a deliberate act rather than an available one.\n2. **A write endpoint.** Replace the bare server with a small handler that\n   accepts `POST /feedback` and appends to the file. Roughly 40 lines. It keeps\n   the install surface unchanged, because it is a script and not a hook.\n3. **Clipboard hand-off.** The viewer holds comments in `localStorage` and a\n   button copies them as one JSON block the person pastes into chat. No server\n   change, and it needs a manual step every time.\n\nOption 2 is the honest one. Option 1 is a real answer if publishing is going to\nbe the default anyway, which open question 2 in `02a` already asks.\n\n**What a comment must carry to be useful.** The quote. A reaction with no\nanchor forces the agent to guess what it refers to, which is the same\nreconstruction problem the whole plugin exists to remove.\n\n## Open questions\n\n1. Which of the three transports for the local viewer? Option 2 is\n   recommended and it changes what `view` mode is.\n2. Does the Build view live in the bundle viewer as a third mode beside\n   Designs and Pull requests, or as a `.lavish` page per feature? The bundle\n   viewer is per-repo and a build is per-feature, which argues for the second.\n3. Does the Contexts view justify a new projection, `contexts.js`, built by a\n   new script? Every other viewer surface has one. This would be the fifth.\n\n## Unverified\n\n- Artifact comment threads are documented and this session has not run one end\n  to end. Design C's \"works today\" column rests on documentation.\n- Line counts for option 2 are an estimate, not a measurement.\n", "02c-record-model.md": "# The record model\n\nA Gate 2 input. What the lifecycle tracks, how the entities join, and where\nthe records live.\n\n## The proposal, and the constraint it meets\n\nThe proposal is a small database that tracks ADRs, pull requests, boundaries,\nand implementations. The need behind it is real and already measured in\n`02b`: 17 of 17 ADRs declare a `maps_to` join, 15 resolve to a district rather\nthan a context, and ADR-0013 is reachable from nowhere in the viewer.\n\n**Postgres is out.** It is a service. The install surface is `/plugin install`\nand nothing else, with no agents, no hooks, and no MCP servers. That rule just\ndisqualified the lavish CLI for the same reason, and it applies here.\n\n**SQLite deserves a hearing, because it is a file and not a service.** It ships\nin the Python standard library, needs no install, and would give real query\nsemantics. It still loses, for one decisive reason: **the viewer cannot read\nit.** `viewer/index.html` loads six `<script src=\"../data/*.js\">` files that\nassign window globals, and `export_artifact.py` inlines each one as literal\nJSON into a published page. Reaching SQLite from either path needs a WASM\nbuild, which breaks the buildless-viewer rule and pushes against the 16 MiB\nartifact budget. A SQLite store would serve scripts and not the viewer, which\nmeans two stores for one set of facts.\n\n**So the answer is JSON, and it is forced rather than settled for.** The\nprimary consumer decides the format.\n\n**The engine is the reversible half of this decision.** What makes state\nreferenceable is stable identity and resolvable joins, not the store that\nholds them. Get the ids right and a local SQLite file can be added later as a\nbuild-time index without touching a single authored record. Get the ids wrong\nand no engine helps. So identity is the decision to make carefully now, and\nthe engine is the one to defer.\n\n**The threshold that would earn SQLite.** A JSON index answers a lookup by id\nand a one-hop join by loading the file. It does not answer an arbitrary\ntraversal without loading everything: which ADRs govern the contexts touched\nby pull requests merged after a date, for example. When a real question needs\nthat, SQLite becomes a build-time index beside `index.json`, not a\nreplacement for it. Until then it is a third layer with no reader.\n\n## We already have the database\n\n`story.json`, `adrs.json`, `designs.js`, `inventory.yaml`, and\n`publish-manifest.json` are tables in a file-based store. It has a\n`schema_version`, a migration ladder, and an authored-field guard.\n\nWhat is missing is not an engine. It is three things:\n\n1. **A declared entity model.** No file states what a design, an epic, a\n   context, and a pull request are to each other.\n2. **Stable identity across types.** An ADR has an id. A context has a\n   directory name. An epic has an id scoped to one design. A boundary rule has\n   nothing.\n3. **An index that resolves the joins.** Every join is declared in the\n   authored source and none is resolved anywhere, which is why an ADR is\n   reachable only when a change happens to cite it.\n\n## Terms \u2014 context, boundary, rule, module\n\nFour terms were in play and the earlier draft collapsed two of them. Read from\n`references/templates/boundary-template.yaml`, they are distinct.\n\n| Term | What it is | Cardinality |\n|---|---|---|\n| **district** | An inferred region, derived by baseline for any repo. Never verified against import edges. A context claims the districts it verifies, so a district is the coarse map and a context is a surveyed part of it. | many per repo |\n| **context** | A verified region. Carries a stable `id`, a `path`, and a `public_interface`. The entity. | many per repo |\n| **boundary record** | The `boundary.yaml` file. The machine-diffable statement of one context's edges. The artifact. | exactly 1 per context |\n| **boundary rule** | One constraint inside that record. | many per record |\n| **module** | A C3-level unit inside a context, carrying its own invariant. | many per context |\n\nA context is *the region*. A boundary is *where the region ends and what may\ncross*. A context with no boundary record is a name. The boundary record is\nwhat makes it checkable.\n\n**A boundary rule has three shapes, not one.** The earlier draft proposed a\nsingle `boundary_rule` entity keyed `<context>/<n>`, which flattens three\ndifferent things:\n\n1. `forbidden_dependencies[]` \u2014 an edge prohibition. `{target, from?, why}`. A\n   violating edge with no approving ADR is drift.\n2. `modules[].rule` with `allowed_inbound` and `allowed_outbound` \u2014 a\n   per-module invariant. `allowed_outbound: []` means a leaf, and it is the\n   strongest checkable rule in the schema.\n3. `context_map[]` \u2014 the integration pattern with one neighbour:\n   `shared-kernel`, `anti-corruption-layer`, `conformist`,\n   `open-host-service`, or `partnership`.\n\nThey share one question \u2014 what may cross this boundary \u2014 so they stay one\nentity with a `kind` discriminator rather than three tables.\n\n**The ADR join is already bidirectional, and both halves are empty.** An ADR\ndeclares `maps_to.context`. A boundary record declares `governed_by: []`. The\ntemplate ships both. Nothing populates either.\n\n## Entities and relations\n\n```\ndesign \u2500\u2500< epic \u2500\u2500? pull_request\n  \u2502                     \u2502\n  \u2502                     \u251c\u2500\u2500< comment\n  \u2502                     \u2514\u2500\u2500> adr *\n  \u251c\u2500\u2500> adr *\n  \u2514\u2500\u2500< gate \u2500\u2500< slice \u2500\u2500< score\n\nadr \u2500\u2500> context          (maps_to, today mostly unresolved)\nadr \u2500\u2500> district         (maps_to when unanchored)\ncontext \u2500\u2500< district     (boundary.verifies, the edge that resolves the above)\nadr \u2500\u2500> adr              (related_decisions, typed edges)\ncontext \u2500\u2500< boundary_rule\nboundary_rule \u2500\u2500? adr    (a violation is an ADR candidate)\n\ncomment \u2500\u2500> any entity   (plus a DOM anchor, see 02b Design C)\npage \u2500\u2500< publication     (url, content hash, published_at)\n```\n\nCardinality worth stating, because both are already load-bearing:\n\n- An epic maps to **zero or one** pull request, through `epics[].branch`.\n- A branch may carry **more than one** design. ADR-0013 settles this.\n\n## Identity\n\nEvery entity needs one stable id that survives a rebuild.\n\n| Entity | Id | Source |\n|---|---|---|\n| `adr` | `ADR-NNNN` | the filename, already stable |\n| `design` | directory name | already stable |\n| `epic` | `<design>/<epic-id>` | scoped, because `E1` repeats across designs |\n| `context` | directory name | already stable |\n| `boundary_rule` | `<context>/<kind>/<n>` | **new** \u2014 no id today. `kind` is forbidden-dependency, module-invariant, or context-map |\n| `pull_request` | integer | already the timeline key |\n| `slice` | `<feature>/<n>` | already implied by the status file |\n| `comment` | ulid | **new** |\n| `publication` | page path | already the manifest key |\n\nTwo of these do not exist yet. That is the smallest change the model needs.\n\n## Where records live\n\nThe existing rule holds: **authored source lives in `docs/`, derived\nprojections live in the bundle.**\n\n- `docs/` stays the source for designs, ADRs, contexts, and plans. A person\n  edits them. Git reviews them.\n- `<bundle-dir>/data/index.json` and `index.js` are **derived**. A new\n  `build_index.py` rebuilds them in full from `docs/` plus git, the same rule\n  `build_adrs.py` and `build_designs.py` already follow. Never a merge, never\n  authored by hand.\n\n**One exception, and it is new.** A comment is authored by a reader at read\ntime and has no home in `docs/`. It is the first record the lifecycle produces\nthat is neither authored source nor derivable from it. It gets its own\nappend-only store at `<bundle-dir>/feedback/threads.ndjson`, and the index\nreads it without owning it.\n\nThat asymmetry deserves naming rather than smoothing over. Everything else in\nthe bundle can be regenerated from `docs/` and git. Comments cannot. They join\nthe paid art and the authored narrative as content a rebuild would destroy,\nwhich puts them under the same migration guard.\n\n## The comment record\n\nAgreed shape, combining the anchor from the lavish CLI with a durable ledger:\n\n```json\n{\"id\":\"01JCXZ...\", \"state\":\"open\",\n \"entity\":{\"type\":\"pull_request\",\"id\":11,\"level\":2},\n \"anchor\":{\"selector\":\"div.level-stack > p:nth-of-type(3)\",\n           \"range\":{\"start\":[0,14],\"end\":[0,61]},\n           \"quote\":\"each carries its own vendored copy\"},\n \"body\":\"is this still true after the split?\",\n \"author\":\"human\", \"ts\":\"2026-08-21T14:02:00Z\",\n \"queue_key\":\"pr11/l2/p3\"}\n```\n\n- **`anchor.selector` is computed at annotation time from the live DOM**, not\n  written into the page at build time. The lavish CLI walks up to five\n  ancestors, short-circuits on a real `id`, and falls back to `:nth-of-type`.\n  Any element becomes annotatable with no pre-tagging.\n- **`anchor.range`** carries DOM range boundaries so a mid-sentence selection\n  survives. `quote` is the human-readable fallback when a selector goes stale.\n- **`state`** is `open`, `answered`, or `resolved`. The lavish CLI has no\n  equivalent for a human comment, and its `takeFeedback()` deletes a prompt on\n  delivery. Verified: all 18 sessions in `~/.lavish-axi/state.json` hold\n  `prompts: []`.\n- **`queue_key`** deduplicates a re-annotated spot before it is sent. Taken\n  from `_lavishQueueKey`.\n- **Machine-detected issues stay in a separate channel.** The lavish CLI keeps\n  layout warnings apart from human prompts, and that separation is right. An\n  automated finding must not compete with human intent in one inbox.\n\n## What already exists and must not be rebuilt\n\n`viewer/index.html:705` already ships a comments drawer. It takes a\nlevel-tagged comment, keeps a list, persists to `localStorage` under\n`odyssey-f:<repo>:<pr>`, and offers **Copy review as markdown**.\n\nThat is the clipboard transport, already working. The change is an upgrade in\ntwo steps, not a new subsystem:\n\n1. Widen the anchor from a whole level to a computed selector plus a range.\n2. Replace the clipboard hand-off with an append to the ledger.\n\n## Decided\n\n1. **One `index.json`**, referencing everything else. Not one file per entity type.\n2. **The index incorporates `adrs.js` and `designs.js`** rather than sitting\n   beside them. `build_index.py` subsumes `build_adrs.py` and `build_designs.py`.\n3. **Comments live in their own file**, separate from the index.\n4. **Comments join the migration guard from the first commit.**\n5. **The index tracks its source folders** so staleness is detectable.\n6. **The write endpoint is designed now** and built after the terms, the\n   human-facing documents, and the index are settled.\n\n## Index freshness\n\nThe index is derived, so it goes stale the moment an authored file changes. It\nrecords what it was built from:\n\n```json\n\"sources\": {\n  \"docs/architecture/adr\":      {\"files\": 17, \"hash\": \"sha256:...\"},\n  \"docs/architecture/designs\":  {\"files\": 3,  \"hash\": \"sha256:...\"},\n  \"docs/architecture/contexts\": {\"files\": 2,  \"hash\": \"sha256:...\"},\n  \"docs/plans\":                 {\"files\": 5,  \"hash\": \"sha256:...\"},\n  \"docs/pull-requests\":         {\"files\": 8,  \"hash\": \"sha256:...\"},\n  \"git\":                        {\"head\": \"642ecb3\"}\n}\n```\n\nEach entry is a content hash over the tracked files in that directory. Any mode\nthat reads the index compares the hashes first and rebuilds on a mismatch, the\nsame way `migrate_bundle.py` already runs before every mode. This is what makes\na full-rebuild projection safe to trust.\n\n## The background poll\n\nA `POST /feedback` endpoint closes the loop only if something reads it. The\nagent must find new threads without a person asking it to.\n\nClaude Code can run a shell command in the background, and the harness\nre-invokes the session when that command exits. So the poll is a background\ncommand that blocks until the ledger grows, then exits. That is the pattern the\nlavish CLI uses, and it is the only wake path available without a hook or an\nMCP server.\n\nTwo rules make it safe:\n\n- The poll exits on a timeout as well as on new feedback, so a session never\n  waits forever on a reader who left.\n- The ledger is append-only and the reader tracks its own offset. Unlike the\n  lavish CLI's `takeFeedback()`, a read must never delete.\n\n## Still open\n\nWhether the write endpoint or default publishing lands first. Deferred until\nthe terms, the human-facing documents, and the index are settled.\n\n## Unverified\n\n- The selector walk and the range capture are read from the lavish CLI source\n  at `dist/cli.mjs` around lines 5037 and 5354. They are read, not run.\n- No estimate is offered for `build_index.py`. The scope depends on question 2.\n", "03-program-design.md": "# Program Design: the cobuilder family\n\nGate 3. The decisions an agent would otherwise make silently while\nimplementing Gate 2. Every one of them is cheap to change here and expensive\nto change once a slice has landed.\n\nGoverned by ADR-0016, ADR-0017, ADR-0018, and ADR-0019. Where this document\nand an ADR disagree, the ADR wins and this document is wrong.\n\n## Files\n\n### The repository becomes a marketplace\n\n```\n.claude-plugin/marketplace.json        one file, five plugin entries\nshared/                                 vendored by symlink into each plugin\n  _bundle_meta.py\n  _manifest.py\n  migrate_bundle.py\n  verify_bundle.py\n  skills/ste-writing/\n  skills/mermaid/\nplugins/\n  cobuilder-architect/\n  cobuilder-pr/\n  cobuilder-implement/\n  cobuilder-artifact/\n  cobuilder-full-lifecycle/\ntests/                                  new, see Test plan\n```\n\n`shared/` sits at the marketplace root and each plugin carries a symlink to\nit at `<plugin>/shared`. The install copy dereferences the link, so each\nplugin's cache holds its own real copy. This is the mechanism ADR-0017\nchose and the one E2 exists to prove.\n\n### Where each existing file lands\n\n| From | To | Why |\n|---|---|---|\n| `skills/architecture/` | `cobuilder-architect` | design, review, maintenance, decisions, describe, debug \u2014 six modes, since `explore-design` is deleted |\n| `skills/odyssey/` | `cobuilder-pr` | baseline, generate, review. `view` and `publ
