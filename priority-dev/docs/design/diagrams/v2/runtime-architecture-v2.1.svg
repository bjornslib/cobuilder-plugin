<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 630" role="img" aria-labelledby="rt-title rt-desc">
<title id="rt-title">priority.dev runtime architecture, version 2.1 (proposal)</title>
<desc id="rt-desc">Runtime components of priority.dev, grouped by boundary. Nodes marked pending are proposed by the design. Each edge names its protocol.</desc>
<style>
.bd{fill:var(--svg-bd,none);stroke:var(--svg-bd-line,#9aa4b2);stroke-width:1.2;stroke-dasharray:6 4}
.bt{font:600 12px system-ui,sans-serif;fill:var(--svg-muted,#5b6575);letter-spacing:.06em;text-transform:uppercase}
.nr{fill:var(--svg-node,#ffffff);stroke:var(--svg-ink,#1f2937);stroke-width:1.4}
.nx{fill:var(--svg-node,#ffffff);stroke:var(--svg-ink,#1f2937);stroke-width:1.4;stroke-dasharray:5 3}
.nt{font:600 12px system-ui,sans-serif;fill:var(--svg-ink,#1f2937)}
.ns{font:400 10.5px system-ui,sans-serif;fill:var(--svg-muted,#5b6575)}
.pb{fill:var(--svg-pending,#f4c36a);stroke:none}
.pt{font:700 8.5px system-ui,sans-serif;fill:#2b1d00;letter-spacing:.04em}
.ed{fill:none;stroke:var(--svg-ink,#1f2937);stroke-width:1.3;marker-end:url(#arr)}
.el{font:400 10px system-ui,sans-serif;fill:var(--svg-ink,#1f2937);paint-order:stroke;stroke:var(--svg-page,#ffffff);stroke-width:3.5px;stroke-linejoin:round}
.ed2{fill:none;stroke:var(--svg-ink,#1f2937);stroke-width:1.3;marker-start:url(#arr);marker-end:url(#arr)}
.ar{fill:var(--svg-ink,#1f2937)}
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ar" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<g id="bound-infra"><title>Infra boundary: your Mac, where the sessions run</title>
<rect class="bd" x="20" y="250" width="240" height="360" rx="10"/>
<text class="bt" x="32" y="270">infra: your Mac</text></g>
<g id="bound-api"><title>API boundary: the resident service in a Docker container</title>
<rect class="bd" x="290" y="140" width="950" height="480" rx="10"/>
<text class="bt" x="302" y="160">api: Docker container (Docker Desktop)</text></g>
