<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 430" role="img" aria-labelledby="loop2-t loop2-d">
<title id="loop2-t">priority.dev roles and action loop</title><desc id="loop2-d">The interpreter proposes, the policy decides, and the actuator re-checks and sends. A deny, an ask, or a failed re-check goes to the human through the attention queue.</desc>
<style>
.bd{fill:var(--svg-bd,none);stroke:var(--svg-bd-line,#9aa4b2);stroke-width:1.2;stroke-dasharray:6 4}
.bt{font:600 12px system-ui,sans-serif;fill:var(--svg-muted,#5b6575);letter-spacing:.06em;text-transform:uppercase}
.nr{fill:var(--svg-node,#ffffff);stroke:var(--svg-ink,#1f2937);stroke-width:1.4}
.nh{fill:var(--svg-hi,#dcecef);stroke:var(--svg-ink,#1f2937);stroke-width:1.8}
.nx{fill:var(--svg-node,#ffffff);stroke:var(--svg-ink,#1f2937);stroke-width:1.4;stroke-dasharray:5 3}
.nt{font:600 13px system-ui,sans-serif;fill:var(--svg-ink,#1f2937)}
.ns{font:400 11px system-ui,sans-serif;fill:var(--svg-muted,#5b6575)}
.ed{fill:none;stroke:var(--svg-ink,#1f2937);stroke-width:1.4;marker-end:url(#arr)}
.el{font:400 11px system-ui,sans-serif;fill:var(--svg-ink,#1f2937);paint-order:stroke;stroke:var(--svg-page,#ffffff);stroke-width:3.5px;stroke-linejoin:round}
.ar{fill:var(--svg-ink,#1f2937)}
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ar" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<g id="n-int"><title>Interpreter: proposes (uses a model)</title><rect class="nr" x="30" y="150" width="200" height="64" rx="12"/><text class="nt" x="130.0" y="177" text-anchor="middle">Interpreter</text><text class="ns" x="130.0" y="195" text-anchor="middle">proposes (uses a model)</text></g>
<g id="n-pol"><title>Policy: decides: ALLOW, DENY, or ASK</title><rect class="nh" x="310" y="150" width="230" height="64" rx="12"/><text class="nt" x="425.0" y="177" text-anchor="middle">Policy</text><text class="ns" x="425.0" y="195" text-anchor="middle">decides: ALLOW, DENY, or ASK</text></g>
<g id="n-act"><title>Actuator: re-checks, then sends</title><rect class="nh" x="650" y="50" width="210" height="64" rx="12"/><text class="nt" x="755.0" y="77" text-anchor="middle">Actuator</text><text class="ns" x="755.0" y="95" text-anchor="middle">re-checks, then sends</text></g>
<g id="n-ses"><title>Session: tmux pane</title><rect class="nx" x="1020" y="50" width="150" height="64" rx="12"/><text class="nt" x="1095.0" y="77" text-anchor="middle">Session</text><text class="ns" x="1095.0" y="95" text-anchor="middle">tmux pane</text></g>
<g id="n-que"><title>Attention queue: item with the reason</title><rect class="nr" x="650" y="260" width="210" height="64" rx="12"/><text class="nt" x="755.0" y="287" text-anchor="middle">Attention queue</text><text class="ns" x="755.0" y="305" text-anchor="middle">item with the reason</text></g>
<g id="n-hum"><title>You: answer in the inbox</title><rect class="nx" x="1020" y="260" width="150" height="64" rx="12"/><text class="nt" x="1095.0" y="287" text-anchor="middle">You</text><text class="ns" x="1095.0" y="305" text-anchor="middle">answer in the inbox</text></g>
<path class="ed" d="M230,182 H310"/>
<text class="el" x="270" y="174" text-anchor="middle">proposal</text>
<path class="ed" d="M540,166 L650,96"/>
<text class="el" x="612" y="122" text-anchor="end">ALLOW</text>
<path class="ed" d="M540,198 L650,284"/>
<text class="el" x="612" y="262" text-anchor="end">DENY or ASK</text>
<path class="ed" d="M860,82 H1020"/>
<text class="el" x="940" y="74" text-anchor="middle">send</text>
<path class="ed" d="M755,114 V260"/>
<text class="el" x="763" y="196" text-anchor="start">re-check fails</text>
<path class="ed" d="M860,292 H1020"/>
<path class="ed" d="M1095,324 V386 H425 V214"/>
<text class="el" x="760" y="378" text-anchor="middle">your answer is a human proposal, and the policy allows it by rule</text>
<text class="ns" x="30" y="420" text-anchor="start">One function, evaluate(action, state), runs in the policy and again in the actuator. Only the actuator can send.</text>
</svg>
